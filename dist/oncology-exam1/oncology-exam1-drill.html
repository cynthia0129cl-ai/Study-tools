<title>Oncology Exam 1 Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--line:#d9d9d9;--soft:#f5f5f5;--ok:#1a7f37;--okbg:#e9f6ec;--bad:#c62828;--badbg:#fdeceb;--amb:#b26a00;--ambbg:#fff4e0;--press:#e6e6e6}

html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
*{box-sizing:border-box;touch-action:manipulation}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.2;text-wrap:balance}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.25rem;margin:1.2em 0 .4em}h3{font-size:1.05rem;margin:1em 0 .3em}
.wrap{max-width:760px;margin:0 auto;padding:0 0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;border-bottom:1px solid var(--line);padding:8px 0;margin-bottom:8px}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
button,select,input[type=number]{font:inherit;color:var(--fg)}
.btn{border:1px solid var(--fg);background:var(--bg);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--fg);color:var(--bg)}
.btn.grn{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:active{background:var(--press)}.btn.pri:active{background:#333}
@media (hover:hover){.btn:hover{background:var(--soft)}.btn.pri:hover{background:#333}.opt:hover{background:var(--soft)}}
.btn[disabled]{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:var(--fg);font:inherit;min-height:0}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.card.hi{border-color:var(--fg)}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--fg);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--soft);margin:6px 0}
.bar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--mut)}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.c-solid{background:#1a7f37}.c-right{background:#7bc47f}.c-shaky{background:#d9534f}.c-new{background:#cfcfcf}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.chk input{margin-top:5px;width:18px;height:18px}
.stem{font-size:1.08rem;margin:10px 0 14px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;margin:8px 0;cursor:pointer;font:inherit}
.opt .ltr{flex:none;width:1.6em;font-weight:700}
.opt.sel{border:2px solid var(--fg);background:#f0f0f0;padding:10px 11px}
.opt:active{background:var(--press)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.miss{border-color:var(--amb);background:var(--ambbg)}

.cc{border:1px solid var(--fg);border-radius:10px;padding:10px 12px;margin:12px 0}
.cc ul{margin:.3em 0 .3em 1.1em;padding:0}
.small{font-size:.85rem;color:var(--mut)}
select{padding:7px 8px;border:1px solid var(--fg);border-radius:6px;background:var(--bg);max-width:100%}
table.m{border-collapse:collapse;width:100%;margin:10px 0}

.ord span.t{flex:1}
.ord button{border:1px solid var(--fg);background:var(--bg);border-radius:6px;min-width:40px;min-height:40px}
.think{font-size:1.4rem;font-weight:700;text-align:center;margin:20px 0}

.p-S{background:var(--okbg);color:var(--ok)}.p-O{background:var(--ambbg);color:var(--amb)}.p-W{background:var(--badbg);color:var(--bad)}

.readme h3{margin-top:1.2em}
.notice{border:1px dashed var(--mut);border-radius:8px;padding:8px 10px;margin:10px 0;font-size:.92rem}

<script>/* Drill engine core: pure logic, no DOM. Used by the drill page and by the simulations in Node. */
(function (root) {
  "use strict";
  var H18 = 18 * 3600 * 1000;

    function rec(S, id) { return S.q[id] || null; }
    function starred(S, id) { var s = S.stars && S.stars[id]; return !!(s && s.s); }
    function isHR(S, q) { return starred(S, q.id) || !!q.lp || !!HR[q.t]; }
    function status(S, q) {
      var r = S.q[q.id];
      if (!r || !r.n) return "new";
      if (r.last !== "r" || r.g) return "shaky";
      return r.rs >= (q.ty === "tf" ? 3 : 2) ? "solid" : "right";
    }
    function missed(S, q) { var r = S.q[q.id]; return !!(r && r.n && (r.last === "w" || r.g)); }
    function restNeeded(S, q, n) {

      if (r.ms >= 2) return clamp(0.10 * n, 6, 25);

    }
    function ready(S, q, n, now) {
      var r = S.q[q.id]; if (!r || !r.n) return true;

      return (S.ans - r.c) >= restNeeded(S, q, n);
    }
    function prevBlocked(S, q) {
      if (!S.prev || S.prev.indexOf(q.id) < 0) return false;
      var r = S.q[q.id];
      return !(isHR(S, q) || (r && r.ms >= 2));
    }
    function fmt(q) { return q.ty === "cloze" ? "blanks" : q.ty; }

    /* greedy interleave: never the same topic twice in a row, avoid the same format 3 times */
    function interleave(list) {
      var rest = list.slice(), out = [];
      while (rest.length) {
        var lt = out.length ? out[out.length - 1].t : null;
        var f1 = out.length ? fmt(out[out.length - 1]) : null, f2 = out.length > 1 ? fmt(out[out.length - 2]) : null;
        var pick = -1, i;
        for (i = 0; i < rest.length; i++) if (rest[i].t !== lt && !(f1 && f1 === f2 && fmt(rest[i]) === f1)) { pick = i; break; }
        if (pick < 0) for (i = 0; i < rest.length; i++) if (rest[i].t !== lt) { pick = i; break; }

    }
    /* keep rough order but split same-topic neighbours */
    function spread(list) {

      for (var i = 1; i < a.length; i++) {

    }

          if (want === null) { var ct = 0; pool.forEach(function (x) { if (x.c === 0) ct++; }); var cf = pool.length - ct; if (ct !== cf) want = ct > cf ? 0 : 1; }

      });
      var B = shuffle(elig.filter(function (q) { var r = S.q[q.id]; return r && r.n && !missed(S, q); })).sort(function (a, b) { return (isHR(S, b) ? 1 : 0) - (isHR(S, a) ? 1 : 0); });

    }

      });

      for (var r = 0; r < per; r++) order.forEach(function (t) { if (picks[t][r]) out.push(picks[t][r]); });

"use strict";
var D={"cfg": {"title": "Oncology Exam 1", "eyebrow": "NUR 291 · Exam 1 · Tuesday, November 10", "sub": "Active-recall drill built only from your study guides, class notes and slides.", "key": "drill:nur291-oncology-exam1:v1", "topics": [{"id": "risk", "name": "Cancer risk factors"}, {"id": "stage", "name": "Cancer staging (TNM, sizes)"}, {"id": "biopsy", "name": "Biopsy procedures"}, {"id": "lung", "name": "Lung cancer"}, {"id": "labs", "name": "Labs: CBC, WBC, platelets"}, {"id": "leuk", "name": "Leukemia: risk factors, medications"}, {"id": "neut", "name": "Neutropenic precautions"}, {"id": "hodgkin", "name": "Hodgkin lymphoma"}, {"id": "mm", "name": "Multiple myeloma"}, {"id": "breast", "name": "Breast cancer (female and male): medications"}, {"id": "uterine", "name": "Uterine cancer"}, {"id": "cervical", "name": "Cervical guidelines"}, {"id": "prostate", "name": "Prostate cancer: post-op complications"}, {"id": "testis", "name": "Testicular cancer"}, {"id": "eol", "name": "End of life: hospice vs palliative"}], "highRoi": ["leuk", "prostate", "labs"], "lastPassNote": "Questions on the facts your class notes and study guide flag as exam topics (the leukemia, prostate, labs and staging items, the class PLQs and case studies). Shakiest first.", "guide": {"url": "https://claude.ai/artifact/UcwmNRDKT44dkoePGiC4VD"}}, "Q": [{"id": 0, "t": "leuk", "ty": "mc", "q": "A 62-year-old client reports fatigue, shortness of breath on stairs, and bleeding gums. The client has worked in an oil refinery since age 18 and has smoked for more than 40 years. Hgb is 9.4 g/dL and platelets are 97,000/mm³. Which part of the history places this client at the highest risk for leukemia?", "o": ["Long-term benzene exposure from refinery work", "Smoking for more than 40 years", "Fatigue with shortness of breath on exertion", "Bleeding gums", "A hemoglobin of 9.4 g/dL"], "c": 0, "w": "Leukemia risk factors include genetic anomalies, Down syndrome, radiation, benzene or other chemical exposure, prior chemotherapy or radiation, and smoking. In this case the oil refinery is the benzene exposure and is identified as the highest risk factor. The low hemoglobin, low platelets, fatigue and bleeding gums are the effects of blasts crowding the marrow. They are findings the nurse assesses, not causes. (study guide, Ch 34 case)", "x": {"Smoking for more than 40 years": "Smoking is a listed leukemia risk factor, but it is not the highest risk in this history; the case names benzene as the highest.", "Fatigue with shortness of breath on exertion": "This is a manifestation of anemia from a crowded marrow, not something that causes leukemia.", "Bleeding gums": "Bleeding gums are a sign of thrombocytopenia, not a cause of leukemia.", "A hemoglobin of 9.4 g/dL": "A low hemoglobin is a result of marrow crowding by blasts, not a risk factor."}, "m": {"Smoking for more than 40 years": "ranks smoking above benzene", "Fatigue with shortness of breath on exertion": "mixes up a symptom with a risk factor", "Bleeding gums": "mixes up a symptom with a risk factor", "A hemoglobin of 9.4 g/dL": "mixes up a symptom with a risk factor"}, "k": "c-leuk-risk", "lp": 1}, {"id": 1, "t": "leuk", "ty": "sata", "q": "The nurse is reviewing risk factors for leukemia with a client's family. Select all that apply.", "o": ["Down syndrome", "Prior chemotherapy or radiation", "Benzene exposure", "Presence of the Philadelphia chromosome in chronic myeloid leukemia", "A diet high in red meat", "Undescended testicle", "Unopposed estrogen exposure"], "c": [0, 1, 2, 3], "w": "Down syndrome raises leukemia risk about 10 to 30 times. Radiation, benzene and prior chemotherapy damage marrow stem cells. The Philadelphia chromosome, a 9;22 swap, is found in more than 90% of chronic myeloid leukemia. Each wrong option is the signature risk of a different cancer. (study guide, Ch 34)", "x": {"A diet high in red meat": "A diet high in red meat is a prostate cancer risk factor, not a leukemia risk factor.", "Undescended testicle": "Cryptorchidism is the greatest risk factor for testicular cancer.", "Unopposed estrogen exposure": "Unopposed estrogen is a main risk factor for uterine cancer."}, "m": {"A diet high in red meat": "borrows a risk factor from another cancer", "Undescended testicle": "borrows a risk factor from another cancer", "Unopposed estrogen exposure": "borrows a risk factor from another cancer"}, "k": "c-leuk-risk", "lp": 1}, {"id": 2, "t": "leuk", "ty": "mc", "q": "A 7-year-old child is admitted with fever, bone pain, and bruising. Testing confirms the most common childhood leukemia. Which type should the nurse expect the chart to list?", "o": ["Acute lymphoblastic leukemia", "Acute myeloid leukemia", "Chronic myeloid leukemia", "Chronic lymphocytic leukemia", "Multiple myeloma"], "c": 0, "w": "Leukemias are named by the stem cell line and the speed of onset. AML and ALL have a sudden, acute onset, and ALL is the most common childhood leukemia. CML and CLL can be present for years before turning acute. Multiple myeloma is a separate plasma cell cancer. (study guide, Ch 34)", "x": {"Acute myeloid leukemia": "AML is acute but is tied to benzene, radiation and prior chemotherapy in adults; ALL is the most common childhood type.", "Chronic myeloid leukemia": "CML is chronic and marked by the Philadelphia chromosome, not the typical childhood form.", "Chronic lymphocytic leukemia": "CLL is chronic and can be present for years before it is found; it is not the common childhood leukemia.", "Multiple myeloma": "Multiple myeloma is a plasma cell cancer of older adults, not a leukemia."}, "m": {"Acute myeloid leukemia": "mixes up AML and ALL", "Chronic myeloid leukemia": "mixes up acute and chronic types", "Chronic lymphocytic leukemia": "mixes up acute and chronic types", "Multiple myeloma": "confuses myeloma with leukemia"}, "k": "c-leuk-patho", "lp": 1}, {"id": 3, "t": "leuk", "ty": "mc", "q": "A client newly diagnosed with leukemia asks, “My white count is high, so why am I getting infections and bruising so easily?” Which response by the nurse is best?", "o": ["“The extra white cells are immature blasts that cannot fight infection, and they crowd out the cells that make platelets and red cells.”", "“Your body is making too many healthy neutrophils, and they are destroying your platelets.”", "“The high count means your immune system is working extra hard to fight an infection.”", "“Your chemotherapy has lowered your platelets and made you prone to infection.”", "“Your spleen is destroying your blood cells faster than they can be made.”"], "c": 0, "w": "An unknown stimulus mutates a stem cell, which clones immature blasts that never mature and never die. The marrow, spleen and lymph tissue fill with blasts. The crowded marrow cannot make enough RBCs and platelets, so anemia and thrombocytopenia follow. The blasts cannot fight infection, so neutropenia and infections follow even when the count is high. (study guide, Ch 34)", "x": {"“Your body is making too many healthy neutrophils, and they are destroying your platelets.”": "The high count is from immature blasts, not healthy neutrophils, and they do not destroy platelets.", "“The high count means your immune system is working extra hard to fight an infection.”": "A high count in leukemia does not mean a stronger defense; the blasts are immature and useless.", "“Your chemotherapy has lowered your platelets and made you prone to infection.”": "The client has just been diagnosed; the problem comes from the leukemia itself, not from treatment.", "“Your spleen is destroying your blood cells faster than they can be made.”": "Splenomegaly can occur, but the main cause is marrow crowding by blasts."}, "m": {"“Your body is making too many healthy neutrophils, and they are destroying your platelets.”": "thinks the extra cells are healthy", "“The high count means your immune system is working extra hard to fight an infection.”": "thinks a high WBC means strong defense", "“Your chemotherapy has lowered your platelets and made you prone to infection.”": "blames chemotherapy before treatment starts", "“Your spleen is destroying your blood cells faster than they can be made.”": "blames the spleen"}, "k": "c-leuk-patho", "lp": 0}, {"id": 4, "t": "leuk", "ty": "order", "q": "The nurse is explaining the phases of chemotherapy for leukemia to a client. Place the phases in the order they are given.", "o": ["Induction to bring the leukemia into remission", "Consolidation to treat hidden disease", "Maintenance to prevent relapse"], "c": [0, 1, 2], "w": "Induction aims to get remission. Consolidation treats leukemia cells that cannot be seen. Maintenance helps prevent relapse. Remission is not a cure, which is why therapy continues in phases. (study guide, Ch 34)", "x": {}, "m": {}, "k": "c-leuk-tx", "lp": 0}, {"id": 5, "t": "leuk", "ty": "match", "q": "The nurse reviews medications used for leukemia. Match each drug with its role.", "o": ["Blocks the Bcr-Abl protein in CML", "Targeted therapy used in CLL", "Induction chemotherapy for AML", "Growth factor that raises neutrophils"], "c": [0, 1, 2, 3], "w": "Imatinib targets the Bcr-Abl abnormality of CML and ibrutinib is used in CLL. Daunorubicin plus cytarabine is the AML chemotherapy example. Filgrastim (G-CSF) raises neutrophils; the textbook says growth factors are generally not indicated in leukemia because they could fuel the disease, although the case patient received it, so ask your instructor how it will be tested. (study guide, Ch 34)", "x": {"Blocks the Bcr-Abl protein in CML": "Imatinib is a Bcr-Abl inhibitor given for CML; it does not treat CLL.", "Targeted therapy used in CLL": "Ibrutinib is the targeted agent listed for CLL.", "Induction chemotherapy for AML": "Daunorubicin plus cytarabine (Ara-C) is the AML example regimen.", "Growth factor that raises neutrophils": "Filgrastim is G-CSF, which raises neutrophils and can cause bone pain."}, "m": {}, "k": "c-leuk-tx", "lp": 1, "r": ["Imatinib", "Ibrutinib", "Daunorubicin with cytarabine", "Filgrastim"]}, {"id": 6, "t": "leuk", "ty": "mc", "q": "A client with acute leukemia is receiving chemotherapy and has an absolute neutrophil count of 0.6 ×10³/mm³. Which medication group does the nurse expect to be ordered to lower the risk of infection?", "o": ["Prophylactic antibiotics, antivirals and antifungals", "Aspirin", "Megestrol", "Mesna", "Allopurinol"], "c": 0, "w": "Chemotherapy causes myelosuppression, and severe neutropenia lets infection spread quickly. The case patient received prophylactic antibiotics, antivirals and antifungals along with blood products. Examples listed are levofloxacin or moxifloxacin, acyclovir and fluconazole. Each wrong option protects against a different chemotherapy problem. (study guide, Ch 34)", "x": {"Aspirin": "Aspirin inhibits platelets and raises bleeding risk; it does not prevent infection and is unsafe with thrombocytopenia.", "Megestrol": "Megestrol is used for anorexia, not infection prevention.", "Mesna": "Mesna protects the bladder from hemorrhagic cystitis.", "Allopurinol": "Allopurinol prevents high uric acid in tumor lysis; it does not prevent infection."}, "m": {"Aspirin": "reaches for a bleeding drug", "Megestrol": "picks a drug for a different problem", "Mesna": "picks a drug for a different problem", "Allopurinol": "picks a drug for a different problem"}, "k": "c-leuk-tx", "lp": 1}, {"id": 7, "t": "leuk", "ty": "tf", "q": "A client whose leukemia is in remission after induction chemotherapy tells the nurse, “I am relieved because this means I am cured.” The nurse recognizes that this statement is accurate.", "o": ["True", "False"], "c": 1, "w": "Remission means no detectable leukemia cells, but hidden disease can remain. That is why consolidation and maintenance follow induction. The true version is: remission is not the same as a cure, and treatment continues to prevent relapse. (study guide, Ch 34)", "x": {"True": "Marking True treats remission as a cure; the teaching need is that remission does not mean cure."}, "m": {}, "k": "c-leuk-tx", "lp": 1}, {"id": 8, "t": "leuk", "ty": "tf", "q": "A client with leukemia involving the brain asks why radiation to the brain and spine is planned along with chemotherapy. The nurse says it is because chemotherapy cannot cross the blood–brain barrier. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "Chemotherapy given by vein does not reach the central nervous system well. Radiation to the brain and spine treats leukemia cells that hide there. Some chemotherapy is also given intrathecally. (study guide, Ch 34)", "x": {"False": "Marking False denies that the blood–brain barrier blocks chemotherapy; this is the reason radiation is added."}, "m": {}, "k": "c-leuk-tx", "lp": 1}, {"id": 9, "t": "leuk", "ty": "mc", "q": "A client receiving chemotherapy for acute leukemia has a temperature of 101.8°F (38.8°C) and an ANC of 0.6 ×10³/mm³. Which action should the nurse take first?", "o": ["Notify the provider immediately so broad-spectrum IV antibiotics can be started", "Give acetaminophen and recheck the temperature in 1 hour", "Take a rectal temperature to confirm the reading", "Encourage oral fluids and bed rest", "Apply a cooling blanket"], "c": 0, "w": "In a chemotherapy client, fever is often the first and only sign of infection, and infection is the most common cause of death besides the disease itself. Myelosuppression with fever is treated aggressively with broad-spectrum antibiotics to prevent sepsis. A fever of 100.4°F (38°C) or higher is the trigger to call. Rectal temperatures and suppositories are avoided because rectal bacteria can enter the blood. (study guide, Ch 13 and Ch 34)", "x": {"Give acetaminophen and recheck the temperature in 1 hour": "Waiting delays treatment; fever may be the only sign of infection and needs antibiotics immediately.", "Take a rectal temperature to confirm the reading": "Rectal temperatures are never done in neutropenia because rectal bacteria can enter the blood.", "Encourage oral fluids and bed rest": "Fluids and rest are supportive but do not treat a possible infection, which is an emergency.", "Apply a cooling blanket": "Cooling lowers the temperature but does not treat the infection behind it."}, "m": {"Give acetaminophen and recheck the temperature in 1 hour": "treats the fever, not the infection", "Take a rectal temperature to confirm the reading": "uses a rectal route", "Encourage oral fluids and bed rest": "treats the fever, not the infection", "Apply a cooling blanket": "treats the fever, not the infection"}, "k": "c-leuk-nursing", "lp": 1}, {"id": 10, "t": "leuk", "ty": "mc", "q": "A client with leukemia has a platelet count of 19,000/mm³ after chemotherapy. Which statement by the client indicates a need for further teaching?", "o": ["“I have an appointment to get my teeth cleaned this week.”", "“I will go to the emergency department if I have a nosebleed that lasts more than 10 minutes.”", "“I will go to the emergency department if my temperature reaches 102°F.”", "“I will use an electric razor instead of a blade.”"], "c": 0, "w": "With platelets this low, dental cleaning can cause bleeding and bacteria can enter the blood, so it should be avoided. The other statements show correct bleeding and infection teaching: report a prolonged nosebleed and fever, and use an electric razor. After chemotherapy the first priority is infection, and platelets below 20,000 can bleed spontaneously. (study guide, Ch 34 case; class notes)", "x": {"“I will go to the emergency department if I have a nosebleed that lasts more than 10 minutes.”": "This is correct teaching; a nosebleed lasting more than 10 minutes needs emergency care.", "“I will go to the emergency department if my temperature reaches 102°F.”": "This is correct teaching; fever with neutropenia needs prompt treatment.", "“I will use an electric razor instead of a blade.”": "This is correct teaching; an electric razor lowers the risk of cuts and bleeding."}, "m": {}, "k": "c-leuk-nursing", "lp": 1}, {"id": 11, "t": "eol", "ty": "mc", "q": "A client with newly diagnosed stage III lung cancer will start chemotherapy next week. The client asks the nurse when pain, shortness of breath and nausea can be managed by a specialty team. Which response is best?", "o": ["“Palliative care can start now, at diagnosis, and it can continue along with chemotherapy.”", "“Palliative care begins only after the cancer stops responding to treatment.”", "“You must stop chemotherapy before palliative care can begin.”", "“Palliative care is available only when a doctor estimates less than 6 months to live.”"], "c": 0, "w": "Palliative care relieves symptoms such as pain, dyspnea and nausea and improves quality of life for the client and family at any stage of a serious illness. It starts on the day of diagnosis and can go on while the client receives chemotherapy, radiation or surgery. Hospice is different: it is for the end of life and curative treatment stops. (study guide, Ch 26 and Other Topics)", "x": {"“Palliative care begins only after the cancer stops responding to treatment.”": "Palliative care is not limited to the end of life; it starts at diagnosis.", "“You must stop chemotherapy before palliative care can begin.”": "Palliative care can continue alongside chemotherapy, radiation and surgery; stopping curative treatment is a hospice requirement.", "“Palliative care is available only when a doctor estimates less than 6 months to live.”": "The 6-month prognosis is the hospice rule, not the palliative rule."}, "m": {"“Palliative care begins only after the cancer stops responding to treatment.”": "thinks palliative means end of life only", "“You must stop chemotherapy before palliative care can begin.”": "mixes up palliative and hospice", "“Palliative care is available only when a doctor estimates less than 6 months to live.”": "mixes up palliative and hospice"}, "k": "c-eol-diff", "lp": 1}, {"id": 12, "t": "eol", "ty": "sata", "q": "The nurse is teaching a family about hospice care for a client with end-stage cancer. Select all that apply.", "o": ["The client has a prognosis of 6 months or less if the disease runs its usual course", "Curative treatment is stopped and the focus is on comfort", "Family support continues after the death, including bereavement", "The client can leave hospice to restart curative treatment", "Hospice can begin the day any serious illness is diagnosed", "Chemotherapy and radiation are continued to cure the disease"], "c": [0, 1, 2, 3], "w": "Hospice is for a client whose prognosis is 6 months or less. The client stops curative treatment and chooses comfort, dignity and a peaceful death, and the family receives support including bereavement. Hospice is usually provided at home but can be in a facility or nursing home, and a client can leave to restart curative care. All hospice is palliative, but not all palliative care is hospice. (study guide, Other Topics; standard content as labeled in the guide)", "x": {"Hospice can begin the day any serious illness is diagnosed": "Starting at diagnosis describes palliative care; hospice is for the end of life.", "Chemotherapy and radiation are continued to cure the disease": "Hospice means the client stops curative treatment and chooses comfort care."}, "m": {"Hospice can begin the day any serious illness is diagnosed": "mixes up palliative and hospice", "Chemotherapy and radiation are continued to cure the disease": "mixes up palliative and hospice"}, "k": "c-eol-diff", "lp": 1}, {"id": 13, "t": "eol", "ty": "mc", "q": "A client with heart failure and several hospitalizations wants help with symptoms but still wants to try every treatment that might extend life. Which type of care fits this client's goals?", "o": ["Palliative care", "Hospice care", "Hospice care with continued curative treatment", "Care only after the client is declared terminal", "Bereavement care only"], "c": 0, "w": "Palliative care is for anyone with a serious illness at any age or stage, and curative treatment can continue with it. Hospice is limited to the last months of life and replaces curative treatment with comfort care. The client's wish to keep treating points to palliative care. (study guide, Other Topics; standard content as labeled in the guide)", "x": {"Hospice care": "Hospice requires stopping curative treatment and a prognosis of 6 months or less; this client wants to keep treating.", "Hospice care with continued curative treatment": "Hospice means the client stops curative treatment.", "Care only after the client is declared terminal": "Palliative care is open to anyone with a serious illness at any stage.", "Bereavement care only": "Bereavement support is a feature of hospice for the family after a death, not the client's present goal."}, "m": {"Hospice care": "mixes up palliative and hospice", "Hospice care with continued curative treatment": "mixes up palliative and hospice", "Care only after the client is declared terminal": "thinks palliative means end of life only", "Bereavement care only": "mixes up palliative and hospice"}, "k": "c-eol-diff", "lp": 0}, {"id": 14, "t": "eol", "ty": "tf", "q": "A nurse tells the daughter of a client with advanced cancer, “All hospice care is palliative, but not all palliative care is hospice.” The statement is accurate.", "o": ["True", "False"], "c": 0, "w": "Hospice is a form of care that aims at comfort, so everything it does is palliative. Palliative care is the wider umbrella: it treats symptoms such as pain, dyspnea and nausea at any stage and can run alongside chemotherapy, radiation or surgery. Because palliative care does not require the client to stop curative treatment, it is not always hospice. This is why “all hospice is palliative, but not all palliative care is hospice” is accurate. (study guide, Other Topics; Ch 26)", "x": {"False": "Marking False would mean hospice is not palliative or that palliative care is always hospice; neither is true."}, "m": {}, "k": "c-eol-diff", "lp": 1}, {"id": 15, "t": "eol", "ty": "tf", "q": "A nurse explains to a client with a new cancer diagnosis that palliative care and hospice are the same thing. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "Palliative care can begin at diagnosis and continue alongside curative treatment. Hospice is for the end of life and curative treatment stops. The true version is: palliative care is not the same as hospice. (study guide, Ch 26 and Other Topics)", "x": {"True": "Marking True treats the two as the same; palliative care is broader than hospice."}, "m": {}, "k": "c-eol-diff", "lp": 1}, {"id": 16, "t": "eol", "ty": "sata", "q": "A hospice nurse is assessing a client who is actively dying. Which findings suggest that death is near? Select all that apply.", "o": ["Decreased oral intake and urine output", "Mottled, cool extremities", "Periods of apnea with Cheyne-Stokes breathing", "Noisy secretions", "A sudden increase in appetite and energy with a rising urine output", "Warm, pink, well-perfused extremities"], "c": [0, 1, 2, 3], "w": "As death nears, intake and urine output fall, the extremities become mottled and cool, and breathing becomes irregular with apnea and Cheyne-Stokes patterns. Noisy secretions, the “death rattle,” and a falling level of consciousness are also expected. Hearing is often the last sense lost, so the nurse keeps talking to the client. (study guide, Other Topics; standard content)", "x": {"A sudden increase in appetite and energy with a rising urine output": "Intake and urine output fall as death nears; they do not rise.", "Warm, pink, well-perfused extremities": "Mottled, cool extremities are the sign of approaching death."}, "m": {}, "k": "c-eol-nursing", "lp": 0}, {"id": 17, "t": "eol", "ty": "mc", "q": "A client in hospice care has dyspnea and pain at the end of life. Which action by the nurse is most consistent with comfort care?", "o": ["Give the opioid as ordered on a regular schedule and provide mouth care and repositioning", "Withhold opioids until the client's respiratory rate rises", "Start curative chemotherapy to reduce the symptoms", "Ignore the advance directive until the family arrives", "Limit visitors to protect the client from emotional strain"], "c": 0, "w": "At the end of life the goal changes from cure to comfort, so symptoms are treated on a schedule rather than waiting for them to become severe. Opioids such as morphine relieve pain and the sensation of breathlessness, and they are given as ordered rather than withheld. Mouth care and repositioning prevent the discomfort that comes with reduced intake and immobility. The nurse also honors the advance directive and DNR order and supports the family. (study guide, Other Topics; standard content)", "x": {"Withhold opioids until the client's respiratory rate rises": "Opioids, including morphine for dyspnea, are given to keep the client comfortable.", "Start curative chemotherapy to reduce the symptoms": "Hospice means curative treatment has stopped.", "Ignore the advance directive until the family arrives": "Advance directives and DNR orders are honored in end-of-life care.", "Limit visitors to protect the client from emotional strain": "Emotional and spiritual support for the client and family is part of nursing care."}, "m": {"Withhold opioids until the client's respiratory rate rises": "undertreats pain out of fear", "Start curative chemotherapy to reduce the symptoms": "mixes up palliative and hospice"}, "k": "c-eol-nursing", "lp": 0}, {"id": 18, "t": "breast", "ty": "mc", "q": "A 52-year-old client with estrogen receptor–positive breast cancer is starting tamoxifen. Which medication on the client's list should the nurse question?", "o": ["A combined oral contraceptive", "Acetaminophen as needed", "A multivitamin", "Calcium with vitamin D", "A stool softener"], "c": 0, "w": "Estrogen-positive tumors are fed by estrogen, so oral contraceptives are questioned. Combined oral contraceptives also raise the risk of clots. Tamoxifen blocks estrogen at its receptor and is taken for 5 to 10 years. The other medications have no hormone effect. (study guide, Ch 65; Davis Table 65.3)", "x": {"Acetaminophen as needed": "Acetaminophen has no interaction with tamoxifen in these materials.", "A multivitamin": "A multivitamin is not a hormone and does not feed an estrogen-positive tumor.", "Calcium with vitamin D": "Calcium and vitamin D are not hormones and do not fuel the tumor.", "A stool softener": "A stool softener has no hormonal effect on the tumor."}, "m": {}, "k": "c-breast-meds", "lp": 1}, {"id": 19, "t": "breast", "ty": "mc", "q": "A client with breast cancer who takes tamoxifen reports depression and a new prescription for an SSRI. Which concern should the nurse raise with the provider?", "o": ["SSRIs reduce how tamoxifen is metabolized", "SSRIs increase the blood level of tamoxifen to a toxic range", "SSRIs cause cardiotoxicity when combined with tamoxifen", "SSRIs raise the risk of endometrial cancer with tamoxifen", "SSRIs cause bone loss when combined with tamoxifen"], "c": 0, "w": "Tamoxifen is a selective estrogen receptor modulator that works only if the body converts it normally. SSRIs reduce tamoxifen metabolism, so the nurse tells the provider before the SSRI is started. Tamoxifen's own risks include DVT, PE, stroke, cataracts and endometrial cancer. (study guide, Ch 65; Davis Table 65.3)", "x": {"SSRIs increase the blood level of tamoxifen to a toxic range": "The interaction lowers the tamoxifen's effect by reducing its metabolism; it does not cause toxicity.", "SSRIs cause cardiotoxicity when combined with tamoxifen": "Cardiotoxicity is linked to trastuzumab, not to this combination.", "SSRIs raise the risk of endometrial cancer with tamoxifen": "Endometrial cancer risk comes from tamoxifen itself, not from SSRIs.", "SSRIs cause bone loss when combined with tamoxifen": "Bone loss is tied to aromatase inhibitors, and to tamoxifen in premenopausal clients, not to this SSRI interaction."}, "m": {"SSRIs increase the blood level of tamoxifen to a toxic range": "reverses the direction of the interaction", "SSRIs cause cardiotoxicity when combined with tamoxifen": "mixes up drug effects", "SSRIs raise the risk of endometrial cancer with tamoxifen": "mixes up drug effects", "SSRIs cause bone loss when combined with tamoxifen": "mixes up drug effects"}, "k": "c-breast-meds", "lp": 1}, {"id": 20, "t": "breast", "ty": "match", "q": "The nurse reviews medications for breast cancer. Match each drug with its key nursing consideration.", "o": ["Blocks estrogen at its receptor; avoid SSRIs", "Blocks conversion of androgens to estrogen; risk of osteoporosis and fractures", "For HER2-positive tumors; watch for cardiotoxicity", "Immunotherapy given with chemotherapy before surgery; rash, diarrhea, thyroid problems"], "c": [0, 1, 2, 3], "w": "Tamoxifen blocks estrogen at the receptor, while aromatase inhibitors stop androgens from becoming estrogen, so only the aromatase inhibitor carries the osteoporosis warning of this pair. Trastuzumab targets HER2 and can harm the heart. Pembrolizumab is immunotherapy. (study guide, Ch 65; Davis Table 65.3)", "x": {"Blocks estrogen at its receptor; avoid SSRIs": "Tamoxifen is a SERM taken for 5 to 10 years.", "Blocks conversion of androgens to estrogen; risk of osteoporosis and fractures": "Aromatase inhibitors such as anastrozole, letrozole and exemestane work this way.", "For HER2-positive tumors; watch for cardiotoxicity": "Trastuzumab (Herceptin) is a targeted antibody; it also causes fatigue, joint pain, diarrhea and fever.", "Immunotherapy given with chemotherapy before surgery; rash, diarrhea, thyroid problems": "Pembrolizumab (Keytruda) is immunotherapy used with chemotherapy for high-risk triple-negative cancer."}, "m": {}, "k": "c-breast-meds", "lp": 1, "r": ["Tamoxifen", "Anastrozole", "Trastuzumab", "Pembrolizumab"]}, {"id": 21, "t": "breast", "ty": "mc", "q": "A 64-year-old male client has had a mastectomy for breast cancer. His tumor is estrogen receptor–negative and HER2-negative. Which order should the nurse question?", "o": ["Antiestrogen therapy", "Pain medication as needed", "Dressing change using aseptic technique", "Emptying and recording the surgical drain", "Teaching about suture care"], "c": 0, "w": "Hormone therapy, such as tamoxifen, aromatase inhibitors or fulvestrant, works only on receptor-positive tumors. This tumor is receptor-negative, so antiestrogen therapy would not help and the order should be questioned. Trastuzumab and pertuzumab are for HER2-positive tumors. The other orders are routine post-operative care. (study guide, Ch 66; Davis table notes)", "x": {"Pain medication as needed": "Pain medication helps with coughing, deep breathing and walking after surgery.", "Dressing change using aseptic technique": "This is routine post-operative wound care.", "Emptying and recording the surgical drain": "Drain care and recording color and amount is expected after mastectomy.", "Teaching about suture care": "Suture care and signs of infection are part of expected teaching."}, "m": {}, "k": "c-breast-male", "lp": 1}, {"id": 22, "t": "breast", "ty": "mc", "q": "A 66-year-old male client with a BRCA2 mutation finds a lump behind his nipple. Which statement about breast cancer in men is accurate for the nurse to include in teaching?", "o": ["It is far less common than in women, and the small amount of breast tissue means it spreads easily to the nipple, skin and muscle", "It is as common as breast cancer in women", "Lumpectomy is the usual treatment because the tissue is small", "Radiation is the main treatment", "BRCA1 is far more common than BRCA2 in men"], "c": 0, "w": "Male breast cancer is about 100 times less common than in women and occurs mainly between ages 60 and 70. BRCA2 is the more common mutation. With so little tissue behind the nipple, the tumor is easier to feel but spreads to the nipple, skin and muscle early. Mastectomy is usual, with chemotherapy and hormone therapy only for receptor-positive tumors. (study guide, Ch 66)", "x": {"It is as common as breast cancer in women": "It is about 100 times less common than in women.", "Lumpectomy is the usual treatment because the tissue is small": "Mastectomy is the usual treatment because there is so little tissue.", "Radiation is the main treatment": "Radiation is rarely used.", "BRCA1 is far more common than BRCA2 in men": "BRCA2 is the more common mutation in male breast cancer."}, "m": {"It is as common as breast cancer in women": "overstates how common it is", "Lumpectomy is the usual treatment because the tissue is small": "assumes breast conservation applies", "Radiation is the main treatment": "assumes breast conservation applies", "BRCA1 is far more common than BRCA2 in men": "mixes up BRCA1 and BRCA2"}, "k": "c-breast-male", "lp": 0}, {"id": 23, "t": "breast", "ty": "mc", "q": "A 22-year-old male client has a palpable lump behind the nipple and a strong family history of breast cancer. Which imaging does the nurse expect the provider to order first?", "o": ["Ultrasound", "Mammogram", "Bone scan", "PET scan", "Chest x-ray"], "c": 0, "w": "In men the workup includes a clinical breast exam, then ultrasound if the client is under 25 years old or mammogram if 25 or older, and MRI. ER/PR and HER2 receptor tests then guide therapy. Bone scan, PET and chest x-ray look for metastasis. (study guide, Ch 66)", "x": {"Mammogram": "A mammogram is the choice for men age 25 and older; this client is under 25.", "Bone scan": "A bone scan looks for metastasis after the cancer is confirmed.", "PET scan": "PET scanning is used later to look for metastasis.", "Chest x-ray": "A chest x-ray is a staging test for spread, not the first imaging of a breast lump."}, "m": {"Mammogram": "ignores the age cutoff"}, "k": "c-breast-male", "lp": 0}, {"id": 24, "t": "breast", "ty": "mc", "q": "A 45-year-old client is scheduled for a lumpectomy for early-stage breast cancer. The client asks what treatment will follow surgery. Which response by the nurse is correct?", "o": ["“Breast conservation surgery is always followed by radiation, with chemotherapy first if it is indicated.”", "“Radiation is not needed if the lumpectomy removed the whole tumor.”", "“Radiation is given first to shrink the tumor, then surgery.”", "“A mastectomy will be needed after the lumpectomy.”", "“Only hormone pills are given after a lumpectomy.”"], "c": 0, "w": "Lumpectomy removes only the tumor plus a margin, and it is always followed by radiation. When chemotherapy is indicated the order is surgery, then chemotherapy, then radiation. For early disease lumpectomy and mastectomy are equivalent, so the client chooses. Endocrine therapy for 5 to 10 years is added for receptor-positive tumors. (study guide, Ch 65)", "x": {"“Radiation is not needed if the lumpectomy removed the whole tumor.”": "Lumpectomy is always followed by radiation.", "“Radiation is given first to shrink the tumor, then surgery.”": "Chemotherapy, not radiation, is the usual neoadjuvant treatment to shrink a tumor before surgery.", "“A mastectomy will be needed after the lumpectomy.”": "Lumpectomy and mastectomy are equivalent for early disease; the patient chooses one.", "“Only hormone pills are given after a lumpectomy.”": "Hormone therapy is added for receptor-positive tumors but does not replace radiation."}, "m": {"“Radiation is not needed if the lumpectomy removed the whole tumor.”": "skips radiation after lumpectomy", "“Radiation is given first to shrink the tumor, then surgery.”": "mixes up neoadjuvant therapies"}, "k": "c-breast-tx", "lp": 1}, {"id": 25, "t": "breast", "ty": "mc", "q": "A client has a 2 cm breast mass and the plan is chemotherapy before surgery, then mastectomy, then oral hormonal therapy. How should the nurse describe the oral hormonal therapy?", "o": ["Adjuvant therapy given after the primary treatment", "Neoadjuvant therapy given before the primary treatment", "Palliative therapy to relieve symptoms", "Primary therapy", "Debulking therapy"], "c": 0, "w": "The timing words describe when a treatment is given relative to the definitive treatment, which here is the mastectomy. Neoadjuvant treatment comes before it and shrinks the tumor, which is why the chemotherapy in this plan is neoadjuvant. Adjuvant treatment comes after it and targets microscopic cells that may be left behind. Radiation and oral hormonal therapy after surgery are therefore adjuvant. (study guide, Ch 13 case and class PLQ)", "x": {"Neoadjuvant therapy given before the primary treatment": "Neoadjuvant therapy is given before the definitive treatment; the chemotherapy in this plan is the neoadjuvant part.", "Palliative therapy to relieve symptoms": "The hormonal therapy is given to lower the risk from leftover cells, not to relieve symptoms.", "Primary therapy": "The primary therapy is the definitive treatment, here the surgery.", "Debulking therapy": "Debulking is partial removal of a tumor by surgery."}, "m": {"Neoadjuvant therapy given before the primary treatment": "mixes up neoadjuvant and adjuvant"}, "k": "c-breast-tx", "lp": 1}, {"id": 26, "t": "breast", "ty": "sata", "q": "A nurse reviews facts about breast cancer in situ lesions. Select all that apply.", "o": ["Ductal carcinoma in situ is stage 0 and requires surgery", "Lobular carcinoma in situ has no treatment and is followed with mammograms", "Both lesions raise the risk of later invasive cancer", "Lobular carcinoma in situ requires a mastectomy", "Ductal carcinoma in situ needs no treatment"], "c": [0, 1, 2], "w": "DCIS is confined to the lining of the milk ducts, is stage 0, and requires surgery. LCIS is in the milk-producing lobules and is no longer considered cancer, so it has no treatment and the client is followed with mammograms and risk reduction. Both increase the chance of later invasive cancer. (study guide, Ch 65)", "x": {"Lobular carcinoma in situ requires a mastectomy": "LCIS is no longer considered cancer and has no treatment; the focus is surveillance and risk reduction.", "Ductal carcinoma in situ needs no treatment": "DCIS requires surgery."}, "m": {"Lobular carcinoma in situ requires a mastectomy": "treats LCIS like invasive cancer", "Ductal carcinoma in situ needs no treatment": "mixes up DCIS and LCIS"}, "k": "c-breast-tx", "lp": 0}, {"id": 27, "t": "breast", "ty": "mc", "q": "A client returns to the unit after a mastectomy and axillary node removal. Which finding is the most concerning?", "o": ["Bloody drainage saturating the dressing", "Serosanguineous drainage in the surgical drain", "Mild incisional pain rated 3 out of 10", "A temperature of 99.0°F (37.2°C)"], "c": 0, "w": "Bloody drainage that saturates the dressing suggests bleeding and is the most concerning wound finding. Serosanguineous drainage is expected. Immediate post-operative complications include infection, wound dehiscence, pulmonary embolism and pneumonia. (study guide, Ch 65)", "x": {"Serosanguineous drainage in the surgical drain": "Serosanguineous drainage is expected after surgery.", "Mild incisional pain rated 3 out of 10": "Mild pain is expected and is treated, which also helps coughing and ambulation.", "A temperature of 99.0°F (37.2°C)": "This is not a fever and is not the most concerning finding."}, "m": {}, "k": "c-breast-nursing", "lp": 1}, {"id": 28, "t": "breast", "ty": "sata", "q": "A client had radiation after a lumpectomy for left breast cancer. Which findings should the nurse monitor for as radiation effects? Select all that apply.", "o": ["Redness and itching of the skin", "Patchy desquamation", "Breast swelling", "A dry cough 6 weeks to 6 months later", "Hot flashes and vaginal dryness", "Skin rashes and flu-like symptoms"], "c": [0, 1, 2, 3], "w": "Radiation irritates the skin, so the nurse monitors for redness, itching and patchy desquamation. The breast can swell for 6 to 18 months, and radiation pneumonitis causes a nonproductive cough 6 weeks to 6 months later. Late cardiac risk also exists. (study guide, Ch 65)", "x": {"Hot flashes and vaginal dryness": "These are effects of endocrine therapy, not radiation.", "Skin rashes and flu-like symptoms": "These are effects of immunotherapy."}, "m": {"Hot flashes and vaginal dryness": "mixes up radiation and hormone effects", "Skin rashes and flu-like symptoms": "mixes up radiation and immunotherapy effects"}, "k": "c-breast-nursing", "lp": 0}, {"id": 29, "t": "breast", "ty": "tf", "q": "A nurse teaches a client with breast cancer that monthly breast self-examination is the recommended screening method. The nurse's teaching is accurate.", "o": ["True", "False"], "c": 1, "w": "Breast self-exam is not recommended according to Chapter 65 and the slides. Screening is by mammography: annual from 45 to 54, then annual or every 2 years from age 55 while healthy. The true version is: breast self-exam is not recommended as screening. (study guide, Ch 65)", "x": {"True": "Marking True repeats the old teaching; the materials say breast self-exam is not recommended."}, "m": {}, "k": "c-breast-nursing", "lp": 1}, {"id": 30, "t": "breast", "ty": "tf", "q": "A nurse tells a client after axillary node removal that the most common long-term effect is shoulder immobility and that arm swelling is called lymphedema. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "Removal of axillary nodes can cause lymphedema, arm swelling. Shoulder immobility, or frozen shoulder, is the most common long-term effect. Pain and scarring also occur. (study guide, Ch 65; class notes)", "x": {"False": "Marking False denies a long-term effect that is listed as the most common one."}, "m": {}, "k": "c-breast-nursing", "lp": 1}, {"id": 31, "t": "labs", "ty": "mc", "q": "A client with leukemia has a platelet count of 45,000/mm³. Which action by the nurse is the priority?", "o": ["Initiate bleeding precautions", "Initiate neutropenic precautions", "Increase iron-rich foods in the diet", "Give a vitamin K injection", "Encourage vigorous exercise"], "c": 0, "w": "Normal platelets are 150,000 to 450,000/mm³. Precautions start below 100,000, spontaneous bleeding is possible below 50,000 and especially below 20,000, and below 5,000 a fatal CNS or GI bleed can occur. A count of 45,000 calls for bleeding precautions such as a soft toothbrush, electric razor and no IM injections. (study guide, Ch 33 and cheat sheet)", "x": {"Initiate neutropenic precautions": "Neutropenic precautions are triggered by a low ANC, not by a low platelet count.", "Increase iron-rich foods in the diet": "Iron foods address iron deficiency anemia, not platelets.", "Give a vitamin K injection": "Vitamin K helps clotting factors, not a low platelet count.", "Encourage vigorous exercise": "Activity that risks falls and bumps raises the bleeding risk."}, "m": {"Initiate neutropenic precautions": "mixes up neutropenia and thrombocytopenia"}, "k": "c-labs-cbc", "lp": 1}, {"id": 32, "t": "labs", "ty": "order", "q": "Place these platelet counts in order from the highest to the lowest as the nurse considers bleeding risk.", "o": ["150,000/mm³: lower limit of normal", "100,000/mm³: start bleeding precautions", "50,000/mm³: spontaneous bleeding possible", "20,000/mm³: platelets usually transfused", "5,000/mm³: fatal CNS or GI bleed possible"], "c": [0, 1, 2, 3, 4], "w": "Platelets plug injured vessels, so the lower the count the less able the body is to stop bleeding. At 150,000 the count is at the lower limit of normal, and below it the client has thrombocytopenia. Precautions begin below 100,000, spontaneous bleeding becomes possible below 50,000, and platelets are usually transfused below 20,000 or before procedures. Below 5,000 a fatal central nervous system or GI bleed is possible. (study guide, Ch 33, Ch 34 and cheat sheet)", "x": {}, "m": {}, "k": "c-labs-plt", "lp": 1}, {"id": 33, "t": "labs", "ty": "mc", "q": "A client receiving chemotherapy has a WBC differential showing an ANC of 400/mm³. Which conclusion should the nurse draw?", "o": ["The client has severe neutropenia and a high risk of infection", "The client has thrombocytopenia and a high risk of bleeding", "The client has anemia and needs iron", "The client has a normal infection-fighting ability", "The client has polycythemia"], "c": 0, "w": "A WBC differential shows the proportion of each type of white cell, and neutrophils are the first cells to arrive at an infection. Neutropenia is an ANC below 1,500, and 500 or below is severe and calls for neutropenic precautions. A fever of 100.4°F (38°C) or higher with neutropenia is treated aggressively. (study guide, Ch 13, Ch 33, Ch 34)", "x": {"The client has thrombocytopenia and a high risk of bleeding": "ANC measures neutrophils, not platelets.", "The client has anemia and needs iron": "ANC measures neutrophils, not red cells or iron.", "The client has a normal infection-fighting ability": "An ANC below 1,500 is neutropenia and 500 or below is severe.", "The client has polycythemia": "Polycythemia is too many red cells."}, "m": {"The client has thrombocytopenia and a high risk of bleeding": "mixes up neutropenia and thrombocytopenia"}, "k": "c-labs-cbc", "lp": 1}, {"id": 34, "t": "labs", "ty": "mc", "q": "A client has a WBC differential showing many immature neutrophils, or bands. What does the nurse understand this left shift to mean?", "o": ["The marrow is releasing immature cells to fight an active infection", "The client has a chronic viral infection", "The client has too many red blood cells", "The client has normal marrow with stable cell counts", "The client has low platelets"], "c": 0, "w": "In a left shift, immature neutrophils (bands) outnumber the normal amount, usually 3 to 5%. The marrow is pumping cells out early to fight infection or inflammation. Bands are not very effective at fighting infection. Bacterial infection raises neutrophils, while chemotherapy and radiation lower them. (study guide, Ch 33)", "x": {"The client has a chronic viral infection": "Left shift points to active bacterial-type infection or inflammation, not to a chronic viral illness.", "The client has too many red blood cells": "Left shift concerns white cells.", "The client has normal marrow with stable cell counts": "Many bands means the marrow is being pushed to release cells early.", "The client has low platelets": "A left shift is a white-cell finding, not a platelet finding."}, "m": {}, "k": "c-labs-cbc", "lp": 0}, {"id": 35, "t": "labs", "ty": "mc", "q": "A client's report lists reticulocytes of 4% of RBCs after a hemorrhage. What does the nurse understand this to mean?", "o": ["The marrow is responding to blood loss by making more red cells", "The marrow is not producing red cells", "The client has leukemia", "The client is dehydrated", "The client has thrombocytopenia"], "c": 0, "w": "Reticulocytes are immature red cells released from the marrow, and they are larger than mature red cells. After a hemorrhage the marrow speeds up to replace lost cells, so more immature cells appear in the blood and the reticulocyte count rises above the normal 0.5 to 2.5%. In a marrow that is not producing, such as aplastic or pernicious anemia, the count is low instead. The count therefore tells the nurse how well the marrow is responding. (study guide, Ch 33)", "x": {"The marrow is not producing red cells": "A low reticulocyte count shows a marrow that is not producing, such as in aplastic or pernicious anemia.", "The client has leukemia": "Reticulocytes are immature red cells and do not point to leukemia.", "The client is dehydrated": "Dehydration raises the hematocrit but does not explain reticulocytes.", "The client has thrombocytopenia": "Reticulocytes are red cells, not platelets."}, "m": {"The marrow is not producing red cells": "reverses the meaning"}, "k": "c-labs-cbc", "lp": 0}, {"id": 36, "t": "labs", "ty": "blanks", "q": "A client with iron deficiency anemia has a serum iron test scheduled. The nurse explains that iron supplements must be held for at least [1] before the test, that the sample is best drawn in the [2], and that the total iron-binding capacity will be [3].", "o": [["24 hours", "4 hours", "2 weeks"], ["morning", "evening", "afternoon"], ["high", "low", "normal"]], "c": [0, 0, 0], "w": "Iron supplements are avoided for at least 24 hours and an overnight fast is recommended. Serum iron is drawn in the morning because levels are lower in the evening. In iron deficiency TIBC is high because transferrin has many empty seats, while ferritin and transferrin saturation are low. (study guide, Ch 33 and class notes)", "x": {"4 hours": "Iron supplements are held at least 24 hours.", "2 weeks": "Two weeks is far longer than needed.", "evening": "Iron levels drop in the evening, so the sample is drawn in the morning.", "afternoon": "The morning draw is recommended.", "low": "TIBC is high in iron deficiency because there are many empty binding spots.", "normal": "TIBC is not normal in iron deficiency; it rises."}, "m": {"low": "reverses TIBC in IDA"}, "k": "c-labs-iron", "lp": 1}, {"id": 37, "t": "labs", "ty": "mc", "q": "A 25-year-old client with fatigue, pale nailbeds, a smooth red tongue and low ferritin has iron deficiency anemia. Which lunch choice shows the client understood diet teaching?", "o": ["Roast beef, steamed spinach, tomato soup and orange juice", "Cheese pizza with a glass of milk", "Cereal with milk and a banana", "Plain pasta with butter and a vanilla milkshake", "Toast with margarine and tea"], "c": 0, "w": "Heme iron from red meat is paired with nonheme iron from spinach and vitamin C from tomatoes and orange juice, which increases absorption. Dairy and antacids reduce iron absorption. The class notes add that iron is taken with vitamin C on an empty stomach, not with milk. (study guide, Ch 34 and class notes)", "x": {"Cheese pizza with a glass of milk": "Dairy blocks iron absorption and this lunch has little iron.", "Cereal with milk and a banana": "Milk blocks iron absorption.", "Plain pasta with butter and a vanilla milkshake": "This meal has little iron and the dairy blocks absorption.", "Toast with margarine and tea": "This meal has no heme iron, no vitamin C source, and no iron-rich vegetables."}, "m": {"Cheese pizza with a glass of milk": "forgets that dairy blocks iron", "Cereal with milk and a banana": "forgets that dairy blocks iron", "Plain pasta with butter and a vanilla milkshake": "forgets that dairy blocks iron"}, "k": "c-labs-iron", "lp": 1}, {"id": 38, "t": "labs", "ty": "sata", "q": "A client has iron deficiency anemia. Which laboratory findings should the nurse expect? Select all that apply.", "o": ["Decreased serum ferritin", "Increased total iron-binding capacity", "Decreased transferrin saturation", "Decreased MCV", "Increased serum ferritin", "Increased MCV", "Increased transferrin saturation"], "c": [0, 1, 2, 3], "w": "Iron is stored as ferritin and carried by transferrin, so when iron runs out the stores empty and ferritin, serum iron and transferrin saturation all fall. The transferrin carriers are left with many empty binding spots, which is why total iron-binding capacity rises. Without enough iron the marrow makes small, pale red cells, so the MCV and MCHC fall. The class slide gives ferritin below 100 for iron deficiency and the textbook gives below 10; ask your instructor which number will be tested. (study guide, Ch 33 and Ch 34)", "x": {"Increased serum ferritin": "Ferritin reflects iron stores and is low in iron deficiency.", "Increased MCV": "An increased MCV is macrocytic, as in B12 or folate deficiency; iron deficiency is microcytic.", "Increased transferrin saturation": "Transferrin saturation is always low in iron deficiency."}, "m": {"Increased MCV": "mixes up microcytic and macrocytic"}, "k": "c-labs-iron", "lp": 0}, {"id": 39, "t": "labs", "ty": "match", "q": "The nurse reviews coagulation studies. Match each test with what it monitors.", "o": ["Heparin, through the intrinsic pathway", "Warfarin, through the extrinsic pathway", "Platelet function", "Abnormal platelet function from aspirin or von Willebrand disease"], "c": [0, 1, 2, 3], "w": "The intrinsic pathway is monitored by PTT and the drug is heparin. The extrinsic pathway is monitored by PT and INR and the drug is warfarin. Your class notes list PT and PTT together for the intrinsic pathway, but the book and slide picture pair heparin with PTT, so PTT is the safe answer for heparin. (study guide, Ch 33 and class notes)", "x": {"Heparin, through the intrinsic pathway": "PTT or aPTT monitors heparin.", "Warfarin, through the extrinsic pathway": "PT and INR monitor warfarin; the INR goal is 2 to 3.", "Platelet function": "Bleeding time checks overall platelet function and is not done if platelets are under 75,000.", "Abnormal platelet function from aspirin or von Willebrand disease": "Platelet aggregation is impaired in von Willebrand disease and with aspirin or NSAIDs."}, "m": {}, "k": "c-labs-coag", "lp": 1, "r": ["PTT", "PT/INR", "Bleeding time", "Platelet aggregation"]}, {"id": 40, "t": "labs", "ty": "mc", "q": "A nurse is preparing to collect blood for a CBC. Which tube should the nurse use?", "o": ["Lavender (EDTA) tube", "Light blue (sodium citrate) tube", "Red top with no additive", "Green (heparin) tube"], "c": 0, "w": "The tube additive decides which test can be run. A CBC needs whole blood that does not clot, so it goes in a lavender tube with EDTA. Clotting studies measure how fast plasma clots, so they use sodium citrate, which is reversible, and the tube must be filled completely to keep the blood-to-additive ratio right. The tourniquet comes off as soon as blood flows because leaving it on for more than a minute falsely raises the RBC, Hgb and Hct. (study guide, Ch 33)", "x": {"Light blue (sodium citrate) tube": "Sodium citrate tubes are used for PT, INR and PTT.", "Red top with no additive": "The CBC is drawn in an EDTA tube.", "Green (heparin) tube": "A heparin tube is not the tube listed for the CBC."}, "m": {"Light blue (sodium citrate) tube": "mixes up the CBC and coagulation tubes"}, "k": "c-labs-cbc", "lp": 0}, {"id": 41, "t": "labs", "ty": "tf", "q": "A nurse teaches a student that a client with iron deficiency anemia will typically show microcytic and hypochromic red cells. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "Hemoglobin needs iron, and the amount of hemoglobin determines how large and how dark a red cell is. When iron is lacking the marrow makes cells with less hemoglobin, so they are smaller (a low MCV, microcytic) and paler (a low MCHC, hypochromic). Lead poisoning produces the same picture. Large cells, by contrast, point to a lack of B12 or folate. (study guide, Ch 33)", "x": {"False": "Marking False would label iron deficiency as macrocytic; macrocytic cells point to B12 or folate deficiency."}, "m": {}, "k": "c-labs-cbc", "lp": 1}, {"id": 42, "t": "labs", "ty": "tf", "q": "A nurse tells a student that a platelet count of 100,000/mm³ is the level at which spontaneous bleeding becomes possible. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "At 100,000 bleeding precautions start. Spontaneous bleeding becomes possible below 50,000, and especially below 20,000. The true version is: precautions start at 100,000, and spontaneous bleeding is possible below 50,000. (study guide, Ch 33 and cheat sheet)", "x": {"True": "Marking True moves the spontaneous-bleeding threshold up to 100,000."}, "m": {}, "k": "c-labs-cbc", "lp": 1}, {"id": 43, "t": "lung", "ty": "mc", "q": "A 68-year-old client who has smoked two packs a day for decades is told the biopsy shows small cell (oat cell) lung cancer. Which statement by the nurse is accurate?", "o": ["“This type grows quickly and spreads to other organs early, so surgery is not the main treatment.”", "“This is the most common type, making up about 85% of lung cancers.”", "“If it is found early, the 5-year survival is good.”", "“It includes adenocarcinoma, squamous cell and large cell types.”", "“Surgery is used primarily for this type when it has not spread.”"], "c": 0, "w": "Smoking causes mutations that turn off the controls on cell growth, and the two lung cancer groups behave very differently once that happens. Small cell cancer is about 15% of cases, grows fast and spreads to other organs early, so removing the tumor does not cure it and surgery is not the main treatment. Its outlook is poor at any stage: only 5 to 10% survive 5 years, and your class notes give a life expectancy of 6 months to 1 year. Non-small cell cancer is about 85%, has three cell types, grows more slowly, and has a good 5-year survival if found early, so surgery is used when there is no metastasis. (study guide, Ch 26 and class notes)", "x": {"“This is the most common type, making up about 85% of lung cancers.”": "About 85% of lung cancers are non-small cell; small cell is about 15%.", "“If it is found early, the 5-year survival is good.”": "Good early-stage survival describes non-small cell cancer; small cell has a poor outlook at any stage.", "“It includes adenocarcinoma, squamous cell and large cell types.”": "Those three cell types make up non-small cell cancer.", "“Surgery is used primarily for this type when it has not spread.”": "Surgery is used primarily for non-small cell cancer without metastasis."}, "m": {"“This is the most common type, making up about 85% of lung cancers.”": "swaps the 85% and 15% figures", "“If it is found early, the 5-year survival is good.”": "gives small cell the non-small cell outlook", "“It includes adenocarcinoma, squamous cell and large cell types.”": "mixes up the two types", "“Surgery is used primarily for this type when it has not spread.”": "mixes up the two types"}, "k": "c-lung-types", "lp": 1}, {"id": 44, "t": "lung", "ty": "sata", "q": "The nurse reviews the features of non-small cell lung cancer with a nursing student. Select all that apply.", "o": ["It makes up about 85% of lung cancers", "Its cell types are adenocarcinoma, squamous cell carcinoma and large cell carcinoma", "Surgery is used primarily when there is no metastasis", "The 5-year survival is good when it is found at an early stage", "It grows quickly and spreads early to other organs", "Life expectancy is typically 6 months to 1 year", "It is also called oat cell cancer"], "c": [0, 1, 2, 3], "w": "Non-small cell lung cancer is the larger and slower group with three cell types, and early-stage disease has a good 5-year survival. Surgery is the preferred treatment when there is no metastasis. The wrong options all describe small cell, the faster and poorer-outlook type. (study guide, Ch 26 and class notes)", "x": {"It grows quickly and spreads early to other organs": "That describes small cell lung cancer.", "Life expectancy is typically 6 months to 1 year": "That is the class figure for small cell lung cancer.", "It is also called oat cell cancer": "Oat cell is another name for small cell lung cancer."}, "m": {"It grows quickly and spreads early to other organs": "mixes up the two types", "Life expectancy is typically 6 months to 1 year": "mixes up the two types", "It is also called oat cell cancer": "mixes up the two types"}, "k": "c-lung-types", "lp": 1}, {"id": 45, "t": "lung", "ty": "mc", "q": "A 70-year-old client with known lung cancer reports a new headache and bone pain. Which finding does the nurse recognize as suggesting metastasis?", "o": ["Headache and bone pain", "A new cough that does not go away", "Hoarseness", "Frequent pneumonia or bronchitis", "Hemoptysis"], "c": 0, "w": "Early lung cancer often has no symptoms. As it advances, cues include a new or changed cough, hemoptysis, shortness of breath, wheezing, hoarseness, chest pain, weight loss and frequent pneumonia. Headache and bone pain suggest metastasis to the brain and bone; common sites are brain, bone, adrenal gland and the other lung. Bone pain also prompts a calcium check. (study guide, Ch 26 and Ch 13)", "x": {"A new cough that does not go away": "A new or changing cough is a presenting cue of lung cancer itself, not a sign of spread.", "Hoarseness": "Hoarseness is a presenting symptom of lung cancer.", "Frequent pneumonia or bronchitis": "This is a presenting cue from airway obstruction and infection.", "Hemoptysis": "Hemoptysis comes from small vessels rupturing in the lung."}, "m": {"A new cough that does not go away": "treats a presenting cue as a sign of spread", "Hoarseness": "treats a presenting cue as a sign of spread", "Frequent pneumonia or bronchitis": "treats a presenting cue as a sign of spread", "Hemoptysis": "treats a presenting cue as a sign of spread"}, "k": "c-lung-dx", "lp": 1}, {"id": 46, "t": "lung", "ty": "mc", "q": "A client with suspected lung cancer is scheduled for a PET scan. The client asks what the test shows. Which response by the nurse is best?", "o": ["“It shows areas of high metabolic activity, such as rapidly dividing cancer cells, rather than the structure of the lung.”", "“It shows the structure of the airways so the provider can take a tissue sample.”", "“It is a small chest incision to look at the nodes in the middle of the chest.”", "“It identifies the type of tumor cells in the mucus you cough up.”", "“It looks only for fractures of the ribs.”"], "c": 0, "w": "A PET scan detects how metabolically active tissue is, and rapidly dividing cancer cells are very active, so they light up as hot spots (glucose must be controlled before the scan). That is why PET reveals metabolism rather than anatomy. Structure and tissue are shown by other tests: chest x-ray and CT find the lesion, sputum cytology may identify tumor cells, bronchoscopy allows a biopsy of the airways, and mediastinoscopy is a surgical incision to view and biopsy the mediastinum. (study guide, Ch 26)", "x": {"“It shows the structure of the airways so the provider can take a tissue sample.”": "Airway structure and tissue sampling describe bronchoscopy.", "“It is a small chest incision to look at the nodes in the middle of the chest.”": "That describes mediastinoscopy.", "“It identifies the type of tumor cells in the mucus you cough up.”": "That describes sputum cytology.", "“It looks only for fractures of the ribs.”": "PET looks at metabolism; bone and abdominal scans look for metastasis."}, "m": {"“It shows the structure of the airways so the provider can take a tissue sample.”": "mixes up PET and bronchoscopy", "“It is a small chest incision to look at the nodes in the middle of the chest.”": "mixes up PET and mediastinoscopy", "“It identifies the type of tumor cells in the mucus you cough up.”": "mixes up PET and sputum cytology"}, "k": "c-lung-dx", "lp": 0}, {"id": 47, "t": "lung", "ty": "match", "q": "The nurse reviews lung cancer surgery and testing with a client. Match each procedure with its description.", "o": ["Removes one entire lobe when the cancer is localized to that lobe", "Removes the entire lung when cancer is spread diffusely through it", "Removes a small section of a lobe for cancer in one small area", "A surgical incision to view and biopsy the mediastinum"], "c": [0, 1, 2, 3], "w": "Surgery is preferred if there is no metastasis. The extent of cancer decides the operation: a small area gets a wedge resection, one lobe gets a lobectomy, and a diffusely spread cancer needs a pneumonectomy. Mediastinoscopy is used to biopsy the nodes. (study guide, Ch 26)", "x": {"Removes one entire lobe when the cancer is localized to that lobe": "This is a lobectomy.", "Removes the entire lung when cancer is spread diffusely through it": "This is a pneumonectomy.", "Removes a small section of a lobe for cancer in one small area": "This is a wedge resection.", "A surgical incision to view and biopsy the mediastinum": "This is mediastinoscopy, a diagnostic test rather than a treatment."}, "m": {}, "k": "c-lung-tx", "lp": 0, "r": ["Lobectomy", "Pneumonectomy", "Wedge resection", "Mediastinoscopy"]}, {"id": 48, "t": "lung", "ty": "order", "q": "The nurse explains the WHO pain ladder used for cancer pain. Place the steps in order from mild to severe pain.", "o": ["Step 1: a nonopioid such as acetaminophen or an NSAID", "Step 2: a moderate opioid such as codeine, hydrocodone or oxycodone plus a nonopioid", "Step 3: a strong opioid such as morphine or fentanyl plus a nonopioid"], "c": [0, 1, 2], "w": "The ladder matches the strength of the drug to the intensity of the pain. A nonopioid is first, and it is kept at every step because it adds pain relief and lets the opioid dose stay lower. When pain is moderate a weaker opioid is added, and when it is severe a strong opioid such as morphine or fentanyl is used. Doses are given around the clock rather than on demand, so that the level of relief stays steady and pain peaks are avoided. (study guide, Ch 26 and Ch 11)", "x": {}, "m": {}, "k": "c-lung-tx", "lp": 1}, {"id": 49, "t": "lung", "ty": "mc", "q": "A client with lung cancer has dyspnea and a SpO₂ of 87% on room air. Which action should the nurse take first?", "o": ["Raise the head of the bed to semi-Fowler's position and apply oxygen to keep the SpO₂ at 90% or higher", "Lay the client flat to rest", "Offer a large meal to improve strength", "Encourage the client to walk the hall", "Wait and recheck the SpO₂ in 1 hour"], "c": 0, "w": "A SpO₂ below 90% means poor gas exchange. Oxygen is given to keep the SpO₂ at 90% or higher, and semi-Fowler's allows full lung expansion and better oxygenation. Small frequent meals with supplements avoid pressure on the diaphragm, and pain, anti-anxiety and bronchodilator medications help the client relax and open the airway. (study guide, Ch 26)", "x": {"Lay the client flat to rest": "Lying flat reduces lung expansion; semi-Fowler's allows full expansion and better oxygenation.", "Offer a large meal to improve strength": "A large meal pushes on the diaphragm; small frequent meals with supplements are better.", "Encourage the client to walk the hall": "Activity increases oxygen demand; the client has activity intolerance.", "Wait and recheck the SpO₂ in 1 hour": "A SpO₂ below 90% is a significant oxygenation problem that needs action now."}, "m": {"Lay the client flat to rest": "positions flat for rest", "Offer a large meal to improve strength": "feeds a large meal"}, "k": "c-lung-nursing", "lp": 1}, {"id": 50, "t": "lung", "ty": "mc", "q": "A nurse sees a coworker about to clamp the chest tube of a client who had a lobectomy, to move the client to a chair. Which action should the nurse take?", "o": ["Intervene, because the chest tube should never be clamped; air or fluid can build up and cause a tension pneumothorax", "Allow it, because clamping prevents air from entering the pleural space", "Allow it for a short time only", "Disconnect the tube from the drainage system to make moving easier", "Ask the client to hold the tube while standing"], "c": 0, "w": "After lobectomy or pneumonectomy the nurse keeps the chest tube system closed, watches the water-seal chamber, and never clamps the tube. Persistent bubbling in the water-seal chamber means an air leak. Excess bloody drainage suggests a bleed and cloudy drainage suggests infection. (study guide, Ch 26)", "x": {"Allow it, because clamping prevents air from entering the pleural space": "Clamping traps air and fluid in the pleural space and can cause a tension pneumothorax.", "Allow it for a short time only": "The rule is to never clamp the chest tube.", "Disconnect the tube from the drainage system to make moving easier": "The system must stay closed to prevent air leaks.", "Ask the client to hold the tube while standing": "This does not address the unsafe clamping and the closed system must be maintained."}, "m": {"Allow it, because clamping prevents air from entering the pleural space": "believes clamping prevents air leaks", "Allow it for a short time only": "believes a brief clamp is safe", "Disconnect the tube from the drainage system to make moving easier": "opens the closed system"}, "k": "c-lung-nursing", "lp": 1}, {"id": 51, "t": "lung", "ty": "mc", "q": "A client who had a lobectomy yesterday has continuous bubbling in the water-seal chamber of the chest tube drainage system. The nurse recognizes this as which finding?", "o": ["An air leak in the system", "Normal re-expansion of the lung", "Excess bloody drainage", "Infection of the pleural space", "Atelectasis"], "c": 0, "w": "The water-seal chamber works as a one-way valve: air leaves the pleural space and bubbles through the water, but cannot come back. A brief bubble when the client coughs is expected, but bubbling that never stops means air is entering the system continuously. That points to a leak somewhere in the drainage system or the lung. The nurse also checks vital signs for hypotension or tachycardia from blood loss, breath sounds for atelectasis, and the suture line for infection. (study guide, Ch 26)", "x": {"Normal re-expansion of the lung": "Normal drainage does not cause persistent bubbling in the water-seal chamber.", "Excess bloody drainage": "Bleeding is judged by the amount and color of drainage, not by bubbling.", "Infection of the pleural space": "Cloudy drainage, not bubbling, suggests infection.", "Atelectasis": "Atelectasis is suspected when breath sounds are diminished or absent."}, "m": {}, "k": "c-lung-nursing", "lp": 0}, {"id": 52, "t": "lung", "ty": "tf", "q": "A nurse tells a client with a 30 pack-year smoking history who quit 4 years ago that a yearly low-dose CT is recommended for all adults over age 65, regardless of smoking history. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "There is no general screening guideline for lung cancer. A yearly low-dose CT is for high-risk clients: current smokers or those who quit within 15 years, with at least a 20 pack-year history. The true version is that screening is for this high-risk group only. (study guide, Ch 13 and Ch 26)", "x": {"True": "Marking True extends screening to everyone over 65; it is limited to high-risk clients."}, "m": {}, "k": "c-lung-types", "lp": 1}, {"id": 53, "t": "lung", "ty": "tf", "q": "A client newly diagnosed with lung cancer asks when palliative care can begin. The nurse answers that it begins at diagnosis to manage pain, dyspnea and nausea. The nurse's answer is accurate.", "o": ["True", "False"], "c": 0, "w": "Palliative care is built around the client's symptoms and quality of life, not around how long the client is expected to live. Lung cancer causes pain, dyspnea and nausea from the time it is diagnosed, so the help is needed from day one. For that reason palliative care starts at diagnosis and continues alongside chemotherapy or radiation. It is not the same as hospice, which is for the end of life. (study guide, Ch 26 Connection Check)", "x": {"False": "Marking False delays palliative care to the end of life, which is the hospice timing."}, "m": {}, "k": "c-lung-tx", "lp": 1}, {"id": 54, "t": "mm", "ty": "sata", "q": "The nurse reviews the CRAB criteria used to support a diagnosis of multiple myeloma. Select all that apply.", "o": ["Calcium above 11.5 mg/dL", "Creatinine above 2 mg/dL", "Hemoglobin below 10 g/dL", "Lytic bone lesions or pathologic fractures", "Platelets above 450,000/mm³", "Philadelphia chromosome present", "Reed–Sternberg cells on biopsy"], "c": [0, 1, 2, 3], "w": "Each letter of CRAB comes from a way the abnormal plasma cells damage the body. Lytic bone lesions release calcium, which causes hypercalcemia and also bone disease with fractures. Excess light chains injure the kidney, which causes renal insufficiency, and the crowded marrow causes anemia. Plasma cells of 10% or more in the marrow and an M protein in serum or urine complete the picture. (study guide, Ch 34)", "x": {"Platelets above 450,000/mm³": "A high platelet count is not part of CRAB.", "Philadelphia chromosome pr
