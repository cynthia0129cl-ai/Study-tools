esent": "The Philadelphia chromosome is linked to chronic myeloid leukemia.", "Reed–Sternberg cells on biopsy": "Reed–Sternberg cells define Hodgkin lymphoma."}, "m": {"Philadelphia chromosome present": "mixes up myeloma and leukemia", "Reed–Sternberg cells on biopsy": "mixes up myeloma and Hodgkin lymphoma"}, "k": "c-mm-patho", "lp": 1}, {"id": 55, "t": "mm", "ty": "mc", "q": "A client with multiple myeloma has Bence Jones protein in the urine. Why does the nurse monitor BUN and creatinine closely?", "o": ["The excess light chains are toxic to the kidneys", "The M protein lowers the blood pressure and starves the kidneys", "Bisphosphonates always cause kidney failure", "The tumor grows directly inside the kidney", "Low platelets cause bleeding into the kidneys"], "c": 0, "w": "One clone of plasma cells overgrows the marrow and pumps out monoclonal immunoglobulin, the M protein. Excess light chains, called Bence Jones protein in the urine, are directly toxic to the kidney, and calcium released from lytic bone lesions adds stones and renal injury. The nurse watches BUN, creatinine, intake and output, and serum and urine calcium. (study guide, Ch 34)", "x": {"The M protein lowers the blood pressure and starves the kidneys": "The harm comes from light chains and calcium, not from low blood pressure.", "Bisphosphonates always cause kidney failure": "The kidney damage in myeloma comes from light chains and hypercalcemia, not from treatment.", "The tumor grows directly inside the kidney": "Myeloma is a plasma cell cancer of the marrow; the kidney is harmed by what the cells make.", "Low platelets cause bleeding into the kidneys": "Bleeding is not the cause of the kidney damage here."}, "m": {}, "k": "c-mm-patho", "lp": 0}, {"id": 56, "t": "mm", "ty": "mc", "q": "A client with multiple myeloma reports sudden severe back pain and new numbness in both legs. Which action should the nurse take first?", "o": ["Assess motor and sensory function in the legs and notify the provider immediately", "Apply a heating pad to the back and reassess in the morning", "Encourage the client to walk to loosen the back", "Give an extra dose of the calcium supplement", "Document the finding and continue routine care"], "c": 0, "w": "Myeloma destroys bone, so sudden severe pain, or pain in a new spot, especially the back, may mean a pathologic fracture or vertebral collapse. Spinal cord compression causes numbness, tingling and motor changes. The nurse assesses and reports at once, and teaches the client to report sudden severe pain and any change in sensation or movement. (study guide, Ch 34)", "x": {"Apply a heating pad to the back and reassess in the morning": "Sudden severe pain with numbness may be a fracture or spinal cord compression, which cannot wait.", "Encourage the client to walk to loosen the back": "Walking could worsen a vertebral fracture or cord compression.", "Give an extra dose of the calcium supplement": "Hypercalcemia is a risk in myeloma, so extra calcium is harmful.", "Document the finding and continue routine care": "These are emergency warning signs that must be reported."}, "m": {"Give an extra dose of the calcium supplement": "forgets the client is at risk for hypercalcemia"}, "k": "c-mm-nursing", "lp": 1}, {"id": 57, "t": "mm", "ty": "sata", "q": "A client with multiple myeloma is admitted with hypercalcemia and bone pain. Which nursing interventions are appropriate? Select all that apply.", "o": ["Encourage fluids to dilute calcium and protect the kidneys", "Encourage ambulation as tolerated", "Position the client for comfort", "Monitor serum and urine calcium, BUN and creatinine", "Restrict fluids to lower urine output", "Maintain strict bed rest", "Offer a calcium supplement for bone strength"], "c": [0, 1, 2, 3], "w": "Fluids dilute calcium and protect the kidneys from stones and light chains. Walking as tolerated gives weight bearing that builds bone and helps prevent DVT. Positioning for comfort eases nerve compression, and monitoring calcium, BUN and creatinine tracks kidney damage. Bisphosphonates, chemotherapy and pain medication are given as ordered. (study guide, Ch 34 and class notes)", "x": {"Restrict fluids to lower urine output": "Fluids are encouraged to dilute the calcium and prevent stones.", "Maintain strict bed rest": "Weight bearing builds bone and prevents DVT and deconditioning.", "Offer a calcium supplement for bone strength": "The client already has too much calcium in the blood from bone breakdown."}, "m": {"Restrict fluids to lower urine output": "restricts fluids in hypercalcemia", "Offer a calcium supplement for bone strength": "forgets the client has hypercalcemia"}, "k": "c-mm-nursing", "lp": 1}, {"id": 58, "t": "mm", "ty": "mc", "q": "A client with multiple myeloma is prescribed ibandronate (Boniva). Which purpose should the nurse include in teaching?", "o": ["It reduces bone breakdown, which lowers calcium and the risk of fractures", "It replaces the clotting factors the client is missing", "It kills the abnormal plasma cells directly", "It raises the blood calcium to strengthen bone", "It lowers uric acid and prevents tumor lysis"], "c": 0, "w": "Bisphosphonates slow bone breakdown, so fewer fractures occur and calcium falls. Examples include ibandronate (Boniva), pamidronate and zoledronate. Long-term use with bisphosphonates or denosumab can cause osteonecrosis of the jaw. (study guide, Ch 34 and class notes)", "x": {"It replaces the clotting factors the client is missing": "Replacing factors is the treatment for hemophilia.", "It kills the abnormal plasma cells directly": "Chemotherapy such as thalidomide, lenalidomide or bortezomib attacks the cancer cells.", "It raises the blood calcium to strengthen bone": "The drug lowers calcium by slowing bone breakdown.", "It lowers uric acid and prevents tumor lysis": "Allopurinol and rasburicase are used for uric acid."}, "m": {"It kills the abnormal plasma cells directly": "mixes up bone drugs and chemotherapy", "It raises the blood calcium to strengthen bone": "reverses the effect on calcium"}, "k": "c-mm-nursing", "lp": 0}, {"id": 59, "t": "mm", "ty": "mc", "q": "A nurse reviews the signs of hypercalcemia in a client with multiple myeloma. Which finding should the nurse expect?", "o": ["Constipation, muscle weakness and polyuria", "Peaked T waves on the ECG", "Dilutional hyponatremia with seizures", "Hypotension, tachycardia and hives", "Ribbon-like stools with vomiting"], "c": 0, "w": "Hypercalcemia from bone breakdown causes confusion or lethargy, muscle weakness, polyuria and dehydration, constipation and nausea, bradycardia and heart block. Your class notes add tingling and burning sensation. Fluids dilute the calcium. (study guide, Ch 13, Ch 34 and class notes)", "x": {"Peaked T waves on the ECG": "Peaked T waves are a sign of hyperkalemia, as in tumor lysis syndrome.", "Dilutional hyponatremia with seizures": "That describes SIADH.", "Hypotension, tachycardia and hives": "That picture fits anaphylaxis.", "Ribbon-like stools with vomiting": "That suggests a bowel obstruction."}, "m": {"Peaked T waves on the ECG": "mixes up calcium and potassium", "Dilutional hyponatremia with seizures": "mixes up calcium and sodium"}, "k": "c-mm-nursing", "lp": 0}, {"id": 60, "t": "mm", "ty": "tf", "q": "A nurse tells a client newly diagnosed with multiple myeloma that the disease is an incurable B-cell cancer of plasma cells. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "A single clone of plasma cells, which are mature B cells that make antibodies, overgrows the marrow and cannot be fully removed. Because the clone is spread through the marrow and bones, treatment aims to control the disease and its complications rather than cure it. That is why the nurse focuses on pain control, calcium and kidney protection, infection and fracture prevention. Chemotherapy, dexamethasone, bisphosphonates and an autologous stem cell transplant are options. (study guide, Ch 34)", "x": {"False": "Marking False would tell the client the disease is curable; it is described as incurable."}, "m": {}, "k": "c-mm-patho", "lp": 1}, {"id": 61, "t": "mm", "ty": "tf", "q": "A nurse tells a woman of childbearing age who is starting thalidomide or lenalidomide for multiple myeloma that these drugs are safe to take during pregnancy. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "These two drugs interfere with the normal development of a fetus, so they are called teratogenic. A woman who becomes pregnant while taking them could have a baby with serious defects. The safe teaching is that a woman of childbearing age needs reliable contraception, and the same two-forms-of-birth-control rule appears for methotrexate in the class case. Claiming they are safe in pregnancy is therefore wrong. (study guide, Ch 34; class notes)", "x": {"True": "Marking True would expose a fetus to a teratogenic drug."}, "m": {}, "k": "c-mm-nursing", "lp": 1}, {"id": 62, "t": "prostate", "ty": "mc", "q": "A 71-year-old client with metastasis to the bone from prostate cancer says, “I never had any trouble urinating.” Which explanation by the nurse is correct?", "o": ["Prostate tumors usually grow at the edges of the gland, so they do not block urine flow early", "The tumor grows inside the urethra but is too small to block it", "The client's bladder muscle compensated for the blockage", "Prostate cancer never affects urination", "The metastasis to the bone relieved the pressure on the urethra"], "c": 0, "w": "Prostate cancer is slow growing and asymptomatic until it is advanced. Because the tumors grow on the periphery of the gland, they do not obstruct urine flow early and go unnoticed until they cause pain. That is how a client can have late-stage disease with no urinary trouble. It spreads to lymph nodes, bone, rectum and bladder. (study guide, Ch 66 and class PLQ)", "x": {"The tumor grows inside the urethra but is too small to block it": "Tumors grow on the periphery of the gland, away from the urethra.", "The client's bladder muscle compensated for the blockage": "There was no early blockage to compensate for.", "Prostate cancer never affects urination": "Urinary symptoms appear when the cancer advances.", "The metastasis to the bone relieved the pressure on the urethra": "Metastasis does not relieve urinary obstruction."}, "m": {"The tumor grows inside the urethra but is too small to block it": "places the tumor at the urethra"}, "k": "c-pros-patho", "lp": 1}, {"id": 63, "t": "prostate", "ty": "mc", "q": "A 56-year-old client has a PSA of 4.6 ng/mL and an enlarged prostate on digital rectal exam. Which statement by the nurse is accurate?", "o": ["“A PSA of 4 or higher needs further evaluation, and a biopsy confirms the diagnosis.”", "“A PSA this high confirms that you have prostate cancer.”", "“A PSA below 4 means cancer is not possible.”", "“PSA rises only with cancer, not with infection or an enlarged prostate.”", "“The next step is a radical prostatectomy.”"], "c": 0, "w": "PSA of 4 ng/mL or higher needs further assessment, and the diagnosis requires a needle biopsy, then a Gleason score and TNM staging. PSA has high sensitivity but low specificity, so infection and enlargement can raise it. A large palpable prostate plus a high PSA needs workup. (study guide, Ch 66 and Ch 13)", "x": {"“A PSA this high confirms that you have prostate cancer.”": "PSA has high sensitivity but low specificity and cannot confirm cancer; biopsy does.", "“A PSA below 4 means cancer is not possible.”": "No PSA value guarantees there is no cancer.", "“PSA rises only with cancer, not with infection or an enlarged prostate.”": "Prostatitis and BPH also raise PSA, which is why it cannot tell BPH from cancer.", "“The next step is a radical prostatectomy.”": "Treatment decisions follow biopsy, Gleason score and staging."}, "m": {"“A PSA this high confirms that you have prostate cancer.”": "treats PSA as diagnostic", "“A PSA below 4 means cancer is not possible.”": "treats a low PSA as a guarantee", "“PSA rises only with cancer, not with infection or an enlarged prostate.”": "thinks only cancer raises PSA"}, "k": "c-pros-patho", "lp": 1}, {"id": 64, "t": "prostate", "ty": "sata", "q": "A client has returned to the unit after a radical prostatectomy. Which complications should the nurse monitor for? Select all that apply.", "o": ["Erectile dysfunction", "Urinary incontinence", "Infection, such as fever, increasing pain, swelling or redness", "Bleeding with clots in the urine", "Hearing loss from ototoxicity", "Lymphedema of the arm", "Dry cough from pneumonitis"], "c": [0, 1, 2, 3], "w": "Impotence is the most expected complication after radical prostatectomy and nerve-sparing surgery only tries to protect the erection nerves. Urinary incontinence, infection, and bleeding with clots are also watched for. The nurse manages bladder irrigation to clear clots, gives stool softeners to avoid straining, and uses aseptic wound care. (study guide, Ch 66; class notes)", "x": {"Hearing loss from ototoxicity": "Ototoxicity is a chemotherapy effect of testicular cancer drugs such as cisplatin.", "Lymphedema of the arm": "Arm lymphedema follows axillary node removal in breast cancer.", "Dry cough from pneumonitis": "Pneumonitis follows chest radiation."}, "m": {"Hearing loss from ototoxicity": "borrows a complication from another cancer", "Lymphedema of the arm": "borrows a complication from another cancer", "Dry cough from pneumonitis": "borrows a complication from another cancer"}, "k": "c-pros-postop", "lp": 1}, {"id": 65, "t": "prostate", "ty": "mc", "q": "A client has continuous bladder irrigation after prostate surgery. The nurse explains that the irrigation is used to do what?", "o": ["Clear blood clots so the catheter stays open", "Treat a urinary tract infection", "Lower the PSA level", "Dissolve bladder stones", "Deliver chemotherapy to the bladder"], "c": 0, "w": "After prostate surgery bleeding and clots can block urine flow. Bladder irrigation clears the clots and keeps the urine light pink. Stool softeners prevent straining, which could start bleeding. (study guide, Ch 66)", "x": {"Treat a urinary tract infection": "Infection is treated with antibiotics; irrigation clears clots.", "Lower the PSA level": "Irrigation does not change PSA.", "Dissolve bladder stones": "Stones are not the purpose of irrigation after this surgery.", "Deliver chemotherapy to the bladder": "Irrigation fluid is not chemotherapy."}, "m": {}, "k": "c-pros-postop", "lp": 0}, {"id": 66, "t": "prostate", "ty": "mc", "q": "After a prostatectomy a client is ordered a daily stool softener. The client asks why it is needed. Which response by the nurse is best?", "o": ["“It prevents straining, which could cause bleeding at the surgical site.”", "“It lowers your PSA level.”", "“It treats the infection in your prostate.”", "“It helps the radioactive seeds pass.”"], "c": 0, "w": "After prostate surgery there are fresh wounds and vessels in and around the bladder neck. Straining to pass a hard stool raises pressure in the pelvis and can restart bleeding or dislodge clots, so the nurse prevents it. A stool softener keeps the stool soft so the client does not strain. It works together with bladder irrigation, which clears clots, and aseptic wound care. (study guide, Ch 66)", "x": {"“It lowers your PSA level.”": "Stool softeners have no effect on PSA.", "“It treats the infection in your prostate.”": "A stool softener does not treat infection.", "“It helps the radioactive seeds pass.”": "Seeds are implanted in brachytherapy, not passed after prostatectomy."}, "m": {}, "k": "c-pros-postop", "lp": 0}, {"id": 67, "t": "prostate", "ty": "mc", "q": "A client is having permanent radioactive seeds placed through the perineum for early prostate cancer. Which statement by the client indicates understanding of safety teaching?", "o": ["“I will avoid sex for 2 weeks and then use a condom to protect my partner from radiation.”", "“I can resume unprotected intercourse after one day.”", "“The seeds will be taken out after a week.”", "“The seeds are placed through my abdomen under general anesthesia.”", "“The seeds are for cancer that has spread to my bones.”"], "c": 0, "w": "Brachytherapy places radioactive seeds permanently through the perineum, as an outpatient procedure, for cancer that has not spread outside the prostate. The client avoids sex for 2 weeks and then uses a condom. Radiation and brachytherapy can cause incontinence and impotence. (study guide, Ch 66)", "x": {"“I can resume unprotected intercourse after one day.”": "The teaching is no sex for 2 weeks, then a condom.", "“The seeds will be taken out after a week.”": "Brachytherapy seeds for prostate cancer are placed permanently.", "“The seeds are placed through my abdomen under general anesthesia.”": "They are placed through the perineum as an outpatient procedure.", "“The seeds are for cancer that has spread to my bones.”": "Brachytherapy is for cancer that has not spread outside the prostate."}, "m": {"“The seeds will be taken out after a week.”": "thinks the seeds are temporary"}, "k": "c-pros-tx", "lp": 1}, {"id": 68, "t": "prostate", "ty": "mc", "q": "A nurse is caring for a client who has a radioactive implant for prostate cancer. Which action should the nurse take?", "o": ["Minimize contact time and wear proper, thicker PPE", "Wear no protective equipment because the client is not radioactive", "Wear only regular gloves", "Spend as much time at the bedside as possible", "Let the family handle all body-fluid care without teaching"], "c": 0, "w": "Brachytherapy places the radiation source inside or next to the tumor, so the client can expose others to radiation. The nurse therefore minimizes contact and wears proper, thicker PPE. This differs from external beam radiation, where the machine delivers the dose and the client is not radioactive. Body fluids of a brachytherapy client may carry radioactive material, so the family is taught the precautions too. (study guide, Ch 13, Ch 66 and class notes)", "x": {"Wear no protective equipment because the client is not radioactive": "Not being radioactive is true for external beam therapy; with brachytherapy the nurse limits exposure.", "Wear only regular gloves": "Proper, thicker PPE is needed to minimize radiation exposure.", "Spend as much time at the bedside as possible": "Time near the source should be limited.", "Let the family handle all body-fluid care without teaching": "Brachytherapy clients may eliminate radioactive material in body fluids, so the family is taught too."}, "m": {"Wear no protective equipment because the client is not radioactive": "applies the external beam rule to brachytherapy"}, "k": "c-pros-tx", "lp": 1}, {"id": 69, "t": "prostate", "ty": "mc", "q": "A client with prostate cancer reports fever, malaise and a rising white blood cell count after treatment. Which principle should guide the nurse's care?", "o": ["Infection is the most likely cause", "This is an expected response to the tumor", "This indicates hemorrhage", "This indicates the cancer has become stage IV", "This is an adverse effect of a stool softener"], "c": 0, "w": "Cancer and its treatment weaken the body's defenses, and surgery or catheters add entry points for bacteria. Fever, malaise and a rising WBC are the body's response to an infection, so infection is the most likely cause and is checked first. After prostate surgery infection also shows as increasing pain, swelling, redness, drainage and nausea or vomiting. The nurse reports these findings and uses aseptic wound care. (study guide, Ch 66 and class PLQ)", "x": {"This is an expected response to the tumor": "Fever with a high WBC in a cancer client points first to infection.", "This indicates hemorrhage": "Hemorrhage shows with bleeding, low blood pressure and a rising heart rate.", "This indicates the cancer has become stage IV": "Staging cannot be judged from a fever.", "This is an adverse effect of a stool softener": "A stool softener does not cause fever."}, "m": {}, "k": "c-pros-postop", "lp": 0}, {"id": 70, "t": "prostate", "ty": "mc", "q": "A client is scheduled for a nerve-sparing radical prostatectomy. Which statement by the client indicates understanding of the surgery?", "o": ["“The surgery tries to protect the nerves that control erection, but impotence is still likely.”", "“The surgery guarantees I will keep normal erections.”", "“The surgery removes only the outer layer of the prostate.”", "“The surgery will prevent any problem with urine control.”", "“The surgery is done with radioactive seeds placed through the skin.”"], "c": 0, "w": "Radical prostatectomy removes the prostate and seminal vesicles, with or without pelvic nodes, and almost always results in impotence. The nerve-sparing approach attempts to keep intact the nerves that control erection. Incontinence, infection, bleeding and clots are other complications to watch for. (study guide, Ch 66)", "x": {"“The surgery guarantees I will keep normal erections.”": "Radical prostatectomy almost always results in impotence; nerve-sparing only tries to protect the nerves.", "“The surgery removes only the outer layer of the prostate.”": "Radical prostatectomy removes the prostate and seminal vesicles, with or without pelvic nodes.", "“The surgery will prevent any problem with urine control.”": "Urinary incontinence is a possible complication.", "“The surgery is done with radioactive seeds placed through the skin.”": "That describes brachytherapy."}, "m": {"“The surgery guarantees I will keep normal erections.”": "thinks nerve-sparing guarantees erections"}, "k": "c-pros-postop", "lp": 0}, {"id": 71, "t": "prostate", "ty": "tf", "q": "A nurse tells a client that African American men have a higher incidence of prostate cancer and about twice the mortality. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "The risk of prostate cancer is not the same in every group. African American men, and Caribbean men of African ancestry, have a higher incidence and about twice the mortality of other men. Because of this the screening conversation starts earlier, at age 45 rather than 50. The nurse should know the disparity when discussing PSA and rectal exam screening. (study guide, Ch 66 and Ch 13)", "x": {"False": "Marking False denies a documented disparity."}, "m": {}, "k": "c-pros-patho", "lp": 1}, {"id": 72, "t": "prostate", "ty": "tf", "q": "A nurse teaches a client that benign prostatic hyperplasia is an early stage of prostate cancer. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "BPH is an enlargement of the gland from changes such as dihydrotestosterone buildup, and it squeezes the urethra. It is a benign process and does not turn into cancer. A man can have both conditions at the same time, which is why PSA cannot separate them and why a biopsy is used to confirm cancer. The statement that BPH is an early stage of cancer is therefore false. (study guide, Ch 66)", "x": {"True": "Marking True treats BPH as a pre-cancer."}, "m": {}, "k": "c-pros-patho", "lp": 1}, {"id": 73, "t": "risk", "ty": "mc", "q": "A nurse is reviewing risk factors with a 58-year-old client. Which finding is a nonmodifiable risk factor for cancer?", "o": ["A genetic predisposition such as a BRCA1 mutation", "A sedentary lifestyle", "A diet low in vegetables", "Smoking one pack a day", "Heavy alcohol use"], "c": 0, "w": "Age and genetics cannot be changed, and 5 to 10% of cancers come from known genetic syndromes such as BRCA1/2, p53 and FAP. Lifestyle factors such as inactivity, poor diet, smoking and alcohol are modifiable. The nine risk factor categories are carcinogens, environment, hormones, genetics, lifestyle, infectious disease, medications, immune status and nutrition. Carcinogen exposure is the most common risk factor. (study guide, Ch 13)", "x": {"A sedentary lifestyle": "A sedentary lifestyle is modifiable.", "A diet low in vegetables": "Diet is modifiable.", "Smoking one pack a day": "Smoking is modifiable.", "Heavy alcohol use": "Alcohol use is modifiable."}, "m": {}, "k": "c-risk-list", "lp": 1}, {"id": 74, "t": "risk", "ty": "mc", "q": "A 38-year-old client reports an HPV infection, multiple sexual partners, early sexual contact and tobacco use. For which cancer is the client at increased risk?", "o": ["Cervical cancer", "Ovarian cancer", "Uterine cancer", "Breast cancer", "Prostate cancer"], "c": 0, "w": "Cervical cancer risk factors include HPV, multiple partners, early sexual contact, tobacco use and long-term oral contraceptive use. HPV is the cause: nearly all cervical cancers test positive. Each other option has its own typical risk set. (study guide, Ch 13 Table 13.2 and Ch 65)", "x": {"Ovarian cancer": "Ovarian risk is tied to BRCA1/2, nulliparity and not breastfeeding.", "Uterine cancer": "Uterine risk is tied to estrogen, obesity, PCOS and tamoxifen.", "Breast cancer": "Breast risk is tied to early menarche, late menopause, BRCA and obesity.", "Prostate cancer": "Prostate cancer occurs in men and is tied to age, family history and pesticides."}, "m": {}, "k": "c-risk-table", "lp": 1}, {"id": 75, "t": "risk", "ty": "match", "q": "The nurse reviews risk factors from the cancer risk table. Match each cancer with a risk factor.", "o": ["H. pylori infection", "Hepatitis B or C", "Undescended testicle", "Asbestos exposure"], "c": [0, 1, 2, 3], "w": "Each cancer has exposures that damage its own organ, and the table pairs them. H. pylori inflames the stomach lining, alcohol and viral hepatitis injure the liver, and an undescended testicle is a developmental problem of the testis. Asbestos and tobacco damage the airway lining. Knowing which exposure hits which organ lets the nurse match a client's history to the cancer. (study guide, Ch 13 Table 13.2)", "x": {"H. pylori infection": "H. pylori is listed with gastric cancer.", "Hepatitis B or C": "Hepatitis A, B or C and alcohol are listed for liver cancer.", "Undescended testicle": "Cryptorchidism is the greatest risk for testicular cancer.", "Asbestos exposure": "Tobacco, asbestos, coal, soot, tar, pollution and wood dust are listed for lung cancer."}, "m": {}, "k": "c-risk-table", "lp": 1, "r": ["Gastric cancer", "Liver cancer", "Testicular cancer", "Lung cancer"]}, {"id": 76, "t": "risk", "ty": "mc", "q": "A client with a BRCA2 mutation asks which cancers, besides breast and ovarian, are linked to this gene. Which response by the nurse is correct?", "o": ["Pancreatic cancer, prostate cancer and melanoma", "Lung cancer and mesothelioma", "Colon and rectal cancer", "Bladder and kidney cancer", "Cervical and vulvar cancer"], "c": 0, "w": "BRCA genes normally repair DNA, so a mutation lets damaged cells survive and multiply. BRCA1 raises the risk of breast and ovarian cancer. BRCA2 raises those too and adds pancreatic and prostate cancer and melanoma, and it is the more common mutation in male breast cancer. The other options belong to other exposures such as tobacco, asbestos or HPV. (study guide, Ch 13 and Ch 66)", "x": {"Lung cancer and mesothelioma": "Those are tied to tobacco and asbestos.", "Colon and rectal cancer": "Colon cancer risk is tied to polyps, alcohol, obesity and inflammatory bowel disease in these materials.", "Bladder and kidney cancer": "Those are tied to tobacco, pesticides and solvents.", "Cervical and vulvar cancer": "Those are tied to HPV."}, "m": {}, "k": "c-risk-list", "lp": 0}, {"id": 77, "t": "risk", "ty": "sata", "q": "A nurse reviews red flags for hereditary cancer. Select all that apply.", "o": ["Multiple primary tumors in the same client", "Bilateral tumors in paired organs", "Cancer at a younger age than usual", "A tumor in a sex not usually affected, such as male breast cancer", "Two or more first-degree relatives with the same cancer", "A single tumor found at the usual age in a client with no family history", "One distant relative with a different cancer"], "c": [0, 1, 2, 3, 4], "w": "A hereditary syndrome is a mutation that is present in every cell from birth, so it shows up as cancer that appears earlier, more often, or in unusual places. That explains the red flags: multiple primaries, bilateral tumors in paired organs, a younger-than-usual age, a tumor in the sex not usually affected, and two or more first-degree relatives with the same cancer. A single tumor at the usual age with no family history does not fit the pattern. These clients are referred for genetic counseling. (study guide, Ch 13)", "x": {"A single tumor found at the usual age in a client with no family history": "This pattern does not suggest a hereditary syndrome.", "One distant relative with a different cancer": "The flag is two or more first-degree relatives with the same cancer."}, "m": {}, "k": "c-risk-list", "lp": 0}, {"id": 78, "t": "risk", "ty": "match", "q": "The nurse is planning cancer prevention activities. Match each activity with its level of prevention.", "o": ["Primary prevention", "Secondary prevention", "Tertiary prevention"], "c": [0, 1, 2], "w": "Primary prevention stops cancer before it starts: risk factor modification, immunization and chemoprevention. Secondary prevention finds it early by screening. Tertiary prevention limits harm after diagnosis. (study guide, Ch 13 and class notes)", "x": {"Primary prevention": "Primary prevention modifies risk: avoiding carcinogens, immunization and chemoprevention.", "Secondary prevention": "Secondary prevention is screening for early detection such as breast, cervical, colon and prostate screening.", "Tertiary prevention": "Tertiary prevention reduces morbidity and mortality once the disease is diagnosed."}, "m": {}, "k": "c-risk-prev", "lp": 0, "r": ["Giving the HPV vaccine", "Arranging a colonoscopy at age 45", "Managing side effects after a cancer diagnosis"]}, {"id": 79, "t": "risk", "ty": "blanks", "q": "The nurse teaches the CAUTION warning signs. The A stands for a [1] that does not heal, the T stands for a [2] or lump, and a sign lasting more than [3] should be evaluated.", "o": [["sore", "rash", "cough"], ["thickening", "tenderness", "tingling"], ["2 weeks", "2 days", "6 months"]], "c": [0, 0, 0], "w": "CAUTION is a memory aid for the changes that early cancers cause in tissue. Each letter names a change: bowel or bladder habits, a sore that does not heal, unusual bleeding or discharge, a thickening or lump, indigestion or difficulty swallowing, an obvious change in a wart or mole, and a nagging cough or hoarseness. Benign causes usually settle in days, so a sign that lasts more than 2 weeks needs evaluation. (study guide, Ch 13)", "x": {"rash": "The A stands for a sore that does not heal.", "cough": "A nagging cough is the N.", "tenderness": "The T stands for thickening or lump.", "tingling": "Tingling is not part of CAUTION.", "2 days": "The guideline is more than 2 weeks.", "6 months": "Waiting 6 months would delay evaluation."}, "m": {}, "k": "c-risk-caution", "lp": 1}, {"id": 80, "t": "risk", "ty": "tf", "q": "A nurse teaches a client that carcinogen exposure is the most common risk factor for cancer and that risks are cumulative. The nurse's teaching is accurate.", "o": ["True", "False"], "c": 0, "w": "A carcinogen damages DNA, and cancer develops when damage builds up faster than the cell and immune system can repair or remove it. For that reason one exposure rarely causes cancer; multiple exposures plus genetic mutations that the immune system misses are what lead to it. The risks are cumulative over a lifetime. Carcinogen exposure is therefore the most common risk factor. (study guide, Ch 13)", "x": {"False": "Marking False denies that carcinogen exposure is the most common risk."}, "m": {}, "k": "c-risk-list", "lp": 1}, {"id": 81, "t": "risk", "ty": "tf", "q": "A nurse tells a client that most cancers come from known genetic syndromes such as BRCA1 and BRCA2. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "Inherited mutations such as BRCA1/2, p53 and FAP are present from birth and raise the risk sharply, but they are uncommon. They account for only 5 to 10% of cancers. Most cancers come from exposures and age, which add damage over time. The statement that most cancers come from known syndromes is therefore false. (study guide, Ch 13)", "x": {"True": "Marking True overstates the share of cancers caused by inherited syndromes."}, "m": {}, "k": "c-risk-list", "lp": 1}, {"id": 82, "t": "hodgkin", "ty": "mc", "q": "A 24-year-old client has painless neck swelling, drenching night sweats and generalized itching. A lymph node biopsy confirms Hodgkin lymphoma. Which finding on the biopsy defines this type?", "o": ["Reed–Sternberg cells", "The Philadelphia chromosome", "Bence Jones protein", "Heinz bodies", "An M protein spike"], "c": 0, "w": "Hodgkin lymphoma is defined by Reed–Sternberg cells, giant lymphocytes, and has a better survival rate than non-Hodgkin lymphoma. It peaks in young adulthood and again after 55 and is linked to Epstein–Barr virus. A lymph node biopsy is definitive. (study guide, Ch 34)", "x": {"The Philadelphia chromosome": "The Philadelphia chromosome is found in chronic myeloid leukemia.", "Bence Jones protein": "Bence Jones protein is a finding of multiple myeloma.", "Heinz bodies": "Heinz bodies are seen with G6PD deficiency.", "An M protein spike": "The M protein is a finding of multiple myeloma."}, "m": {"The Philadelphia chromosome": "mixes up lymphoma and leukemia", "Bence Jones protein": "mixes up lymphoma and myeloma", "An M protein spike": "mixes up lymphoma and myeloma"}, "k": "c-hodg-dx", "lp": 1}, {"id": 83, "t": "hodgkin", "ty": "sata", "q": "The nurse assesses a client with suspected Hodgkin lymphoma. Which findings are expected? Select all that apply.", "o": ["Painless swelling of cervical, axillary or inguinal lymph nodes", "Drenching night sweats", "Unexplained weight loss", "Generalized itching with scratch marks", "A dry cough that is worse when lying flat", "Tender, warm lymph nodes with a sore throat", "A smooth red tongue and spoon-shaped nails", "Severe back pain with high calcium and high creatinine"], "c": [0, 1, 2, 3, 4], "w": "Lymphoma causes painless lymph node swelling. B symptoms are low-grade fevers, drenching night sweats and unexplained weight loss. Itching is common in Hodgkin lymphoma, and a dry cough worse lying flat suggests a mediastinal mass that can compress the trachea. Fatigue is not a B symptom. (study guide, Ch 34 and Ch 13)", "x": {"Tender, warm lymph nodes with a sore throat": "Painful, tender nodes point to infection; lymphoma nodes are painless.", "A smooth red tongue and spoon-shaped nails": "These are signs of iron deficiency anemia.", "Severe back pain with high calcium and high creatinine": "That fits multiple myeloma."}, "m": {"Tender, warm lymph nodes with a sore throat": "expects painful nodes", "Severe back pain with high calcium and high creatinine": "mixes up lymphoma and myeloma"}, "k": "c-hodg-dx", "lp": 1}, {"id": 84, "t": "hodgkin", "ty": "mc", "q": "A client with Hodgkin lymphoma reports facial and arm swelling, shortness of breath, chest pain and trouble swallowing. Which complication does the nurse suspect?", "o": ["Superior vena cava syndrome", "Tumor lysis syndrome", "Syndrome of inappropriate antidiuretic hormone", "Bowel obstruction", "Leukostasis"], "c": 0, "w": "Enlarged nodes or a mediastinal mass can squeeze the soft-walled superior vena cava so blood cannot return from the upper body. This is an emergency with dyspnea, edema of the face, neck and arms, and chest pain. Treatment includes chemotherapy or radiation and corticosteroids. (study guide, Ch 13 and Ch 34)", "x": {"Tumor lysis syndrome": "Tumor lysis causes hyperkalemia, hypocalcemia and renal failure after treatment.", "Syndrome of inappropriate antidiuretic hormone": "SIADH causes hyponatremia with confusion and seizures.", "Bowel obstruction": "Bowel obstruction causes vomiting, distention and ribbon-like stools.", "Leukostasis": "Leukostasis occurs in leukemia with a very high WBC."}, "m": {"Tumor lysis syndrome": "mixes up oncologic emergencies", "Syndrome of inappropriate antidiuretic hormone": "mixes up oncologic emergencies", "Bowel obstruction": "mixes up oncologic emergencies", "Leukostasis": "mixes up oncologic emergencies"}, "k": "c-hodg-comp", "lp": 1}, {"id": 85, "t": "hodgkin", "ty": "mc", "q": "A client with lymphoma reports back pain followed by numbness and tingling in both legs. Which action should the nurse take first?", "o": ["Perform a neurologic assessment and notify the provider immediately", "Offer a back massage and reassess later", "Position the client for comfort and reassess in the morning", "Document the findings and continue the plan of care"], "c": 0, "w": "Spinal cord compression is a lymphoma emergency. Back pain and sensory changes come before motor weakness, and bowel and bladder dysfunction is late. Radiation and corticosteroids give rapid relief. (study guide, Ch 13 and Ch 34)", "x": {"Offer a back massage and reassess later": "Back pain with sensory change may be spinal cord compression, an emergency.", "Position the client for comfort and reassess in the morning": "The delay could allow permanent paralysis.", "Document the findings and continue the plan of care": "These are warning signs that need an urgent report."}, "m": {}, "k": "c-hodg-comp", "lp": 0}, {"id": 86, "t": "hodgkin", "ty": "mc", "q": "A client with lymphoma has a serum calcium of 12 mg/dL, confusion and polyuria. Which intervention should the nurse anticipate?", "o": ["IV fluids to dilute the calcium", "Restricting oral fluids", "A calcium supplement", "A dose of heparin"], "c": 0, "w": "In lymphoma, bone involvement releases calcium into the blood, and high calcium makes the kidneys lose water. That causes polyuria and dehydration, and the high level affects the brain and the heart, causing confusion and heart block. A calcium above 11 mg/dL is an emergency. IV fluids replace the losses and dilute the calcium, so they are the expected intervention. (study guide, Ch 34)", "x": {"Restricting oral fluids": "Fluids are encouraged to dilute the calcium.", "A calcium supplement": "The calcium is already too high.", "A dose of heparin": "Heparin treats clots, not hypercalcemia."}, "m": {"A calcium supplement": "forgets the client has hypercalcemia"}, "k": "c-hodg-comp", "lp": 0}, {"id": 87, "t": "hodgkin", "ty": "mc", "q": "A client with lymphoma has involvement of two lymph node regions on the same side of the diaphragm. Which stage does the nurse document?", "o": ["Stage II", "Stage I", "Stage III", "Stage IV"], "c": 0, "w": "Lymphoma staging follows how far the disease has traveled through lymph tissue. Stage I is a single node, stage II is two or more nodes on the same side of the diaphragm, and stage III is nodes on both sides. Stage IV means organs are involved as well as nodes. The letters E for extranodal and S for spleen add detail. (study guide, Ch 34)", "x": {"Stage I": "Stage I is a single node.", "Stage III": "Stage III means nodes on both sides of the diaphragm.", "Stage IV": "Stage IV means organs plus nodes."}, "m": {}, "k": "c-hodg-comp", "lp": 0}, {"id": 88, "t": "hodgkin", "ty": "mc", "q": "A client with painless lymph node enlargement has a CBC, chest x-ray and CT scan. Which test is definitive for diagnosing lymphoma?", "o": ["Lymph node biopsy", "CBC", "Chest x-ray", "Serum uric acid and LDH", "PET scan"], "c": 0, "w": "Blood tests and imaging show that something is wrong and how far it has spread, but they cannot show what the cells are. Uric acid and LDH rise from high cell turnover, and the CBC can show marrow involvement. Only tissue can prove lymphoma, so a lymph node biopsy is definitive. A bone marrow biopsy or lumbar puncture is added if marrow or CNS involvement is suspected. (study guide, Ch 34)", "x": {"CBC": "A CBC shows marrow involvement but does not diagnose lymphoma.", "Chest x-ray": "Imaging shows extent, not the diagnosis.", "Serum uric acid and LDH": "These are raised from high cell turnover but are not diagnostic.", "PET scan": "A PET scan helps staging and does not confirm the diagnosis."}, "m": {}, "k": "c-hodg-dx", "lp": 0}, {"id": 89, "t": "hodgkin", "ty": "mc", "q": "A client with lymphoma is about to start chemotherapy. Which information is most essential for the nurse to teach?", "o": ["Neutropenic and bleeding precautions", "Preparing for surgery to remove the tumor", "Preparing for a splenectomy", "How to avoid all fluids to reduce night sweats", "Limiting rest to speed recovery"], "c": 0, "w": "Chemotherapy is the primary treatment for lymphoma, with radiation and immunotherapy. It lowers white cells and platelets, so neutropenic and bleeding precautions are the most essential teaching. The nurse also teaches the infection risk, frequent rest, nutrition, symptoms to report and fertility preservation. (study guide, Ch 34 and class PLQ)", "x": {"Preparing for surgery to remove the tumor": "Surgery to remove the tumor is not typical; chemotherapy is the primary treatment.", "Preparing for a splenectomy": "Splenectomy is now rare.", "How to avoid all fluids to reduce night sweats": "Fluids replace losses from fever and sweats and dilute calcium.", "Limiting rest to speed recovery": "The client should rest often and keep the treatment schedule."}, "m": {}, "k": "c-hodg-comp", "lp": 1}, {"id": 90, "t": "hodgkin", "ty": "tf", "q": "A nurse tells a client with lymphoma that a dry cough that is worse lying flat may mean a mediastinal mass that can compress the airway. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "Lymph nodes in the chest can enlarge into a mediastinal mass. When the client lies flat the mass presses on the trachea and irritates it, which causes a dry persistent cough that worsens when lying down. Because the airway can be compressed, this sign is a warning of an airway risk and needs prompt evaluation. The nurse should not dismiss the cough. (study guide, Ch 34)", "x": {"False": "Marking False ignores a warning sign of airway compression."}, "m": {}, "k": "c-hodg-dx", "lp": 1}, {"id": 91, "t": "hodgkin", "ty": "tf", "q": "A nurse teaches that generalized itching with scratch marks is more common in non-Hodgkin lymphoma than in Hodgkin lymphoma. The nurse's teaching is accurate.", "o": ["True", "False"], "c": 1, "w": "Hodgkin lymphoma often causes generalized itching, and scratching leaves excoriation. The skin changes are one of the recognizable features that help separate it from non-Hodgkin lymphoma. Both lymphomas cause painless node swelling and B symptoms. The true teaching is that itching is more typical of Hodgkin lymphoma. (study guide, Ch 34)", "x": {"True": "Marking True gives the symptom to the wrong lymphoma."}, "m": {}, "k": "c-hodg-dx", "lp": 1}, {"id": 92, "t": "stage", "ty": "mc", "q": "A client with stage III breast cancer classified as T3, N2, M1 is being taught about the staging. Which statement by the client indicates a need for further teaching?", "o": ["“I am relieved that the cancer is still local.”", "“The T tells me about the size of my tumor.”", "“The N tells me about the lymph nodes that are affected.”", "“The M1 tells me the cancer has spread to other parts of my body.”"], "c": 0, "w": "TNM stands for tumor size (T), number of lymph nodes involved (N) and presence of metastasis (M). M1 means metastasis is present, so the cancer is not local. A client who feels relieved that it is still local needs more teaching. (study guide, Ch 13 and class PLQ)", "x": {"“The T tells me about the size of my tumor.”": "This is correct; T is the size of the tumor.", "“The N tells me about the lymph nodes that are affected.”": "This is correct; N is the number of lymph nodes involved.", "“The M1 tells me the cancer has spread to other parts of my body.”": "This is correct; M1 means metastasis is present."}, "m": {}, "k": "c-stage-tnm", "lp": 1}, {"id": 93, "t": "stage", "ty": "mc", "q": "A client has been told her breast cancer is stage III and asks what that means. Which description by the nurse is best?", "o": ["A large tumor or locally advanced cancer that may be in nearby lymph nodes", "A small tumor with no obvious spread outside the organ", "A tumor that has invaded deeper tissues or local lymph nodes", "A cancer that has spread to other organs"], "c": 0, "w": "Staging puts the extent of disease on a scale from small and local to spread. Stage I is small with no obvious spread outside the organ, stage II invades deeper tissue or local nodes, stage III is large or locally advanced and possibly in local nodes, and stage IV has metastasized to other organs. Your class notes recorded a different answer for this case (spread to the lymph and blood systems), but the textbook definition is the one the case answer key supports, so confirm with your instructor. (study guide, Ch 13 and class PLQ)", "x": {"A small tumor with no obvious spread outside the organ": "That describes stage I.", "A tumor that has invaded deeper tissues or local lymph nodes": "That describes stage II.", "A cancer that has spread to other organs": "Spread to other organs is stage IV."}, "m": {"A small tumor with no obvious spread outside the organ": "mixes up the stage numbers", "A tumor that has invaded deeper tissues or local lymph nodes": "mixes up the stage numbers", "A cancer that has spread to other organs": "mixes up stage III and IV"}, "k": "c-stage-tnm", "lp": 1}, {"id": 94, "t": "stage", "ty": "match", "q": "The nurse reviews cancer classification terms. Match each term with its meaning.", "o": ["Size of the primary tumor", "Number of lymph nodes involved", "Presence of distant spread, yes or no", "How differentiated the cells look under the microscope"], "c": [0, 1, 2, 3], "w": "Staging and grading answer two different questions. Staging asks how big the tumor is and how far it has spread, using T for size, N for the number of lymph nodes and M for metastasis. Grading asks how differentiated the cells look under the microscope. Poorly differentiated cells no longer look like the parent cell, so they are harder to treat and more aggressive. (study guide, Ch 13)", "x": {"Size of the primary tumor": "T is the tumor size.", "Number of lymph nodes involved": "N is the nodes involved.", "Presence of distant spread, yes or no": "M is metastasis.", "How differentiated the cells look under the microscope": "Grading describes differentiation; poorly differentiated cells are more aggressive."}, "m": {}, "k": "c-stage-tnm", "lp": 0, "r": ["T", "N", "M", "Grade"]}, {"id": 95, "t": "stage", "ty": "mc", "q": "A client's breast cancer is 3.5 cm with no lymph node involvement and no metastasis. Which stage does the nurse expect on the chart?", "o": ["Stage IIA", "Stage IA", "Stage IB", "Stage IIB", "Stage IIIA"], "c": 0, "w": "Breast sizes to remember are 2 cm or less (stage I), 2 to 5 cm (stage II), and over 5 cm (stage IIB or III). A 2 to 5 cm tumor with no nodes is stage IIA. Nodes: 4 to 8 for IIIA, up to 9 for IIIB, 10 or more for IIIC. (study guide, Ch 65)", "x": {"Stage IA": "Stage IA is a tumor up to 2 cm with no nodes.", "Stage IB": "Stage IB is no tumor or under 2 cm with small node involvement.", "Stage IIB": "Stage IIB is 2 to 5 cm with nodes, or over 5 cm with no nodes.", "Stage IIIA": "Stage IIIA is over 5 cm with nodes, or any size with 4 to 8 nodes."}, "m": {"Stage IA": "mixes up the breast size cutoffs", "Stage IB": "mixes up the breast size cutoffs", "Stage IIB": "mixes up the breast size cutoffs", "Stage IIIA": "mixes up the breast size cutoffs"}, "k": "c-stage-sizes", "lp": 1}, {"id": 96, "t": "stage", "ty": "mc", "q": "A client's prostate cancer is described as T2. Which description does the nurse understand?", "o": ["The tumor is confined to the prostate", "The tumor cannot be felt and is not seen on ultrasound", "The tumor is locally extensive beyond the gland", "The tumor has invaded neighboring organs"], "c": 0, "w": "In the prostate system the T number shows how far the tumor has grown locally. T1 cannot be felt on exam, T2 is confined to the prostate, T3 is locally extensive, and T4 invades neighboring organs. A Gleason grade describes the cells separately: two sites are graded 1 to 5 and added, for a maximum of 10. A higher score means more poorly differentiated cells. (study guide, Ch 66)", "x": {"The tumor cannot be felt and is not seen on ultrasound": "That describes T1.", "The tumor is locally extensive beyond the gland": "That describes T3.", "The tumor has invaded neighboring organs": "That describes T4."}, "m": {"The tumor cannot be felt and is not seen on ultrasound": "mixes up the T numbers", "The tumor is locally extensive beyond the gland": "mixes up the T numbers", "The tumor has invaded neighboring organs": "mixes up the T numbers"}, "k": "c-stage-sizes", "lp": 1}, {"id": 97, "t": "stage", "ty": "mc", "q": "A client's pathology report lists a prostate Gleason score of 9. Which statement by the nurse is accurate?", "o": ["“A higher score means poorly differentiated cells and a worse prognosis, and 10 is the maximum.”", "“A score of 9 means a 90% chance of cure.”", "“A score of 9 means the cancer is stage IX.”", "“A lower score means more aggressive cancer.”", "“The score measures how large the tumor is.”"], "c": 0, "w": "Two sites in the biopsy are each graded from 1 to 5 and the grades are added. Grade 1 is well differentiated, looks nearly normal, and has the best prognosis. Grade 5 is poorly differentiated and has a poor prognosis. A total of 9 out of a maximum of 10 therefore means poorly differentiated cells and a worse outlook. The score is a grade, not a stage or a cure percentage. (study guide, Ch 66)", "x": {"“A score of 9 means a 90% chance of cure.”": "The score is a grade of the cells, not a cure percentage.", "“A score of 9 means the cancer is stage IX.”": "Stages run I to IV; Gleason is a grade.", "“A lower score means more aggressive cancer.”": "A higher score is worse.", "“The score measures how large the tumor is.”": "Size is the T in TNM; Gleason measures how differentiated the cells are."}, "m": {"“A lower score means more aggressive cancer.”": "reverses the Gleason scale"}, "k": "c-stage-sizes", "lp": 0}, {"id": 98, "t": "stage", "ty": "mc", "q": "A client's ovarian cancer has spread to the peritoneum and lymph nodes. Which FIGO stage does the nurse expect?", "o": ["Stage III", "Stage I", "Stage II", "Stage IV"], "c": 0, "w": "Ovarian cancer is staged from what the surgeon finds, because it is not biopsied beforehand. The FIGO stages follow how far the disease has spread from the ovaries: stage I is limited to the ovaries and stage II extends into the pelvis. Stage III means the peritoneum and/or lymph nodes are involved, and stage IV is distant spread. Spread to the peritoneum and nodes is therefore stage III. (study guide, Ch 65)", "x": {"Stage I": "Stage I is limited to the ovaries.", "Stage II": "Stage II extends to the pelvis.", "Stage IV": "Stage IV is distant spread."}, "m": {}, "k": "c-stage-sizes", "lp": 0}, {"id": 99, "t": "stage", "ty": "mc", "q": "A pathology report describes a client's tumor cells as poorly differentiated. Which conclusion should the nurse draw?", "o": ["The cells look unlike the parent cell, and the cancer is more aggressive and harder to treat", "The tumor is small and has not spread", "The tumor has spread to lymph nodes", "The cells look like the parent cell and respond well to treatment"], "c": 0, "w": "Altered differentiation means the cell no longer looks or acts like the parent cell. Well differentiated cells look like the parent cell, while poorly differentiated cells are more aggressive and harder to treat. This is the basis of grading, which is separate from staging. (study guide, Ch 13)", "x": {"The tumor is small and has not spread": "Differentiation describes how cells look, not size or spread.", "The tumor has spread to lymph nodes": "Node spread is the N in TNM.", "The cells look like the parent cell and respond well to treatment": "That describes well differentiated cells."}, "m": {"The tumor is small and has not spread": "mixes up grade and stage", "The tumor has spread to lymph nodes": "mixes up grade and stage", "The cells look like the parent cell and respond well to treatment": "reverses the meaning"}, "k": "c-stage-tnm", "lp": 0}, {"id": 100, "t": "stage", "ty": "tf", "q": "A nurse tells a client with leukemia that all hematologic malignancies are considered stage IV at diagnosis because they involve the whole body from the start. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "Solid tumors start in an organ and spread outward, so size and spread give a stage. Leukemia, lymphoma and multiple myeloma start in blood-forming or lymph tissue, which circulates through the whole body. They therefore involve the body from the start and are classed as stage IV at diagnosis. The statement is accurate. (study guide, Ch 13)", "x": {"False": "Marking False would stage a leukemia like a small local solid tumor."}, "m": {}, "k": "c-stage-tnm", "lp": 1}, {"id": 101, "t": "stage", "ty": "tf", "q": "A nurse teaches that the grade of a tumor describes how far the cancer has spread in the body. The nurse's teaching is accurate.", "o": ["True", "False"], "c": 1, "w": "Grade and stage measure different things. Grade describes how differentiated the cells look under the microscope, and poorly differentiated cells are more aggressive. Stage describes size, lymph node involvement and metastasis, which is how far the cancer has spread. The statement mixes the two up and is false. (study guide, Ch 13)", "x": {"True": "Marking True mixes up grade and stage."}, "m": {}, "k": "c-stage-tnm", "lp": 1}, {"id": 102, "t": "cervical", "ty": "mc", "q": "A 25-year-old client had her first Pap smear at age 21 with normal results. Primary HPV testing is not available at the clinic. Which services should the nurse expect at today's visit?", "o": ["A breast exam, a pelvic exam and a Pap smear without HPV cotesting", "A Pap smear with an HPV cotest", "An HPV test alone every year", "No screening until age 30", "An immediate colposcopy"], "c": 0, "w": "Cervical screening starts at 21 with a Pap every 3 years, and HPV testing is only a reflex test if atypical cells are found in ages 21 to 29. Primary HPV screening may start at 25 and repeat every 5 years. The Ch 13 table groups ages 25 to 65, while Ch 65 starts at 21; the Ch 65 schedule is used here. (study guide, Ch 65 and class PLQ)", "x": {"A Pap smear with an HPV cotest": "HPV cotesting is not used before age 30.", "An HPV test alone every year": "HPV testing alone is primary screening every 5 years and is not available here.", "No screening until age 30": "Pap smears are done every 3 years from age 21.", "An immediate colposcopy": "Colposcopy is done after an abnormal result."}, "m": {"A Pap smear with an HPV cotest": "applies the 30 and older rule too early"}, "k": "c-cerv-screen", "lp": 1}, {"id": 103, "t": "cervical", "ty": "mc", "q": "A 19-year-old client who is sexually active asks when she needs her first Pap smear. Which response by the nurse is correct?", "o": ["“Your first Pap smear is at age 21.”", "“You need one now, because you are sexually active.”", "“You should start at age 25 with an HPV test.”", "“You should start at age 30 with a cotest.”", "“You do not need screening if you receive the HPV vaccine.”"], "c": 0, "w": "No cervical screening is done before age 21. From 21 the Pap is repeated every 3 years. The HPV vaccine at age 11 to 12, and as early as 9, is prevention and does not treat an existing infection. (study guide, Ch 65)", "x": {"“You need one now, because you are sexually active.”": "No screening is done before age 21.", "“You should start at age 25 with an HPV test.”": "Primary HPV screening may start at 25, but the Pap starts at 21.", "“You should start at age 30 with a cotest.”": "Screening starts well before age 30.", "“You do not need screening if you receive the HPV vaccine.”": "The vaccine does not replace screening."}, "m": {"“You need one now, because you are sexually active.”": "starts screening at first intercourse"}, "k": "c-cerv-screen", "lp": 1}, {"id": 104, "t": "cervical", "ty": "sata", "q": "A nurse reviews screening options for a healthy 40-year-old client. Select all that apply.", "o": ["Primary HPV testing every 5 years", "A Pap and HPV cotest every 5 years", "A Pap test alone every 3 years", "A Pap test alone every year", "A Pap test alone every 5 years"], "c": [0, 1, 2], "w": "Cervical cancer develops slowly through dysplasia, and the HPV test finds the virus that causes it earlier than the Pap finds cell changes. Because of that, from age 30 to 65 the interval can be longer when HPV testing is included: primary HPV or a Pap and HPV cotest every 5 years. A Pap alone is repeated every 3 years. Clients with HIV, immunosuppression, DES exposure or prior dysplasia may need screening more often. (study guide, Ch 65)", "x": {"A Pap test alone every year": "Pap alone is repeated every 3 years.", "A Pap test alone every 5 years": "Pap alone is every 3 years; the 5-year interval applies to HPV testing."}, "m": {}, "k": "c-cerv-screen", "lp": 1}, {"id": 105, "t": "cervical", "ty": "mc", "q": "A 67-year-old client has had adequate negative cervical screenings and no history of CIN 2 in the last 20 years. What should the nurse expect about further screening?", "o": ["She may stop screening", "She needs a Pap every year for life", "She needs a colposcopy every 3 years", "She needs a hysterectomy"], "c": 0, "w": "Cervical cancer takes years to develop from dysplasia, so a long record of normal results makes new disease unlikely. After age 65, screening may stop if prior screening was adequate and negative and there has been no CIN 2 in 20 years. A hysterectomy for a benign cause, with no history of CIN 2, also ends screening. Screening continues only when risk is higher. (study guide, Ch 65)", "x": {"She needs a Pap every year for life": "Screening may stop after 65 with adequate negative results.", "She needs a colposcopy every 3 years": "Colposcopy follows an abnormal result.", "She needs a hysterectomy": "There is no indication for surgery."}, "m": {}, "k": "c-cerv-screen", "lp": 0}, {"id": 106, "t": "cervical", "ty": "mc", "q": "A client has an abnormal Pap smear and a positive high-risk HPV test. Which procedure does the nurse expect next?", "o": ["Colposcopy with biopsy", "A repeat Pap smear in 3 years", "A hysterectomy", "A CA-125 blood test", "A mammogram"], "c": 0, "w": "An abnormal Pap with high-risk HPV leads to colposcopy: the cervix is swabbed with acetic acid or Lugol's, and abnormal areas are biopsied. The biopsy is diagnostic. MRI, PET, CT and chest x-ray stage the cancer. (study guide, Ch 65 and Ch 64)", "x": {"A repeat Pap smear in 3 years": "An abnormal result with high-risk HPV is followed up now.", "A hysterectomy": "Treatment is decided after the biopsy.", "A CA-125 blood test": "CA-125 is an ovarian marker and is not a screening test.", "A mammogram": "A mammogram screens the breast."}, "m": {"A CA-125 blood test": "borrows an ovarian test"}, "k": "c-cerv-dx", "lp": 1}, {"id": 107, "t": "cervical", "ty": "mc", "q": "A 40-year-old client with invasive cervical cancer reports bleeding after intercourse. Which statement about the clinical manifestations is accurate?", "o": ["Vaginal bleeding, especially after intercourse, is the most common symptom of invasive cancer, while dysplasia has no symptoms", "Early dysplasia causes heavy bleeding and pain", "Bloating and early satiety are the typical first signs", "A hard painless breast lump is typical"], "c": 0, "w": "Cervical dysplasia has no symptoms. Vaginal bleeding, especially postcoital bleeding, is the most common symptom of invasive cancer, and malodorous discharge and pain with intercourse may be present. The nursing focus is prevention through Pap screening and the HPV vaccine. (study guide, Ch 65)", "x": {"Early dysplasia causes heavy bleeding and pain": "Dysplasia has no symptoms and usually cannot be seen.", "Bloating and early satiety are the typical first signs": "That is the pattern of ovarian cancer.", "A hard painless breast lump is typical": "That describes breast cancer."}, "m": {"Bloating and early satiety are the typical first signs": "borrows ovarian symptoms"}, "k": "c-cerv-dx", "lp": 1}, {"id": 108, "t": "cervical", "ty": "mc", "q": "A client is scheduled for a colposcopy. Which statement by the client indicates understanding of the preparation?", "o": ["“I will not put anything in my vagina for 24 hours before the test.”", "“I need a full bladder for this test.”", "“It is fine to use Lugol's solution even though I am allergic to shellfish.”", "“I should schedule it for the heaviest day of my period.”"], "c": 0, "w": "Colposcopy magnifies the cervix after an abnormal Pap, and acetic acid or Lugol's solution is applied so abnormal tissue stands out. The client is told to put nothing in the vagina for 24 hours beforehand. The client empties the bladder, and the test is rescheduled during heavy menstruation. Lugol's contains iodine, so it is contraindicated with an iodine or shellfish allergy. (study guide, Ch 64)", "x": {"“I need a full bladder for this test.”": "The client empties the bladder first; a full bladder is for pelvic ultrasound.", "“It is fine to use Lugol's solution even though I am allergic to shellfish.”": "Lugol's is contraindicated with iodine or shellfish allergy.", "“I should schedule it for the heaviest day of my period.”": "The test is rescheduled if menstruating heavily."}, "m": {"“I need a full bladder for this test.”": "mixes up colposcopy and ultrasound prep"}, "k": "c-cerv-dx", "lp": 0}, {"id": 109, "t": "cervical", "ty": "mc", "q": "A 29-year-old client with early-stage cervical cancer wants to keep her fertility. Which surgery does the nurse expect to be offered?", "o": ["Radical trachelectomy", "Radical hysterectomy with lymph node dissection", "Pelvic exenteration", "Chemoradiation with brachytherapy"], "c": 0, "w": "Early disease may be treated with cone biopsy or a radical trachelectomy, which removes the cervix only, for a client who wants to keep fertility. Without a fertility wish, simple or radical hysterectomy with node dissection is done. Higher stages use chemoradiation, and pelvic exenteration can cure a pelvic recurrence. (study guide, Ch 65)", "x": {"Radical hysterectomy with lymph node dissection": "This is for a client who does not desire fertility.", "Pelvic exenteration": "Exenteration is for recurrence confined to the pelvis and removes all pelvic organs.", "Chemoradiation with brachytherapy": "This is used for higher stages and is not a fertility-preserving surgery."}, "m": {}, "k": "c-cerv-tx", "lp": 0}, {"id": 110, "t": "cervical", "ty": "tf", "q": "A nurse tells a student that most cervical cancers are squamous cell carcinomas that arise in the transformation zone where the endocervix meets the ectocervix. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "About 90% of cervical cancers are squamous cell carcinomas arising in the transformation zone. Most of the rest are adenocarcinomas of the glandular cells of the endocervix. The Pap samples this junction. (study guide, Ch 65 and Ch 64)", "x": {"False": "Marking False denies the main cell type of cervical cancer."}, "m": {}, "k": "c-cerv-dx", "lp": 1}, {"id": 111, "t": "cervical", "ty": "tf", "q": "A nurse tells a client that HPV vaccination treats an existing HPV infection and makes cervical screening unnecessary. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "The vaccine is given at age 11 to 12 (it can start at 9) and does not treat an existing infection. Routine screening is still needed. The true version is that vaccination is prevention and screening continues. (study guide, Ch 65)", "x": {"True": "Marking True would tell the client to skip screening."}, "m": {}, "k": "c-cerv-dx", "lp": 1}, {"id": 112, "t": "testis", "ty": "mc", "q": "A 31-year-old client reports a firm, painless lump in his scrotum with a heavy feeling. Which part of his history is the greatest risk factor for testicular cancer?", "o": ["An undescended testicle in childhood", "Klinefelter's syndrome", "HIV infection", "Cigarette smoking", "Down syndrome"], "c": 0, "w": "Cryptorchidism, one or both testes failing to descend from the abdomen into the scrotum, is the greatest risk factor. Others include Down syndrome, Klinefelter's, HIV, family history, cancer in the other testicle and smoking. The average age is 33, and the cure rate is 90 to 100% if it is found early. (study guide, Ch 66)", "x": {"Klinefelter's syndrome": "Klinefelter's is a listed risk but not the greatest.", "HIV infection": "HIV is a listed risk but not the greatest.", "Cigarette smoking": "Smoking is listed among others but is not the greatest.", "Down syndrome": "Down syndrome is listed among other risks but is not the greatest."}, "m": {"Klinefelter's syndrome": "ranks a minor risk above cryptorchidism", "HIV infection": "ranks a minor risk above cryptorchidism", "Cigarette smoking": "ranks a minor risk above cryptorchidism", "Down syndrome": "ranks a minor risk above cryptorchidism"}, "k": "c-test-dx", "lp": 1}, {"id": 113, "t": "testis", "ty": "mc", "q": "A 29-year-old client has a mass in one testicle. Which description of the classic presentation does the nurse expect?", "o": ["A painless mass, sometimes with a firm or heavy feeling in the scrotum", "Sudden severe scrotal pain with fever after a kick to the groin", "A tender, red, hot scrotum with painful urination", "Bright red blood in the semen with urgency"], "c": 0, "w": "The classic sign of testicular cancer is a painless mass. Some men have a dull abdominal ache or a dull scrotal ache, a firm or heavy feeling, swelling and redness. Metastasis may cause GI symptoms, low back pain, gynecomastia, cough or hemoptysis. (study guide, Ch 66)", "x": {"Sudden severe scrotal pain with fever after a kick to the groin": "Sudden pain after trauma suggests testicular injury, not the classic cancer mass.", "A tender, red, hot scrotum with painful urination": "Painful, red and hot suggests infection such as epididymitis.", "Bright red blood in the semen with urgency": "That points toward the prostate, not the testis."}, "m": {"Sudden severe scrotal pain with fever after a kick to the groin": "confuses trauma with cancer"}, "k": "c-test-dx", "lp": 1}, {"id": 114, "t": "testis", "ty": "mc", "q": "A client with testicular cancer asks the nurse about the best treatment. Which response is correct?", "o": ["“Treatment for all types starts with removal of the affected testicle.”", "“Radiation alone is the best first treatment.”", "“Chemotherapy alone is used first for every type.”", "“Hormone therapy is the first treatment.”", "“Observation with ultrasound is enough for all types.”"], "c": 0, "w": "All types start with orchiectomy through an abdominal incision. Seminoma then gets radiation and/or chemotherapy; nonseminoma gets lymph node removal and chemotherapy, not radiation. Chemotherapy drugs include cisplatin, etoposide, bleomycin, ifosfamide, paclitaxel and vinblastine. (study guide, Ch 66 and class PLQ)", "x": {"“Radiation alone is the best first treatment.”": "Radiation is added after surgery for seminoma only.", "“Chemotherapy alone is used first for every type.”": "Surgery comes first; chemotherapy follows.", "“Hormone therapy is the first treatment.”": "Hormone therapy is not the treatment for testicular cancer.", "“Observation with ultrasound is enough for all types.”": "Removal of the testicle and its blood supply is the starting treatment."}, "m": {}, "k": "c-test-tx", "lp": 1}, {"id": 115, "t": "testis", "ty": "mc", "q": "A client's AFP and hCG levels stayed elevated after orchiectomy. What does the nurse understand this to mean?", "o": ["More tumor may remain, so further workup is needed", "The surgery cured the cancer", "The client has developed hypercalcemia", "The client has a benign condition"], "c": 0, "w": "Alpha-fetoprotein and hCG are made by testicular tumor cells and enter the blood. Once the tumor is removed the levels should fall. If they stay high, tumor tissue that makes them must still be present somewhere, perhaps in lymph nodes or other organs. The nurse reports persistent elevation, because it means more tumor should be looked for. Staging uses TNM plus S for the serum markers. (study guide, Ch 66)", "x": {"The surgery cured the cancer": "These markers should fall after the tumor is removed.", "The client has developed hypercalcemia": "The markers are not calcium results.", "The client has a benign condition": "Persistent elevation points to remaining tumor."}, "m": {}, "k": "c-test-dx", "lp": 0}, {"id": 116, "t": "testis", "ty": "sata", "q": "The nurse is teaching a client who will start treatment for testicular cancer. Select all that apply.", "o": ["Bank sperm before treatment to preserve fertility", "Follow up for at least 10 years", "Retroperitoneal lymph node removal can damage nerves that control ejaculation", "Report signs of infection after surgery", "Fertility is not affected by treatment", "Follow-up can stop after 1 year", "Chemotherapy has no effect on the kidneys or hearing"], "c": [0, 1, 2, 3], "w": "Bank sperm before treatment, follow up for at least 10 years, and know that retroperitoneal lymph node resection may damage the ejaculation nerves. Report infection signs. Chemotherapy can cause hair loss, mouth sores, nausea, infection, bleeding, kidney damage, neuropathy, ototoxicity, lung damage with bleomycin and hemorrhagic cystitis with ifosfamide. (study guide, Ch 66)", "x": {"Fertility is not affected by treatment": "Treatment can affect fertility, which is why sperm banking is offered first.", "Follow-up can stop after 1 year": "Follow-up lasts at least 10 years, the usual window for recurrence.", "Chemotherapy has no effect on the kidneys or hearing": "Chemotherapy can cause kidney damage and ototoxicity."}, "m": {}, "k": "c-test-tx", "lp": 1}, {"id": 117, "t": "testis", "ty": "match", "q": "The nurse reviews testicular cancer facts. Match each item with its description.", "o": ["Slow-growing and very sensitive to radiation", "Grows and spreads faster and is not responsive to radiation", "Can cause lung damage", "Can cause hemorrhagic cystitis"], "c": [0, 1, 2, 3], "w": "Seminoma and nonseminoma behave differently, which decides treatment. Seminoma is slow growing and very sensitive to radiation, so surgery is followed by radiation and/or chemotherapy. Nonseminoma grows and spreads faster and does not respond to radiation, so it gets surgery, node removal and chemotherapy. The chemotherapy drugs also have typical toxicities: bleomycin can injure the lungs and ifosfamide can cause hemorrhagic cystitis. (study guide, Ch 66)", "x": {"Slow-growing and very sensitive to radiation": "Seminoma occurs in men in their 30s to 40s.", "Grows and spreads faster and is not responsive to radiation": "Nonseminoma includes embryonal and teratoma types, from teens to 40s.", "Can cause lung damage": "Bleomycin is the chemotherapy listed for lung damage.", "Can cause hemorrhagic cystitis": "Ifosfamide is listed for hemorrhagic cystitis."}, "m": {}, "k": "c-test-tx", "lp": 0, "r": ["Seminoma", "Nonseminoma", "Bleomycin", "Ifosfamide"]}, {"id": 118, "t": "testis", "ty": "mc", "q": "A client returns from an orchiectomy with a blood pressure of 88/50 mm Hg and a heart rate of 124 beats per minute. What does the nurse suspect?", "o": ["Volume loss", "Infection", "Pain only", "Normal recovery"], "c": 0, "w": "After surgery the body loses blood and fluid from the surgical site, and the heart beats faster to keep the output up. When the volume lost is significant the blood pressure falls, so low blood pressure with a fast heart rate means volume loss. Infection would show as fever instead. The nurse reports the vital signs and watches the wound for bleeding. (study guide, Ch 66)", "x": {"Infection": "Fever, not hypotension with tachycardia, points to infection.", "Pain only": "Pain can raise the heart rate but does not lower the blood pressure.", "Normal recovery": "These vital signs are abnormal."}, "m": {}, "k": "c-test-tx", "lp": 0}, {"id": 119, "t": "testis", "ty": "tf", "q": "A nurse explains to a client that alpha-fetoprotein and hCG levels should fall after the tumor is removed. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "The tumor cells are the source of AFP and hCG, so when the tumor is removed the markers should drop. A fall confirms that the source was removed. A level that does not fall suggests tumor tissue elsewhere. The nurse therefore follows the markers as a measure of treatment success. (study guide, Ch 66)", "x": {"False": "Marking False would make a persistent rise sound normal."}, "m": {}, "k": "c-test-tx", "lp": 1}, {"id": 120, "t": "testis", "ty": "tf", "q": "A nurse teaches a client with a nonseminoma that radiation is the main treatment because this type is very sensitive to radiation. The nurse's teaching is accurate.", "o": ["True", "False"], "c": 1, "w": "Nonseminoma grows and spreads faster and is not responsive to radiation. It is treated with surgery plus lymph node removal, then chemotherapy. Seminoma is the radiation-sensitive type. (study guide, Ch 66)", "x": {"True": "Marking True gives nonseminoma the seminoma's radiation sensitivity."}, "m": {}, "k": "c-test-tx", "lp": 1}, {"id": 121, "t": "biopsy", "ty": "mc", "q": "A client asks why the provider wants a biopsy when a CT scan already shows a mass. Which response by the nurse is best?", "o": ["“A biopsy is the most specific test and is required for a definite diagnosis of cancer.”", "“A CT scan can identify the exact cell type of the tumor.”", "“A PET scan is the most specific test for cancer.”", "“A tumor marker blood test is enough to confirm cancer.”", "“A biopsy is done only after treatment has started.”"], "c": 0, "w": "Labs and imaging are supportive. A biopsy is the most specific way to diagnose cancer and gives tissue for stage and grade. Results take 3 to 10 days. CT shows the mass location, PET shows active areas, and MRI is best for brain, joint and breast. (study guide, Ch 13 and class PLQ)", "x": {"“A CT scan can identify the exact cell type of the tumor.”": "CT shows the location and organ or vessel involvement, not the cell type.", "“A PET scan is the most specific test for cancer.”": "A PET scan shows metabolic hot spots and supports the diagnosis.", "“A tumor marker blood test is enough to confirm cancer.”": "Markers support the diagnosis and track treatment but do not confirm it.", "“A biopsy is done only after treatment has started.”": "Tissue is needed to diagnose, stage and grade before treatment."}, "m": {"“A CT scan can identify the exact cell type of the tumor.”": "thinks imaging can diagnose cancer", "“A PET scan is the most specific test for cancer.”": "thinks imaging can diagnose cancer", "“A tumor marker blood test is enough to confirm cancer.”": "thinks labs can diagnose cancer"}, "k": "c-bx-types", "lp": 1}, {"id": 122, "t": "biopsy", "ty": "mc", "q": "A client with a breast mass is scheduled for an excisional biopsy rather than an incisional biopsy. The client asks why. Which response by the nurse is correct?", "o": ["“An excisional biopsy removes the whole mass with a margin, while an incisional biopsy can track cancer cells through normal tissue.”", "“An incisional biopsy removes the whole mass, so it is preferred.”", "“An excisional biopsy only suctions a few cells with a needle.”", "“An excisional biopsy tests the blood for tumor DNA.”", "“Both types carry the same risk of spreading cells.”"], "c": 0, "w": "Excisional biopsy removes the whole mass plus a margin and is preferred. Incisional (core) biopsy cuts into the mass and risks tracking cancer cells through normal tissue. Fine-needle aspiration is less traumatic but yields fewer cells. (study guide, Ch 13)", "x": {"“An incisional biopsy removes the whole mass, so it is preferred.”": "The excisional biopsy removes the whole mass; incisional cuts into the mass.", "“An excisional biopsy only suctions a few cells with a needle.”": "That describes fine-needle aspiration.", "“An excisional biopsy tests the blood for tumor DNA.”": "That describes a liquid biopsy.", "“Both types carry the same risk of spreading cells.”": "The incisional type can track cells through normal tissue."}, "m": {"“An incisional biopsy removes the whole mass, so it is preferred.”": "swaps excisional and incisional"}, "k": "c-bx-types", "lp": 1}, {"id": 123, "t": "biopsy", "ty": "match", "q": "The nurse reviews biopsy procedures. Match each with its description.", "o": ["A needle suctions cells from near the skin; less traumatic but fewer cells", "A wider needle with a cutter removes a larger sample", "An imaging-guided probe with a vacuum and rotating cutter, with no sutures", "Finds the first node the cancer drains to and determines the stage"], "c": [0, 1, 2, 3], "w": "FNA, core needle and vacuum-assisted biopsies are different needle methods with different sample sizes. A surgical excision removes a mass under 2.5 cm entirely, and a nonpalpable mass is marked with a hooked wire first. A sentinel node biopsy finds the first node the cancer drains to. (study guide, Ch 13 and Ch 65)", "x": {"A needle suctions cells from near the skin; less traumatic but fewer cells": "This is FNA, such as for a breast mass.", "A wider needle with a cutter removes a larger sample": "This is a core needle biopsy.", "An imaging-guided probe with a vacuum and rotating cutter, with no sutures": "This is vacuum-assisted biopsy, done with local anesthesia.", "Finds the first node the cancer drains to and determines the stage": "This is a sentinel node biopsy, using a radioactive tracer or blue dye."}, "m": {}, "k": "c-bx-types", "lp": 0, "r": ["Fine-needle aspiration", "Core needle biopsy", "Vacuum-assisted biopsy", "Sentinel node biopsy"]}, {"id": 124, "t": "biopsy", "ty": "mc", "q": "A client's sentinel lymph node biopsy is negative for cancer. What does the nurse understand this to mean?", "o": ["No further nodes need to be removed", "A full axillary dissection of 20 to 40 nodes is still required", "The cancer has metastasized to bone", "The tumor is stage IV"], "c": 0, "w": "The sentinel node is the first node the cancer would reach, found with a radioactive tracer or blue dye, and it determines the stage. If it is negative, the full axillary dissection can be skipped. If it is positive, an axillary dissection of 20 to 40 nodes follows. (study guide, Ch 65)", "x": {"A full axillary dissection of 20 to 40 nodes is still required": "Axillary dissection is done when the sentinel node is positive.", "The cancer has metastasized to bone": "The sentinel node does not show bone spread.", "The tumor is stage IV": "A negative sentinel node does not make a stage IV tumor."}, "m": {"A full axillary dissection of 20 to 40 nodes is still required": "swaps negative and positive"}, "k": "c-bx-types", "lp": 1}, {"id": 125, "t": "biopsy", "ty": "mc", "q": "A client has a pelvic mass thought to be ovarian cancer. The client asks why the provider is not doing a needle biopsy of the mass. Which response is correct?", "o": ["“A biopsy could spread the cancer cells; the diagnosis is made by removing the mass surgically and examining it.”", "“A needle biopsy is always done first for ovarian masses.”", "“A CA-125 blood test is enough to diagnose ovarian cancer.”", "“A Pap smear will confirm the diagnosis.”"], "c": 0, "w": "A biopsy of an ovarian mass is not recommended because it could spread the cancer. The definitive diagnosis is surgical removal of the mass plus
