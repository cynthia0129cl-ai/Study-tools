pathology. In uterine cancer the endometrial biopsy is 99% sensitive for high-grade cancer, and D&C is done if the biopsy is negative but bleeding continues. (study guide, Ch 65)", "x": {"“A needle biopsy is always done first for ovarian masses.”": "Biopsy of an ovarian mass is not recommended.", "“A CA-125 blood test is enough to diagnose ovarian cancer.”": "CA-125 is normal in 50% of early cases and also rises with other conditions.", "“A Pap smear will confirm the diagnosis.”": "A Pap samples the cervix."}, "m": {"“A needle biopsy is always done first for ovarian masses.”": "applies breast biopsy habits to the ovary"}, "k": "c-bx-site", "lp": 1}, {"id": 126, "t": "biopsy", "ty": "mc", "q": "A client is scheduled for a bone marrow aspiration and biopsy. Which statement by the client indicates a need for further teaching?", "o": ["“Odds are I will die from this procedure.”", "“I will feel pressure when the needle goes in.”", "“I may feel a brief pulling pain when the marrow is drawn out.”", "“I will keep the dressing on for at least 24 hours.”"], "c": 0, "w": "The procedure takes 5 to 10 minutes and a mild sedative is allowed. The client feels pressure on insertion and a brief pulling pain on aspiration, and may hear crunching. A statement that the client will die from it shows fear and misinformation and needs correction. (study guide, Ch 33 and class PLQ)", "x": {"“I will feel pressure when the needle goes in.”": "This is correct teaching.", "“I may feel a brief pulling pain when the marrow is drawn out.”": "This is correct teaching.", "“I will keep the dressing on for at least 24 hours.”": "This is correct teaching."}, "m": {}, "k": "c-bx-marrow", "lp": 1}, {"id": 127, "t": "biopsy", "ty": "mc", "q": "The nurse prepares a client for a bone marrow biopsy at the most common site. Which position does the nurse use?", "o": ["Prone or side-lying, for the posterior iliac crest", "Supine, because the most common site is the sternum", "Sitting upright with the arms crossed", "Trendelenburg"], "c": 0, "w": "The most common site is the posterior iliac crest, with the client prone or side-lying. The sternum or anterior iliac crest is done supine. Before the procedure: consent, allergies and bleeding risk (platelets, coagulation studies, anticoagulants). (study guide, Ch 33)", "x": {"Supine, because the most common site is the sternum": "The most common site is the posterior iliac crest; the sternum and anterior iliac crest use supine.", "Sitting upright with the arms crossed": "This does not expose the posterior iliac crest.", "Trendelenburg": "This position is not used for this procedure."}, "m": {"Supine, because the most common site is the sternum": "swaps the common site and position"}, "k": "c-bx-marrow", "lp": 0}, {"id": 128, "t": "biopsy", "ty": "sata", "q": "The nurse provides care after a bone marrow biopsy. Select all that apply.", "o": ["Hold direct pressure for 5 to 10 minutes and apply a sterile dressing", "Have the client rest for several hours", "Leave the dressing on for at least 24 hours", "Report bleeding that soaks the dressing or lasts more than 24 hours", "Remove the dressing after 1 hour to inspect the site", "Encourage vigorous exercise right away"], "c": [0, 1, 2, 3], "w": "After the procedure the nurse applies direct pressure for 5 to 10 minutes and a sterile dressing, and the client rests for several hours. The dressing stays on at least 24 hours. Bleeding that soaks the dressing or lasts more than 24 hours is reported, and the nurse watches for infection and gives analgesia. (study guide, Ch 33)", "x": {"Remove the dressing after 1 hour to inspect the site": "The dressing stays on at least 24 hours.", "Encourage vigorous exercise right away": "The client rests for several hours."}, "m": {}, "k": "c-bx-marrow", "lp": 0}, {"id": 129, "t": "biopsy", "ty": "mc", "q": "A client asks what a liquid biopsy is. Which description by the nurse is accurate?", "o": ["A blood test that looks for cancer cells or tumor DNA", "Removal of the whole mass with a margin", "A needle that suctions cells from a mass", "A scope that looks inside the airways"], "c": 0, "w": "A liquid biopsy is a blood test that looks for cancer cells or tumor DNA, so it does not take tissue from the mass. It is used for example in non-small cell lung, breast, colorectal, GI and ovarian cancers. It differs from tissue biopsies, which remove cells or a mass directly. (study guide, Ch 13)", "x": {"Removal of the whole mass with a margin": "That describes an excisional biopsy.", "A needle that suctions cells from a mass": "That describes fine-needle aspiration.", "A scope that looks inside the airways": "That describes bronchoscopy."}, "m": {}, "k": "c-bx-types", "lp": 0}, {"id": 130, "t": "biopsy", "ty": "tf", "q": "A nurse tells a client that the results of a tissue biopsy usually take 3 to 10 days. The nurse's statement is accurate.", "o": ["True", "False"], "c": 0, "w": "A biopsy sample has to be processed, stained and examined by a pathologist before a cytopathologic diagnosis can be made, and that takes time. Results are expected in 3 to 10 days. The nurse explains the purpose, preparation, aftercare and when results arrive, so the client is not left waiting without information. The statement is accurate. (study guide, Ch 13)", "x": {"False": "Marking False gives the client an unrealistic expectation about when results arrive."}, "m": {}, "k": "c-bx-types", "lp": 1}, {"id": 131, "t": "biopsy", "ty": "tf", "q": "A nurse tells a client that blood tests and imaging can give a definitive diagnosis of cancer without a biopsy. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "Labs and imaging are supportive. A biopsy is required for a definitive cytopathologic diagnosis. The true version is that tissue confirmation is needed. (study guide, Ch 13)", "x": {"True": "Marking True treats supportive tests as diagnostic."}, "m": {}, "k": "c-bx-types", "lp": 1}, {"id": 132, "t": "uterine", "ty": "mc", "q": "A 60-year-old postmenopausal client calls the clinic. Which statement requires the nurse's immediate follow-up?", "o": ["“I have had some vaginal bleeding.”", "“I feel a little tired in the afternoons.”", "“I have mild joint stiffness in the mornings.”", "“I had trouble falling asleep last night.”", "“I had heartburn after a spicy dinner.”"], "c": 0, "w": "After menopause the uterine lining should not bleed, so bleeding means the lining is abnormal. Uterine cancer is most common at ages 55 to 65, with a median of 60, and abnormal bleeding is its most common symptom. Any postmenopausal bleeding needs evaluation, so this statement is the one that needs immediate follow-up. The other statements are not the key warning sign for a gynecologic cancer. (study guide, Ch 65 and class PLQ)", "x": {"“I feel a little tired in the afternoons.”": "Mild afternoon fatigue is not the red flag for uterine cancer.", "“I have mild joint stiffness in the mornings.”": "This is not the key warning sign for a gynecologic cancer.", "“I had trouble falling asleep last night.”": "This is not the key warning sign for a gynecologic cancer.", "“I had heartburn after a spicy dinner.”": "This is not the key warning sign for a gynecologic cancer."}, "m": {}, "k": "c-ut-dx", "lp": 1}, {"id": 133, "t": "uterine", "ty": "sata", "q": "The nurse reviews risk factors for uterine (endometrial) cancer. Select all that apply.", "o": ["Unopposed estrogen exposure", "Obesity", "Tamoxifen use", "Early menarche and late menopause", "Polycystic ovary syndrome", "Estrogen given together with progesterone", "Maintaining a healthy weight and exercising", "HPV infection"], "c": [0, 1, 2, 3, 4], "w": "Estrogen makes the uterine lining grow, and progesterone balances it. When estrogen is unopposed, by estrogen therapy without progesterone, tamoxifen or anovulation, the lining keeps growing and can become cancer. Obesity adds risk because fat tissue makes estrogen. Chapter 13 also lists early menarche, late menopause, PCOS and diabetes. (study guide, Ch 65 and Ch 13)", "x": {"Estrogen given together with progesterone": "Progesterone with estrogen is protective; the risk is estrogen without progesterone.", "Maintaining a healthy weight and exercising": "These help prevent uterine cancer.", "HPV infection": "HPV is the cause of cervical cancer."}, "m": {"Estrogen given together with progesterone": "forgets that progesterone is protective", "HPV infection": "borrows a cervical risk factor"}, "k": "c-ut-risk", "lp": 1}, {"id": 134, "t": "uterine", "ty": "mc", "q": "A nurse is describing the most common type of uterine cancer to a client. Which description is correct?", "o": ["Endometrioid adenocarcinoma, which is estrogen-driven and usually found early", "Serous or clear cell carcinoma, which is the most common type", "Uterine sarcoma, which is the most common type", "Squamous cell carcinoma of the cervix"], "c": 0, "w": "Most uterine cancers arise from the lining, the endometrium. About 80% are endometrioid adenocarcinoma, called type I, which is driven by estrogen and is usually found early with about 88% survival. Type II (serous or clear cell) is aggressive and occurs in older clients with a poor prognosis, and sarcoma of the muscle is only 3 to 5%. The most common type is therefore the estrogen-driven endometrioid type. (study guide, Ch 65)", "x": {"Serous or clear cell carcinoma, which is the most common type": "Type II serous or clear cell cancers are aggressive and occur in older clients, but they are not the most common.", "Uterine sarcoma, which is the most common type": "Sarcoma makes up only 3 to 5%.", "Squamous cell carcinoma of the cervix": "That is the main type of cervical cancer."}, "m": {"Squamous cell carcinoma of the cervix": "borrows a cervical cancer type"}, "k": "c-ut-risk", "lp": 0}, {"id": 135, "t": "uterine", "ty": "mc", "q": "A postmenopausal client has vaginal bleeding. Which diagnostic test does the nurse expect to be done first for uterine cancer?", "o": ["Endometrial biopsy", "CA-125 blood test", "Colposcopy", "Mammogram"], "c": 0, "w": "Bleeding comes from the endometrium, so the test samples the endometrium. The endometrial biopsy is 99% sensitive for high-grade cancer and is done first. A pelvic transvaginal ultrasound shows a thickened endometrium, and a D&C is added if the biopsy is negative but bleeding continues. CA-125, colposcopy and mammography belong to ovarian, cervical and breast evaluation. (study guide, Ch 65)", "x": {"CA-125 blood test": "CA-125 is an ovarian marker.", "Colposcopy": "Colposcopy is for the cervix after an abnormal Pap.", "Mammogram": "A mammogram screens the breast."}, "m": {"CA-125 blood test": "borrows an ovarian test"}, "k": "c-ut-dx", "lp": 1}, {"id": 136, "t": "uterine", "ty": "mc", "q": "A client's endometrial biopsy is negative but she continues to have postmenopausal bleeding. Which procedure does the nurse expect?", "o": ["Dilation and curettage", "No further testing is needed", "Repeat screening in 3 years", "A bone marrow biopsy"], "c": 0, "w": "A biopsy takes a small sample and can miss an area of disease, so a negative result does not explain ongoing bleeding. A D&C scrapes the whole lining and gives a larger tissue sample for pathology. It is done with NPO status and consent, and normal postoperative bleeding and cramping are expected. Continued bleeding always needs further evaluation. (study guide, Ch 65 and Ch 64)", "x": {"No further testing is needed": "Continued bleeding needs evaluation.", "Repeat screening in 3 years": "The bleeding needs follow-up now.", "A bone marrow biopsy": "This is for blood and marrow disorders."}, "m": {}, "k": "c-ut-dx", "lp": 0}, {"id": 137, "t": "uterine", "ty": "mc", "q": "A client has stage I uterine cancer. Which treatment does the nurse expect?", "o": ["Surgery to remove the uterus, fallopian tubes and ovaries", "Chemotherapy alone", "Observation only", "Pelvic exenteration", "Radical trachelectomy"], "c": 0, "w": "Surgery removes the uterus, tubes and ovaries plus washings and lymphadenectomy, and early stage I is often cured by surgery alone. Progestin therapy is used for stage I if surgery is not possible. Radiation is the usual adjuvant. (study guide, Ch 65)", "x": {"Chemotherapy alone": "Chemotherapy is for higher-risk disease and gives only a modest response.", "Observation only": "Early stage I is often cured by surgery.", "Pelvic exenteration": "Exenteration is for a pelvic recurrence of cervical cancer.", "Radical trachelectomy": "This surgery is for early cervical cancer."}, "m": {"Pelvic exenteration": "borrows a cervical cancer treatment", "Radical trachelectomy": "borrows a cervical cancer treatment"}, "k": "c-ut-dx", "lp": 1}, {"id": 138, "t": "uterine", "ty": "mc", "q": "A 52-year-old client with a uterus is prescribed estrogen for menopausal symptoms. Which statement should the nurse include in teaching to lower the risk of uterine cancer?", "o": ["“Estrogen is taken with progesterone because estrogen alone can cause the lining of the uterus to overgrow.”", "“Estrogen is safe alone because it protects the uterus.”", "“Estrogen should be stopped if you gain weight.”", "“Only women who have had a hysterectomy need progesterone.”"], "c": 0, "w": "Anyone on estrogen who has a uterus needs progesterone too. Tamoxifen users need monitoring for endometrial hyperplasia. Prevention also includes a healthy weight and exercise. (study guide, Ch 65)", "x": {"“Estrogen is safe alone because it protects the uterus.”": "Estrogen alone is unopposed and raises uterine cancer risk.", "“Estrogen should be stopped if you gain weight.”": "Weight management helps, but the key point is progesterone.", "“Only women who have had a hysterectomy need progesterone.”": "The women who need it are those with a uterus."}, "m": {"“Estrogen is safe alone because it protects the uterus.”": "forgets that estrogen alone is a risk"}, "k": "c-ut-risk", "lp": 1}, {"id": 139, "t": "uterine", "ty": "mc", "q": "A client receiving chemotherapy for uterine cancer has stomatitis. Which instruction by the nurse is correct?", "o": ["Avoid hot or spicy food and use salt-water rinses", "Eat hot soups to soothe the mouth", "Use a hard toothbrush to keep the mouth clean", "Avoid fluids to keep the mouth dry"], "c": 0, "w": "Chemotherapy kills fast-dividing cells, including the lining of the mouth, so sores develop. Hot or spicy food irritates the damaged lining and worsens pain. Salt-water rinses keep the mouth clean and comfortable, and antiemetics help with nausea. Soft toothbrushes and good hydration also help. (study guide, Ch 65 and Ch 13)", "x": {"Eat hot soups to soothe the mouth": "Hot food irritates stomatitis.", "Use a hard toothbrush to keep the mouth clean": "A soft toothbrush is used.", "Avoid fluids to keep the mouth dry": "Fluids help; dryness worsens mouth sores."}, "m": {}, "k": "c-ut-dx", "lp": 0}, {"id": 140, "t": "uterine", "ty": "tf", "q": "A nurse teaches a client that anyone who takes estrogen therapy and has a uterus also needs progesterone. The nurse's teaching is accurate.", "o": ["True", "False"], "c": 0, "w": "Estrogen makes the lining of the uterus grow, and progesterone keeps that growth in check. Estrogen alone is unopposed, and years of unopposed growth raise the risk of uterine cancer. A client who has a uterus therefore takes progesterone with estrogen. The teaching is accurate. (study guide, Ch 65)", "x": {"False": "Marking False would leave estrogen unopposed."}, "m": {}, "k": "c-ut-risk", "lp": 1}, {"id": 141, "t": "uterine", "ty": "tf", "q": "A nurse tells a client that ovarian cancer is the most common gynecologic cancer in the United States. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "Two different facts are easy to swap. Uterine (endometrial) cancer is the most common gynecologic cancer in the US, with a 2.6% lifetime risk. Ovarian cancer is the deadliest, because its symptoms are vague and 70 to 75% are not found until stage III or IV. The statement gives the label of the wrong cancer and is false. (study guide, Ch 65)", "x": {"True": "Marking True swaps the most common gynecologic cancer with the deadliest one."}, "m": {}, "k": "c-ut-risk", "lp": 1}, {"id": 142, "t": "neut", "ty": "mc", "q": "A client receiving chemotherapy has an absolute neutrophil count of 480/mm³. Which nursing action is the priority?", "o": ["Implement neutropenic precautions, including a private room and hand hygiene by everyone", "Implement bleeding precautions", "Encourage visitors and fresh flowers to lift the client's mood", "Take the client's temperature rectally", "Offer iron-rich foods"], "c": 0, "w": "Neutropenia is an ANC below 1,500, and neutropenic precautions start at 500 or below. A fever of 100.4°F (38°C) or higher means broad-spectrum IV antibiotics immediately. The nurse uses hand hygiene, a private room and restricts visitors with communicable diseases. (study guide, Ch 13 and Ch 34)", "x": {"Implement bleeding precautions": "Bleeding precautions are for a low platelet count.", "Encourage visitors and fresh flowers to lift the client's mood": "Crowds and live plants are avoided in neutropenia.", "Take the client's temperature rectally": "Rectal temperatures are never used in neutropenia.", "Offer iron-rich foods": "Iron foods are for iron deficiency anemia."}, "m": {"Implement bleeding precautions": "mixes up neutropenia and thrombocytopenia"}, "k": "c-neut-def", "lp": 1}, {"id": 143, "t": "neut", "ty": "sata", "q": "The nurse is teaching a client with neutropenia about precautions at home. Select all that apply.", "o": ["Wash hands often and ask visitors to do the same", "Avoid crowds and people who are sick", "Avoid live plants and cut flowers", "Avoid standing water, such as in a humidifier", "Keep fresh cut flowers in the bedroom", "Take the temperature rectally when ill", "Eat raspberries and blackberries as a healthy snack"], "c": [0, 1, 2, 3], "w": "Neutrophils are the first cells to reach an infection, so with a low count even ordinary germs can cause serious infection. Each precaution removes a source of germs: other people's hands and coughs, live plants and flowers that carry bacteria and mold, standing water, fruit that is hard to wash, and the rectal route. The client washes produce, avoids raspberries and blackberries, and uses no rectal temperatures, suppositories or enemas. Your class notes add reverse isolation, where staff wear PPE to protect the client. (study guide, Ch 34 Box 34.2 and class notes)", "x": {"Keep fresh cut flowers in the bedroom": "Live plants and cut flowers carry bacteria and mold.", "Take the temperature rectally when ill": "No rectal temperatures, suppositories or enemas; rectal bacteria can enter the blood.", "Eat raspberries and blackberries as a healthy snack": "Raspberries and blackberries are bumpy and hard to wash, so they are avoided."}, "m": {"Keep fresh cut flowers in the bedroom": "forgets that plants and flowers carry mold"}, "k": "c-neut-prec", "lp": 1}, {"id": 144, "t": "neut", "ty": "mc", "q": "A client with neutropenia is being discharged. Which statement by the client indicates a need for further teaching?", "o": ["“I will put fresh cut flowers on my bedside table to cheer me up.”", "“I will wash raw fruits and vegetables well.”", "“I will check my temperature every day and call if it is above 100.4°F.”", "“I will take my antibiotics every day and finish the whole course.”"], "c": 0, "w": "Live plants and cut flowers carry bacteria and mold, and a neutropenic client cannot fight them off. For that reason they are avoided at home and in the hospital, and a statement about placing flowers at the bedside shows a need for teaching. The correct statements are washing raw fruits and vegetables, checking the temperature daily and calling for more than 100.4°F (38°C), and taking prophylactic antimicrobials daily and finishing the course. These actions lower the chance of infection or catch it early. (study guide, Ch 34 Box 34.2)", "x": {"“I will wash raw fruits and vegetables well.”": "This is correct teaching.", "“I will check my temperature every day and call if it is above 100.4°F.”": "This is correct teaching.", "“I will take my antibiotics every day and finish the whole course.”": "This is correct teaching; prophylactic antimicrobials are taken daily."}, "m": {}, "k": "c-neut-prec", "lp": 1}, {"id": 145, "t": "neut", "ty": "mc", "q": "A client at home who is receiving chemotherapy has a temperature of 100.6°F (38.1°C). Which instruction by the nurse is correct?", "o": ["“Seek care or call your provider right away, because IV antibiotics can prevent sepsis.”", "“Take acetaminophen and call tomorrow if it persists.”", "“Drink extra fluids and recheck in 12 hours.”", "“A low-grade fever is expected and can be ignored.”"], "c": 0, "w": "In a chemotherapy client, few working neutrophils means the usual signs of infection may be weak or missing, and a fever may be the only sign. An infection can spread to the blood and lead to sepsis within hours. Treatment with IV antibiotics prevents that, so the client should seek care or call the provider right away. Waiting to see whether the fever settles delays treatment. (study guide, Ch 13 and Ch 34)", "x": {"“Take acetaminophen and call tomorrow if it persists.”": "Waiting delays treatment; fever may be the only sign of infection.", "“Drink extra fluids and recheck in 12 hours.”": "This delays treatment.", "“A low-grade fever is expected and can be ignored.”": "A temperature of 100.4°F or higher requires immediate care."}, "m": {"“Take acetaminophen and call tomorrow if it persists.”": "treats the fever at home", "“Drink extra fluids and recheck in 12 hours.”": "treats the fever at home"}, "k": "c-neut-def", "lp": 0}, {"id": 146, "t": "neut", "ty": "mc", "q": "The nurse reviews the orders of a client with an ANC of 450/mm³. Which order should the nurse question?", "o": ["Bisacodyl rectal suppository as needed for constipation", "Prophylactic levofloxacin daily", "Oral temperature every 4 hours", "Private room with strict hand hygiene"], "c": 0, "w": "Rectal tissue is full of bacteria, and a suppository, enema or thermometer can create tiny tears that let them into the blood. With an ANC of 450 the client cannot control that infection. For that reason rectal medications and temperatures are not used in neutropenia. Prophylactic antibiotics, a private room and oral temperatures are appropriate. (study guide, Ch 34 Box 34.2)", "x": {"Prophylactic levofloxacin daily": "Prophylactic antibiotics are used in neutropenia.", "Oral temperature every 4 hours": "Oral temperatures are appropriate.", "Private room with strict hand hygiene": "This is part of neutropenic precautions."}, "m": {}, "k": "c-neut-prec", "lp": 1}, {"id": 147, "t": "neut", "ty": "mc", "q": "A client with leukemia is neutropenic. Which visitor should the nurse restrict?", "o": ["A sibling who has a cold and a cough", "A well adult friend who has washed her hands", "The client's spouse who is well and wears a mask as requested", "An asymptomatic adult relative who sanitizes his hands"], "c": 0, "w": "A neutropenic client has few cells to fight germs, so any visitor with a communicable illness is a direct risk. A sibling with a cold and a cough could pass on the infection. Well visitors who clean their hands are allowed. The plan also avoids crowds, small children and pets, and requires hand hygiene by everyone. (study guide, Ch 34 and class PLQ)", "x": {"A well adult friend who has washed her hands": "A healthy visitor using hand hygiene is allowed.", "The client's spouse who is well and wears a mask as requested": "A well visitor is allowed.", "An asymptomatic adult relative who sanitizes his hands": "A well adult with hand hygiene is allowed."}, "m": {}, "k": "c-neut-prec", "lp": 0}, {"id": 148, "t": "neut", "ty": "match", "q": "The nurse reviews neutropenia values with a new graduate. Match each value with its meaning.", "o": ["Neutropenia and an infection risk", "Neutropenic precautions begin", "Call the provider immediately"], "c": [0, 1, 2], "w": "The ANC counts the neutrophils that can fight bacteria and fungi. Below 1,500 the client is neutropenic and at risk of infection, and at 500 or below the risk is high enough that neutropenic precautions are started. A temperature of 100.4°F (38°C) or higher in a chemotherapy client is called in immediately and treated with broad-spectrum IV antibiotics. Matching each number with its action is the core of the care plan. (study guide, Ch 13 and Ch 34)", "x": {"Neutropenia and an infection risk": "An ANC below 1,500 is neutropenia.", "Neutropenic precautions begin": "At an ANC of 500 or below the client is on neutropenic precautions, and IV antibiotics are given for fever.", "Call the provider immediately": "A fever of 100.4°F (38°C) or higher in a chemotherapy client is called in right away."}, "m": {}, "k": "c-neut-def", "lp": 0, "r": ["ANC below 1,500", "ANC 500 or below", "Temperature of 100.4°F (38°C) or higher"]}, {"id": 149, "t": "neut", "ty": "tf", "q": "A nurse explains that in reverse isolation for a neutropenic client the nurse wears protective equipment to protect the client from infection. The nurse's explanation is accurate.", "o": ["True", "False"], "c": 0, "w": "In ordinary isolation the barrier protects other people from the client's germs. In reverse isolation the direction is reversed, because the neutropenic client is the one who cannot fight germs. Staff and visitors wear PPE when required, limit their exposures, and avoid items that harbor waterborne organisms. The nurse explaining that the PPE protects the client is accurate. (class notes and study guide, Ch 34)", "x": {"False": "Marking False would turn it into isolation that protects others instead."}, "m": {}, "k": "c-neut-prec", "lp": 1}, {"id": 150, "t": "neut", "ty": "tf", "q": "A nurse tells a neutropenic client that raspberries and blackberries are safe to eat because they are easy to wash. The nurse's statement is accurate.", "o": ["True", "False"], "c": 1, "w": "Fruits and vegetables carry soil bacteria on their surface, and a neutropenic client cannot fight them off. Raspberries and blackberries have a bumpy surface that traps dirt and is hard to clean. For that reason they are avoided, while other raw fruits and vegetables are washed well. The statement is false. (study guide, Ch 34 Box 34.2)", "x": {"True": "Marking True would let the client eat fruit that is hard to clean."}, "m": {}, "k": "c-neut-prec", "lp": 1}], "concepts": {"c-risk-list": {"title": "The risk factor categories", "unit": "risk", "points": ["The nine risk factor categories are carcinogens, environment, hormones, genetics, lifestyle, infectious disease, medications, immune status and nutrition.", "Carcinogen exposure is the most common risk factor, and risks are cumulative.", "Age and genetics cannot be changed; 5 to 10% of cancers come from known genetic syndromes such as BRCA1/2.", "Hereditary red flags are multiple primaries, bilateral tumors in paired organs, a younger-than-usual age, a tumor in the sex not usually affected, and two or more first-degree relatives with the same cancer.", "BRCA2 also raises the risk of pancreatic and prostate cancer and melanoma."], "source": "study guide, Ch 13", "guide": ["c-risk-list"]}, "c-risk-table": {"title": "Risk factors by cancer (Table 13.2)", "unit": "risk", "points": ["Cervical cancer: HPV, multiple partners, early sexual contact, tobacco use.", "Gastric cancer: H. pylori, alcohol, ulcers, smoking. Liver cancer: alcohol and hepatitis A, B or C.", "Testicular cancer: undescended testicle is the greatest risk. Lung cancer: tobacco, asbestos, coal, soot, tar, pollution, wood dust.", "Uterine cancer: estrogen therapy without progesterone, obesity, tamoxifen, PCOS, diabetes."], "source": "study guide, Ch 13 Table 13.2", "guide": ["c-risk-table"]}, "c-risk-prev": {"title": "Levels of prevention", "unit": "risk", "points": ["Primary prevention: risk factor modification, immunization (HPV, hepatitis), chemoprevention and avoiding carcinogens.", "Secondary prevention: screening for early detection (breast, cervical, colon, prostate).", "Tertiary prevention: reducing morbidity and mortality once disease is diagnosed."], "source": "study guide, Ch 13 and class notes", "guide": ["c-risk-prev"]}, "c-risk-caution": {"title": "CAUTION warning signs", "unit": "risk", "points": ["C change in bowel or bladder habits; A a sore that does not heal; U unusual bleeding or discharge; T thickening or lump.", "I indigestion or difficulty swallowing; O obvious change in a wart or mole; N nagging cough or hoarseness.", "A sign lasting more than 2 weeks needs evaluation."], "source": "study guide, Ch 13", "guide": ["c-risk-caution"]}, "c-stage-tnm": {"title": "TNM, stages and grade", "unit": "stage", "points": ["T is the size of the tumor, N is the number of lymph nodes involved, and M is the presence of metastasis; M1 means the cancer is not local.", "Stage I is small with no obvious spread outside the organ, stage II invades deeper tissue or local nodes, stage III is large or locally advanced, and stage IV has metastasized.", "All hematologic malignancies are stage IV at diagnosis.", "Grade describes how differentiated the cells are; poorly differentiated cells are more aggressive."], "source": "study guide, Ch 13 and class PLQ", "guide": ["c-stage-tnm"]}, "c-stage-sizes": {"title": "Size and stage tables", "unit": "stage", "points": ["Breast sizes: 2 cm or less is stage I, 2 to 5 cm is stage II, over 5 cm is stage IIB or III; nodes 4 to 8 is IIIA, up to 9 is IIIB, 10 or more is IIIC.", "Prostate: T1 cannot be felt, T2 is confined to the prostate, T3 is locally extensive, T4 invades neighboring organs.", "Gleason is two grades of 1 to 5 added together, maximum 10; higher is worse.", "Ovarian FIGO: I ovaries, II pelvis, III peritoneum and/or nodes, IV distant."], "source": "study guide, Ch 65 and Ch 66", "guide": ["c-stage-sizes"]}, "c-bx-types": {"title": "Biopsy types and what they prove", "unit": "biopsy", "points": ["A biopsy is the most specific test and is required for a definite diagnosis; labs and imaging are supportive; results take 3 to 10 days.", "Excisional biopsy removes the whole mass with a margin and is preferred; incisional (core) biopsy can track cells through normal tissue.", "Fine-needle aspiration is less traumatic but gives fewer cells; core needle gives a larger sample; vacuum-assisted uses a probe with no sutures.", "A negative sentinel node means no further nodes are removed; a positive one leads to an axillary dissection of 20 to 40 nodes.", "A liquid biopsy is a blood test for cancer cells or tumor DNA."], "source": "study guide, Ch 13 and Ch 65", "guide": ["c-bx-types"]}, "c-bx-site": {"title": "Biopsy by site", "unit": "biopsy", "points": ["Ovarian mass: biopsy is not recommended because it could spread cells; the diagnosis is surgical removal with pathology.", "Uterine: endometrial biopsy is 99% sensitive for high-grade cancer; a D&C is done if the biopsy is negative but bleeding continues.", "Cervical: colposcopy with biopsy after an abnormal Pap; the biopsy is diagnostic.", "Lung: bronchoscopy views and biopsies the airways; mediastinoscopy is an incision to biopsy the mediastinum."], "source": "study guide, Ch 13, Ch 26 and Ch 65", "guide": ["c-bx-site"]}, "c-bx-marrow": {"title": "Bone marrow aspiration and biopsy", "unit": "biopsy", "points": ["The most common site is the posterior iliac crest with the client prone or side-lying; the sternum or anterior iliac crest is done supine.", "Before: consent, allergies and bleeding risk. The client feels pressure and a brief pulling pain, and the procedure takes 5 to 10 minutes.", "After: direct pressure for 5 to 10 minutes, a sterile dressing, rest for several hours, dressing on at least 24 hours.", "Report bleeding that soaks the dressing or lasts more than 24 hours, and watch for infection."], "source": "study guide, Ch 33", "guide": ["c-bx-marrow"]}, "c-lung-types": {"title": "Small cell versus non-small cell", "unit": "lung", "points": ["Small cell is about 15%, grows fast and spreads early, has a poor outlook (class: 6 months to 1 year), and surgery is not the main treatment.", "Non-small cell is about 85%, has three types (adenocarcinoma, squamous cell, large cell), is slower, and has a good 5-year survival if found early.", "More than 90% of lung cancer is caused by smoking; yearly low-dose CT is for high-risk clients (20 pack-years, current smoker or quit within 15 years)."], "source": "study guide, Ch 26 and class notes", "guide": ["c-lung-types"]}, "c-lung-dx": {"title": "Lung cancer cues and diagnosis", "unit": "lung", "points": ["Cues: new or changed cough, hemoptysis, shortness of breath, wheezing, hoarseness, chest pain, weight loss, frequent pneumonia.", "Headache and bone pain suggest metastasis to brain and bone; common sites are brain, bone, adrenal gland and the other lung.", "PET shows metabolic activity, not structure; sputum cytology, bronchoscopy and mediastinoscopy obtain cells or tissue."], "source": "study guide, Ch 26", "guide": ["c-lung-dx"]}, "c-lung-tx": {"title": "Lung cancer treatment", "unit": "lung", "points": ["Lobectomy removes a lobe, pneumonectomy removes a lung, and a wedge resection removes a small section; surgery is preferred if there is no metastasis.", "Chemotherapy is the primary treatment for advanced disease; radiation is used when surgery is not an option or for palliation.", "WHO ladder: nonopioid, then moderate opioid plus nonopioid, then strong opioid plus nonopioid, given around the clock.", "Palliative care begins at diagnosis."], "source": "study guide, Ch 26", "guide": ["c-lung-tx"]}, "c-lung-nursing": {"title": "Lung cancer nursing care and chest tubes", "unit": "lung", "points": ["Give oxygen to keep the SpO₂ at 90% or higher and position the client in semi-Fowler's.", "Small frequent meals with supplements; a large meal pushes on the diaphragm.", "Never clamp a chest tube; keep the system closed; continuous bubbling in the water-seal chamber is an air leak."], "source": "study guide, Ch 26", "guide": ["c-lung-nursing"]}, "c-labs-cbc": {"title": "CBC, WBC and ANC", "unit": "labs", "points": ["A CBC uses a lavender (EDTA) tube; PT, INR and PTT use sodium citrate.", "A left shift is many immature neutrophils (bands) and means active infection.", "Neutropenia is an ANC below 1,500; 500 or below needs neutropenic precautions.", "Reticulocytes are immature RBCs: high means the marrow is responding, low means a hypoproliferative marrow.", "Low MCV is microcytic (iron deficiency); high MCV is macrocytic (B12 or folate)."], "source": "study guide, Ch 33", "guide": ["c-labs-cbc"]}, "c-labs-plt": {"title": "Platelet thresholds", "unit": "labs", "points": ["Normal platelets are 150,000 to 450,000/mm³.", "Bleeding precautions start below 100,000; spontaneous bleeding is possible below 50,000.", "Platelets are usually transfused below 20,000; below 5,000 a fatal CNS or GI bleed is possible."], "source": "study guide, Ch 33 and Ch 34", "guide": ["c-labs-plt"]}, "c-labs-iron": {"title": "Iron studies and the iron diet", "unit": "labs", "points": ["In iron deficiency ferritin and transferrin saturation are low, TIBC is high, and the cells are microcytic and hypochromic.", "No iron supplements for 24 hours before a serum iron; draw it in the morning.", "Eat heme iron (red meat) and nonheme iron (spinach, beans) with vitamin C; dairy blocks absorption."], "source": "study guide, Ch 33 and Ch 34", "guide": ["c-labs-iron"]}, "c-labs-coag": {"title": "Clotting studies", "unit": "labs", "points": ["The intrinsic pathway is monitored by PTT and heparin; the extrinsic pathway by PT/INR and warfarin.", "The INR goal on warfarin is 2 to 3.", "Bleeding time checks platelet function and is not done if platelets are under 75,000; platelet aggregation is impaired by aspirin, NSAIDs and von Willebrand disease."], "source": "study guide, Ch 33", "guide": ["c-labs-coag"]}, "c-leuk-patho": {"title": "What leukemia does", "unit": "leuk", "points": ["A stem cell mutates into immature blasts that never mature or die, producing leukocytosis.", "The crowded marrow cannot make enough RBCs and platelets, so anemia and thrombocytopenia occur.", "The blasts cannot fight infection, so neutropenia and infection occur.", "AML and ALL are acute and ALL is the most common childhood leukemia; CML and CLL are chronic and can turn acute."], "source": "study guide, Ch 34", "guide": ["c-leuk-patho"]}, "c-leuk-risk": {"title": "Leukemia risk factors", "unit": "leuk", "points": ["Risk factors are genetic anomalies, Down syndrome, radiation, benzene or chemical exposure, prior chemotherapy or radiation, and smoking.", "The Philadelphia chromosome (9;22) is found in more than 90% of CML.", "Oil refinery work means benzene exposure, the highest risk factor in the case."], "source": "study guide, Ch 34", "guide": ["c-leuk-risk"]}, "c-leuk-tx": {"title": "Leukemia treatment and medications", "unit": "leuk", "points": ["Chemotherapy is given in phases: induction (get remission), consolidation (treat hidden disease), maintenance (prevent relapse); remission is not a cure.", "AML induction example is daunorubicin plus cytarabine; imatinib targets Bcr-Abl in CML; ibrutinib is used in CLL.", "Prophylactic antibiotics, antivirals and antifungals are given during neutropenia.", "Radiation to the brain and spine treats CNS disease because chemotherapy cannot cross the blood–brain barrier.", "The textbook says G-CSF (filgrastim) is generally not indicated in leukemia."], "source": "study guide, Ch 34", "guide": ["c-leuk-tx"]}, "c-leuk-nursing": {"title": "Leukemia nursing priorities", "unit": "leuk", "points": ["After chemotherapy the first priority is infection; fever means broad-spectrum IV antibiotics immediately.", "Never take a rectal temperature in a neutropenic client.", "Teach to avoid dental cleanings when platelets are low, and go to the ED for fever of 102°F, chills or a nosebleed over 10 minutes.", "Offer sperm or egg banking before therapy."], "source": "study guide, Ch 34", "guide": ["c-leuk-nursing"]}, "c-neut-def": {"title": "Neutropenia values and fever", "unit": "neut", "points": ["Neutropenia is an ANC below 1,500; precautions start at 500 or below.", "A temperature of 100.4°F (38°C) or higher needs immediate care and IV antibiotics.", "Fever may be the first and only sign of infection."], "source": "study guide, Ch 13 and Ch 34", "guide": ["c-neut-def"]}, "c-neut-prec": {"title": "Neutropenic precautions (Box 34.2)", "unit": "neut", "points": ["Hand hygiene by everyone, a private room, avoid crowds, sick people, small children and pets.", "No live plants or cut flowers, no standing water or humidifiers.", "Wash raw fruits and vegetables well; avoid raspberries and blackberries.", "No rectal temperatures, suppositories or enemas, because rectal bacteria can enter the blood.", "Take prophylactic antimicrobials daily and finish the course; reverse isolation means staff wear PPE to protect the client."], "source": "study guide, Ch 34 and class notes", "guide": ["c-neut-prec"]}, "c-hodg-dx": {"title": "Hodgkin lymphoma: signs and diagnosis", "unit": "hodgkin", "points": ["Reed–Sternberg cells define Hodgkin lymphoma; it has a better survival rate than non-Hodgkin lymphoma.", "Painless lymph node swelling; B symptoms are low-grade fever, drenching night sweats and weight loss.", "Itching is common in Hodgkin lymphoma; a dry cough worse lying flat suggests a mediastinal mass.", "A lymph node biopsy is definitive; uric acid and LDH are elevated."], "source": "study guide, Ch 34", "guide": ["c-hodg-dx"]}, "c-hodg-comp": {"title": "Lymphoma complications and nursing", "unit": "hodgkin", "points": ["Superior vena cava syndrome: facial and arm swelling, dyspnea, chest pain, dysphagia.", "Spinal cord compression: back pain, then sensory and motor change; an emergency.", "Hypercalcemia above 11 mg/dL: confusion, polyuria, heart block; IV fluids dilute calcium.", "Lymphoma staging: I one node, II two or more nodes on one side of the diaphragm, III both sides, IV organs plus nodes.", "Teach neutropenic and bleeding precautions before chemotherapy."], "source": "study guide, Ch 34", "guide": ["c-hodg-comp"]}, "c-mm-patho": {"title": "Myeloma: patho and CRAB", "unit": "mm", "points": ["A clone of plasma cells makes an M protein; lytic bone lesions release calcium.", "CRAB: hypercalcemia above 11.5, renal insufficiency (creatinine above 2), anemia (Hgb below 10), bone disease.", "Excess light chains (Bence Jones protein) are toxic to the kidneys.", "Myeloma is an incurable B-cell cancer of plasma cells."], "source": "study guide, Ch 34", "guide": ["c-mm-patho"]}, "c-mm-nursing": {"title": "Myeloma nursing interventions", "unit": "mm", "points": ["Encourage fluids to dilute calcium and protect the kidneys; monitor serum and urine calcium, BUN and creatinine.", "Encourage ambulation as tolerated and position for comfort.", "Bisphosphonates such as ibandronate (Boniva) reduce bone breakdown, which lowers calcium and fractures.", "Sudden severe pain or new numbness may mean a fracture or cord compression: report at once.", "Thalidomide and lenalidomide are teratogenic."], "source": "study guide, Ch 34 and class notes", "guide": ["c-mm-nursing"]}, "c-breast-tx": {"title": "Breast cancer treatment", "unit": "breast", "points": ["Lumpectomy is always followed by radiation; with chemotherapy the order is surgery, chemotherapy, then radiation.", "Neoadjuvant therapy is given before the primary treatment; adjuvant therapy is given after.", "DCIS is stage 0 and requires surgery; LCIS has no treatment and is followed with mammograms."], "source": "study guide, Ch 65", "guide": ["c-breast-tx"]}, "c-breast-meds": {"title": "Breast cancer medications (Table 65.3)", "unit": "breast", "points": ["Tamoxifen blocks estrogen at its receptor for 5 to 10 years; avoid SSRIs and question oral contraceptives in estrogen-positive disease.", "Aromatase inhibitors (anastrozole, letrozole, exemestane) stop androgens becoming estrogen; they risk osteoporosis and fractures.", "Trastuzumab is for HER2-positive tumors and can cause cardiotoxicity; pembrolizumab is immunotherapy with rash, diarrhea and thyroid problems."], "source": "study guide, Ch 65 and Davis Table 65.3", "guide": ["c-breast-meds"]}, "c-breast-male": {"title": "Male breast cancer", "unit": "breast", "points": ["It is about 100 times less common than in women, occurs at ages 60 to 70, and BRCA2 is the more common mutation.", "With little breast tissue it spreads early to the nipple, skin and muscle; mastectomy is usual.", "Hormone therapy is only for receptor-positive tumors, so question antiestrogen therapy in a receptor-negative client.", "Ultrasound is used under age 25; mammogram at 25 or older."], "source": "study guide, Ch 66", "guide": ["c-breast-male"]}, "c-breast-nursing": {"title": "Breast cancer nursing care", "unit": "breast", "points": ["Bloody drainage saturating the dressing is the most concerning wound finding; serosanguineous drainage is expected.", "Lymphedema follows axillary node removal; shoulder immobility is the most common long-term effect.", "Radiation effects: skin redness, itching, desquamation, breast swelling, and pneumonitis 6 weeks to 6 months later.", "Breast self-exam is not recommended; screening is by mammography."], "source": "study guide, Ch 65", "guide": ["c-breast-nursing"]}, "c-ut-risk": {"title": "Uterine cancer risk", "unit": "uterine", "points": ["The most common gynecologic cancer in the US, usually at ages 55 to 65.", "The number one risk factors are unopposed estrogen and obesity; tamoxifen, early menarche, late menopause, PCOS and diabetes add risk.", "About 80% are endometrioid adenocarcinoma; anyone on estrogen with a uterus needs progesterone."], "source": "study guide, Ch 65 and Ch 13", "guide": ["c-ut-risk"]}, "c-ut-dx": {"title": "Uterine cancer diagnosis and treatment", "unit": "uterine", "points": ["Abnormal uterine or postmenopausal bleeding is the most common symptom and needs evaluation.", "Endometrial biopsy first; ultrasound shows a thickened endometrium; D&C if the biopsy is negative but bleeding continues.", "Treatment is removal of the uterus, tubes and ovaries; radiation is the usual adjuvant.", "Stomatitis: salt-water rinses and avoid hot or spicy food."], "source": "study guide, Ch 65", "guide": ["c-ut-dx"]}, "c-cerv-screen": {"title": "Cervical screening guidelines", "unit": "cervical", "points": ["No screening before age 21; the first Pap is at 21 and is repeated every 3 years until 29.", "HPV testing is not a screen at 21 to 29, except as a reflex if atypical cells are found; primary HPV may start at 25 every 5 years.", "Ages 30 to 65: primary HPV or Pap plus HPV cotest every 5 years, or Pap alone every 3 years.", "Screening may stop after 65 with adequate negative results and no CIN 2 in 20 years."], "source": "study guide, Ch 65 and class PLQ", "guide": ["c-cerv-screen"]}, "c-cerv-dx": {"title": "Cervical cancer cause, signs and work-up", "unit": "cervical", "points": ["HPV is the cause; the HPV vaccine at age 11 to 12 (as early as 9) does not treat an existing infection.", "Dysplasia has no symptoms; vaginal bleeding, especially after intercourse, is the most common symptom of invasive cancer.", "An abnormal Pap with high-risk HPV leads to colposcopy with biopsy; nothing in the vagina for 24 hours before, and Lugol's is contraindicated with iodine or shellfish allergy.", "About 90% are squamous cell carcinomas in the transformation zone."], "source": "study guide, Ch 65 and Ch 64", "guide": ["c-cerv-dx"]}, "c-cerv-tx": {"title": "Cervical cancer treatment", "unit": "cervical", "points": ["Early disease: cone biopsy or radical trachelectomy if fertility is wanted; hysterectomy with node dissection if not.", "Higher stages: chemoradiation with brachytherapy.", "Pelvic exenteration can cure a recurrence confined to the pelvis."], "source": "study guide, Ch 65", "guide": ["c-cerv-tx"]}, "c-pros-patho": {"title": "Prostate cancer patho and screening", "unit": "prostate", "points": ["Tumors grow on the periphery of the gland, so urinary symptoms come late; spread is to lymph nodes, bone, rectum and bladder.", "PSA of 4 ng/mL or higher needs further assessment; PSA has high sensitivity but low specificity and cannot tell BPH from cancer.", "A needle biopsy confirms the diagnosis, followed by a Gleason score.", "African American men have a higher incidence and twice the mortality; BPH is not a precursor to prostate cancer."], "source": "study guide, Ch 66", "guide": ["c-pros-patho"]}, "c-pros-tx": {"title": "Prostate cancer treatment and safety", "unit": "prostate", "points": ["Brachytherapy seeds are placed permanently through the perineum for cancer confined to the prostate; no sex for 2 weeks, then use a condom.", "The nurse minimizes contact and wears proper, thicker PPE with brachytherapy; an external beam client is not radioactive.", "Ablative hormone therapy suppresses testosterone; chemotherapy is for hormone-refractory disease."], "source": "study guide, Ch 66 and class notes", "guide": ["c-pros-tx"]}, "c-pros-postop": {"title": "Post-op complications after prostatectomy", "unit": "prostate", "points": ["Impotence is the most expected; nerve-sparing surgery only tries to protect the erection nerves.", "Watch for urinary incontinence, infection (fever, pain, swelling, redness) and bleeding with clots.", "Manage bladder irrigation to clear clots and give stool softeners to avoid straining.", "A cancer client with fever, malaise and high WBC most likely has an infection."], "source": "study guide, Ch 66 and class PLQ", "guide": ["c-pros-postop"]}, "c-test-dx": {"title": "Testicular cancer risk, signs and markers", "unit": "testis", "points": ["Cryptorchidism is the greatest risk factor; the average age is 33.", "The classic sign is a painless mass, sometimes with a firm or heavy feeling.", "AFP and hCG should fall after the tumor is removed; if not, look for more tumor.", "Cure rate is 90 to 100% if found early."], "source": "study guide, Ch 66", "guide": ["c-test-dx"]}, "c-test-tx": {"title": "Testicular cancer treatment and teaching", "unit": "testis", "points": ["All types start with removal of the affected testicle (orchiectomy).", "Seminoma is radiation sensitive; nonseminoma is not and gets node removal and chemotherapy.", "Bank sperm before treatment; follow up for at least 10 years; retroperitoneal node removal can damage ejaculation nerves.", "Bleomycin can damage the lungs and ifosfamide can cause hemorrhagic cystitis.", "After surgery, hypotension with tachycardia means volume loss and fever means infection."], "source": "study guide, Ch 66", "guide": ["c-test-tx"]}, "c-eol-diff": {"title": "Hospice versus palliative care", "unit": "eol", "points": ["Palliative care is for any stage of serious illness, begins at diagnosis, and can continue with curative treatment.", "Hospice is for a prognosis of 6 months or less; curative treatment stops and the goal is comfort.", "All hospice is palliative, but not all palliative care is hospice."], "source": "study guide, Ch 26 and Other Topics", "guide": ["c-eol-diff"]}, "c-eol-nursing": {"title": "Nursing care at the end of life", "unit": "eol", "points": ["Signs death is near: falling intake and urine output, mottled cool extremities, apnea periods, noisy secretions.", "Give opioids around the clock for pain and dyspnea, provide mouth care and repositioning, and honor advance directives.", "Hearing is often the last sense lost."], "source": "study guide, Other Topics", "guide": ["c-eol-nursing"]}}}, README="<h1>Read me<\/h1>\n<p class=\"small\">The same page is in the drill and in the Mastery Study Guide. They are built from the same facts and always agree.<\/p>\n\n<h3>How to use the drill<\/h3>\n<ol>\n<li><b>Start with the pre-test.<\/b> It asks a few questions from every topic (none from the last pass) and shows your level in each: Strong, Okay or Weak.<\/li>\n<li><b>Do your daily sessions.<\/b> Pick topics, a length (5 to 500, endless, or a timed 30 or 45 minute plan) and tap Start. Leave <b>Think first<\/b> on: try to recall the answer before the choices appear.<\/li>\n<li><b>Check each answer.<\/b> Read “Why my pick is wrong”, then the key idea. After a right answer tap <b>Knew it<\/b> or <b>I guessed<\/b>. A guess comes back sooner.<\/li>\n<li><b>Star<\/b> anything you want to see again. Use the filters (missed, starred, last pass, never practiced) to drill just those.<\/li>\n<li><b>Fix my misses<\/b> shows the mistakes you keep making and your shaky questions by concept. “Fix this” re-teaches the concept and asks you a different question on it.<\/li>\n<li><b>Last pass.<\/b> Use it in the final days. It asks every last-pass question once, shakiest first. “Just the 20 weakest” is the short version.<\/li>\n<li>A question is <b>solid<\/b> only after you get the whole question right on two spaced visits (three for true/false). Your progress is saved on this device and, when you open the page as a claude.ai artifact, in your account so your phone and laptop match.<\/li>\n<\/ol>\n\n<h3>How to use the guide<\/h3>\n<ol>\n<li>The guide teaches the same facts in lecture order. Each section gives the <b>mechanism<\/b> first, then the <b>priority actions<\/b>, a <b>patient example<\/b>, the <b>common trap<\/b> and a <b>memory trick<\/b>.<\/li>\n<li>Tap each <b>blank<\/b> to reveal it, but say the answer out loud first.<\/li>\n<li>The <b>Key ideas<\/b> box at the end of each section is the short version to re-read the night before.<\/li>\n<\/ol>\n\n<h3>How to use both together<\/h3>\n<ul>\n<li><b>Drill to find and prove.<\/b> The drill finds what you do not know yet and proves what you do.<\/li>\n<li><b>Guide to look up and re-learn.<\/b> When a card in Fix my misses shows a concept, tap its link to open the same section in the guide. Read that section, then go back and prove it in the drill.<\/li>\n<li>Every fact on a Fix my misses card is in the guide section it links to.<\/li>\n<\/ul>\n";
var CFG=D.cfg, Q=D.Q, CON=D.concepts, TOP=D.cfg.topics, KEY=CFG.key;
var DEV=Math.random().toString(36).slice(2,8);
var core=DrillCore.make({Q:Q,highRoi:CFG.highRoi});
var byId=core.byId, LET="ABCDEF";
var topicName={};TOP.forEach(function(t){topicName[t.id]=t.name});
var app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function now(){return Date.now()}

/* ---------------- state ---------------- */
function fresh(){return{v:1,q:{},stars:{},ans:0,avg:{s:0,c:0},letters:{},lastPos:{},misc:{},wp:{},pre:null,prev:[],session:null,think:true,sel:null,u:0}}
var S=fresh();
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);S=Object.assign(fresh(),o)}}catch(e){}}
function saveLocal(){S.u=now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

/* ---------------- sync with the account (claude.ai artifact db) ---------------- */
var SY={db:null,id:null,doc:null,t:null,ready:false,last:0};
function mergeInto(a,b){ /* merge remote b into local a, in place */
  var id;
  for(id in (b.q||{})){var x=a.q[id],y=b.q[id];if(!x||(y.t||0)>(x.t||0))a.q[id]=y}
  for(id in (b.stars||{})){var s=a.stars[id],r=b.stars[id];if(!s||(r.t||0)>(s.t||0))a.stars[id]=r}
  a.ans=Math.max(a.ans||0,b.ans||0);
  if((b.avg&&b.avg.c||0)>(a.avg.c||0))a.avg=b.avg;
  ["letters","misc"].forEach(function(k){for(var z in (b[k]||{}))a[k][z]=Math.max(a[k][z]||0,b[k][z])});
  for(id in (b.wp||{})){a.wp[id]=a.wp[id]||{};for(var o in b.wp[id])a.wp[id][o]=Math.max(a.wp[id][o]||0,b.wp[id][o])}
  if(b.pre&&(!a.pre||b.pre.ts>a.pre.ts))a.pre=b.pre;
  if((b.u||0)>(a.u||0)){a.prev=b.prev||a.prev;a.session=b.session;a.think=b.think;a.lastPos=b.lastPos||a.lastPos}
  return a;
}
function syncInit(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    if(!r[0]||!r[1])return;SY.db=r[0];return r[1].id().then(function(id){
      if(!id)return;SY.id=id;SY.doc=SY.db.doc("data/users/"+id+"/"+KEY);
      return SY.doc.get().then(function(snap){
        if(snap.exists){var d=snap.data();if(d&&d.s){try{mergeInto(S,JSON.parse(d.s))}catch(e){}}}
        saveLocal();SY.ready=true;syncPush(true);
        SY.doc.onSnapshot(function(sn){var d=sn.data();if(!d||d.dev===DEV||!d.s||sn.metadata.hasPendingWrites)return;
          if((d.u||0)<=SY.last)return;try{mergeInto(S,JSON.parse(d.s));saveLocal();if(ui.screen==="home")render()}catch(e){}},function(){});
        render();
      });
    });
  }).catch(function(){});
}
function slim(){var s=Object.assign({},S);if(s.session){var ss=Object.assign({},s.session);ss.items={};for(var k in s.session.items){var it=s.session.items[k];ss.items[k]={o:it.o,sel:it.sel,ch:it.ch,ok:it.ok,fr:it.fr,g:it.g,sec:it.sec,card:it.card}}s.session=ss}return s}
function syncPush(now_){
  if(!SY.ready)return;clearTimeout(SY.t);
  var go=function(){SY.last=now();try{SY.doc.set({dev:DEV,u:SY.last,s:JSON.stringify(slim())}).catch(function(){})}catch(e){}};
  if(now_)go();else SY.t=setTimeout(go,1200);
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")syncPush(true)});
window.addEventListener("pagehide",function(){syncPush(true)});

/* ---------------- ui state ---------------- */
var ui={screen:"home",tab:"drill",topics:null,filt:{missed:false,starred:false,lp:false,never:false},overlap:false,len:"10",custom:20,resetArm:false,review:false,fixOpen:false,cardFor:null,thinkLeft:0,thinkTimer:null,clock:null,stopArm:false,note:""};
function allTopics(){return TOP.map(function(t){return t.id})}
if(!ui.topics)ui.topics=allTopics();

/* ---------------- helpers ---------------- */
function pool(){return Q.filter(function(q){return ui.topics.indexOf(q.t)>=0})}
function statusCounts(list){var c={solid:0,right:0,shaky:0,"new":0};list.forEach(function(q){c[core.status(S,q)]++});return c}
function bar(c){var t=c.solid+c.right+c.shaky+c["new"]||1;return'<div class="bar"><i class="c-solid" style="width:'+100*c.solid/t+'%"></i><i class="c-right" style="width:'+100*c.right/t+'%"></i><i class="c-shaky" style="width:'+100*c.shaky/t+'%"></i><i class="c-new" style="width:'+100*c["new"]/t+'%"></i></div><div class="leg"><span><b class="c-solid"></b>solid '+c.solid+'</span><span><b class="c-right"></b>right once '+c.right+'</span><span><b class="c-shaky"></b>shaky '+c.shaky+'</span><span><b class="c-new"></b>not answered yet '+c["new"]+'</span></div>'}
function fmtDate(t){var d=new Date(t);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function srcOf(q){var m=q.w.match(/\(([^()]*)\)\s*$/);return m?m[1].replace(/,?\s*Ch\s*[\d, and]+.*$/,"").replace(/ and .*/,"").trim():"other"}

/* ---------------- sessions ---------------- */
function newSession(mode,list,extra){
  var s=Object.assign({mode:mode,ids:list.map(function(q){return q.id}),idx:0,items:{},startedAt:now(),follow:0,prevCorrect:-1,done:false,extras:0},extra||{});
  S.session=s;saveLocal();return s;
}
function startFromSetup(){
  var p=pool(),f=ui.filt,any=f.missed||f.starred||f.lp||f.never;
  if(any){
    var tests=[];
    if(f.missed)tests.push(function(q){return core.missed(S,q)});
    if(f.starred)tests.push(function(q){return core.starred(S,q.id)});
    if(f.lp)tests.push(function(q){return !!q.lp});
    if(f.never)tests.push(function(q){return core.status(S,q)==="new"});
    p=p.filter(function(q){return ui.overlap?tests.every(function(t){return t(q)}):tests.some(function(t){return t(q)})});
  }
  if(!p.length){ui.note="No questions match those choices.";render();return}
  var len=ui.len,sess;
  if(len==="endless"){var first=core.nextEndless(S,p,now(),null);sess=newSession("endless",[first],{poolIds:p.map(function(q){return q.id})})}
  else if(len==="30"||len==="45"){var pl=core.buildTimed(S,p,+len,now());sess=newSession("timed",pl.list,{minutes:+len,deadline:null,plan:pl.mix,weak:pl.weak});ui.note=""}
  else{var N=Math.min(len==="custom"?Math.max(5,Math.min(500,+ui.custom||20)):+len,p.length);var r=core.buildLimited(S,p,N,now());sess=newSession("limited",r.list,{note:r.note})}
  begin();
}
function begin(){var s=S.session;if(s.mode==="timed"&&!s.deadline)s.deadline=now()+s.minutes*60000;ui.screen="q";ui.review=false;prepItem();render();startClock()}
function cur(){var s=S.session;return s?byId[s.ids[s.idx]]:null}
function item(q){var s=S.session;return s.items[q.id]}
function prepItem(){
  var s=S.session,q=cur();if(!q)return;
  var it=s.items[q.id];
  if(!it){
    it={t0:null,ch:false,ok:null,fr:0,g:false,sel:null,sec:0};
    if(q.ty==="mc"){it.o=core.placeMC(S,q,s.prevCorrect);var pos=it.o.indexOf(q.c);S.letters[LET[pos]]=(S.letters[LET[pos]]||0)+1;S.lastPos[q.id]=pos;s.prevCorrect=pos}
    else if(q.ty==="sata"){it.o=core.shuffle(q.o.map(function(_,i){return i}))}
    else if(q.ty==="blanks"||q.ty==="cloze"||q.ty==="match"){it.o=core.placeRows(q);it.sel=(q.ty==="match"?q.r:q.o).map(function(){return -1})}
    else if(q.ty==="order"){var a;do{a=core.shuffle(q.o.map(function(_,i){return i}))}while(a.every(function(v,i){return v===i})&&a.length>1);it.o=a}
    it.card=(s.mode==="fix");
    s.items[q.id]=it;
  }
  ui.think=(q.ty!=="order")&&S.think&&!it.ch&&!it.seen;
  clearInterval(ui.thinkTimer);
  if(ui.think&&!it.card){ui.thinkLeft=(q.ty==="tf"||q.q.length<170)?10:15;ui.thinkTimer=setInterval(function(){ui.thinkLeft--;if(ui.thinkLeft<=0){clearInterval(ui.thinkTimer);ui.think=false;it.seen=true;render()}else{var e=document.getElementById("thk");if(e)e.textContent=ui.thinkLeft}},1000)}
  it.t0=it.t0||now();saveLocal();
}
function startClock(){clearInterval(ui.clock);var s=S.session;if(s&&s.mode==="timed"){ui.clock=setInterval(function(){var e=document.getElementById("clk");if(e){var left=Math.max(0,Math.round((s.deadline-now())/1000));e.textContent=Math.floor(left/60)+":"+String(left%60).padStart(2,"0")}},1000)}}

/* ---------------- grading ---------------- */
function grade(q,it){
  var ok=false,fr=0;
  if(q.ty==="mc"){ok=it.sel===q.c;fr=ok?1:0}
  else if(q.ty==="tf"){ok=it.sel===q.c;fr=ok?1:0}
  else if(q.ty==="sata"){var rr=0,ww=0;(it.sel||[]).forEach(function(i){q.c.indexOf(i)>=0?rr++:ww++});fr=Math.max(0,rr-ww)/q.c.length;ok=rr===q.c.length&&ww===0}
  else if(q.ty==="order"){ok=it.o.every(function(v,i){return v===i});fr=ok?1:0}
  else{ok=it.sel.every(function(v,i){return v===q.c[i]});fr=ok?1:0}
  return{ok:ok,fr:fr};
}
function recordAnswer(q,it,g){
  var r=S.q[q.id]||(S.q[q.id]={n:0,ok:0,ms:0,rs:0,mi:0});
  r.n++;S.ans++;r.c=S.ans;r.t=now();
  if(g.ok){r.ok++;r.last="r";r.rs++;r.ms=0}else{r.last="w";r.rs=0;r.ms++;r.mi++}
  r.g=false;
  var sec=Math.min(180,Math.round((now()-it.t0)/1000));S.avg.s+=sec;S.avg.c++;it.sec=sec;
}
function pickLabels(q,it){ /* wrong picks as option texts */
  var out=[];
  if(q.ty==="mc"&&it.sel!==q.c)out.push(q.o[it.sel]);
  else if(q.ty==="tf"&&it.sel!==q.c)out.push(q.o[it.sel]);
  else if(q.ty==="sata")(it.sel||[]).forEach(function(i){if(q.c.indexOf(i)<0)out.push(q.o[i])});
  else if(q.ty==="blanks"||q.ty==="cloze"){it.sel.forEach(function(v,b){if(v!==q.c[b]&&v>=0)out.push(q.o[b][v])})}
  else if(q.ty==="match"){it.sel.forEach(function(v,b){if(v!==q.c[b]&&v>=0)out.push(q.o[v])})}
  return out;
}
function check(){
  var q=cur(),it=item(q);if(it.ch)return;
  if(q.ty==="mc"||q.ty==="tf"){if(it.sel==null)return}
  if(q.ty==="blanks"||q.ty==="cloze"||q.ty==="match"){if(it.sel.some(function(v){return v<0}))return}
  var g=grade(q,it);it.ch=true;it.ok=g.ok;it.fr=g.fr;
  recordAnswer(q,it,g);
  pickLabels(q,it).forEach(function(t){var lab=q.m&&q.m[t];if(lab)S.misc[lab]=(S.misc[lab]||0)+1;var oi=Array.isArray(q.o[0])?-1:q.o.indexOf(t);if(oi>=0){S.wp[q.id]=S.wp[q.id]||{};S.wp[q.id][oi]=(S.wp[q.id][oi]||0)+1}});
  if(!g.ok&&S.session.mode!=="pretest"&&S.session.mode!=="fix")scheduleFollow(q);
  saveLocal();syncPush();render();
  var v=document.getElementById("verdict");if(v)v.scrollIntoView({block:"start"});
}
function scheduleFollow(q){
  var s=S.session;if(!q.k)return;
  var cap=Math.floor(s.ids.length/3);
  var same=Q.filter(function(x){return x.k===q.k&&x.id!==q.id&&!s.items[x.id]});
  if(!same.length)return;
  var later=same.filter(function(x){return s.ids.indexOf(x.id,s.idx+1)>=0});
  var target=s.idx+1+3+Math.floor(Math.random()*3);
  if(later.length){var x=later[0],pos=s.ids.indexOf(x.id,s.idx+1);if(pos>target){s.ids.splice(pos,1);s.ids.splice(Math.min(target,s.ids.length),0,x.id)}return}
  if(s.follow<cap){var y=same[Math.floor(Math.random()*same.length)];s.ids.splice(Math.min(target,s.ids.length),0,y.id);s.follow++;s.extras++}
}
function nextQ(){
  var s=S.session,q=cur(),it=item(q);if(!it.ch)return;
  s.prevOk=it.ok;
  if(s.mode==="endless"){
    if(s.idx+1>=s.ids.length){var p=s.poolIds.map(function(i){return byId[i]});var nx=core.nextEndless(S,p,now(),q);s.ids.push(nx.id)}
    s.idx++;ui.screen="q";prepItem();saveLocal();syncPush();render();window.scrollTo(0,0);return;
  }
  var timeUp=s.mode==="timed"&&s.deadline&&now()>=s.deadline;
  if(s.idx+1>=s.ids.length||timeUp){finish();return}
  s.idx++;prepItem();saveLocal();syncPush();render();window.scrollTo(0,0);
}
function answered(){var s=S.session;return s.ids.filter(function(id){var it=s.items[id];return it&&it.ch}).map(function(id){return byId[id]})}
function finish(){
  var s=S.session;s.done=true;
  var list=answered();
  S.prev=list.map(function(q){return q.id});
  if(s.mode==="pretest"){var sc=0;list.forEach(function(q){sc+=s.items[q.id].fr});S.pre={ts:now(),n:list.length,total:s.ids.length,score:list.length?Math.round(100*sc/list.length):0}}
  clearInterval(ui.thinkTimer);clearInterval(ui.clock);
  ui.screen="results";S.sessionSummary={mode:s.mode,ids:list.map(function(q){return q.id}),frs:list.map(function(q){return s.items[q.id].fr}),oks:list.map(function(q){return s.items[q.id].ok}),total:s.ids.length};
  saveLocal();syncPush(true);render();window.scrollTo(0,0);
}

  var cMissed=p.filter(function(q){return core.missed(S,q)}).length,cStar=p.filter(function(q){return core.starred(S,q.id)}).length,cLp=p.filter(function(q){return q.lp}).length,cNew=p.filter(function(q){return core.status(S,q)==="new"}).length;

function describe(){

  return n+" questions from "+tn+" topic"+(tn>1?"s":"")+", each asked once: up to a quarter rested misses ("+rm+" ready), up to a fifth review checks on ones you got right, then questions you have never answered ("+nw+" available), then more rested ones.";

function stemHTML(q,it,live){

function clockText(s){var left=Math.max(0,Math.round((s.deadline-now())/1000));return Math.floor(left/60)+":"+String(left%60).padStart(2,"0")}
function canCheck(q,it){if(q.ty==="mc"||q.ty==="tf")return it.sel!=null;if(q.ty==="sata")return(it.sel||[]).length>0;if(q.ty==="order")return true;return it.sel.every(function(v){return v>=0})}
function controls(q,it){
  var h="";

  else if(q.ty==="tf"){[0,1].forEach(function(oi){var cls="opt";if(it.ch){if(oi===q.c)cls+=" right";else if(it.sel===oi)cls+=" wrong"}else if(it.sel===oi)cls+=" sel";h+='<button class="'+cls+'" data-act="pick" data-v="'+oi+'" '+(it.ch?"disabled":"")+'><span class="ltr">'+(oi+1)+'</span><span>'+q.o[oi]+'</span></button>'})}
  else if(q.ty==="sata"){it.o.forEach(function(oi,pos){var on=(it.sel||[]).indexOf(oi)>=0,cls="opt";if(it.ch){if(q.c.indexOf(oi)>=0)cls+=on?" right":" miss";else if(on)cls+=" wrong"}else if(on)cls+=" sel";h+='<button class="'+cls+'" data-act="tog" data-v="'+oi+'" '+(it.ch?"disabled":"")+'><span class="ltr">'+(on?"☑":"☐")+'</span><span>'+esc(q.o[oi])+'</span></button>'})}

  else if(q.ty==="match"){h+='<table class="m">';q.r.forEach(function(prompt,b){var ord=it.o[b];h+='<tr><td>'+esc(prompt)+'</td><td><select data-act="blank" data-b="'+b+'"'+(it.ch?" disabled":"")+'><option value="-1">Choose…</option>'+ord.map(function(oi){return'<option value="'+oi+'"'+(it.sel[b]===oi?" selected":"")+'>'+esc(q.o[oi])+'</option>'}).join("")+'</select></td></tr>'});h+='</table>'}

function rightText(q,it){

function myPick(q,it){
  if(q.ty==="mc"||q.ty==="tf")return esc(q.o[it.sel]);
  if(q.ty==="sata")return(it.sel||[]).map(function(i){return"• "+esc(q.o[i])}).join("<br>")||"nothing";
  if(q.ty==="order")return it.o.map(function(oi,i){return(i+1)+". "+esc(q.o[oi])}).join("<br>");
  if(q.ty==="match")return q.r.map(function(p,b){return esc(p)+" → "+esc(it.sel[b]>=0?q.o[it.sel[b]]:"(none)")}).join("<br>");
  return it.sel.map(function(v,b){return"["+(b+1)+"] "+esc(v>=0?q.o[b][v]:"(none)")}).join("<br>");
}
function results(){
  var sm=S.sessionSummary,s=S.session||{},out=header(),n=sm.ids.length,sc=0;sm.frs.forEach(function(f){sc+=f});
  var pct=n?Math.round(100*sc/n):0;
  var msg=pct>=90?["Exam-ready","Keep your last pass fresh and re-run any shaky questions."]:pct>=80?["Strong","Drill the questions you missed with Fix my misses."]:pct>=70?["Almost there","Run a last pass, shakiest first."]:pct>=60?["Shaky","Open Fix my misses and re-learn the concepts you keep missing."]:["Needs work","Read the Mastery Study Guide for your weakest topic, then come back for a short session."];
  if(sm.mode==="pretest"){
    out+='<h1>Pre-test results</h1><p><b>'+Math.round(sc*10)/10+' of '+n+'</b> ('+pct+'%) on '+n+' of '+sm.total+' questions.</p>';
    var ts=core.topicStats(S,allTopics()),rows=[];
    TOP.forEach(function(t){var x=ts[t.id];if(!x.n){rows.push('<div class="tbar"><span>'+esc(t.name)+'</span><span class="small">not reached, no level</span><span></span></div>');return}var p=Math.round(100*x.ok/x.n),lv=core.level(p);rows.push('<div class="tbar"><span>'+esc(t.name)+'</span><div class="bar"><i style="width:'+p+'%;background:'+(lv==="Strong"?"var(--ok)":lv==="Okay"?"var(--amb)":"var(--bad)")+'"></i></div><span class="pill p-'+lv[0]+'">'+lv+'</span></div>')});
    out+='<h2>Your level by topic</h2><p class="small">Strong is 80% and up, Okay is 60 to 79%, Weak is under 60%, from the pre-test and your saved answers.</p>'+rows.join("");
    var weak=TOP.filter(function(t){var x=ts[t.id];return x.n&&x.ok/x.n<0.6}).map(function(t){return t.name});
    out+='<p><b>Next step:</b> start the last pass.'+(weak.length?' Your weakest topics so far: '+weak.map(esc).join(", ")+'.':"")+'</p><div class="row"><button class="btn pri" data-act="lp">Start last pass</button><button class="btn" data-act="fixgo">Fix my misses</button></div>';
    return out;
  }
  out+='<h1>'+msg[0]+'</h1><p style="font-size:1.2rem"><b>'+Math.round(sc*10)/10+' of '+n+'</b> ('+pct+'%)</p><p>'+msg[1]+'</p>';
  if(n<10)out+='<div class="notice">This session had fewer than 10 questions, so treat the percentage with care.</div>';
  var tb={};sm.ids.forEach(function(id,i){var t=byId[id].t;tb[t]=tb[t]||{n:0,s:0};tb[t].n++;tb[t].s+=sm.frs[i]});
  var wk=null;Object.keys(tb).forEach(function(t){if(tb[t].n>=3&&tb[t].s/tb[t].n<.8&&(!wk||tb[t].s/tb[t].n<tb[wk].s/tb[wk].n))wk=t});
  if(wk)out+='<p><b>Weakest topic this session:</b> '+esc(topicName[wk])+' ('+Math.round(100*tb[wk].s/tb[wk].n)+'%).</p>';
  var set=sm.mode==="lastpass"?Q.filter(function(q){return q.lp}):pool();
  out+='<h2>'+(sm.mode==="lastpass"?"The last pass set":"These topics")+'</h2>'+bar(statusCounts(set))+'<p class="small">One session can only make a question “right once”. It becomes solid after you get the full question right on two spaced visits (three for a true/false).</p>';
  out+='<h2>By topic</h2>';Object.keys(tb).forEach(function(t){var p=Math.round(100*tb[t].s/tb[t].n);out+='<div class="tbar"><span>'+esc(topicName[t])+'</span><div class="bar"><i style="width:'+p+'%;background:'+(p>=80?"var(--ok)":p>=60?"var(--amb)":"var(--bad)")+'"></i></div><span>'+p+'%</span></div>'});
  out+='<div class="row" style="margin-top:14px"><button class="btn pri" data-act="again">Drill again</button><button class="btn" data-act="review">Check my answers</button><button class="btn" data-act="home">Change topics</button><button class="btn" data-act="fixgo">Fix my misses</button></div><p style="margin-top:20px"><button class="link" data-act="reset">'+(ui.resetArm?"Tap again to erase all progress (stars are kept)":"Reset all progress")+'</button></p>';
  return out;
}
function fixScreen(){
  var out=header()+'<h1>Fix my misses</h1>';
  var sh=Q.filter(function(q){return core.status(S,q)==="shaky"});
  var labs=Object.keys(S.misc).sort(function(a,b){return S.misc[b]-S.misc[a]}).slice(0,8);
  out+='<h2>Mistakes I keep making</h2>';
  out+=labs.length?'<ul>'+labs.map(function(l){return'<li>'+esc(l)+' <span class="small">('+S.misc[l]+' time'+(S.misc[l]>1?"s":"")+')</span></li>'}).join("")+'</ul>':'<p class="small">Nothing yet. Wrong picks that match a known mistake show up here.</p>';
  var groups={};sh.forEach(function(q){var k=q.k||"x";(groups[k]=groups[k]||[]).push(q)});
  var keys=Object.keys(groups);
  out+='<h2>Shaky questions by concept</h2>';
  if(!keys.length)out+='<p class="small">No shaky questions right now.</p>';
  else{out+='<div class="row"><button class="btn pri" data-act="fixall">Fix all ('+keys.length+' concept'+(keys.length>1?"s":"")+')</button></div>';
    keys.forEach(function(k){var c=CON[k];out+='<div class="card"><b>'+esc(c?c.title:"Other")+'</b> <span class="small">'+groups[k].length+' shaky · '+esc(c?topicName[c.unit]:"")+'</span><div class="row" style="margin-top:6px"><button class="btn" data-act="fixone" data-v="'+k+'">Fix this</button></div></div>'})}
  out+='<details class="f"><summary>Detailed miss rates</summary>'+rates()+'</details>';
  out+='<div class="row" style="margin-top:14px"><button class="btn" data-act="drillmiss">Drill only what I’ve missed</button></div>';
  return out;
}
function rates(){
  function tab(title,keyf,namef){var m={};Q.forEach(function(q){var r=S.q[q.id];if(!r||!r.n)return;var k=keyf(q);m[k]=m[k]||{n:0,w:0};m[k].n+=r.n;m[k].w+=r.n-(r.ok||0)});var ks=Object.keys(m);if(!ks.length)return"";return'<h3>'+title+'</h3>'+ks.sort(function(a,b){return m[b].w/m[b].n-m[a].w/m[a].n}).map(function(k){return'<div class="tbar"><span>'+esc(namef(k))+'</span><div class="bar"><i style="width:'+100*m[k].w/m[k].n+'%;background:var(--bad)"></i></div><span>'+Math.round(100*m[k].w/m[k].n)+'%</span></div>'}).join("")}
  return tab("By topic",function(q){return q.t},function(k){return topicName[k]})+tab("By format",function(q){return q.ty},function(k){return k})+tab("By source",srcOf,function(k){return k})+tab("By kind of question",function(q){return q.lp?"Last pass":"Other"},function(k){return k})||'<p class="small">Answer some questions first.</p>';
}
function cardScreen(){var q=byId[ui.cardFor];return header()+'<h1>Concept</h1>'+cardBlock(q)+'<div class="row"><button class="btn pri" data-act="home">Main screen</button></div>'}
function readme(){return header()+'<div class="readme">'+README+'</div>'}

/* ---------------- fix sessions ---------------- */
function startFix(keys){
  var picks=[];
  keys.forEach(function(k){
    var shaky=Q.filter(function(q){return q.k===k&&core.status(S,q)==="shaky"}).map(function(q){return q.id});
    var other=Q.filter(function(q){return q.k===k&&shaky.indexOf(q.id)<0});
    var pickq=other.length?other[Math.floor(Math.random()*other.length)]:byId[shaky[0]];
    picks.push(pickq);
  });
  if(!picks.length)return;
  newSession("fix",picks,{});ui.screen="q";prepItem();render();
}

/* ---------------- events ---------------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act"),v=el.getAttribute("data-v");
  if(el.tagName==="SELECT"||el.tagName==="INPUT"&&el.type!=="checkbox")return;
  switch(act){
   case"home":clearInterval(ui.thinkTimer);ui.screen="home";ui.resetArm=false;render();window.scrollTo(0,0);break;
   case"tab":ui.screen=v==="fix"?"fix":"readme";render();window.scrollTo(0,0);break;
   case"resume":S.session.done=false;begin();break;
   case"fresh":S.session=null;saveLocal();render();break;
   case"pre":{var l=core.buildPretest(S,allTopics());newSession("pretest",l,{});begin();break}
   case"lp":{var l2=core.buildLastPass(S,Q,0);newSession("lastpass",l2,{});begin();break}
   case"lp20":{var l3=core.buildLastPass(S,Q,20);newSession("lastpass",l3,{});begin();break}
   case"allt":ui.topics=allTopics();render();break;
   case"nonet":ui.topics=[];render();break;
   case"topic":{var i=ui.topics.indexOf(v);if(el.checked&&i<0)ui.topics.push(v);if(!el.checked&&i>=0)ui.topics.splice(i,1);ui.note="";render();break}
   case"filt":ui.filt[v]=el.checked;ui.note="";render();break;
   case"overlap":ui.overlap=el.checked;render();break;
   case"len":ui.len=v;render();break;
   case"think":S.think=el.checked;saveLocal();render();break;
   case"start":ui.note="";if(!ui.topics.length){ui.note="Tick at least one topic.";render();break}startFromSetup();break;
   case"reset":if(!ui.resetArm){ui.resetArm=true;render()}else{var st=S.stars;S=fresh();S.stars=st;S.u=now();saveLocal();syncPush(true);ui.resetArm=false;ui.screen="home";render()}break;
   case"pick":{var q=cur(),it=item(q);if(it.ch)break;it.sel=+v;saveLocal();render();break}
   case"tog":{var q2=cur(),it2=item(q2);if(it2.ch)break;it2.sel=it2.sel||[];var p=it2.sel.indexOf(+v);p>=0?it2.sel.splice(p,1):it2.sel.push(+v);saveLocal();render();break}
   case"up":case"dn":{var q3=cur(),it3=item(q3);if(it3.ch)break;var a=+v,b=act==="up"?a-1:a+1;if(b<0||b>=it3.o.length)break;var t=it3.o[a];it3.o[a]=it3.o[b];it3.o[b]=t;saveLocal();render();break}
   case"check":check();break;
   case"next":nextQ();break;
   case"guess":{var q4=cur(),r=S.q[q4.id];if(r){r.g=true;r.rs=0;item(q4).g=true;saveLocal();syncPush();render()}break}
   case"star":{var q5=cur(),cs=core.starred(S,q5.id);S.stars[q5.id]={s:!cs,t:now()};saveLocal();syncPush();render();break}
   case"timer":S.think=!S.think;saveLocal();if(!S.think){clearInterval(ui.thinkTimer);ui.think=false}render();break;
   case"showch":{clearInterval(ui.thinkTimer);ui.think=false;var q6=cur();item(q6).seen=true;render();break}
   case"submit":ui.screen=S.session.mode==="pretest"?"stopre":"submit";render();window.scrollTo(0,0);break;
   case"keep":ui.screen="q";render();break;
   case"subnow":case"stopnow":finish();break;
   case"review":ui.screen="review";render();window.scrollTo(0,0);break;
   case"backq":ui.screen="q";render();break;
   case"again":{ui.screen="home";render();startFromSetup();break}
   case"cardok":{var q7=cur();item(q7).cardSeen=true;saveLocal();render();break}
   case"fixgo":ui.screen="fix";render();window.scrollTo(0,0);break;
   case"fixone":startFix([v]);break;
   case"fixall":{var ks={};Q.filter(function(x){return core.status(S,x)==="shaky"&&x.k}).forEach(function(x){ks[x.k]=1});startFix(Object.keys(ks));break}
   case"drillmiss":ui.screen="home";ui.filt={missed:true,starred:false,lp:false,never:false};render();break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target;if(el.getAttribute("data-act")==="blank"){var q=cur(),it=item(q);if(it.ch)return;it.sel[+el.getAttribute("data-b")]=+el.value;saveLocal();render();return}
  if(el.id==="cust"){ui.custom=+el.value;document.getElementById("desc").textContent=describe()}
});
document.addEventListener("input",function(e){if(e.target.id==="cust"){ui.custom=+e.target.value}});
document.addEventListener("keydown",function(e){
  if(ui.screen!=="q"||!S.session||e.target.tagName==="SELECT"||e.target.tagName==="INPUT")return;
  var q=cur();if(!q)return;var it=item(q);
  if(/^[1-6]$/.test(e.key)&&!it.ch&&!ui.think){var n=+e.key-1;
    if(q.ty==="mc"&&it.o[n]!=null){it.sel=it.o[n];saveLocal();render()}
    else if(q.ty==="tf"&&n<2){it.sel=n;saveLocal();render()}
    else if(q.ty==="sata"&&it.o[n]!=null){it.sel=it.sel||[];var oi=it.o[n],p=it.sel.indexOf(oi);p>=0?it.sel.splice(p,1):it.sel.push(oi);saveLocal();render()}}
  else if(e.key==="Enter"){e.preventDefault();if(ui.think){ui.think=false;clearInterval(ui.thinkTimer);it.seen=true;render()}else if(!it.ch)check();else nextQ()}
  else if(e.key==="s"||e.key==="S"){var cs=core.starred(S,q.id);S.stars[q.id]={s:!cs,t:now()};saveLocal();render()}
  else if((e.key==="g"||e.key==="G")&&it.ch&&it.ok){var r=S.q[q.id];if(r){r.g=true;r.rs=0;it.g=true;saveLocal();render()}}
});

render();syncInit();
window.__drill={S:function(){return S},core:core,Q:Q};
})();
</script>
