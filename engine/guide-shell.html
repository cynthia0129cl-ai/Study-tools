<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#fff;--fg:#111;--mut:#555;--line:#d9d9d9;--soft:#f5f5f5;--ok:#1a7f37;--okbg:#e9f6ec;--bad:#c62828;--press:#e6e6e6}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
*{box-sizing:border-box;touch-action:manipulation}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.2;text-wrap:balance}
h1{font-size:1.7rem;margin:.2em 0}h2{font-size:1.3rem;margin:0 0 .3em}h3{font-size:1.05rem;margin:1.1em 0 .3em}
.wrap{max-width:760px;margin:0 auto;padding-bottom:70px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20;border-bottom:1px solid var(--line);padding:8px 0}
.hrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.btn{font:inherit;border:1px solid var(--fg);background:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer;min-height:40px;color:var(--fg)}
.btn:active{background:var(--press)}
@media (hover:hover){.btn:hover{background:var(--soft)}}
.btn.on{background:var(--fg);color:var(--bg)}
.unit{margin-top:30px;border-top:2px solid var(--fg);padding-top:6px}
.unit h2{font-size:1.5rem}
section.sec{border:1px solid var(--line);border-radius:10px;padding:14px 14px 4px;margin:16px 0;scroll-margin-top:calc(120px + env(safe-area-inset-top,0px))}
section.sec:target{border-color:var(--fg);box-shadow:0 0 0 2px var(--fg)}
.lab{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:12px 0 2px}
ul{margin:.2em 0 .6em 1.1em;padding:0}
.trap{border-left:3px solid var(--bad);padding:2px 10px;background:#fdf3f2;border-radius:0 8px 8px 0}
.mem{border-left:3px solid var(--fg);padding:2px 10px;background:var(--soft);border-radius:0 8px 8px 0}
.key{border:2px solid var(--ok);border-radius:10px;padding:6px 12px;margin:14px 0 12px;background:var(--okbg)}
.key b.t{color:var(--ok)}
.blk{font:inherit;border:0;border-bottom:2px dashed var(--fg);background:#fafafa;padding:0 6px;cursor:pointer;color:transparent;min-width:3em;border-radius:3px}
.blk.open{color:var(--ok);font-weight:700;background:var(--okbg);border-bottom-color:var(--ok)}
.blk:active{background:var(--press)}
nav.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
nav.toc a{color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;text-decoration:none}
nav.toc a:active{background:var(--press)}
.small{font-size:.85rem;color:var(--mut)}
.readme h3{margin-top:1.2em}
#readme{display:none}
</style>
<div class="wrap">
<header class="top"><div class="hrow"><div><div class="eyebrow">__EYEBROW__</div><b style="font-family:Georgia,serif">Mastery Study Guide</b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn on" id="tg">Guide</button><button class="btn" id="tr">Read me</button><a class="btn" style="text-decoration:none" href="__DRILL_URL__" target="_blank" rel="noopener">Open the drill</a></div></div></header>
<div id="guide">
<h1>__TITLE__</h1>
<p class="small">__SUB__ Say each answer aloud before you tap a blank.</p>
<nav class="toc">__TOC__</nav>
__BODY__
</div>
<div id="readme" class="readme">__README__</div>
</div>
<script>
(function(){
function show(g){document.getElementById("guide").style.display=g?"":"none";document.getElementById("readme").style.display=g?"none":"block";document.getElementById("tg").className="btn"+(g?" on":"");document.getElementById("tr").className="btn"+(g?"":" on");window.scrollTo(0,0)}
document.getElementById("tg").onclick=function(){show(true)};document.getElementById("tr").onclick=function(){show(false)};
document.addEventListener("click",function(e){var b=e.target.closest(".blk");if(b)b.classList.toggle("open")});
function hashGo(){var h=location.hash.slice(1);if(h==="readme")show(false);else if(h){show(true);var el=document.getElementById(h);if(el)setTimeout(function(){el.scrollIntoView({block:"start"})},30)}}
window.addEventListener("hashchange",hashGo);hashGo();
})();
</script>
