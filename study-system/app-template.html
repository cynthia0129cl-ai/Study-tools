<style>

.btn.pri{background:var(--acc);color:var(--acc-ink)}.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:500}.btn.sm{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn:active{background:var(--press)}.btn.pri:active{filter:brightness(.9)}.btn[disabled]{opacity:.45;cursor:default}

.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{margin-top:5px;width:18px;height:18px}.task.done .tl{text-decoration:line-through;color:var(--mut)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}

<script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("bank").textContent);
var M=B.meta,KEY=M.key;
var LET="ABCDEF";
function $(s,r){return(r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
var CH={};B.chapters.forEach(function(c){CH[c.id]=c});
var TP={};B.topics.forEach(function(t){TP[t.id]=t});
var BYID={};B.Q.forEach(function(q){BYID[q.id]=q});

/* ---------------- progress state ---------------- */
function fresh(){return{v:1,a:{},rel:{},added:{qs:[],pearls:{}},plan:{},sims:[],opts:{gen:true,sata:"pm1"},seeded:false,u:0}}
var P=fresh(),MODE="file";
function loadLocal(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);P=Object.assign(fresh(),o);P.opts=Object.assign({gen:true,sata:"pm1"},P.opts||{});P.added=P.added||{qs:[],pearls:{}}}}catch(e){}}
loadLocal();
function seed(){if(P.seeded)return;P.seeded=true;(B.reviewFirst||[]).forEach(function(id){if(!P.a[id])P.a[id]={n:1,r:0,w:1,last:"w",t:1,fr:0,seed:1}})}
seed();
function allQ(){var out=[];B.Q.forEach(function(q){if(!q.rs||P.rel[q.id])out.push(q)});(P.added.qs||[]).forEach(function(q){out.push(q)});return out}
function qById(id){return BYID[id]||(P.added.qs||[]).filter(function(q){return q.id===id})[0]}
function st(q){return P.a[q.id]||{n:0,r:0,w:0}}
function isMissed(q){var s=P.a[q.id];return !!(s&&s.n&&s.last&&s.last!=="r")}
function isFlag(q){var s=P.a[q.id];return !!(s&&s.fl)}
function isNew(q){var s=P.a[q.id];return !s||!s.n}
function acc(list){var n=0,r=0;list.forEach(function(q){var s=P.a[q.id];if(s&&s.n){n+=s.n;r+=s.r}});return n?r/n:null}

/* ---------------- saving: account (artifact) or this browser ---------------- */
var DEV=Math.random().toString(36).slice(2,8),SY={db:null,doc:null,ok:false,t:null,last:0,at:0};
function setSave(){var e=$("#save");if(!e)return;e.innerHTML=SY.ok?'<b>Saved to your account</b>':(MODE==="artifact"?"Saving to your account…":"Saved in this browser")}
function mergeP(a,b){var id;
 for(id in b.a||{}){var x=a.a[id],y=b.a[id];if(!x||(y.t||0)>(x.t||0)){var fl=x&&x.fl;a.a[id]=y;if(x&&(x.fl!==y.fl)&&(x.ft||0)>(y.ft||0))a.a[id].fl=x.fl,a.a[id].ft=x.ft}else if(y.ft&&(y.ft>(x.ft||0))){x.fl=y.fl;x.ft=y.ft}}
 for(id in b.rel||{})a.rel[id]=Math.min(a.rel[id]||1e15,b.rel[id]);
 for(id in b.plan||{})a.plan[id]=Math.max(a.plan[id]||0,b.plan[id]);
 var ids={};(a.added.qs||[]).forEach(function(q){ids[q.id]=1});(b.added&&b.added.qs||[]).forEach(function(q){if(!ids[q.id])a.added.qs.push(q)});
 for(var c in (b.added&&b.added.pearls)||{}){a.added.pearls[c]=a.added.pearls[c]||[];b.added.pearls[c].forEach(function(p){if(a.added.pearls[c].indexOf(p)<0)a.added.pearls[c].push(p)})}
 var have={};a.sims.forEach(function(s){have[s.ts]=1});(b.sims||[]).forEach(function(s){if(!have[s.ts])a.sims.push(s)});
 if((b.u||0)>(a.u||0)){a.opts=Object.assign(a.opts,b.opts||{})}
 if((b.resetAt||0)>(a.resetAt||0)){}
 return a}
function save(){P.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}pushSoon();setSave()}
function pushSoon(now){if(!SY.doc)return;clearTimeout(SY.t);var go=function(){SY.last=Date.now();try{SY.doc.set({dev:DEV,u:SY.last,s:JSON.stringify(P)}).then(function(){SY.ok=true;setSave()},function(){SY.ok=false;setSave()})}catch(e){}};if(now)go();else SY.t=setTimeout(go,1000)}
function syncInit(){
 if(!window.claude||!window.claude.use)return;MODE="artifact";setSave();
 Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
  if(!r[0]||!r[1]){MODE="file";setSave();return}
  return r[1].id().then(function(id){if(!id){MODE="file";setSave();return}
   SY.db=r[0];SY.doc=SY.db.doc("data/users/"+id+"/"+KEY);
   return SY.doc.get().then(function(sn){if(sn.exists){var d=sn.data();if(d&&d.s){try{mergeP(P,JSON.parse(d.s))}catch(e){}}}
    try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}pushSoon(true);
    SY.doc.onSnapshot(function(s2){var d=s2.data();if(!d||d.dev===DEV||!d.s||s2.metadata.hasPendingWrites||(d.u||0)<=SY.last)return;try{mergeP(P,JSON.parse(d.s));try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}if(!RUN)render()}catch(e){}},function(){});
    route()})})}).catch(function(){MODE="file";setSave()})}
window.addEventListener("storage",function(e){if(e.key===KEY&&e.newValue){try{mergeP(P,JSON.parse(e.newValue));if(!RUN)render()}catch(x){}}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")pushSoon(true)});
window.addEventListener("pagehide",function(){pushSoon(true)});

/* ---------------- grading ---------------- */
function parseNum(s){var t=String(s==null?"":s).trim().toLowerCase().replace(/,/g,"").replace(/\s*[a-z][a-z\s\/.]*$/,"").trim();
 var m=t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]+ +m[2]/ +m[3];
 m=t.match(/^(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]/ +m[2];
 if(/^-?\d*\.?\d+$/.test(t))return parseFloat(t);return NaN}
function numWarn(s){s=String(s||"").trim();var w=[];if(/^\.\d/.test(s))w.push("Write a leading zero (0"+s.split(/\s/)[0]+", not "+s.split(/\s/)[0]+").");if(/^\d+\.\d*0(\s|$|[a-z])/i.test(s)&&!/^\d+\.0*$/.test("x"))if(/\.\d*0(\s|$|[a-z])/i.test(s))w.push("Do not add a trailing zero (write "+parseFloat(s)+", not "+s.split(/\s/)[0]+").");return w}
function grade(q,r,mode){
 var ok=false,fr=0,rr=0,ww=0,n=0;
 if(q.ty==="mc"||q.ty==="tf"){ok=r===q.c;fr=ok?1:0}
 else if(q.ty==="sata"){n=q.c.length;(r||[]).forEach(function(i){q.c.indexOf(i)>=0?rr++:ww++});ok=rr===n&&ww===0;fr=mode==="aon"?(ok?1:0):Math.max(0,rr-ww)/n}
 else if(q.ty==="order"){ok=(r||[]).every(function(v,i){return v===i})&&r&&r.length===q.o.length;fr=ok?1:0}
 else if(q.ty==="num"){var v=parseNum(r);ok=!isNaN(v)&&Math.abs(v-q.c.answer)<=1e-6*Math.max(1,Math.abs(q.c.answer));fr=ok?1:0}
 else{ok=(r||[]).length===q.c.length&&(r||[]).every(function(v,i){return v===q.c[i]});fr=ok?1:0}
 return{ok:ok,fr:fr,rr:rr,ww:ww,n:n}}

/* ---------------- sessions ---------------- */
var RUN=null; /* {mode:'practice'|'sata'|'exam'|'review', ids, i, resp, sub, ord, res, flags, title, t0, limit, done} */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startRun(mode,ids,title,extra){RUN=Object.assign({mode:mode,ids:ids,i:0,resp:{},sub:{},ord:{},res:{},flags:{},title:title,t0:Date.now(),done:false,note:""},extra||{});window.scrollTo(0,0);location.hash="#run";render();if(mode==="exam")startClock()}
function cur(){return qById(RUN.ids[RUN.i])}
function ensureOrd(q){if(RUN.ord[q.id])return RUN.ord[q.id];var o;
 if(q.ty==="mc"||q.ty==="sata")o=shuffle(q.o.map(function(_,i){return i}));
 else if(q.ty==="tf")o=[0,1];
 else if(q.ty==="order"){do{o=shuffle(q.o.map(function(_,i){return i}))}while(o.length>1&&o.every(function(v,i){return v===i}));}
 else if(q.ty==="blanks"||q.ty==="cloze")o=q.o.map(function(ch){return shuffle(ch.map(function(_,i){return i}))});
 else if(q.ty==="match")o=q.rows.map(function(){return shuffle(q.o.map(function(_,i){return i}))});
 else o=null;
 RUN.ord[q.id]=o;
 if(q.ty==="order"&&RUN.resp[q.id]===undefined)RUN.resp[q.id]=o.slice();
 if((q.ty==="blanks"||q.ty==="cloze")&&RUN.resp[q.id]===undefined)RUN.resp[q.id]=q.o.map(function(){return -1});
 if(q.ty==="match"&&RUN.resp[q.id]===undefined)RUN.resp[q.id]=q.rows.map(function(){return -1});
 return o}
function answered(q){var r=RUN.resp[q.id];if(r===undefined||r===null)return false;if(q.ty==="sata")return r.length>0;if(q.ty==="num")return String(r).trim()!=="";if(q.ty==="order")return true;if(q.ty==="blanks"||q.ty==="cloze"||q.ty==="match")return r.every(function(v){return v>=0});return true}
function record(q,g){var s=P.a[q.id]||(P.a[q.id]={n:0,r:0,w:0});s.n++;s.t=Date.now();s.fr=g.fr;if(g.ok){s.r++;s.last="r"}else{s.w++;s.last=g.fr>0?"p":"w"}delete s.seed;P.a[q.id]=s}
function submitQ(q,mode){if(RUN.sub[q.id])return;var g=grade(q,RUN.resp[q.id],P.opts.sata);RUN.sub[q.id]=1;RUN.res[q.id]=g;record(q,g);
 if(!g.ok&&P.opts.gen&&RUN.mode!=="exam")releaseFor(q);save()}
/* each miss writes two new questions on the same concept (one SATA) */
function releaseFor(q){if(!q.cn)return;var pool=B.Q.filter(function(x){return x.rs&&x.cn===q.cn&&!P.rel[x.id]});if(!pool.length){RUN.note="No more new angles are waiting for this idea.";return}
 var s=pool.filter(function(x){return x.ty==="sata"})[0],o=pool.filter(function(x){return x.ty!=="sata"})[0],pick=[];if(s)pick.push(s);if(o)pick.push(o);if(!pick.length)pick=pool.slice(0,2);
 var put=0;pick.forEach(function(x){P.rel[x.id]=Date.now();var okHere=RUN.mode==="exam"||RUN.done?false:RUN.mode==="sata"?(x.ty==="sata"||x.ty==="match"):true;if(okHere){var pos=Math.min(RUN.ids.length,RUN.i+2+put);RUN.ids.splice(pos,0,x.id);put++}});
 RUN.note=put?("2 new questions on this idea were added to your set"+(put<pick.length?" (one more is waiting in Review & Retry)":"")+"."):"2 new questions on this idea are waiting in Review & Retry.";
 if(RUN.mode==="exam")RUN.note=""}
function finishRun(){RUN.done=true;clearInterval(RUN.clock);if(RUN.mode==="exam"){RUN.ids.slice().forEach(function(id){var q=qById(id);if(!RUN.sub[id]){RUN.sub[id]=1;var g=grade(q,RUN.resp[id],P.opts.sata);RUN.res[id]=g;record(q,g);if(!g.ok&&P.opts.gen)releaseFor(q)}});
  var bych={},byt={},sc=0;RUN.ids.forEach(function(id){var q=qById(id),g=RUN.res[id];sc+=g.fr;[[bych,q.ch],[byt,q.t]].forEach(function(p){var o=p[0][p[1]]||(p[0][p[1]]={n:0,s:0});o.n++;o.s+=g.fr})});
  P.sims.push({ts:Date.now(),n:RUN.ids.length,score:Math.round(100*sc/RUN.ids.length),bych:bych,byt:byt})}
 save();render()}
function startClock(){clearInterval(RUN.clock);RUN.clock=setInterval(function(){var left=RUN.limit*60-Math.floor((Date.now()-RUN.t0)/1000);var e=$("#clk");if(e){e.textContent=Math.floor(Math.max(0,left)/60)+":"+String(Math.max(0,left)%60).padStart(2,"0");e.className="timer"+(left<300?" low":"")}if(left<=0){finishRun()}},1000)}

/* ---------------- pool filters ---------------- */
var F={ch:null,tp:null,ty:{mc:1,sata:1,tf:1,match:1,blanks:1,order:1,num:1},focus:"all",count:20,sataCh:null,sataFocus:"all",sataCount:15,simN:60};
function initF(){if(!F.ch)F.ch=B.chapters.map(function(c){return c.id});if(!F.tp)F.tp=B.topics.map(function(t){return t.id});if(!F.sataCh)F.sataCh=B.chapters.map(function(c){return c.id})}
function tyKey(q){return q.ty==="cloze"?"blanks":q.ty}
function focusOK(q,f){if(f==="all")return true;if(f==="new")return isNew(q);if(f==="missed")return isMissed(q);if(f==="flagged")return isFlag(q);if(f==="hy")return !!(q.lp||q.src==="quiz");return true}

function weightedSim(n){var pool=allQ().filter(function(q){return q.ty!=="num"||true});var w=B.topics.map(function(t){return{t:t.id,w:t.exam||3}});var tot=w.reduce(function(a,b){return a+b.w},0),ids=[],used={};
 w.forEach(function(x){x.k=Math.max(0,Math.round(n*x.w/tot))});
 w.forEach(function(x){var l=shuffle(pool.filter(function(q){return q.t===x.t&&!used[q.id]})).sort(function(a,b){return(isNew(b)?1:0)-(isNew(a)?1:0)});l.slice(0,x.k).forEach(function(q){used[q.id]=1;ids.push(q.id)})});
 var rest=shuffle(pool.filter(function(q){return !used[q.id]}));while(ids.length<n&&rest.length){var q=rest.pop();used[q.id]=1;ids.push(q.id)}
 return shuffle(ids).slice(0,n)}
