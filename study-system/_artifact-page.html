function numWarn(s){s=String(s||"").trim();var w=[];if(/^\.\d/.test(s))w.push("Write a leading zero (0"+s.split(/\s/)[0]+", not "+s.split(/\s/)[0]+").");if(/^\d+\.\d*0(\s|$|[a-z])/i.test(s)&&!/^\d+\.0*$/.test("x"))if(/\.\d*0(\s|$|[a-z])/i.test(s))w.push("Do not add a trailing zero (write "+parseFloat(s)+", not "+s.split(/\s/)[0]+").");return w}
function grade(q,r,mode){
 var ok=false,fr=0,rr=0,ww=0,n=0;
 if(q.ty==="mc"||q.ty==="tf"){ok=r===q.c;fr=ok?1:0}
 else if(q.ty==="sata"){n=q.c.length;(r||[]).forEach(function(i){q.c.indexOf(i)>=0?rr++:ww++});ok=rr===n&&ww===0;fr=mode==="aon"?(ok?1:0):Math.max(0,rr-ww)/n}
 else if(q.ty==="order"){ok=(r||[]).every(function(v,i){return v===i})&&r&&r.length===q.o.length;fr=ok?1:0}
 else if(q.ty==="num"){var v=parseNum(r);ok=!isNaN(v)&&Math.abs(v-q.c.answer)<=1e-6*Math.max(1,Math.abs(q.c.answer));fr=ok?1:0}
 else{ok=(r||[]).length===q.c.length&&(r||[]).every(function(v,i){return v===q.c[i]});fr=ok?1:0}
 return{ok:ok,fr:fr,rr:rr,ww:ww,n:n}}

/* ---------------- sessions ---------------- */
var RUN=null; /* {mode:'practice'|'sata'|'exam'|'review', ids, i, resp, sub, ord, res, flags, title, t0, limit, done} */
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function startRun(mode,ids,title,extra){RUN=Object.assign({mode:mode,ids:ids,i:0,resp:{},sub:{},ord:{},res:{},flags:{},title:title,t0:Date.now(),done:false,note:""},extra||{});window.scrollTo(0,0);location.hash="#run";render();if(mode==="exam")startClock()}
function cur(){return qById(RUN.ids[RUN.i])}
function ensureOrd(q){if(RUN.ord[q.id])return RUN.ord[q.id];var o;
 if(q.ty==="mc"||q.ty==="sata")o=shuffle(q.o.map(function(_,i){return i}));
 else if(q.ty==="tf")o=[0,1];
 else if(q.ty==="order"){do{o=shuffle(q.o.map(function(_,i){return i}))}while(o.length>1&&o.every(function(v,i){return v===i}));}
 else if(q.ty==="blanks"||q.ty==="cloze")o=q.o.map(function(ch){return shuffle(ch.map(function(_,i){return i}))});
 else if(q.ty==="match")o=q.rows.map(function(){return shuffle(q.o.map(function(_,i){return i}))});
 else o=null;
 RUN.ord[q.id]=o;
 if(q.ty==="order"&&RUN.resp[q.id]===undefined)RUN.resp[q.id]=o.slice();
 if((q.ty==="blanks"||q.ty==="cloze")&&RUN.resp[q.id]===undefined)RUN.resp[q.id]=q.o.map(function(){return -1});
 if(q.ty==="match"&&RUN.resp[q.id]===undefined)RUN.resp[q.id]=q.rows.map(function(){return -1});
 return o}
function answered(q){var r=RUN.resp[q.id];if(r===undefined||r===null)return false;if(q.ty==="sata")return r.length>0;if(q.ty==="num")return String(r).trim()!=="";if(q.ty==="order")return true;if(q.ty==="blanks"||q.ty==="cloze"||q.ty==="match")return r.every(function(v){return v>=0});return true}
function record(q,g){var s=P.a[q.id]||(P.a[q.id]={n:0,r:0,w:0});s.n++;s.t=Date.now();s.fr=g.fr;if(g.ok){s.r++;s.last="r"}else{s.w++;s.last=g.fr>0?"p":"w"}delete s.seed;P.a[q.id]=s}
function submitQ(q,mode){if(RUN.sub[q.id])return;var g=grade(q,RUN.resp[q.id],P.opts.sata);RUN.sub[q.id]=1;RUN.res[q.id]=g;record(q,g);
 if(!g.ok&&P.opts.gen&&RUN.mode!=="exam")releaseFor(q);save()}
/* each miss writes two new questions on the same concept (one SATA) */
function releaseFor(q){if(!q.cn)return;var pool=B.Q.filter(function(x){return x.rs&&x.cn===q.cn&&!P.rel[x.id]});if(!pool.length){RUN.note="No more new angles are waiting for this idea.";return}
 var s=pool.filter(function(x){return x.ty==="sata"})[0],o=pool.filter(function(x){return x.ty!=="sata"})[0],pick=[];if(s)pick.push(s);if(o)pick.push(o);if(!pick.length)pick=pool.slice(0,2);
 var put=0;pick.forEach(function(x){P.rel[x.id]=Date.now();var okHere=RUN.mode==="exam"||RUN.done?false:RUN.mode==="sata"?(x.ty==="sata"||x.ty==="match"):true;if(okHere){var pos=Math.min(RUN.ids.length,RUN.i+2+put);RUN.ids.splice(pos,0,x.id);put++}});
 RUN.note=put?("2 new questions on this idea were added to your set"+(put<pick.length?" (one more is waiting in Review & Retry)":"")+"."):"2 new questions on this idea are waiting in Review & Retry.";
 if(RUN.mode==="exam")RUN.note=""}
function finishRun(){RUN.done=true;clearInterval(RUN.clock);if(RUN.mode==="exam"){RUN.ids.slice().forEach(function(id){var q=qById(id);if(!RUN.sub[id]){RUN.sub[id]=1;var g=grade(q,RUN.resp[id],P.opts.sata);RUN.res[id]=g;record(q,g);if(!g.ok&&P.opts.gen)releaseFor(q)}});
  var bych={},byt={},sc=0;RUN.ids.forEach(function(id){var q=qById(id),g=RUN.res[id];sc+=g.fr;[[bych,q.ch],[byt,q.t]].forEach(function(p){var o=p[0][p[1]]||(p[0][p[1]]={n:0,s:0});o.n++;o.s+=g.fr})});
  P.sims.push({ts:Date.now(),n:RUN.ids.length,score:Math.round(100*sc/RUN.ids.length),bych:bych,byt:byt})}
 save();render()}
function startClock(){clearInterval(RUN.clock);RUN.clock=setInterval(function(){var left=RUN.limit*60-Math.floor((Date.now()-RUN.t0)/1000);var e=$("#clk");if(e){e.textContent=Math.floor(Math.max(0,left)/60)+":"+String(Math.max(0,left)%60).padStart(2,"0");e.className="timer"+(left<300?" low":"")}if(left<=0){finishRun()}},1000)}

/* ---------------- pool filters ---------------- */
var F={ch:null,tp:null,ty:{mc:1,sata:1,tf:1,match:1,blanks:1,order:1,num:1},focus:"all",count:20,sataCh:null,sataFocus:"all",sataCount:15,simN:60};
function initF(){if(!F.ch)F.ch=B.chapters.map(function(c){return c.id});if(!F.tp)F.tp=B.topics.map(function(t){return t.id});if(!F.sataCh)F.sataCh=B.chapters.map(function(c){return c.id})}
function tyKey(q){return q.ty==="cloze"?"blanks":q.ty}
function focusOK(q,f){if(f==="all")return true;if(f==="new")return isNew(q);if(f==="missed")return isMissed(q);if(f==="flagged")return isFlag(q);if(f==="hy")return !!(q.lp||q.src==="quiz");return true}
function poolFor(o){return allQ().filter(function(q){return(!o.ch||o.ch.indexOf(q.ch)>=0)&&(!o.tp||o.tp.indexOf(q.t)>=0||q.t==="added")&&(!o.ty||o.ty[tyKey(q)])&&focusOK(q,o.focus||"all")})}
function setFor(spec){ /* spec: {ch,tp,focus,count,types,ids} used by plan tasks and drill buttons */
 var ids;if(spec.ids)ids=spec.ids.filter(function(id){return qById(id)});
 else{var list=poolFor({ch:spec.ch,tp:spec.tp,focus:spec.focus||"all",ty:spec.ty||null});ids=shuffle(list.map(function(q){return q.id}))}
 if(spec.focus==="all"||!spec.focus)ids=ids.sort(function(a,b){var qa=qById(a),qb=qById(b);return(isNew(qb)?1:0)-(isNew(qa)?1:0)||(isMissed(qb)?1:0)-(isMissed(qa)?1:0)});
 return ids.slice(0,spec.count||ids.length)}

/* ---------------- views ---------------- */
var TABS=[["dash","Dashboard"],["practice","Practice"],["sata","SATA Lab"],["exam","Exam Simulator"],["review","Review & Retry"],["pearls","High-Yield Pearls"],["plan","Study Plan"],["add","Add Materials"],["data","Data"]];
var PAGE="dash";
function route(){var h=(location.hash||"#dash").slice(1);if(h==="run"&&RUN){PAGE="run"}else{if(h==="run")h="dash";PAGE=TABS.some(function(t){return t[0]===h})?h:"dash";if(PAGE!=="run"&&RUN&&!RUN.done&&RUN.mode==="exam"){}}render()}
window.addEventListener("hashchange",route);
function render(){initF();var t=$("#tabs");t.innerHTML=TABS.map(function(x){return'<button class="'+((PAGE===x[0])?"on":"")+'" data-go="'+x[0]+'">'+x[1]+"</button>"}).join("");
 var h;if(PAGE==="run"&&RUN)h=runView();else if(PAGE==="dash")h=dash();else if(PAGE==="practice")h=practice();else if(PAGE==="sata")h=sataLab();else if(PAGE==="exam")h=examSetup();else if(PAGE==="review")h=reviewPage();else if(PAGE==="pearls")h=pearls();else if(PAGE==="plan")h=planPage();else if(PAGE==="add")h=addPage();else h=dataPage();
 $("#app").innerHTML=h;setSave()}

function dayNum(d){return Math.round((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/864e5)}
function dash(){
 var all=allQ(),ex=new Date(M.examDate+"T00:00:00"),ms=ex-new Date(),days=Math.floor(ms/864e5),hrs=Math.floor((ms%864e5)/36e5);
 var tot=0,rt=0,ans=0;all.forEach(function(q){var s=P.a[q.id];if(s&&s.n){tot+=s.n;rt+=s.r;ans++}});
 var missed=all.filter(isMissed).length,flagged=all.filter(isFlag).length;
 var h='<div class="card"><div class="row" style="justify-content:space-between"><div><div class="small">'+esc(M.examLabel)+'</div>'+(ms>0?'<div class="big">'+days+' day'+(days===1?"":"s")+', '+hrs+' h</div><div class="small">until exam day</div>':'<div class="big">Exam day has passed</div>')+'</div><div><button class="btn pri" data-go="exam">Take a timed practice exam</button></div></div></div>';
 h+='<div class="grid"><div class="card stat"><div class="n">'+(tot?Math.round(100*rt/tot):"–")+(tot?"%":"")+'</div><div class="l">Accuracy over '+tot+' answers</div></div><div class="card stat"><div class="n">'+missed+'</div><div class="l">Missed, waiting to be fixed</div><button class="btn sm" data-act="runmissed" '+(missed?"":"disabled")+'>Retry missed</button></div><div class="card stat"><div class="n">'+ans+' / '+all.length+'</div><div class="l">Questions tried</div></div><div class="card stat"><div class="n">'+flagged+'</div><div class="l">Flagged for review</div></div></div>';
 /* weakest topics */
 var rows=B.topics.map(function(t){var l=all.filter(function(q){return q.t===t.id});var n=0,r=0;l.forEach(function(q){var s=P.a[q.id];if(s&&s.n){n+=s.n;r+=s.r}});return{t:t,n:n,a:n?r/n:null,q:l.length}}).filter(function(x){return x.n>=2}).sort(function(a,b){return a.a-b.a}).slice(0,4);

 if(name.endsWith(".pdf")){if(!window.pdfjsLib)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";var pdf=await window.pdfjsLib.getDocument({data:ab}).promise,out=[];for(var p=1;p<=pdf.numPages;p++){var pg=await pdf.getPage(p),tc=await pg.getTextContent();out.push(tc.items.map(function(i){return i.str}).join(" "))}return out.join("\n")}
 if(!window.JSZip)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");var z=await window.JSZip.loadAsync(ab),parts=[];

 return 'You write NCLEX-style nursing exam questions for the chapter "'+ch+'".\n'+src+'\nUse ONLY the text below. Do not add outside facts.\nStyle: a short realistic client scenario; priority, first-action and teaching stems. Multiple choice has exactly 4 options. Select-all (sata) has 5 or 6 long, complete-sentence options of similar length; some wrong options are mostly true with one wrong detail; vary the number of correct options (2 to 4).\nWrite '+n+' questions and 3 short pearls (must-know facts).\nReturn ONLY JSON: {"questions":[{"type":"mc"|"sata","topic":"short topic","stem":"...","options":[{"text":"...","correct":true|false,"why":"one short sentence"}],"takeaway":"one line","note":"optional flag if the sources disagree"}],"pearls":["..."]}\n\nTEXT:\n'+chunk}
function normGen(o,ch){var out=[];(o.questions||[]).forEach(function(g,k){try{var opts=g.options||[];if(opts.length<4||!g.stem)return;var cor=[];opts.forEach(function(x,i){if(x.correct)cor.push(i)});if(g.type==="mc"&&cor.length!==1)return;if(g.type==="sata"&&(cor.length<2||opts.length<5))return;if(g.type!=="mc"&&g.type!=="sata")return;
  var x={};opts.forEach(function(p){if(!p.correct)x[p.text]=p.why||""});
  out.push({id:"u-"+Date.now()+"-"+k+"-"+Math.floor(Math.random()*1e4),ch:ch,t:"added",ty:g.type,q:g.stem+(g.type==="sata"?" Select all that apply.":""),o:opts.map(function(p){return p.text}),c:g.type==="mc"?cor[0]:cor,x:x,tk:g.takeaway||"",w:"Written from your uploaded material. ("+(g.topic||"added")+")",cn:null,lp:0,src:"added",note:g.note||""})}catch(e){}});return out}
async function genMaterials(){if(AM.busy)return;var files=$("#amfiles")&&$("#amfiles").files;if(!files||!files.length){AM.log=["Choose at least one file."];render();return}
