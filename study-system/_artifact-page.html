Spontaneous bleeding is possible and platelets are usually transfused","No bleeding precautions are needed","The count is a normal variation","A fatal bleed is not possible at any count"],"c":0,"x":{"No bleeding precautions are needed":"Precautions start below 100,000.","The count is a normal variation":"Normal is 150,000 to 450,000.","A fatal bleed is not possible at any count":"A fatal CNS or GI bleed is possible below 5,000."},"tk":"Below 20,000 spontaneous bleeding occurs and platelets are usually transfused.","w":"Below 20,000 spontaneous bleeding occurs and platelets are usually transfused. Bleeding precautions start below 100,000, and below 5,000 a fatal bleed is possible. (study guide, Ch 33 and Ch 34)","rs":1},{"id":"r030","ty":"sata","ch":"ch2","t":"labs","cn":"c-labs-plt","q":"Which are bleeding precautions for a client with thrombocytopenia? Select all that apply.","o":["Use a soft-bristle toothbrush","Use an electric razor","Avoid IM injections","Give a daily stool softener","Teach the client not to blow the nose","Take rectal temperatures","Encourage vigorous flossing"],"c":[0,1,2,3,4],"x":{"Take rectal temperatures":"Rectal temperatures are avoided.","Encourage vigorous flossing":"Flossing is avoided."},"tk":"Bleeding precautions reduce trauma: soft toothbrush, electric razor, shoes on, a clutter-free room, stool softener, no rectal thermometers, suppositories or enemas, and minimal BP cuff inflation.","w":"Bleeding precautions reduce trauma: soft toothbrush, electric razor, shoes on, a clutter-free room, stool softener, no rectal thermometers, suppositories or enemas, and minimal BP cuff inflation. Direct pressure or ice for 5 minutes stops a cut. (study guide, Ch 34 Box 34.1)","rs":1},{"id":"r031","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"Which instruction about oral iron is correct?","o":["Take it with orange juice and not with milk","Take it with milk to protect the stomach","Take it with an antacid","Take it only when fatigue is severe"],"c":0,"x":{"Take it with milk to protect the stomach":"Dairy blocks iron absorption.","Take it with an antacid":"Antacids reduce iron absorption.","Take it only when fatigue is severe":"Iron is taken daily as prescribed."},"tk":"Vitamin C increases absorption, and class notes add taking iron on an empty stomach.","w":"Vitamin C increases absorption, and class notes add taking iron on an empty stomach. Oral iron can cause nausea, constipation, diarrhea and dark stools. IM iron uses Z-track. (study guide, Ch 34 and class notes)","rs":1},{"id":"r032","ty":"sata","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"Which statements about iron deficiency are correct? Select all that apply.","o":["Ferritin reflects iron stores","Transferrin carries iron","TIBC is high because there are empty binding spots","Oral iron is first-line treatment","Ferritin is high in iron deficiency","Iron deficiency causes macrocytic cells"],"c":[0,1,2,3],"x":{"Ferritin is high in iron deficiency":"Ferritin is low in iron deficiency.","Iron deficiency causes macrocytic cells":"Iron deficiency causes microcytic cells."},"tk":"Ferritin is stored iron, transferrin is the transport protein, and TIBC measures the iron transferrin could carry.","w":"Ferritin is stored iron, transferrin is the transport protein, and TIBC measures the iron transferrin could carry. In iron deficiency stores are empty, so ferritin and saturation are low and TIBC is high. (study guide, Ch 33)","rs":1},{"id":"r033","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-coag","q":"A client is receiving a heparin infusion. Which laboratory test does the nurse use to monitor it?","o":["PTT","PT/INR","Bleeding time","Ferritin"],"c":0,"x":{"PT/INR":"PT/INR monitors warfarin.","Bleeding time":"Bleeding time tests platelet function.","Ferritin":"Ferritin is an iron store test."},"tk":"The intrinsic pathway is monitored by PTT and the drug is heparin.","w":"The intrinsic pathway is monitored by PTT and the drug is heparin. The extrinsic pathway is monitored by PT/INR and the drug is warfarin. Your class notes list PT and PTT together; PTT is the safe answer for heparin. (study guide, Ch 33)","rs":1},{"id":"r034","ty":"sata","ch":"ch2","t":"labs","cn":"c-labs-coag","q":"Which statements about clotting studies are correct? Select all that apply.","o":["PTT monitors heparin","PT/INR monitors warfarin","The warfarin INR goal is 2 to 3","Platelet aggregation is impaired by aspirin","PT monitors heparin","Bleeding time is done when platelets are 50,000"],"c":[0,1,2,3],"x":{"PT monitors heparin":"PT/INR monitors warfarin.","Bleeding time is done when platelets are 50,000":"It is not done if platelets are under 75,000."},"tk":"The two pathways each have a test and a drug.","w":"The two pathways each have a test and a drug. Platelet aggregation is impaired in von Willebrand disease and with aspirin or NSAIDs. (study guide, Ch 33)","rs":1},{"id":"r035","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"Which CBC pattern does the nurse expect in a client with newly diagnosed acute leukemia?","o":["Leukocytosis with anemia and thrombocytopenia","Leukopenia with polycythemia","Normal white cells with high platelets","High hemoglobin with high platelets"],"c":0,"x":{"Leukopenia with polycythemia":"Leukemia causes leukocytosis, and the red cells fall.","Normal white cells with high platelets":"Platelets fall because the marrow is crowded.","High hemoglobin with high platelets":"These rise in polycythemia vera."},"tk":"Blasts crowd the marrow so RBCs and platelets fall while the white count may rise.","w":"Blasts crowd the marrow so RBCs and platelets fall while the white count may rise. Early on the count can look normal because only cells that escape into the blood show up. (study guide, Ch 34)","rs":1},{"id":"r036","ty":"sata","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"Which findings are expected in leukemia? Select all that apply.","o":["Swollen lymph glands","Frequent infections and low-grade fevers","Fatigue and pallor","Bruising and petechiae","Bone pain","Bradycardia and weight gain","Ruddy facial flushing with itching after a bath"],"c":[0,1,2,3,4],"x":{"Bradycardia and weight gain":"Leukemia causes weight loss from high metabolic demand.","Ruddy facial flushing with itching after a bath":"That fits polycythemia vera."},"tk":"Blasts congest nodes and spleen, cause infections and anemia, and crowd out platelets.","w":"Blasts congest nodes and spleen, cause infections and anemia, and crowd out platelets. Bone pain comes from marrow swelling, and weight loss from high metabolism. (study guide, Ch 34)","rs":1},{"id":"r037","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-risk","q":"A client has leukemia with the Philadelphia chromosome in more than 90% of cases. Which type does the nurse recognize?","o":["Chronic myeloid leukemia","Acute lymphoblastic leukemia","Chronic lymphocytic leukemia","Hodgkin lymphoma"],"c":0,"x":{"Acute lymphoblastic leukemia":"ALL is the common childhood type.","Chronic lymphocytic leukemia":"CLL is a chronic lymphoid type.","Hodgkin lymphoma":"Hodgkin lymphoma is a lymph node cancer."},"tk":"The Philadelphia chromosome, a 9;22 swap, is found in more than 90% of CML.","w":"The Philadelphia chromosome, a 9;22 swap, is found in more than 90% of CML. Imatinib targets the Bcr-Abl protein it produces. (study guide, Ch 34)","rs":1},{"id":"r038","ty":"sata","ch":"ch3","t":"leuk","cn":"c-leuk-risk","q":"Which clients are at higher risk for leukemia? Select all that apply.","o":["A child with Down syndrome","A worker with benzene exposure","A client who received radiation","A client who received prior chemotherapy","A client with chronic H. pylori infection","A client with hepatitis B"],"c":[0,1,2,3],"x":{"A client with chronic H. pylori infection":"H. pylori goes with gastric cancer.","A client with hepatitis B":"Hepatitis goes with liver cancer."},"tk":"Down syndrome raises the risk 10 to 30 times, and radiation, benzene and prior chemotherapy damage marrow cells.","w":"Down syndrome raises the risk 10 to 30 times, and radiation, benzene and prior chemotherapy damage marrow cells. Smoking also adds risk. (study guide, Ch 34)","rs":1},{"id":"r039","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"Which therapy uses the client's own T cells, engineered to kill leukemia cells?","o":["CAR-T therapy","Monoclonal antibody therapy","Induction chemotherapy","Radiation to the brain and spine"],"c":0,"x":{"Monoclonal antibody therapy":"Monoclonal antibodies are made proteins, not engineered T cells.","Induction chemotherapy":"Chemotherapy is a drug treatment.","Radiation to the brain and spine":"This treats CNS disease."},"tk":"CAR-T cells are the client's T cells engineered to kill leukemia cells, and the effect is permanent.","w":"CAR-T cells are the client's T cells engineered to kill leukemia cells, and the effect is permanent. Patients may live without B cells. (study guide, Ch 34)","rs":1},{"id":"r040","ty":"sata","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"Which statements about leukemia treatment are correct? Select all that apply.","o":["Chemotherapy is given in induction, consolidation and maintenance phases","Brain and spine radiation treats CNS involvement","Transplant is used for refractory or relapsed disease","Prophylactic antimicrobials are given in neutropenia","Remission means the client is cured","G-CSF is always indicated in leukemia"],"c":[0,1,2,3],"x":{"Remission means the client is cured":"Remission is not a cure.","G-CSF is always indicated in leukemia":"It is generally not indicated, since it may fuel the disease."},"tk":"Therapy includes chemotherapy, targeted drugs, immunotherapy, transplant and supportive blood products.","w":"Therapy includes chemotherapy, targeted drugs, immunotherapy, transplant and supportive blood products. GVHD is a risk of transplant. (study guide, Ch 34)","rs":1},{"id":"r041","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-nursing","q":"A 25-year-old client with leukemia will begin chemotherapy. Which teaching is a priority?","o":["Banking sperm or eggs before therapy because of the sterility risk","Chemotherapy has no effect on fertility","Fertility can be restored by taking vitamins","Fertility is not discussed until after remission"],"c":0,"x":{"Chemotherapy has no effect on fertility":"Sterility is a risk.","Fertility can be restored by taking vitamins":"This is not supported.","Fertility is not discussed until after remission":"Banking must happen before therapy."},"tk":"Teaching covers neutropenic and bleeding precautions, signs of anemia and thrombocytopenia, the disease course, chemotherapy reactions and the sterility risk.","w":"Teaching covers neutropenic and bleeding precautions, signs of anemia and thrombocytopenia, the disease course, chemotherapy reactions and the sterility risk. Offering sperm or egg banking before therapy is a priority. (study guide, Ch 34)","rs":1},{"id":"r042","ty":"sata","ch":"ch3","t":"leuk","cn":"c-leuk-nursing","q":"Which assessments does the nurse make for a client with leukemia? Select all that apply.","o":["Vital signs for fever","Bruising and non-blanching petechiae","CBC and WBC","Signs of anemia such as pallor and dizziness","Rectal temperature","Deep palpation of the spleen"],"c":[0,1,2,3],"x":{"Rectal temperature":"Rectal temperatures are never taken in neutropenia.","Deep palpation of the spleen":"The spleen can rupture with deep palpation."},"tk":"Assessments include fever, anemia signs, bruising and petechiae, and the CBC.","w":"Assessments include fever, anemia signs, bruising and petechiae, and the CBC. Fever may be the first and only sign of infection. (study guide, Ch 34)","rs":1},{"id":"r043","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-def","q":"A client's ANC is 1,200/mm³. Which statement by the nurse is accurate?","o":["The client has neutropenia, and neutropenic precautions are formally started at 500 or below","The client has a normal ANC","The client has thrombocytopenia","The client needs a platelet transfusion"],"c":0,"x":{"The client has a normal ANC":"An ANC below 1,500 is neutropenia.","The client has thrombocytopenia":"ANC counts neutrophils.","The client needs a platelet transfusion":"Platelets are not shown."},"tk":"Neutropenia is an ANC below 1,500, and neutropenic precautions start at 500 or below.","w":"Neutropenia is an ANC below 1,500, and neutropenic precautions start at 500 or below. A temperature of 100.4°F (38°C) or higher needs immediate care. (study guide, Ch 13 and Ch 34)","rs":1},{"id":"r044","ty":"sata","ch":"ch3","t":"neut","cn":"c-neut-def","q":"Which statements about fever in a chemotherapy client are correct? Select all that apply.","o":["A temperature of 100.4°F (38°C) or higher is called in immediately","Fever may be the first and only sign of infection","IV broad-spectrum antibiotics are given immediately","Fever with neutropenia can lead to sepsis","Acetaminophen is given and the client waits to see if the fever settles","A low-grade fever is expected and can be ignored"],"c":[0,1,2,3],"x":{"Acetaminophen is given and the client waits to see if the fever settles":"Waiting delays treatment.","A low-grade fever is expected and can be ignored":"It needs immediate care."},"tk":"Myelosuppression plus fever is treated aggressively to prevent sepsis and shock.","w":"Myelosuppression plus fever is treated aggressively to prevent sepsis and shock. The client checks the temperature daily and calls for more than 100.4°F. (study guide, Ch 13 and Ch 34)","rs":1},{"id":"r045","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"Which item should the nurse remove from the room of a client with neutropenia?","o":["A humidifier or a vase of fresh flowers","A hand sanitizer dispenser","A box of tissues","A call light"],"c":0,"x":{"A hand sanitizer dispenser":"Hand hygiene is a core precaution.","A box of tissues":"Tissues are not a hazard in the precautions.","A call light":"The call light is needed."},"tk":"Live plants, cut flowers and standing water carry bacteria and mold, so they are removed.","w":"Live plants, cut flowers and standing water carry bacteria and mold, so they are removed. Reverse isolation means staff wear PPE to protect the client. (study guide, Ch 34 Box 34.2 and class notes)","rs":1},{"id":"r046","ty":"sata","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"Which actions are consistent with neutropenic precautions? Select all that apply.","o":["A private room","Hand hygiene by everyone","Washing raw fruits and vegetables well","Restricting visitors with communicable diseases","A humidifier at the bedside","A potted plant on the windowsill"],"c":[0,1,2,3],"x":{"A humidifier at the bedside":"No standing water or humidifiers.","A potted plant on the windowsill":"No live plants."},"tk":"Precautions also include avoiding crowds, sick people, small children and pets, no rectal temperatures, suppositories or enemas, and taking prophylactic antimicrobials.","w":"Precautions also include avoiding crowds, sick people, small children and pets, no rectal temperatures, suppositories or enemas, and taking prophylactic antimicrobials. (study guide, Ch 34 Box 34.2)","rs":1},{"id":"r047","ty":"mc","ch":"ch4","t":"hodgkin","cn":"c-hodg-dx","q":"Which finding helps the nurse distinguish a lymphoma node from an infected node?","o":["The lymphoma node is painless, while an infected node is usually more tender","The lymphoma node is hot and tender","The lymphoma node disappears within 48 hours","The lymphoma node causes high fever only"],"c":0,"x":{"The lymphoma node is hot and tender":"Painful nodes suggest infection.","The lymphoma node disappears within 48 hours":"Lymphoma nodes persist.","The lymphoma node causes high fever only":"B symptoms accompany painless nodes."},"tk":"Lymphoma causes painless lymph node swelling.","w":"Lymphoma causes painless lymph node swelling. Malignant nodes are usually less tender than infected ones. B symptoms are fever, drenching night sweats and weight loss. (study guide, Ch 34 and Ch 13)","rs":1},{"id":"r048","ty":"sata","ch":"ch4","t":"hodgkin","cn":"c-hodg-dx","q":"Which tests are used for suspected lymphoma? Select all that apply.","o":["Lymph node biopsy","Uric acid and LDH","Chest x-ray, CT and PET","Bone marrow biopsy if marrow involvement is suspected","Bence Jones protein in the urine","JAK2 gene testing"],"c":[0,1,2,3],"x":{"Bence Jones protein in the urine":"That is a myeloma test.","JAK2 gene testing":"JAK2 testing is for polycythemia vera."},"tk":"History, CBC and imaging support the diagnosis, and a lymph node biopsy is definitive.","w":"History, CBC and imaging support the diagnosis, and a lymph node biopsy is definitive. A lumbar puncture is added if CNS involvement is suspected. (study guide, Ch 34)","rs":1},{"id":"r049","ty":"mc","ch":"ch4","t":"hodgkin","cn":"c-hodg-comp","q":"A client with Hodgkin lymphoma has back pain followed by leg weakness. Which complication does the nurse suspect?","o":["Spinal cord compression","Superior vena cava syndrome","Hypercalcemia","Venous thrombosis"],"c":0,"x":{"Superior vena cava syndrome":"SVC syndrome causes facial and arm swelling and dyspnea.","Hypercalcemia":"Hypercalcemia causes polyuria and confusion.","Venous thrombosis":"DVT causes leg pain or swelling."},"tk":"A mass can compress the spinal cord, causing back pain and sensory changes before motor weakness.","w":"A mass can compress the spinal cord, causing back pain and sensory changes before motor weakness. It is an emergency treated with radiation and corticosteroids. (study guide, Ch 13 and Ch 34)","rs":1},{"id":"r050","ty":"sata","ch":"ch4","t":"hodgkin","cn":"c-hodg-comp","q":"Which are complications of lymphoma? Select all that apply.","o":["Superior vena cava syndrome","Spinal cord compression","Hypercalcemia","Myelodysplasia","Venous thrombosis","Leukostasis from a very high WBC in AML","SIADH from lung and brain cancer"],"c":[0,1,2,3,4],"x":{"Leukostasis from a very high WBC in AML":"Leukostasis occurs in AML with a very high WBC.","SIADH from lung and brain cancer":"SIADH is tied to brain and lung cancer."},"tk":"Lymphoma complications include SVC syndrome, cord compression, hypercalcemia above 11, myelodysplasia, hepatic or renal failure, hyperviscosity and venous thrombosis.","w":"Lymphoma complications include SVC syndrome, cord compression, hypercalcemia above 11, myelodysplasia, hepatic or renal failure, hyperviscosity and venous thrombosis. (study guide, Ch 34)","rs":1},{"id":"r051","ty":"mc","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"Which finding in a client with multiple myeloma shows kidney injury?","o":["A creatinine above 2 mg/dL with Bence Jones protein in the urine","A hemoglobin of 14 g/dL","A platelet count of 300,000","A serum calcium of 9 mg/dL"],"c":0,"x":{"A hemoglobin of 14 g/dL":"This does not show kidney injury.","A platelet count of 300,000":"This is a normal platelet count.","A serum calcium of 9 mg/dL":"This is normal calcium."},"tk":"Excess light chains are toxic to the kidney, and calcium adds stones and injury.","w":"Excess light chains are toxic to the kidney, and calcium adds stones and injury. Renal insufficiency, creatinine above 2 mg/dL, is the R in CRAB. (study guide, Ch 34)","rs":1},{"id":"r052","ty":"sata","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"Which facts describe multiple myeloma? Select all that apply.","o":["A clone of plasma cells makes an M protein","Lytic bone lesions release calcium","Excess light chains are toxic to the kidneys","Plasma cells are 10% or more of the marrow","Reed–Sternberg cells are the hallmark","B symptoms are the classic presentation"],"c":[0,1,2,3],"x":{"Reed–Sternberg cells are the hallmark":"That is Hodgkin lymphoma.","B symptoms are the classic presentation":"Bone pain and CRAB are classic for myeloma."},"tk":"Myeloma is an incurable plasma cell cancer, with an average age of 62, and is more common in people of African descent.","w":"Myeloma is an incurable plasma cell cancer, with an average age of 62, and is more common in people of African descent. It leads to bone pain, anemia, infection and hypercalcemia. (study guide, Ch 34)","rs":1},{"id":"r053","ty":"mc","ch":"ch4","t":"mm","cn":"c-mm-nursing","q":"Which statement by a client with multiple myeloma shows understanding?","o":["“I will drink plenty of fluids to protect my kidneys.”","“I will limit fluids so I do not have to urinate at night.”","“I will take a calcium supplement for my bones.”","“I will stay in bed all day.”"],"c":0,"x":{"“I will limit fluids so I do not have to urinate at night.”":"Fluids dilute calcium and protect the kidneys.","“I will take a calcium supplement for my bones.”":"Calcium is already high.","“I will stay in bed all day.”":"Walking as tolerated prevents DVT and builds bone."},"tk":"Fluids dilute calcium and protect the kidneys, and ambulation as tolerated builds bone and prevents DVT.","w":"Fluids dilute calcium and protect the kidneys, and ambulation as tolerated builds bone and prevents DVT. Bisphosphonates reduce bone breakdown. (study guide, Ch 34 and class notes)","rs":1},{"id":"r054","ty":"sata","ch":"ch4","t":"mm","cn":"c-mm-nursing","q":"Which findings should a client with multiple myeloma report immediately? Select all that apply.","o":["Sudden severe pain","New numbness or tingling","Confusion","Fatigue, shortness of breath or dizziness","Feeling comfortable after drinking fluids","Taking short walks each day"],"c":[0,1,2,3],"x":{"Feeling comfortable after drinking fluids":"This is expected.","Taking short walks each day":"Ambulation is encouraged."},"tk":"Sudden severe pain or pain in a new spot may mean a fracture.","w":"Sudden severe pain or pain in a new spot may mean a fracture. New numbness or tingling may mean cord compression, and confusion may mean hypercalcemia. (study guide, Ch 34)","rs":1},{"id":"r055","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-tx","q":"A client is diagnosed with ductal carcinoma in situ. Which treatment does the nurse expect?","o":["Surgery","No treatment, only mammograms","Chemotherapy alone","Immunotherapy alone"],"c":0,"x":{"No treatment, only mammograms":"That is the plan for lobular carcinoma in situ.","Chemotherapy alone":"DCIS requires surgery.","Immunotherapy alone":"Surgery is required."},"tk":"DCIS is stage 0, confined to the lining of the milk ducts, and requires surgery.","w":"DCIS is stage 0, confined to the lining of the milk ducts, and requires surgery. LCIS is no longer considered cancer and is followed with mammograms. (study guide, Ch 65)","rs":1},{"id":"r056","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-tx","q":"Which statements about breast cancer treatment are correct? Select all that apply.","o":["Neoadjuvant chemotherapy is first line for intermediate and advanced operable cancer","Radiation follows lumpectomy","Radiation follows mastectomy if 4 or more nodes are positive","Trastuzumab is used for HER2-positive tumors","Endocrine therapy for receptor-positive tumors lasts 5 to 10 years","Lumpectomy is not followed by radiation","LCIS requires mastectomy"],"c":[0,1,2,3,4],"x":{"Lumpectomy is not followed by radiation":"It is always followed by radiation.","LCIS requires mastectomy":"LCIS has no treatment."},"tk":"Treatment depends on stage: surgery, chemotherapy, radiation, targeted therapy, immunotherapy and endocrine therapy.","w":"Treatment depends on stage: surgery, chemotherapy, radiation, targeted therapy, immunotherapy and endocrine therapy. Metastatic disease focuses on quality and quantity of life. (study guide, Ch 65)","rs":1},{"id":"r057","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"A client on letrozole asks about long-term effects. Which risk should the nurse mention?","o":["Osteoporosis and fractures","Cardiotoxicity","Endometrial cancer","Hemorrhagic cystitis"],"c":0,"x":{"Cardiotoxicity":"Cardiotoxicity is linked to trastuzumab.","Endometrial cancer":"That is a tamoxifen risk.","Hemorrhagic cystitis":"That is a chemotherapy effect of ifosfamide."},"tk":"Aromatase inhibitors block the conversion of androgens to estrogen and are taken for 5 to 10 years.","w":"Aromatase inhibitors block the conversion of androgens to estrogen and are taken for 5 to 10 years. Their main risk is osteoporosis and fractures. (study guide, Ch 65 and Davis Table 65.3)","rs":1},{"id":"r058","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"Which effects are associated with tamoxifen? Select all that apply.","o":["Hot flashes","Irregular bleeding or spotting","Vaginal dryness or discharge","DVT and PE","Endometrial cancer","Cardiotoxicity","Hearing loss"],"c":[0,1,2,3,4],"x":{"Cardiotoxicity":"This is linked to trastuzumab.","Hearing loss":"This is not an effect of tamoxifen."},"tk":"Tamoxifen is a SERM taken for 5 to 10 years.","w":"Tamoxifen is a SERM taken for 5 to 10 years. It also carries stroke, cataract and bone loss risk, and SSRIs reduce its metabolism. (study guide, Ch 65)","rs":1},{"id":"r059","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-male","q":"Which statement about hormone therapy for male breast cancer is correct?","o":["It is used only when the tumor is receptor-positive","It is used for every male breast cancer","It is used instead of surgery","It is used to treat HER2-positive tumors"],"c":0,"x":{"It is used for every male breast cancer":"It works only on receptor-positive tumors.","It is used instead of surgery":"Mastectomy is usual.","It is used to treat HER2-positive tumors":"HER2-positive tumors get trastuzumab or pertuzumab."},"tk":"ER/PR testing tells whether hormone therapy will work, and HER2 testing tells whether monoclonal antibody therapy will work.","w":"ER/PR testing tells whether hormone therapy will work, and HER2 testing tells whether monoclonal antibody therapy will work. Tamoxifen, aromatase inhibitors and fulvestrant are used only for receptor-positive tumors. (study guide, Ch 66)","rs":1},{"id":"r060","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-male","q":"Which facts about male breast cancer are correct? Select all that apply.","o":["It is about 100 times less common than in women","BRCA2 is the more common mutation","It spreads early to the nipple, skin and muscle","Mastectomy is the usual surgery","Lumpectomy is the usual surgery","Radiation is the main treatment"],"c":[0,1,2,3],"x":{"Lumpectomy is the usual surgery":"There is too little tissue for lumpectomy.","Radiation is the main treatment":"Radiation is rarely used."},"tk":"The usual age is 60 to 70.","w":"The usual age is 60 to 70. Targeted therapy with trastuzumab or pertuzumab for HER2-positive tumors can cause hypertension, bleeding, poor wound healing, clots and kidney damage. (study guide, Ch 66)","rs":1},{"id":"r061","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-nursing","q":"Which is the most common long-term effect after axillary node removal?","o":["Immobility of the shoulder","Hypothermia","Hemoptysis","Gynecomastia"],"c":0,"x":{"Hypothermia":"This is not a listed effect.","Hemoptysis":"This is a lung cancer cue.","Gynecomastia":"This is a sign of testicular cancer metastasis."},"tk":"Long-term effects include pain, scarring, lymphedema (arm swelling from node removal) and shoulder immobility.","w":"Long-term effects include pain, scarring, lymphedema (arm swelling from node removal) and shoulder immobility. Shoulder immobility is the most common. (study guide, Ch 65 and class notes)","rs":1},{"id":"r062","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-nursing","q":"Which nursing actions apply after breast cancer surgery? Select all that apply.","o":["Assess vital signs for infection or bleeding","Inspect the wound for redness, warmth or purulent drainage","Measure daily weight","Use a pain scale","Watch mood and nonverbal cues for depression","Apply rubefacients such as menthol rubs to radiated skin","Teach monthly breast self-exam as screening"],"c":[0,1,2,3,4],"x":{"Apply rubefacients such as menthol rubs to radiated skin":"Rubefacients are not used on radiated skin.","Teach monthly breast self-exam as screening":"Self-exam is not recommended."},"tk":"The nurse also gives chemotherapy and antiemetics, cough and deep breathing prevent atelectasis, and encourages verbalization.","w":"The nurse also gives chemotherapy and antiemetics, cough and deep breathing prevent atelectasis, and encourages verbalization. (study guide, Ch 65)","rs":1},{"id":"r063","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"Which client is at highest risk for uterine cancer?","o":["A postmenopausal client with obesity who takes estrogen without progesterone and has a uterus","A premenopausal client who takes estrogen with progesterone","A client who exercises and keeps a healthy weight","A client with HPV infection and no other risk"],"c":0,"x":{"A premenopausal client who takes estrogen with progesterone":"Progesterone with estrogen is protective.","A client who exercises and keeps a healthy weight":"This lowers risk.","A client with HPV infection and no other risk":"HPV is the cause of cervical cancer."},"tk":"Unopposed estrogen and obesity are the number one risk factors.","w":"Unopposed estrogen and obesity are the number one risk factors. The usual age is 55 to 65, and tamoxifen, PCOS and diabetes add risk. (study guide, Ch 65)","rs":1},{"id":"r064","ty":"sata","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"Which are risk factors for uterine cancer? Select all that apply.","o":["Unopposed estrogen","Obesity","Tamoxifen use","Polycystic ovary syndrome","Diabetes","Estrogen given with progesterone","HPV infection"],"c":[0,1,2,3,4],"x":{"Estrogen given with progesterone":"It is protective.","HPV infection":"This is cervical cancer's cause."},"tk":"Estrogen without progesterone, anovulation, early menarche and late menopause increase risk.","w":"Estrogen without progesterone, anovulation, early menarche and late menopause increase risk. About 2 to 5% are hereditary. (study guide, Ch 65 and Ch 13)","rs":1},{"id":"r065","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"Which treatment is the usual adjuvant therapy after surgery for uterine cancer?","o":["Radiation","Lumpectomy","Brachytherapy seeds in the prostate","Trachelectomy"],"c":0,"x":{"Lumpectomy":"This is a breast surgery.","Brachytherapy seeds in the prostate":"This is prostate treatment.","Trachelectomy":"This is cervical surgery."},"tk":"Treatment is surgical removal of the uterus, tubes and ovaries with washings and lymphadenectomy.","w":"Treatment is surgical removal of the uterus, tubes and ovaries with washings and lymphadenectomy. Radiation is the usual adjuvant, and chemotherapy is for high-risk or higher-stage disease. (study guide, Ch 65)","rs":1},{"id":"r066","ty":"sata","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"Which tests are used for suspected uterine cancer? Select all that apply.","o":["Endometrial biopsy","Transvaginal ultrasound showing a thickened endometrium","Dilation and curettage if the biopsy is negative but bleeding continues","CA-125 screening","Colposcopy"],"c":[0,1,2],"x":{"CA-125 screening":"CA-125 is an ovarian marker and not a screening test.","Colposcopy":"Colposcopy is for the cervix."},"tk":"Any postmenopausal bleeding needs evaluation, and the usual age is 55 to 65.","w":"Any postmenopausal bleeding needs evaluation, and the usual age is 55 to 65. (study guide, Ch 65)","rs":1},{"id":"r067","ty":"mc","ch":"ch6","t":"cervical","cn":"c-cerv-screen","q":"A 35-year-old client had a normal Pap and HPV cotest today. When is her next screening?","o":["In 5 years","In 1 year","In 3 years","Never again"],"c":0,"x":{"In 1 year":"Ages 30 to 65 with a cotest are screened every 5 years.","In 3 years":"Every 3 years applies to Pap alone.","Never again":"Screening continues to 65."},"tk":"From age 30 to 65, primary HPV or a Pap and HPV cotest is repeated every 5 years, or Pap alone every 3 years.","w":"From age 30 to 65, primary HPV or a Pap and HPV cotest is repeated every 5 years, or Pap alone every 3 years. (study guide, Ch 65)","rs":1},{"id":"r068","ty":"sata","ch":"ch6","t":"cervical","cn":"c-cerv-screen","q":"Which clients may need more frequent cervical screening? Select all that apply.","o":["A client with HIV","An immunosuppressed client","A client with DES exposure","A client with prior dysplasia","A client with a hysterectomy for a benign cause and no CIN 2","A 67-year-old with adequate negative screening"],"c":[0,1,2,3],"x":{"A client with a hysterectomy for a benign cause and no CIN 2":"She may stop screening.","A 67-year-old with adequate negative screening":"She may stop."},"tk":"HIV, immunosuppression, DES exposure or prior dysplasia may need more frequent screening.","w":"HIV, immunosuppression, DES exposure or prior dysplasia may need more frequent screening. Transgender men still need breast, Pap and pelvic screening. (study guide, Ch 65)","rs":1},{"id":"r069","ty":"mc","ch":"ch6","t":"cervical","cn":"c-cerv-dx","q":"During colposcopy the cervix is swabbed with Lugol's solution. Which finding indicates abnormal tissue?","o":["Areas that do not stain brown","Areas that stain brown","Areas that turn blue","No visible change"],"c":0,"x":{"Areas that stain brown":"Normal tissue stains brown.","Areas that turn blue":"This is not the described finding.","No visible change":"Abnormal areas do not stain."},"tk":"Acetic acid and Lugol's iodine are applied and abnormal tissue does not stain brown; those areas are biopsied.","w":"Acetic acid and Lugol's iodine are applied and abnormal tissue does not stain brown; those areas are biopsied. Lugol's is contraindicated with iodine or shellfish allergy. (study guide, Ch 64)","rs":1},{"id":"r070","ty":"sata","ch":"ch6","t":"cervical","cn":"c-cerv-dx","q":"Which are risk factors for HPV-related cervical cancer? Select all that apply.","o":["Early sexual activity","Multiple partners","Low socioeconomic status","Immunosuppression","HPV vaccination","Routine Pap screening"],"c":[0,1,2,3],"x":{"HPV vaccination":"The vaccine is preventive.","Routine Pap screening":"Screening is protective."},"tk":"Contributors include HSV-2, smoking, douching, poor nutrition and long-term oral contraceptive use.","w":"Contributors include HSV-2, smoking, douching, poor nutrition and long-term oral contraceptive use. (study guide, Ch 65)","rs":1},{"id":"r071","ty":"mc","ch":"ch6","t":"cervical","cn":"c-cerv-tx","q":"Which statement about pelvic exenteration is correct?","o":["It removes all pelvic organs and can cure a pelvic recurrence, leaving a colostomy and urinary diversion","It is used for early cervical cancer in a client who wants fertility","It removes only the cervix","It is a screening procedure"],"c":0,"x":{"It is used for early cervical cancer in a client who wants fertility":"A trachelectomy is used for fertility preservation.","It removes only the cervix":"That is a radical trachelectomy.","It is a screening procedure":"It is surgery."},"tk":"Mortality is about 5% and morbidity about 70%.","w":"Mortality is about 5% and morbidity about 70%. A client who has already been radiated can only receive chemotherapy. (study guide, Ch 65)","rs":1},{"id":"r072","ty":"sata","ch":"ch6","t":"cervical","cn":"c-cerv-tx","q":"Which statements about cervical cancer treatment are correct? Select all that apply.","o":["Brachytherapy is internal radiation placed in or next to the tumor","Chemotherapy makes the cells more sensitive to radiation","A radical trachelectomy preserves fertility","Five-year survival is 92% when localized","Pelvic exenteration is used for early disease","Hysterectomy preserves fertility"],"c":[0,1,2,3],"x":{"Pelvic exenteration is used for early disease":"It is for pelvic recurrence.","Hysterectomy preserves fertility":"A hysterectomy removes the uterus."},"tk":"Higher stages use chemoradiation.","w":"Higher stages use chemoradiation. Five-year survival is 92% localized, 58% regional and 17% distant. (study guide, Ch 65)","rs":1},{"id":"r073","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-patho","q":"To which sites does prostate cancer typically spread?","o":["Lymph nodes, bone, rectum and bladder","Brain and adrenal glands first","Peritoneum, omentum and pleura","Liver, lung and muscle"],"c":0,"x":{"Brain and adrenal glands first":"That is lung cancer's pattern.","Peritoneum, omentum and pleura":"That is ovarian cancer's pattern.","Liver, lung and muscle":"That is colon cancer's pattern."},"tk":"Prostate cancer spreads cell-to-cell to the rectum, pelvic floor, lower spine and hip.","w":"Prostate cancer spreads cell-to-cell to the rectum, pelvic floor, lower spine and hip. Bone pain suggests metastasis. (study guide, Ch 66 and Ch 13)","rs":1},{"id":"r074","ty":"sata","ch":"ch7","t":"prostate","cn":"c-pros-patho","q":"Which are risk factors for prostate cancer? Select all that apply.","o":["Family history including BRCA mutations","A diet high in red meat","High calcium intake","High body mass index","Smoking","A diet high in vegetables","Selenium-rich foods"],"c":[0,1,2,3,4],"x":{"A diet high in vegetables":"Vegetables are protective.","Selenium-rich foods":"Selenium is protective."},"tk":"More than 7 multivitamins a week, chemicals and STIs also add risk.","w":"More than 7 multivitamins a week, chemicals and STIs also add risk. Protective factors include vegetables, vitamin E, lycopene, selenium and antioxidants. (study guide, Ch 66)","rs":1},{"id":"r075","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-tx","q":"A client has prostate cancer that has spread to the bone. Which therapy suppresses testosterone, the hormone that feeds the tumor?","o":["Ablative hormone therapy","Brachytherapy","Cryotherapy","TURP"],"c":0,"x":{"Brachytherapy":"This places radioactive seeds.","Cryotherapy":"This freezes the prostate.","TURP":"This treats BPH by removing inner prostate tissue."},"tk":"Ablative hormone therapy is used when cancer has spread to nodes or bone, and it is neoadjuvant when used to shrink the prostate before radiation.","w":"Ablative hormone therapy is used when cancer has spread to nodes or bone, and it is neoadjuvant when used to shrink the prostate before radiation. (study guide, Ch 66)","rs":1},{"id":"r076","ty":"sata","ch":"ch7","t":"prostate","cn":"c-pros-tx","q":"Which statements about prostate cancer treatment are correct? Select all that apply.","o":["External beam radiation runs 5 times a week for 8 weeks","Radical prostatectomy removes the prostate and seminal vesicles","Chemotherapy is used once the cancer is hormone-refractory","Brachytherapy seeds are placed permanently through the perineum","Brachytherapy seeds are removed after one week","Cryotherapy has a high success rate"],"c":[0,1,2,3],"x":{"Brachytherapy seeds are removed after one week":"Prostate brachytherapy seeds are permanent.","Cryotherapy has a high success rate":"It has a low success rate and is often repeated."},"tk":"CyberKnife takes 4 to 5 sessions.","w":"CyberKnife takes 4 to 5 sessions. Cryotherapy can cause impotence, incontinence and rectal complications. (study guide, Ch 66)","rs":1},{"id":"r077","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-postop","q":"Which finding after prostate surgery should the client report?","o":["Fever, increasing pain and swelling at the site","Light pink urine on the first day","A soft stool","Mild fatigue"],"c":0,"x":{"Light pink urine on the first day":"Light pink urine is expected with irrigation.","A soft stool":"Soft stool is the goal.","Mild fatigue":"Mild fatigue is not a warning sign."},"tk":"Infection shows as fever, increasing pain, swelling, redness, drainage and nausea or vomiting.","w":"Infection shows as fever, increasing pain, swelling, redness, drainage and nausea or vomiting. Clots and bleeding are also reported. (study guide, Ch 66)","rs":1},{"id":"r078","ty":"sata","ch":"ch7","t":"prostate","cn":"c-pros-postop","q":"Which nursing actions apply after a radical prostatectomy? Select all that apply.","o":["Manage bladder irrigation","Give stool softeners","Use aseptic wound care","Monitor for infection","Encourage straining at stool","Give a rectal enema"],"c":[0,1,2,3],"x":{"Encourage straining at stool":"Straining can cause bleeding.","Give a rectal enema":"Straining and rectal procedures are avoided."},"tk":"The outcomes are normal sexual function, normal urination and no incontinence.","w":"The outcomes are normal sexual function, normal urination and no incontinence. Teaching covers signs of infection and chemotherapy or radiation effects. (study guide, Ch 66)","rs":1},{"id":"r079","ty":"mc","ch":"ch7","t":"testis","cn":"c-test-dx","q":"Which tumor markers does the nurse follow for testicular cancer?","o":["Alpha-fetoprotein and hCG","PSA and CA-125","Bence Jones protein","Reed–Sternberg cells"],"c":0,"x":{"PSA and CA-125":"PSA is prostate and CA-125 is ovarian.","Bence Jones protein":"That is a myeloma marker.","Reed–Sternberg cells":"That is a Hodgkin finding."},"tk":"AFP and hCG should fall after the tumor is removed; if they do not, look for more tumor.","w":"AFP and hCG should fall after the tumor is removed; if they do not, look for more tumor. (study guide, Ch 66)","rs":1},{"id":"r080","ty":"sata","ch":"ch7","t":"testis","cn":"c-test-dx","q":"Which findings fit testicular cancer? Select all that apply.","o":["A painless mass","A firm or heavy feeling in the scrotum","Swelling and redness","A dull ache in the abdomen or scrotum","Sudden severe pain with high fever","Severe pain after a kick to the groin with a normal exam"],"c":[0,1,2,3],"x":{"Sudden severe pain with high fever":"That suggests infection or torsion.","Severe pain after a kick to the groin with a normal exam":"That suggests trauma."},"tk":"Metastasis may cause GI symptoms, low back pain, gynecomastia, dyspnea, cough, hemoptysis and a neck mass.","w":"Metastasis may cause GI symptoms, low back pain, gynecomastia, dyspnea, cough, hemoptysis and a neck mass. Self-exam in a warm shower may find it first. (study guide, Ch 66)","rs":1},{"id":"r081","ty":"mc","ch":"ch7","t":"testis","cn":"c-test-tx","q":"Which type of testicular cancer is radiation sensitive?","o":["Seminoma","Nonseminoma","Embryonal carcinoma","Teratoma"],"c":0,"x":{"Nonseminoma":"Nonseminoma is not radiation responsive.","Embryonal carcinoma":"It is a nonseminoma and is not radiation responsive.","Teratoma":"It is a nonseminoma and is not radiation responsive."},"tk":"Seminoma is slow growing, occurs in men in their 30s to 40s, and gets radiation and/or chemotherapy after surgery.","w":"Seminoma is slow growing, occurs in men in their 30s to 40s, and gets radiation and/or chemotherapy after surgery. Nonseminoma gets node removal and chemotherapy. (study guide, Ch 66)","rs":1},{"id":"r082","ty":"sata","ch":"ch7","t":"testis","cn":"c-test-tx","q":"Which adverse effects are linked to testicular cancer chemotherapy? Select all that apply.","o":["Hair loss and mouth sores","Kidney damage","Neuropathy and ototoxicity","Lung damage with bleomycin","Hemorrhagic cystitis with ifosfamide","Hemorrhagic cystitis with bleomycin","Lung damage with ifosfamide"],"c":[0,1,2,3,4],"x":{"Hemorrhagic cystitis with bleomycin":"Hemorrhagic cystitis is linked to ifosfamide.","Lung damage with ifosfamide":"Lung damage is linked to bleomycin."},"tk":"Chemotherapy can also cause infection, bleeding, nausea and diarrhea, lowered testosterone and cardiovascular risk.","w":"Chemotherapy can also cause infection, bleeding, nausea and diarrhea, lowered testosterone and cardiovascular risk. (study guide, Ch 66)","rs":1},{"id":"r083","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A hospice client's daughter asks whether her father can go back to curative treatment. Which response is correct?","o":["“Yes, a client can leave hospice to restart curative treatment.”","“No, once enrolled the client cannot leave hospice.”","“Only if the client has not yet been given morphine.”","“Only after a 6-month wait.”"],"c":0,"x":{"“No, once enrolled the client cannot leave hospice.”":"Patients can leave hospice to restart curative treatment.","“Only if the client has not yet been given morphine.”":"Opioids do not bar a return to treatment.","“Only after a 6-month wait.”":"There is no required wait."},"tk":"Hospice means the client stops curative treatment and chooses comfort care.","w":"Hospice means the client stops curative treatment and chooses comfort care. The client can leave hospice to restart curative treatment. (study guide, Other Topics)","rs":1},{"id":"r084","ty":"sata","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"Which statements correctly relate hospice and palliative care? Select all that apply.","o":["All hospice is palliative","Palliative care is broader than hospice","Palliative care can run alongside curative treatment","Palliative care is not the same as hospice","All palliative care is hospice","Hospice can start at diagnosis alongside chemotherapy"],"c":[0,1,2,3],"x":{"All palliative care is hospice":"Palliative care is broader.","Hospice can start at diagnosis alongside chemotherapy":"That is true of palliative care, not hospice."},"tk":"Hospice is for a prognosis of 6 months or less and replaces curative treatment with comfort.","w":"Hospice is for a prognosis of 6 months or less and replaces curative treatment with comfort. Palliative care can start at any stage. (study guide, Other Topics)","rs":1},{"id":"r085","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-nursing","q":"Why does the nurse keep talking to a client who is unresponsive and dying?","o":["Hearing is often the last sense lost","Hearing is always the first sense lost","Talking restores consciousness","The client's sight is unaffected"],"c":0,"x":{"Hearing is always the first sense lost":"Hearing is often the last sense lost.","Talking restores consciousness":"This is not supported.","The client's sight is unaffected":"This is not stated."},"tk":"Nursing care at the end of life includes emotional and spiritual support for the client and family.","w":"Nursing care at the end of life includes emotional and spiritual support for the client and family. (study guide, Other Topics; standard content)","rs":1},{"id":"r086","ty":"sata","ch":"ch8","t":"eol","cn":"c-eol-nursing","q":"Which nursing actions are appropriate for a dying client? Select all that apply.","o":["Give opioids on schedule for pain and dyspnea","Provide mouth care","Reposition the client","Honor the advance directive and DNR order","Provide emotional and spiritual support","Withhold opioids until the respiratory rate rises","Start curative chemotherapy"],"c":[0,1,2,3,4],"x":{"Withhold opioids until the respiratory rate rises":"Opioids are given to keep the client comfortable.","Start curative chemotherapy":"Curative treatment has stopped in hospice."},"tk":"The goal is comfort.","w":"The goal is comfort. Signs that death is near include falling intake and urine output, mottled extremities, apnea periods and noisy secretions. (study guide, Other Topics)","rs":1},{"id":"r087","ty":"mc","ch":"ch7","t":"prostate","cn":"c-bph","q":"A man is prescribed finasteride (Proscar) for BPH. Which teaching is correct?","o":["A pregnant person should not handle crushed or broken tablets because the drug is teratogenic","Finasteride relaxes the smooth muscle of the bladder neck","It works within 2 weeks","It raises the PSA level"],"c":0,"x":{"Finasteride relaxes the smooth muscle of the bladder neck":"That describes alpha-adrenergic blockers.","It works within 2 weeks":"5-alpha reductase inhibitors take 3 to 6 months.","It raises the PSA level":"It lowers PSA."},"tk":"5-alpha reductase inhibitors block testosterone from becoming DHT, so the prostate shrinks.","w":"5-alpha reductase inhibitors block testosterone from becoming DHT, so the prostate shrinks. Effects include decreased libido, ED and breast tenderness, and it can reduce male-pattern baldness. (study guide, Ch 66 and class notes)","rs":1},{"id":"r088","ty":"sata","ch":"ch7","t":"prostate","cn":"c-bph","q":"Which are manifestations of benign prostatic hyperplasia? Select all that apply.","o":["Difficulty starting the urine stream","A weak stream","Dribbling after urination","Nocturia","Urgency and frequency","It is an early stage of prostate cancer","The PSA can tell BPH from cancer"],"c":[0,1,2,3,4],"x":{"It is an early stage of prostate cancer":"BPH is not cancer and not a precursor.","The PSA can tell BPH from cancer":"PSA cannot separate them."},"tk":"BPH affects 50% of men aged 51 to 60 and 90% over 80.","w":"BPH affects 50% of men aged 51 to 60 and 90% over 80. Complications include retention, UTI, bladder stones and hydronephrosis. (study guide, Ch 66)","rs":1},{"id":"r089","ty":"mc","ch":"ch2","t":"pv","cn":"c-pv","q":"A client with polycythemia vera has a hematocrit of 56%. Which treatment does the nurse expect?","o":["Therapeutic phlebotomy of 350 to 500 mL weekly until the hematocrit is below 45%","Iron supplements to raise the hemoglobin","Erythropoietin injections","A transfusion of red blood cells"],"c":0,"x":{"Iron supplements to raise the hemoglobin":"The problem is too many red cells.","Erythropoietin injections":"Erythropoietin stimulates red cell production; it is low in polycythemia vera.","A transfusion of red blood cells":"This would worsen the hyperviscosity."},"tk":"Too many red cells make the blood thick, slowing circulation and lowering oxygen delivery.","w":"Too many red cells make the blood thick, slowing circulation and lowering oxygen delivery. Phlebotomy removes red cells until the hematocrit is below 45%, and hydroxyurea or interferon suppress the marrow when white cells and platelets are high. Low-dose aspirin or anagrelide reduce thrombosis. (study guide, Ch 34)","rs":1},{"id":"r090","ty":"sata","ch":"ch2","t":"pv","cn":"c-pv","q":"Which findings are expected in polycythemia vera? Select all that apply.","o":["Generalized itching, especially after a warm bath","Facial flushing","Splenomegaly with fullness in the left upper abdomen","Headache and blurred vision","Orthopnea","Pallor and spoon-shaped nails","A low hematocrit"],"c":[0,1,2,3,4],"x":{"Pallor and spoon-shaped nails":"Those suggest iron deficiency anemia.","A low hematocrit":"The hematocrit is high, above 52% in men."},"tk":"Hyperviscosity, hypervolemia and engorged capillaries cause the symptoms.","w":"Hyperviscosity, hypervolemia and engorged capillaries cause the symptoms. Thrombosis such as MI, stroke, PE and DVT is the main danger, so sudden chest pain, headache or shortness of breath is reported immediately. (study guide, Ch 34)","rs":1},{"id":"r091","ty":"mc","ch":"ch8","t":"pain","cn":"c-pain","q":"Which type of medication is kept at every step of the WHO pain ladder?","o":["A nonopioid","A strong opioid","A benzodiazepine","A corticosteroid alone"],"c":0,"x":{"A strong opioid":"Strong opioids are used only at step 3.","A benzodiazepine":"It is not part of the ladder.","A corticosteroid alone":"Corticosteroids are adjuvants."},"tk":"A nonopioid is kept at every step to add relief and lower the opioid dose.","w":"A nonopioid is kept at every step to add relief and lower the opioid dose. It has no respiratory depression or addiction, but limits include GI bleeding and kidney injury for NSAIDs and liver injury for acetaminophen. (study guide, Ch 11)","rs":1},{"id":"r092","ty":"sata","ch":"ch8","t":"pain","cn":"c-pain","q":"Which are adverse effects of opioids? Select all that apply.","o":["Respiratory depression","Constipation","Nausea and vomiting","Urinary retention","Confusion and delirium in older adults","Hemorrhage from COX-1 inhibition","Liver failure at 3,000 mg a day"],"c":[0,1,2,3,4],"x":{"Hemorrhage from COX-1 inhibition":"That is an NSAID effect.","Liver failure at 3,000 mg a day":"That is acetaminophen toxicity."},"tk":"Opioid effects come from mu receptors.","w":"Opioid effects come from mu receptors. Tolerance and addiction are different: fewer than 5% of cancer patients become addicted. (study guide, Ch 11)","rs":1},{"id":"r093","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"A provider orders 300 mg. The vial contains 100 mg per mL. How many milliliters does the nurse draw up?","o":[],"c":{"answer":3,"unit":"mL","setup":"(Desired ÷ Have) × Quantity = (300 mg ÷ 100 mg) × 1 mL = 3 mL","near":{"0.33":"0.33 divides 100 by 300, which inverts the ratio.","30":"30 uses a misplaced decimal.","300":"300 is the ordered milligrams, not milliliters."}},"x":{},"tk":"The ordered dose is three times the dose in each milliliter, so three milliliters are needed.","w":"The ordered dose is three times the dose in each milliliter, so three milliliters are needed. (study guide, Other Topics: medication math, standard content)","rs":1},{"id":"r094","ty":"sata","ch":"ch8","t":"dose","cn":"c-dose","q":"Which conversion facts are correct? Select all that apply.","o":["1 kg equals 2.2 lb","1 g equals 1,000 mg","1 mg equals 1,000 mcg","1 tsp equals 5 mL","1 oz equals 15 mL","1 tbsp equals 5 mL"],"c":[0,1,2,3],"x":{"1 oz equals 15 mL":"1 oz equals 30 mL; 15 mL is 1 tbsp.","1 tbsp equals 5 mL":"1 tbsp equals 15 mL; 5 mL is 1 tsp."},"tk":"Also 1 oz equals 30 mL and 1 tbsp equals 15 mL.","w":"Also 1 oz equals 30 mL and 1 tbsp equals 15 mL. Check units before you calculate and round per your program's rules. (study guide, Other Topics: medication math, standard content)","rs":1}],"pearls":{"ch1":{"emph":["Cancer risk factors, cancer staging (size of tumor, TNM) using the table in Davis, and biopsy procedures are on your priority list."],"diff":[],"core":["The nine risk factor categories are carcinogens, environment, hormones, genetics, lifestyle, infectious disease, medications, immune status and nutrition.","Carcinogen exposure is the most common risk factor, and risks are cumulative.","Age and genetics cannot be changed; 5 to 10% of cancers come from known genetic syndromes such as BRCA1/2.","Hereditary red flags are multiple primaries, bilateral tumors in paired organs, a younger-than-usual age, a tumor in the sex not usually affected, and two or more first-degree relatives with the same cancer.","BRCA2 also raises the risk of pancreatic and prostate cancer and melanoma.","Cervical cancer: HPV, multiple partners, early sexual contact, tobacco use.","Gastric cancer: H. pylori, alcohol, ulcers, smoking. Liver cancer: alcohol and hepatitis A, B or C.","Testicular cancer: undescended testicle is the greatest risk. Lung cancer: tobacco, asbestos, coal, soot, tar, pollution, wood dust.","Uterine cancer: estrogen therapy without progesterone, obesity, tamoxifen, PCOS, diabetes.","Primary prevention: risk factor modification, immunization (HPV, hepatitis), chemoprevention and avoiding carcinogens.","Secondary prevention: screening for early detection (breast, cervical, colon, prostate).","Tertiary prevention: reducing morbidity and mortality once disease is diagnosed.","C change in bowel or bladder habits; A a sore that does not heal; U unusual bleeding or discharge; T thickening or lump.","I indigestion or difficulty swallowing; O obvious change in a wart or mole; N nagging cough or hoarseness.","A sign lasting more than 2 weeks needs evaluation.","T is the size of the tumor, N is the number of lymph nodes involved, and M is the presence of metastasis; M1 means the cancer is not local.","Stage I is small with no obvious spread outside the organ, stage II invades deeper tissue or local nodes, stage III is large or locally advanced, and stage IV has metastasized.","All hematologic malignancies are stage IV at diagnosis.","Grade describes how differentiated the cells are; poorly differentiated cells are more aggressive.","Breast sizes: 2 cm or less is stage I, 2 to 5 cm is stage II, over 5 cm is stage IIB or III; nodes 4 to 8 is IIIA, up to 9 is IIIB, 10 or more is IIIC.","Prostate: T1 cannot be felt, T2 is confined to the prostate, T3 is locally extensive, T4 invades neighboring organs.","Gleason is two grades of 1 to 5 added together, maximum 10; higher is worse.","Ovarian FIGO: I ovaries, II pelvis, III peritoneum and/or nodes, IV distant.","A biopsy is the most specific test and is required for a definite diagnosis; labs and imaging are supportive; results take 3 to 10 days.","Excisional biopsy removes the whole mass with a margin and is preferred; incisional (core) biopsy can track cells through normal tissue.","Fine-needle aspiration is less traumatic but gives fewer cells; core needle gives a larger sample; vacuum-assisted uses a probe with no sutures.","A negative sentinel node means no further nodes are removed; a positive one leads to an axillary dissection of 20 to 40 nodes.","A liquid biopsy is a blood test for cancer cells or tumor DNA.","Ovarian mass: biopsy is not recommended because it could spread cells; the diagnosis is surgical removal with pathology.","Uterine: endometrial biopsy is 99% sensitive for high-grade cancer; a D&C is done if the biopsy is negative but bleeding continues.","Cervical: colposcopy with biopsy after an abnormal Pap; the biopsy is diagnostic.","Lung: bronchoscopy views and biopsies the airways; mediastinoscopy is an incision to biopsy the mediastinum.","The most common site is the posterior iliac crest with the client prone or side-lying; the sternum or anterior iliac crest is done supine.","Before: consent, allergies and bleeding risk. The client feels pressure and a brief pulling pain, and the procedure takes 5 to 10 minutes.","After: direct pressure for 5 to 10 minutes, a sterile dressing, rest for several hours, dressing on at least 24 hours.","Report bleeding that soaks the dressing or lasts more than 24 hours, and watch for infection."]},"ch2":{"emph":["Labs (CBC, WBC, platelets) are a priority topic."],"diff":["Lecture vs book: the RBC range in this key (3.61 to 5.11 million) and the class sheet (4.5 to 5.5) differ slightly; this patient is normal by either."],"core":["A CBC uses a lavender (EDTA) tube; PT, INR and PTT use sodium citrate.","A left shift is many immature neutrophils (bands) and means active infection.","Neutropenia is an ANC below 1,500; 500 or below needs neutropenic precautions.","Reticulocytes are immature RBCs: high means the marrow is responding, low means a hypoproliferative marrow.","Low MCV is microcytic (iron deficiency); high MCV is macrocytic (B12 or folate).","Normal platelets are 150,000 to 450,000/mm³.","Bleeding precautions start below 100,000; spontaneous bleeding is possible below 50,000.","Platelets are usually transfused below 20,000; below 5,000 a fatal CNS or GI bleed is possible.","In iron deficiency ferritin and transferrin saturation are low, TIBC is high, and the cells are microcytic and hypochromic.","No iron supplements for 24 hours before a serum iron; draw it in the morning.","Eat heme iron (red meat) and nonheme iron (spinach, beans) with vitamin C; dairy blocks absorption.","The intrinsic pathway is monitored by PTT and heparin; the extrinsic pathway by PT/INR and warfarin.","The INR goal on warfarin is 2 to 3.","Bleeding time checks platelet function and is not done if platelets are under 75,000; platelet aggregation is impaired by aspirin, NSAIDs and von Willebrand disease.","Polycythemia - is a term used to describe an increased RBC count."]},"ch3":{"emph":["Leukemia is worth 5 questions: risk factors and medications.","Neutropenic precautions are a priority topic."],"diff":[],"core":["A stem cell mutates into immature blasts that never mature or die, producing leukocytosis.","The crowded marrow cannot make enough RBCs and platelets, so anemia and thrombocytopenia occur.","The blasts cannot fight infection, so neutropenia and infection occur.","AML and ALL are acute and ALL is the most common childhood leukemia; CML and CLL are chronic and can turn acute.","Risk factors are genetic anomalies, Down syndrome, radiation, benzene or chemical exposure, prior chemotherapy or radiation, and smoking.","The Philadelphia chromosome (9;22) is found in more than 90% of CML.","Oil refinery work means benzene exposure, the highest risk factor in the case.","Chemotherapy is given in phases: induction (get remission), consolidation (treat hidden disease), maintenance (prevent relapse); remission is not a cure.","AML induction example is daunorubicin plus cytarabine; imatinib targets Bcr-Abl in CML; ibrutinib is used in CLL.","Prophylactic antibiotics, antivirals and antifungals are given during neutropenia.","Radiation to the brain and spine treats CNS disease because chemotherapy cannot cross the blood–brain barrier.","The textbook says G-CSF (filgrastim) is generally not indicated in leukemia.","After chemotherapy the first priority is infection; fever means broad-spectrum IV antibiotics immediately.","Never take a rectal temperature in a neutropenic client.","Teach to avoid dental cleanings when platelets are low, and go to the ED for fever of 102°F, chills or a nosebleed over 10 minutes.","Offer sperm or egg banking before therapy.","Neutropenia is an ANC below 1,500; precautions start at 500 or below.","A temperature of 100.4°F (38°C) or higher needs immediate care and IV antibiotics.","Fever may be the first and only sign of infection.","Hand hygiene by everyone, a private room, avoid crowds, sick people, small children and pets.","No live plants or cut flowers, no standing water or humidifiers.","Wash raw fruits and vegetables well; avoid raspberries and blackberries.","No rectal temperatures, suppositories or enemas, because rectal bacteria can enter the blood.","Take prophylactic antimicrobials daily and finish the course; reverse isolation means staff wear PPE to protect the client."]},"ch4":{"emph":["Hodgkin lymphoma: complications and symptoms.","Multiple myeloma: nursing interventions."],"diff":[],"core":["Reed–Sternberg cells define Hodgkin lymphoma; it has a better survival rate than non-Hodgkin lymphoma.","Painless lymph node swelling; B symptoms are low-grade fever, drenching night sweats and weight loss.","Itching is common in Hodgkin lymphoma; a dry cough worse lying flat suggests a mediastinal mass.","A lymph node biopsy is definitive; uric acid and LDH are elevated.","Superior vena cava syndrome: facial and arm swelling, dyspnea, chest pain, dysphagia.","Spinal cord compression: back pain, then sensory and motor change; an emergency.","Hypercalcemia above 11 mg/dL: confusion, polyuria, heart block; IV fluids dilute calcium.","Lymphoma staging: I one node, II two or more nodes on one side of the diaphragm, III both sides, IV organs plus nodes.","Teach neutropenic and bleeding precautions before chemotherapy.","A clone of plasma cells makes an M protein; lytic bone lesions release calcium.","CRAB: hypercalcemia above 11.5, renal insufficiency (creatinine above 2), anemia (Hgb below 10), bone disease.","Excess light chains (Bence Jones protein) are toxic to the kidneys.","Myeloma is an incurable B-cell cancer of plasma cells.","Encourage fluids to dilute calcium and protect the kidneys; monitor serum and urine calcium, BUN and creatinine.","Encourage ambulation as tolerated and position for comfort.","Bisphosphonates such as ibandronate (Boniva) reduce bone breakdown, which lowers calcium and fractures.","Sudden severe pain or new numbness may mean a fracture or cord compression: report at once.","Thalidomide and lenalidomide are teratogenic."]},"ch5":{"emph":["Lung cancer is a priority topic."],"diff":[],"core":["Small cell is about 15%, grows fast and spreads early, has a poor outlook (class: 6 months to 1 year), and surgery is not the main treatment.","Non-small cell is about 85%, has three types (adenocarcinoma, squamous cell, large cell), is slower, and has a good 5-year survival if found early.","More than 90% of lung cancer is caused by smoking; yearly low-dose CT is for high-risk clients (20 pack-years, current smoker or quit within 15 years).","Cues: new or changed cough, hemoptysis, shortness of breath, wheezing, hoarseness, chest pain, weight loss, frequent pneumonia.","Headache and bone pain suggest metastasis to brain and bone; common sites are brain, bone, adrenal gland and the other lung.","PET shows metabolic activity, not structure; sputum cytology, bronchoscopy and mediastinoscopy obtain cells or tissue.","Lobectomy removes a lobe, pneumonectomy removes a lung, and a wedge resection removes a small section; surgery is preferred if there is no metastasis.","Chemotherapy is the primary treatment for advanced disease; radiation is used when surgery is not an option or for palliation.","WHO ladder: nonopioid, then moderate opioid plus nonopioid, then strong opioid plus nonopioid, given around the clock.","Palliative care begins at diagnosis.","Give oxygen to keep the SpO₂ at 90% or higher and position the client in semi-Fowler's.","Small frequent meals with supplements; a large meal pushes on the diaphragm.","Never clamp a chest tube; keep the system closed; continuous bubbling in the water-seal chamber is an air leak."]},"ch6":{"emph":["Breast cancer in men and women: medications (Davis).","Cervical cancer guidelines and uterine cancer."],"diff":["Lecture vs book: your quiz key says docetaxel/Taxotere are prostate drugs, but Davis Table 65.3 in your first study guide lists docetaxel (and paclitaxel) with breast cancer chemotherapy. Follow the quiz key for this question and ask your instructor which will be tested.","Wording problem in the question: it calls tamoxifen an aromatase inhibitor. Your study guide lists tamoxifen as a SERM that blocks the estrogen receptor and anastrozole, letrozole and exemestane as the aromatase inhibitors."],"core":["Lumpectomy is always followed by radiation; with chemotherapy the order is surgery, chemotherapy, then radiation.","Neoadjuvant therapy is given before the primary treatment; adjuvant therapy is given after.","DCIS is stage 0 and requires surgery; LCIS has no treatment and is followed with mammograms.","Tamoxifen blocks estrogen at its receptor for 5 to 10 years; avoid SSRIs and question oral contraceptives in estrogen-positive disease.","Aromatase inhibitors (anastrozole, letrozole, exemestane) stop androgens becoming estrogen; they risk osteoporosis and fractures.","Trastuzumab is for HER2-positive tumors and can cause cardiotoxicity; pembrolizumab is immunotherapy with rash, diarrhea and thyroid problems.","It is about 100 times less common than in women, occurs at ages 60 to 70, and BRCA2 is the more common mutation.","With little breast tissue it spreads early to the nipple, skin and muscle; mastectomy is usual.","Hormone therapy is only for receptor-positive tumors, so question antiestrogen therapy in a receptor-negative client.","Ultrasound is used under age 25; mammogram at 25 or older.","Bloody drainage saturating the dressing is the most concerning wound finding; serosanguineous drainage is expected.","Lymphedema follows axillary node removal; shoulder immobility is the most common long-term effect.","Radiation effects: skin redness, itching, desquamation, breast swelling, and pneumonitis 6 weeks to 6 months later.","Breast self-exam is not recommended; screening is by mammography.","The most common gynecologic cancer in the US, usually at ages 55 to 65.","The number one risk factors are unopposed estrogen and obesity; tamoxifen, early menarche, late menopause, PCOS and diabetes add risk.","About 80% are endometrioid adenocarcinoma; anyone on estrogen with a uterus needs progesterone.","Abnormal uterine or postmenopausal bleeding is the most common symptom and needs evaluation.","Endometrial biopsy first; ultrasound shows a thickened endometrium; D&C if the biopsy is negative but bleeding continues.","Treatment is removal of the uterus, tubes and ovaries; radiation is the usual adjuvant.","Stomatitis: salt-water rinses and avoid hot or spicy food.","No screening before age 21; the first Pap is at 21 and is repeated every 3 years until 29.","HPV testing is not a screen at 21 to 29, except as a reflex if atypical cells are found; primary HPV may start at 25 every 5 years.","Ages 30 to 65: primary HPV or Pap plus HPV cotest every 5 years, or Pap alone every 3 years.","Screening may stop after 65 with adequate negative results and no CIN 2 in 20 years.","HPV is the cause; the HPV vaccine at age 11 to 12 (as early as 9) does not treat an existing infection.","Dysplasia has no symptoms; vaginal bleeding, especially after intercourse, is the most common symptom of invasive cancer.","An abnormal Pap with high-risk HPV leads to colposcopy with biopsy; nothing in the vagina for 24 hours before, and Lugol's is contraindicated with iodine or shellfish allergy.","About 90% are squamous cell carcinomas in the transformation zone.","Early disease: cone biopsy or radical trachelectomy if fertility is wanted; hysterectomy with node dissection if not.","Higher stages: chemoradiation with brachytherapy.","Pelvic exenteration can cure a recurrence confined to the pelvis."]},"ch7":{"emph":["Prostate cancer is worth 5 questions: complications after surgery.","Testicular cancer."],"diff":["Key problem: the keyed answer says every year, but the rationale printed under it (and your study guide: PSA under 2.5 is retested every 2 years, 2.5 or higher yearly) say every other year. The question also writes the unit as ng/dL. Follow the key for this question and ask your instructor."],"core":["Tumors grow on the periphery of the gland, so urinary symptoms come late; spread is to lymph nodes, bone, rectum and bladder.","PSA of 4 ng/mL or higher needs further assessment; PSA has high sensitivity but low specificity and cannot tell BPH from cancer.","A needle biopsy confirms the diagnosis, followed by a Gleason score.","African American men have a higher incidence and twice the mortality; BPH is not a precursor to prostate cancer.","Brachytherapy seeds are placed permanently through the perineum for cancer confined to the prostate; no sex for 2 weeks, then use a condom.","The nurse minimizes contact and wears proper, thicker PPE with brachytherapy; an external beam client is not radioactive.","Ablative hormone therapy suppresses testosterone; chemotherapy is for hormone-refractory disease.","Impotence is the most expected; nerve-sparing surgery only tries to protect the erection nerves.","Watch for urinary incontinence, infection (fever, pain, swelling, redness) and bleeding with clots.","Manage bladder irrigation to clear clots and give stool softeners to avoid straining.","A cancer client with fever, malaise and high WBC most likely has an infection.","Cryptorchidism is the greatest risk factor; the average age is 33.","The classic sign is a painless mass, sometimes with a firm or heavy feeling.","AFP and hCG should fall after the tumor is removed; if not, look for more tumor.","Cure rate is 90 to 100% if found early.","All types start with removal of the affected testicle (orchiectomy).","Seminoma is radiation sensitive; nonseminoma is not and gets node removal and chemotherapy.","Bank sperm before treatment; follow up for at least 10 years; retroperitoneal node removal can damage ejaculation nerves.","Bleomycin can damage the lungs and ifosfamide can cause hemorrhagic cystitis.","After surgery, hypotension with tachycardia means volume loss and fever means infection.","With minimal symptoms and minimal enlargement the first approach is watchful waiting or active surveillance with a yearly exam. If the symptoms worsen, a 5-alpha reductase inhibitor or an alpha-adrenergic blocker may be prescribed. The nurse teaches recognition of worsening symptoms and the need for follow-up."]},"ch8":{"emph":["End of life is worth 2 questions: the difference between hospice and palliative care.","Dosage calculations are worth 2 questions."],"diff":[],"core":["Palliative care is for any stage of serious illness, begins at diagnosis, and can continue with curative treatment.","Hospice is for a prognosis of 6 months or less; curative treatment stops and the goal is comfort.","All hospice is palliative, but not all palliative care is hospice.","Signs death is near: falling intake and urine output, mottled cool extremities, apnea periods, noisy secretions.","Give opioids around the clock for pain and dyspnea, provide mouth care and repositioning, and honor advance directives.","Hearing is often the last sense lost.","ANS: Step 2 - moderate pain. Chp. 11, Table 11.8 The World Health Organization ladder - FA Davis Advantage, medical surgical, 2nd Edition, page 200.","ANS: (Ordered Per Hour ÷ Have) × Volume (mL) = Y (Flow Rate in mL/hr) → (20 mg/hr ÷ 500 mg) × 250 mL = 10 mL/hr."]}},"plan":[{"date":"2026-11-06","label":"Fri Nov 6 · heavy day","tasks":[{"id":"p1","label":"Redo the quiz questions you missed","sub":"7 questions from your NUR 334 practice quiz","set":{"ids":["q186","q188","q195","q200","q205","q209","q230"]}},{"id":"p2","label":"Leukemia and neutropenia: 25 questions","sub":"Highest-weighted chapter (leukemia is 5 questions)","set":{"count":25,"ch":["ch3"]}},{"id":"p3","label":"Labs and blood counts: 25 questions","sub":"CBC, WBC, platelets, polycythemia","set":{"count":25,"ch":["ch2"]}},{"id":"p4","label":"Read the Leukemia and Labs pearls","sub":"10 minutes","go":"pearls"}]},{"date":"2026-11-07","label":"Sat Nov 7 · heavy day","tasks":[{"id":"p5","label":"Prostate and testicular: 25 questions","sub":"Prostate is 5 questions; post-op complications","set":{"count":25,"ch":["ch7"]}},{"id":"p6","label":"Cancer basics: 25 questions","sub":"Risk factors, TNM staging, biopsy","set":{"count":25,"ch":["ch1"]}},{"id":"p7","label":"Lymphoma and myeloma: 20 questions","sub":"Hodgkin symptoms and complications; myeloma nursing","set":{"count":20,"ch":["ch4"]}},{"id":"p8","label":"SATA Lab: 10 questions","sub":"Select-all practice","set":{"count":10,"ty":{"sata":1,"match":1}}}]},{"date":"2026-11-08","label":"Sun Nov 8 · lighter day","tasks":[{"id":"p9","label":"Breast, uterine and cervical: 20 questions","sub":"Medications and cervical screening guidelines","set":{"count":20,"ch":["ch6"]}},{"id":"p10","label":"Lung cancer: 15 questions","sub":"","set":{"count":15,"ch":["ch5"]}},{"id":"p11","label":"Pain, dosage and end of life: 15 questions","sub":"Hospice vs palliative; the numeric questions","set":{"count":15,"ch":["ch8"]}},{"id":"p12","label":"Retry everything you missed","sub":"Review & Retry","go":"review"}]},{"date":"2026-11-09","label":"Mon Nov 9 · day before the exam","tasks":[{"id":"p13","label":"Timed practice exam: 50 questions","sub":"50 minutes, no feedback until you submit","set":{"mode":"exam","count":50}},{"id":"p14","label":"Retry the questions you missed on the practice exam","sub":"Review & Retry","go":"review"},{"id":"p15","label":"Skim all the pearls, then stop and sleep","sub":"","go":"pearls"}]},{"date":"2026-11-10","label":"Tue Nov 10 · exam day","tasks":[{"id":"p16","label":"Look over the pearls once","sub":"No new material today.","go":"pearls"}]}],"reviewFirst":["q186","q188","q195","q200","q205","q209","q230"]}</script>
<script>
(function(){
"use strict";
var B=JSON.parse(document.getElementById("bank").textContent);
var M=B.meta,KEY=M.key;
var LET="ABCDEF";
function $(s,r){return(r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
var CH={};B.chapters.forEach(function(c){CH[c.id]=c});
var TP={};B.topics.forEach(function(t){TP[t.id]=t});
var BYID={};B.Q.forEach(function(q){BYID[q.id]=q});

/* ---------------- progress state ---------------- */
function fresh(){return{v:1,a:{},rel:{},added:{qs:[],pearls:{}},plan:{},sims:[],opts:{gen:true,sata:"pm1"},seeded:false,u:0}}
var P=fresh(),MODE="file";
function loadLocal(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);P=Object.assign(fresh(),o);P.opts=Object.assign({gen:true,sata:"pm1"},P.opts||{});P.added=P.added||{qs:[],pearls:{}}}}catch(e){}}
loadLocal();
function seed(){if(P.seeded)return;P.seeded=true;(B.reviewFirst||[]).forEach(function(id){if(!P.a[id])P.a[id]={n:1,r:0,w:1,last:"w",t:1,fr:0,seed:1}})}
seed();
function allQ(){var out=[];B.Q.forEach(function(q){if(!q.rs||P.rel[q.id])out.push(q)});(P.added.qs||[]).forEach(function(q){out.push(q)});return out}
function qById(id){return BYID[id]||(P.added.qs||[]).filter(function(q){return q.id===id})[0]}
function st(q){return P.a[q.id]||{n:0,r:0,w:0}}
function isMissed(q){var s=P.a[q.id];return !!(s&&s.n&&s.last&&s.last!=="r")}
function isFlag(q){var s=P.a[q.id];return !!(s&&s.fl)}
function isNew(q){var s=P.a[q.id];return !s||!s.n}
function acc(list){var n=0,r=0;list.forEach(function(q){var s=P.a[q.id];if(s&&s.n){n+=s.n;r+=s.r}});return n?r/n:null}

/* ---------------- saving: account (artifact) or this browser ---------------- */
var DEV=Math.random().toString(36).slice(2,8),SY={db:null,doc:null,ok:false,t:null,last:0,at:0};
function setSave(){var e=$("#save");if(!e)return;e.innerHTML=SY.ok?'<b>Saved to your account</b>':(MODE==="artifact"?"Saving to your account…":"Saved in this browser")}
function mergeP(a,b){var id;
 for(id in b.a||{}){var x=a.a[id],y=b.a[id];if(!x||(y.t||0)>(x.t||0)){var fl=x&&x.fl;a.a[id]=y;if(x&&(x.fl!==y.fl)&&(x.ft||0)>(y.ft||0))a.a[id].fl=x.fl,a.a[id].ft=x.ft}else if(y.ft&&(y.ft>(x.ft||0))){x.fl=y.fl;x.ft=y.ft}}
 for(id in b.rel||{})a.rel[id]=Math.min(a.rel[id]||1e15,b.rel[id]);
 for(id in b.plan||{})a.plan[id]=Math.max(a.plan[id]||0,b.plan[id]);
 var ids={};(a.added.qs||[]).forEach(function(q){ids[q.id]=1});(b.added&&b.added.qs||[]).forEach(function(q){if(!ids[q.id])a.added.qs.push(q)});
 for(var c in (b.added&&b.added.pearls)||{}){a.added.pearls[c]=a.added.pearls[c]||[];b.added.pearls[c].forEach(function(p){if(a.added.pearls[c].indexOf(p)<0)a.added.pearls[c].push(p)})}
 var have={};a.sims.forEach(function(s){have[s.ts]=1});(b.sims||[]).forEach(function(s){if(!have[s.ts])a.sims.push(s)});
 if((b.u||0)>(a.u||0)){a.opts=Object.assign(a.opts,b.opts||{})}
 if((b.resetAt||0)>(a.resetAt||0)){}
 return a}
function save(){P.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}pushSoon();setSave()}
function pushSoon(now){if(!SY.doc)return;clearTimeout(SY.t);var go=function(){SY.last=Date.now();try{SY.doc.set({dev:DEV,u:SY.last,s:JSON.stringify(P)}).then(function(){SY.ok=true;setSave()},function(){SY.ok=false;setSave()})}catch(e){}};if(now)go();else SY.t=setTimeout(go,1000)}
function syncInit(){
 if(!window.claude||!window.claude.use)return;MODE="artifact";setSave();
 Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
  if(!r[0]||!r[1]){MODE="file";setSave();return}
  return r[1].id().then(function(id){if(!id){MODE="file";setSave();return}
   SY.db=r[0];SY.doc=SY.db.doc("data/users/"+id+"/"+KEY);
   return SY.doc.get().then(function(sn){if(sn.exists){var d=sn.data();if(d&&d.s){try{mergeP(P,JSON.parse(d.s))}catch(e){}}}
    try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}pushSoon(true);
    SY.doc.onSnapshot(function(s2){var d=s2.data();if(!d||d.dev===DEV||!d.s||s2.metadata.hasPendingWrites||(d.u||0)<=SY.last)return;try{mergeP(P,JSON.parse(d.s));try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}if(!RUN)render()}catch(e){}},function(){});
    route()})})}).catch(function(){MODE="file";setSave()})}
window.addEventListener("storage",function(e){if(e.key===KEY&&e.newValue){try{mergeP(P,JSON.parse(e.newValue));if(!RUN)render()}catch(x){}}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")pushSoon(true)});
window.addEventListener("pagehide",function(){pushSoon(true)});

/* ---------------- grading ---------------- */
function parseNum(s){var t=String(s==null?"":s).trim().toLowerCase().replace(/,/g,"").replace(/\s*[a-z][a-z\s\/.]*$/,"").trim();
 var m=t.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]+ +m[2]/ +m[3];
 m=t.match(/^(\d+)\s*\/\s*(\d+)$/);if(m)return+m[1]/ +m[2];
 if(/^-?\d*\.?\d+$/.test(t))return parseFloat(t);return NaN}
