evers; the answer is low-grade fevers).","src":"quiz","qno":18},{"id":"q196","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-tx","q":"A client with a diagnosis of prostate cancer is scheduled to have an interstitial implant for high-dose radiation (HDR). What safety measure should the nurse include in this client's plan of care?","o":["Limit the time that visitors spend at the client's bedside.","Teach the client to perform all aspects of basic care independently.","Assign male nurses to the client's care whenever possible.","Situate the client in a shared room with other clients receiving brachytherapy."],"c":0,"x":{"Teach the client to perform all aspects of basic care independently.":"All necessary care should be provided to the client.","Assign male nurses to the client's care whenever possible.":"There is no reason to limit care to male nurses; pregnant nurses and visitors should not be near the client.","Situate the client in a shared room with other clients receiving brachytherapy.":"A single room should be used."},"tk":"ANS: To limit radiation exposure, visitors should generally not spend more than 30 minutes with the client.","w":"ANS: To limit radiation exposure, visitors should generally not spend more than 30 minutes with the client. Pregnant nurses or visitors should not be near the client, but there is no reason to limit care to nurses who are male. All necessary care should be provided to the client and a single room should be used. Safety and Infection Control. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":10},{"id":"q197","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-coag","q":"The nurse is reviewing laboratory results for a patient scheduled for a bleeding time test. Which value requires an immediate intervention?","o":["platelet count of 70,000/mm3","white blood cell count of 13,000/mm3","hemoglobin 9g/L","prothrombin time 12 seconds"],"c":0,"x":{"white blood cell count of 13,000/mm3":"This is a slightly elevated white count, but it is not a contraindication to a bleeding time.","hemoglobin 9g/L":"This is a low hemoglobin, but it is associated with oxygen carrying capacity, not bleeding.","prothrombin time 12 seconds":"This is within the normal range of prothrombin time (10 to 13 seconds)."},"tk":"ANS: A bleeding time is usually not recommended for a patient with a platelet count of less than 75,000 mm³ because of increased risk for massive bleeding and ineffective clotting.","w":"ANS: A bleeding time is usually not recommended for a patient with a platelet count of less than 75,000 mm³ because of increased risk for massive bleeding and ineffective clotting. WBC - This is a slightly elevated white blood cell count, but it would not be a contraindication to a bleeding time. HGB - This is a low hemoglobin, but this is associated with oxygen carrying capacity of red blood cells, not bleeding. PT - This is within the normal range of prothrombin time (10-13 seconds). REF: p. 705, Chapter 33 - FA Davis. (This question appears twice in your quiz, as Q11 and Q15.) (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":11},{"id":"q198","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"Which is an age-related hematological change the nurse anticipates when reviewing a complete blood count (CBC) for an older adult patient?","o":["Increased sedimentation rate","Increased B and T cells","Increased hemoglobin","Increased hematocrit"],"c":0,"x":{"Increased B and T cells":"This is not the anticipated change.","Increased hemoglobin":"This is not the anticipated change.","Increased hematocrit":"This is not the anticipated change."},"tk":"ANS: An increased (ESR) sedimentation rate is anticipated with the aging process.","w":"ANS: An increased (ESR) sedimentation rate is anticipated with the aging process. Objective 7: Discussing changes in hematological function associated with aging. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":13},{"id":"q199","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"Which statement to the nurse by the patient about a planned bone marrow biopsy indicates the need for further teaching?","o":["“I will need to be on strict bedrest for at least 24 hours.”","“I may feel some pressure during the procedure.”","“I can receive sedation for this test.”","“I may hear a crunching sound as the needle punctures the bone.”"],"c":0,"x":{"“I may feel some pressure during the procedure.”":"This is correct teaching.","“I can receive sedation for this test.”":"This is correct teaching.","“I may hear a crunching sound as the needle punctures the bone.”":"This is correct teaching."},"tk":"ANS: \"I will need to be on strict bedrest for at least 24 hours\" - This statement indicates the need for further teaching.","w":"ANS: \"I will need to be on strict bedrest for at least 24 hours\" - This statement indicates the need for further teaching. The patient will be required to rest for several hours, but will not require strict bedrest for 24 hours. Chapter 33, p. 707. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":23},{"id":"q200","ty":"sata","ch":"ch2","t":"pv","cn":"c-pv","q":"The nurse teaches a patient with polycythemia to immediately report which clinical manifestations to his or her healthcare provider? Select all that apply.","o":["Orthopnea","Headache","Fatigue","Temperature 100.4°F (38.0°C)","Pruritus"],"c":[0,1],"x":{"Fatigue":"Fatigue is seen in polycythemia but does not require immediate attention.","Temperature 100.4°F (38.0°C)":"A fever is not one of the keyed immediate reports for polycythemia.","Pruritus":"Pruritus is seen in polycythemia but does not require immediate attention."},"tk":"Answer: Orthopnea (Shortness of Breath) & Headache.","w":"Answer: Orthopnea (Shortness of Breath) & Headache. Rationale: Patients with polycythemia are at increased risk of death secondary to cerebrovascular accidents, myocardial infarction, pulmonary embolus, or hemorrhage due to hyper viscosity of blood. Shortness of breath may be indicate myocardial infarction or pulmonary embolism, and headache may be associated with a cerebrovascular accident. Fatigue and Pruritus are seen in patients with polycythemia, but do not require immediate attention. Chp 34, page 730. (NUR 334 practice quiz)","lp":1,"note":"You missed this one on your quiz (picked fever and pruritus, missed orthopnea).","src":"quiz","qno":24},{"id":"q201","ty":"mc","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"The nurse correlates which diagnostic finding to a diagnosis of multiple myeloma?","o":["Serum creatinine 2.2 mg/dL","Serum calcium 8.5 mg/dL","Serum BUN 15 mg/dL","Hemoglobin 18 g/dL"],"c":0,"x":{"Serum calcium 8.5 mg/dL":"Hypercalcemia in CRAB is above 11.5 mg/dL; 8.5 is not elevated.","Serum BUN 15 mg/dL":"This is not a renal insufficiency finding; CRAB uses creatinine above 2 mg/dL.","Hemoglobin 18 g/dL":"CRAB anemia is hemoglobin below 10 g/dL; 18 is not low."},"tk":"ANS: Serum creatinine 2.2 mg/dL.","w":"ANS: Serum creatinine 2.2 mg/dL. The CRAB criterion is useful when formulating a diagnosis of multiple myeloma and includes hyperCalcemia (serum calcium > 11.5 mg/dL), Renal insufficiency (serum creatinine > 2 mg/dL), Anemia (hemoglobin < 10 g/dL or > 2 g/dL less than the lower limit of normal range), and Bone disease (lytic lesions, severe osteopenia, or pathological fractures). Chapter 34, p. 744. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":21},{"id":"q202","ty":"mc","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"An oncology nurse is caring for a client with multiple myeloma who is experiencing bone destruction. When reviewing the client's most recent blood tests, the nurse should anticipate which imbalance?","o":["Hypercalcemia","Elevated red blood count (RBC)","Elevated serum viscosity","Hyperproteinemia"],"c":0,"x":{"Elevated red blood count (RBC)":"Myeloma causes anemia, not a high red cell count.","Elevated serum viscosity":"This is not the keyed imbalance.","Hyperproteinemia":"This is not the keyed imbalance."},"tk":"ANS: Hypercalcemia - is the most common metabolic complication associated with multiple myeloma.","w":"ANS: Hypercalcemia - is the most common metabolic complication associated with multiple myeloma. MM is a type of cancer affecting immune cells in the bone marrow called plasma cells. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":25},{"id":"q203","ty":"mc","ch":"ch1","t":"risk","cn":"c-risk-list","q":"During a routine mammogram, a client asks the nurse whether breast cancer causes the most deaths. Which type of cancer is the leading cause of death in the United States?","o":["Lung","Breast","Colorectal","Prostate"],"c":0,"x":{"Breast":"Breast cancer follows lung and prostate in cancer-related deaths in this key.","Colorectal":"Colorectal cancer is the third-leading cause of cancer-related deaths.","Prostate":"Prostate cancer follows lung cancer in men."},"tk":"ANS: Lung cancer is the leading cause of cancer-related deaths in the United States, followed by prostate cancer in men and breast cancer in women.","w":"ANS: Lung cancer is the leading cause of cancer-related deaths in the United States, followed by prostate cancer in men and breast cancer in women. Colorectal cancer is the third-leading cause of cancer-related deaths in the United States. Cancer is a common health problem worldwide. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":7},{"id":"q204","ty":"mc","ch":"ch1","t":"stage","cn":"c-stage-tnm","q":"A patient being treated for cancer has a tumor designation of Stage IV, T4, N3, M1. What does this staging indicate to the nurse?","o":["The tumor has metastasized with lymph node involvement.","The tumor will respond to chemotherapy","The tumor is big in size , has not metastasized and will not respond to chemotherapy","There is one single tumor to treat"],"c":0,"x":{"The tumor will respond to chemotherapy":"The staging system is not used to determine tumor response to chemotherapy.","The tumor is big in size , has not metastasized and will not respond to chemotherapy":"Stage IV indicates metastasis.","There is one single tumor to treat":"There is no way to determine the number of tumors from this designation."},"tk":"ANS: The tumor has metastasized with lymph node involvement. 1) T refers to the depth of invasion.","w":"ANS: The tumor has metastasized with lymph node involvement. 1) T refers to the depth of invasion. A 4 indicates a large, not small, tumor. 2) There is no way to determine the number of tumors based on this designation. 3) The staging system is not used to determine tumor response to chemotherapy. 4) Stage IV indicates metastasis. N refers to the absence or presence and extent of lymph node involvement. The N3 indicates a significant number of lymph nodes are involved. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":9},{"id":"q205","ty":"sata","ch":"ch1","t":"risk","cn":"c-risk-caution","q":"The nurse working in oncology unit is discussing on how to recognize cues in the clinical presentation of cancer. Select all that apply.","o":["Irregularly shape mole","Persistent bleeding of the gums","Nagging cough","Painful menstruation","Colorless and odorless discharge"],"c":[0,1,2],"x":{"Painful menstruation":"This is not a CAUTION cue.","Colorless and odorless discharge":"The CAUTION cue is unusual bleeding or discharge; a colorless, odorless discharge is not the keyed cue."},"tk":"ANS: Nagging cough, persistent bleeding in the gums, irregularly shape mole.","w":"ANS: Nagging cough, persistent bleeding in the gums, irregularly shape mole. Ref: Chp 11 - Overview of Cancer, FA Davis Advantage, 2nd Edition. (NUR 334 practice quiz)","lp":1,"note":"You partly missed this one on your quiz (you missed persistent bleeding of the gums).","src":"quiz","qno":28},{"id":"q206","ty":"mc","ch":"ch1","t":"risk","cn":"c-risk-prev","q":"Which nursing action best demonstrates primary cancer prevention?","o":["Promoting and providing vaccines","Teaching testicular self-examination","Encouraging yearly Pap tests","Facilitating screening mammograms"],"c":0,"x":{"Teaching testicular self-examination":"This is early detection, a secondary prevention.","Encouraging yearly Pap tests":"Pap tests are screening, a secondary prevention.","Facilitating screening mammograms":"Screening mammograms are secondary prevention."},"tk":"ANS: Primary prevention is concerned with reducing the risks of cancer in healthy people through practices such as promoting vaccines that prevent cancer.","w":"ANS: Primary prevention is concerned with reducing the risks of cancer in healthy people through practices such as promoting vaccines that prevent cancer. Secondary prevention involves detection and screening to achieve early diagnosis, as demonstrated by Pap tests, mammograms, and testicular exams. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":31},{"id":"q207","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"A 60-year-old client with chronic myeloid leukemia (CML) will be treated in the home setting, and the nurse is preparing appropriate health education. Which topic should the nurse emphasize?","o":["The importance of adhering to the prescribed drug regimen","The importance of daily physical activity","The need to avoid shellfish and raw foods","The need to ensure that vaccinations are up to date"],"c":0,"x":{"The importance of daily physical activity":"Daily physical activity may be impossible for the client.","The need to avoid shellfish and raw foods":"Dietary restrictions are not normally necessary.","The need to ensure that vaccinations are up to date":"Vaccinations normally would not be given during treatment."},"tk":"ANS: The importance of adhering to the prescribed drug regimen.","w":"ANS: The importance of adhering to the prescribed drug regimen. Understand that the effectiveness of the drugs used to treat CML is based on the ability of the client to adhere to the medication regimen as prescribed. Adherence is often incomplete, thus this must be a focus of health education. Vaccinations normally would not be given during treatment, and daily physical activity may be impossible for the client. Dietary restrictions are not normally necessary. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":30},{"id":"q208","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"Which statement by the patient with stage IV breast cancer indicates the need for further teaching?","o":["“The tumor is large but there is not metastasis.”","“The dimpling of the breast is a sign of cancer.”","“There is a risk of this stage of cancer spreading to other parts of my body.”","“This stage of cancer is usually in the lymph nodes.”"],"c":0,"x":{"“The dimpling of the breast is a sign of cancer.”":"This is correct; dimpling is a skin change of breast cancer.","“There is a risk of this stage of cancer spreading to other parts of my body.”":"This is correct teaching.","“This stage of cancer is usually in the lymph nodes.”":"This is correct teaching."},"tk":"ANS: “The tumor is large but there is not metastasis.” - This patient requires further teaching because stage IV breast cancer does involve metastasis to other parts of the body.","w":"ANS: “The tumor is large but there is not metastasis.” - This patient requires further teaching because stage IV breast cancer does involve metastasis to other parts of the body. Chapter 65 - page 1507-1509. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":6},{"id":"q209","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-types","q":"The clinical nurse educator is reinforcing education to a patient who will have fine-needle aspiration breast biopsy. Which patient statement indicates a need for additional teaching?","o":["“Although my mass is palpable, I will still require ultrasound imaging with the biopsy.”","“I will apply ice to the biopsy site to decrease pain and inflammation.”","\"I will have local anesthesia to decrease discomfort\"","“A sample of the mass will be suctioned out into a syringe.”"],"c":0,"x":{"“I will apply ice to the biopsy site to decrease pain and inflammation.”":"This is correct teaching.","\"I will have local anesthesia to decrease discomfort\"":"This is correct teaching.","“A sample of the mass will be suctioned out into a syringe.”":"This is correct: FNA suctions cells into a syringe. This is the statement you picked as needing teaching on your quiz."},"tk":"ANS: Nonpalpable masses often require guidance to the mass through mammographic imaging, ultrasound, or magnetic resonance imaging (MRI); therefore, this patient statement indicates the need for additional teaching.","w":"ANS: Nonpalpable masses often require guidance to the mass through mammographic imaging, ultrasound, or magnetic resonance imaging (MRI); therefore, this patient statement indicates the need for additional teaching. Chapter 65, Types of Breast Biopsy, FA Davis Advantage page 1510. (NUR 334 practice quiz)","lp":1,"note":"You missed this one on your quiz (picked the suction statement).","src":"quiz","qno":22},{"id":"q210","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-tx","q":"The nurse is reviewing data collected during a health history and physical assessment and determines that a patient is at risk for developing breast cancer. Which data support this patient’s risk for developing breast cancer? Select all that apply.","o":["Menopause at age 58","Sister had breast cancer","Age 60","Enlarged lymph nodes","Body mass index 22"],"c":[0,1,2],"x":{"Enlarged lymph nodes":"Enlarged lymph nodes are a possible finding of cancer, not a risk factor.","Body mass index 22":"Breastfeeding and maintaining a normal body weight lower a person’s risk for developing breast cancer."},"tk":"ANSWERS: The risk for developing breast cancer increases with age.","w":"ANSWERS: The risk for developing breast cancer increases with age. Having a first-degree relative with breast cancer increases the risk. Menopause after the age of 55 also increases the risk for developing breast cancer. Breastfeeding and maintaining a normal body weight lower a person’s risk for developing breast cancer. Chapter 65, page 1507. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":26},{"id":"q211","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"The nurse explains to the client the commonly use chemotherapy agents in breast cancer. Select all that apply.","o":["5-FU","Adriamycin","Cytoxan","Docetaxel","Taxotere"],"c":[0,1,2],"x":{"Docetaxel":"Your quiz key treats docetaxel as a prostate cancer medication. (The Davis Table 65.3 in your study guide lists docetaxel among breast chemotherapy drugs, so ask your instructor.)","Taxotere":"Taxotere is the brand name of docetaxel; your quiz key treats it as a prostate cancer medication."},"tk":"ANS: Breast cancer case study, Q# 9: Cytoxan, Adriamycin, 5-FU.","w":"ANS: Breast cancer case study, Q# 9: Cytoxan, Adriamycin, 5-FU. Incorrect - Taxotere & Docetaxel are Prostate cancer medications. (NUR 334 practice quiz)","lp":1,"note":"Lecture vs book: your quiz key says docetaxel/Taxotere are prostate drugs, but Davis Table 65.3 in your first study guide lists docetaxel (and paclitaxel) with breast cancer chemotherapy. Follow the quiz key for this question and ask your instructor which will be tested.","src":"quiz","qno":32},{"id":"q212","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"A nurse is educating a breast cancer client who has been prescribed with filgrastim (Neupogen). What explanation are you going to tell about the use of Neupogen as part of treatment regimen.","o":["Improve the number and function of Neutrophils","You need to drink 3,00ml a day after taking this medication","Replace abnormal cells in the bone marrow with normal cells","Taking this drug at nighttime will reduce nausea"],"c":0,"x":{"You need to drink 3,00ml a day after taking this medication":"Fluid volume is not the purpose of the drug.","Replace abnormal cells in the bone marrow with normal cells":"That describes a stem cell or bone marrow transplant.","Taking this drug at nighttime will reduce nausea":"It is a growth factor, not an antiemetic."},"tk":"ANS: Improve the number and function of neutrophils.","w":"ANS: Improve the number and function of neutrophils. Breast cancer case study, Q# 12. Management of Care. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":37},{"id":"q213","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"The RN recognizes her client was prescribed with aromatase inhibitor (tamoxifen) as part of her teaching, tamoxifen is used to do which of the following.","o":["Blocks estrogen receptor in breast tissue","Minimize the effects of lymphedema","Replace abnormal cells in the bone marrow with normal cells","Help chemotherapeutic meds more effective in treating breast cancer"],"c":0,"x":{"Minimize the effects of lymphedema":"Tamoxifen does not treat lymphedema.","Replace abnormal cells in the bone marrow with normal cells":"That describes a transplant.","Help chemotherapeutic meds more effective in treating breast cancer":"Tamoxifen is endocrine therapy that blocks estrogen; it is not a chemotherapy enhancer."},"tk":"ANS: tamoxifen - Blocks estrogen receptor in breast tissue.","w":"ANS: tamoxifen - Blocks estrogen receptor in breast tissue. Chapter 65 - Breast cancer treatment, page 1511. (NUR 334 practice quiz)","lp":1,"note":"Wording problem in the question: it calls tamoxifen an aromatase inhibitor. Your study guide lists tamoxifen as a SERM that blocks the estrogen receptor and anastrozole, letrozole and exemestane as the aromatase inhibitors.","src":"quiz","qno":44},{"id":"q214","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-patho","q":"A nurse is performing an admission assessment on a 40-year-old man who has been admitted for outpatient surgery on the right knee. While taking the client's family history, the client states, \"My father died of prostate cancer at age 48.\" The nurse should instruct the client on which of the following health promotion activities?","o":["The client should have PSA levels drawn regularly.","The client should have testing for presence of the CDH1 and STK11 genes.","The client should limit alcohol use due to the risk of malignancy.","The client will need PSA levels drawn starting at age 55."],"c":0,"x":{"The client should have testing for presence of the CDH1 and STK11 genes.":"This is not the keyed health promotion activity.","The client should limit alcohol use due to the risk of malignancy.":"This is not the keyed activity for this family history.","The client will need PSA levels drawn starting at age 55.":"A father diagnosed at 48 is a strong family history; screening is discussed earlier (age 40 with more than one early-onset relative, 45 with a relative diagnosed before 65)."},"tk":"ANS: The client should have PSA levels drawn regularly.","w":"ANS: The client should have PSA levels drawn regularly. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":20},{"id":"q215","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-patho","q":"Which statement by the patient with a prostate-specific antigen (PSA) of 2.0 ng/dL indicates understanding of the 2017 recommendations regarding prostate cancer screening?","o":["“I will continue to have my PSA checked every year.”","“I need to have a digital rectal examination (DRE).”","“I am at high risk of prostate cancer.”","“I will need to have a prostate biopsy.”"],"c":0,"x":{"“I need to have a digital rectal examination (DRE).”":"This is not the keyed statement.","“I am at high risk of prostate cancer.”":"A PSA of 2.0 is below the 4 ng/mL level that needs further evaluation.","“I will need to have a prostate biopsy.”":"A biopsy follows an abnormal DRE or PSA."},"tk":"ANS: “I will continue to have my PSA checked every year.” Rationale printed in your quiz: For those men who have a PSA less than 2.5 ng/mL, the recommendation is continued testing every other year.","w":"ANS: “I will continue to have my PSA checked every year.” Rationale printed in your quiz: For those men who have a PSA less than 2.5 ng/mL, the recommendation is continued testing every other year. Chp 66 - Davis Advantage. (NUR 334 practice quiz)","lp":1,"note":"Key problem: the keyed answer says every year, but the rationale printed under it (and your study guide: PSA under 2.5 is retested every 2 years, 2.5 or higher yearly) say every other year. The question also writes the unit as ng/dL. Follow the key for this question and ask your instructor.","src":"quiz","qno":34},{"id":"q216","ty":"mc","ch":"ch7","t":"prostate","cn":"c-pros-tx","q":"The client diagnosed with Prostate cancer was prescribed with treatment that will maximizing tumor exposure while minimizing injury to normal cells. the nurse explained that the delivery of the treatment will be internally via placement in a cavity. What type of treatment would this be?","o":["Brachytherapy","Resection of the Prostate","Chemotherapy","Stem cell transplantation"],"c":0,"x":{"Resection of the Prostate":"Resection is surgical removal, not internal radiation.","Chemotherapy":"Chemotherapy is given as drugs, not placed in a cavity.","Stem cell transplantation":"A transplant infuses stem cells after high-dose therapy."},"tk":"ANS: Brachytherapy, radiation therapy delivered internally via placement in a cavity or reservoir in the body.","w":"ANS: Brachytherapy, radiation therapy delivered internally via placement in a cavity or reservoir in the body. Chapter 13 - page 244 - Figure 13.6 - Brachytherapy. (NUR 334 practice quiz)","lp":1,"note":"Your review PDF printed a rationale about doxorubicin (a vesicant) under this question; that text belongs to a different question. The brachytherapy rationale from the chapter reference is used here.","src":"quiz","qno":42},{"id":"q217","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"A client has just been diagnosed with lung cancer. After the health care provider discusses treatment options and leaves the room, the client asks the nurse how the treatment is decided upon. What would be the nurse's best response?","o":["\"The type of treatment depends on the cell type of the cancer, the stage of the cancer, and the client's health status.\"","\"The type of treatment depends on what the client wants when given the options.\"","\"The type of treatment depends on the discussion between the client and the health care provider of which treatment is best.\"","\"The type of treatment depends on the client's age and health status.\""],"c":0,"x":{"\"The type of treatment depends on what the client wants when given the options.\"":"Treatment does not depend solely on the client's preference.","\"The type of treatment depends on the discussion between the client and the health care provider of which treatment is best.\"":"This discussion takes place, but it is not what the decision primarily depends on.","\"The type of treatment depends on the client's age and health status.\"":"Treatment does not depend solely on the client's age."},"tk":"ANS: Treatment of lung cancer depends on the cell type, the stage of the disease, and the client's physiologic status (particularly cardiac and pulmonary status).","w":"ANS: Treatment of lung cancer depends on the cell type, the stage of the disease, and the client's physiologic status (particularly cardiac and pulmonary status). Treatment does not depend solely on the client's age or the client's preference between the different treatment modes. The decision about treatment does not primarily depend on a discussion between the client and the health care provider of which treatment is best, though this discussion will take place. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":8},{"id":"q218","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"The nurse is caring for a client who is scheduled for a lobectomy for lung cancer. While assisting with a subclavian vein central line insertion, the nurse notes that the client's oxygen saturation is rapidly dropping. The client reports shortness of breath and becomes tachypneic. The nurse suspects a pneumothorax has developed. Which further assessment finding would support the presence of a pneumothorax?","o":["Diminished or absent breath sounds on the affected side","Paradoxical chest wall movement with respirations","Muffled heart sounds","Sudden loss of consciousness"],"c":0,"x":{"Paradoxical chest wall movement with respirations":"Paradoxical chest wall movements occur in flail chest.","Muffled heart sounds":"Muffled or distant heart sounds occur in pericardial tamponade.","Sudden loss of consciousness":"Sudden loss of consciousness does not typically occur."},"tk":"ANS: In the case of a simple pneumothorax, auscultating the breath sounds will reveal absent or diminished breath sounds on the affected side.","w":"ANS: In the case of a simple pneumothorax, auscultating the breath sounds will reveal absent or diminished breath sounds on the affected side. Paradoxical chest wall movements occur in flail chest conditions. Sudden loss of consciousness does not typically occur. Muffled or distant heart sounds occur in pericardial tamponade. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":33},{"id":"q219","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-types","q":"A client has just been diagnosed with small cell lung cancer. The client asks the nurse why the doctor is not offering surgery as a treatment for the cancer. Which fact about lung cancer treatment should inform the nurse's response?","o":["Small cell cancer of the lung grows rapidly and metastasizes early and extensively.","The cells in small cell cancer of the lung are not large enough to visualize in surgery.","Clients with small cell lung cancer are not normally stable enough to survive surgery.","Small cell lung cancer is self-limiting in many clients, and surgery should be delayed."],"c":0,"x":{"The cells in small cell cancer of the lung are not large enough to visualize in surgery.":"Difficult visualization is not the limiting factor.","Clients with small cell lung cancer are not normally stable enough to survive surgery.":"A client's medical instability is not the limiting factor.","Small cell lung cancer is self-limiting in many clients, and surgery should be delayed.":"Lung cancer is not a self-limiting disease."},"tk":"ANS: Surgery is primarily used for non-small cell lung cancer, because small cell cancer of the lung grows rapidly and metastasizes early and extensively.","w":"ANS: Surgery is primarily used for non-small cell lung cancer, because small cell cancer of the lung grows rapidly and metastasizes early and extensively. Difficult visualization and a client's medical instability are not the limiting factors. Lung cancer is not a self-limiting disease. Chapter 26 - Lung cancer. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":39},{"id":"q220","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"When should palliative care be initiated for patients diagnosed with lung cancer?","o":["Upon diagnosis","After surgery","After chemotherapy","Upon patient request"],"c":0,"x":{"After surgery":"Palliative care is appropriate from the diagnosis of a life-threatening illness.","After chemotherapy":"It is not delayed until after treatment.","Upon patient request":"It is considered at diagnosis, not only on request."},"tk":"ANS: Palliative care services are appropriate to consider with the diagnosis of a life-threatening illness like lung cancer.","w":"ANS: Palliative care services are appropriate to consider with the diagnosis of a life-threatening illness like lung cancer. Palliative care improves the quality of life of patients and families. In addition providing pain relief, palliative care can also help in management of other distressing and debilitating symptoms like SOB and N & V. Chapter 26. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":46},{"id":"q221","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"The nurse is caring for an adult client recently diagnosed with the early stages of lung cancer. The nurse is aware that the preferred method of treating clients with non–small cell tumors is what method?","o":["Surgical resection","Radiation","Bronchoscopic opening of the airway","Chemotherapy"],"c":0,"x":{"Radiation":"Radiation may be considered, but surgery is preferred.","Bronchoscopic opening of the airway":"This may be considered, but surgery is preferred.","Chemotherapy":"Chemotherapy may be considered, but surgery is preferred."},"tk":"ANS: Surgical resection is the preferred method of treating clients with localized non–small cell tumors with no evidence of metastatic spread and adequate cardiopulmonary function.","w":"ANS: Surgical resection is the preferred method of treating clients with localized non–small cell tumors with no evidence of metastatic spread and adequate cardiopulmonary function. The other listed treatment options may be considered, but surgery is preferred. Small cell cancer grows quickly and metastasizes to other organs. Chp 26. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":48},{"id":"q222","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"The nurse is reviewing the complete blood cell (CBC) count for a female patient recently admitted to the medical-surgical unit. The CBC count is as follows: platelet 180,000/mm³; hemoglobin 15 g/dL; red blood cells 4.4 million cells/mm³; white blood cells 6 10³/mm³. What is the nurse’s analysis of these results?","o":["The patient’s laboratory values are within normal limits","The patient is anemic","The patient has leukopenia.","The patient has thrombocytopenia"],"c":0,"x":{"The patient is anemic":"A hemoglobin of 15 g/dL is within the female range of 11.7 to 15.5.","The patient has leukopenia.":"A WBC of 6 ×10³/mm³ is within 4.5 to 11.1.","The patient has thrombocytopenia":"A platelet count of 180,000 is within 150,000 to 450,000."},"tk":"ANS: Platelets 150,000 to 450,000/mm³, hemoglobin 11.7 to 15.5 g/dL in a female adult, red blood cell count 3.61 to 5.11 million cells/mm³, and white blood cell count 4.5 to 11.1 10³/mm³ indicate normal values in this patient.","w":"ANS: Platelets 150,000 to 450,000/mm³, hemoglobin 11.7 to 15.5 g/dL in a female adult, red blood cell count 3.61 to 5.11 million cells/mm³, and white blood cell count 4.5 to 11.1 10³/mm³ indicate normal values in this patient. (NUR 334 practice quiz)","lp":1,"note":"Lecture vs book: the RBC range in this key (3.61 to 5.11 million) and the class sheet (4.5 to 5.5) differ slightly; this patient is normal by either.","src":"quiz","qno":35},{"id":"q223","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-coag","q":"The nurse monitors which laboratory results in the patient with a clotting disorder caused by the intrinsic pathway?","o":["Partial thromboplastin time (PTT)","Complete Blood cell count ( CBC)","Prothrombin time (PT)","Reticulocyte count"],"c":0,"x":{"Complete Blood cell count ( CBC)":"A CBC counts cells and does not monitor the intrinsic pathway.","Prothrombin time (PT)":"PT monitors the extrinsic pathway.","Reticulocyte count":"Reticulocytes are immature red cells."},"tk":"A partial thromboplastin time (PTT) is anticipated for a patient experiencing issues with the intrinsic pathway.","w":"A partial thromboplastin time (PTT) is anticipated for a patient experiencing issues with the intrinsic pathway. The purpose of the PTT or activated PTT (aPTT) is to screen for deficiencies of the clotting factors in the intrinsic pathways and to monitor response to thrombin inhibitor therapy (heparin, argatroban). (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":45},{"id":"q224","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-nursing","q":"A client with leukemia has developed stomatitis and is experiencing a nutritional deficit. An oral anesthetic has consequently been prescribed. What health education should the nurse provide to the client?","o":["Chew with care to avoid inadvertently biting the tongue.","Brush teeth before and after eating.","Swallow slowly and deliberately.","Use the oral anesthetic 1 hour prior to mealtime."],"c":0,"x":{"Brush teeth before and after eating.":"There is no specific need to warn about brushing because an oral anesthetic is used.","Swallow slowly and deliberately.":"There is no specific need to warn about swallowing slowly.","Use the oral anesthetic 1 hour prior to mealtime.":"An oral anesthetic would be metabolized by the time the client eats if used 1 hour prior to meals."},"tk":"ANS: If oral anesthetics are used, the client must be warned to chew with extreme care to avoid inadvertently biting the tongue or buccal mucosa.","w":"ANS: If oral anesthetics are used, the client must be warned to chew with extreme care to avoid inadvertently biting the tongue or buccal mucosa. An oral anesthetic would be metabolized by the time the client eats if it is used 1 hour prior to meals. There is no specific need to warn the client about brushing teeth or swallowing slowly because an oral anesthetic has been used. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":36},{"id":"q225","ty":"mc","ch":"ch4","t":"hodgkin","cn":"c-hodg-dx","q":"A client with Hodgkin lymphoma is receiving information from the oncology nurse. The client asks the nurse why it is necessary to stop drinking and smoking and stay out of the sun. Which response by the nurse would be best?","o":["\"It's important to reduce other factors that increase the risk of second cancers.\"","\"Avoiding these factors can reduce the risk of Reed-Sternberg cells developing.\"","\"Engaging in these activities increases your risk of hemorrhage.\"","\"These behaviors can reduce the effectiveness of your chemotherapy.\""],"c":0,"x":{"\"Avoiding these factors can reduce the risk of Reed-Sternberg cells developing.\"":"Reed-Sternberg cells are the pathologic hallmark of Hodgkin lymphoma; avoiding these behaviors will not reduce their development.","\"Engaging in these activities increases your risk of hemorrhage.\"":"Hemorrhage is not a typical complication of Hodgkin lymphoma.","\"These behaviors can reduce the effectiveness of your chemotherapy.\"":"There is no evidence that these behaviors reduce the effectiveness of chemotherapy."},"tk":"ANS: The nurse should encourage clients to reduce other factors that increase the risk of developing second cancers, such as use of tobacco and alcohol and exposure to environmental carcinogens and excessive sunlight.","w":"ANS: The nurse should encourage clients to reduce other factors that increase the risk of developing second cancers, such as use of tobacco and alcohol and exposure to environmental carcinogens and excessive sunlight. The presence of Reed-Sternberg cells is the pathologic hallmark and essential diagnostic criterion for Hodgkin lymphoma. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":47},{"id":"q226","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"A client is undergoing diagnostic testing for chronic lymphocytic leukemia (CLL). Which assessment finding is certain to be present if the client has CLL?","o":["Increased lymphocyte levels","Intractable bone pain","Thrombocytopenia with no evidence of bleeding","Increased numbers of blast cells"],"c":0,"x":{"Intractable bone pain":"This may or may not be present and is not definitive for CLL.","Thrombocytopenia with no evidence of bleeding":"This may or may not be present and is not definitive for CLL.","Increased numbers of blast cells":"This may or may not be present and is not definitive for CLL."},"tk":"ANS: An increased lymphocyte count (lymphocytosis) is always present in clients with CLL.","w":"ANS: An increased lymphocyte count (lymphocytosis) is always present in clients with CLL. Each of the other listed symptoms may or may not be present, and none is definitive for CLL. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":38},{"id":"q227","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"The nurse is assisting the healthcare provider with bone marrow aspiration and biopsy on a patient who has leukemia. The patient also has thrombocytopenia. On completing the test, which intervention is a priority for the nurse?","o":["Hold pressure on the wound for at least 5 to 10 minutes.","Assess for post-procedure pain after the bone marrow biopsy","Teach the patient about signs of infection.","Label and refrigerate the specimen obtained by the provider."],"c":0,"x":{"Assess for post-procedure pain after the bone marrow biopsy":"Pain is assessed, but preventing bleeding comes first in thrombocytopenia.","Teach the patient about signs of infection.":"Teaching is important but is not the priority over preventing bleeding.","Label and refrigerate the specimen obtained by the provider.":"Specimen handling is not the priority for the client."},"tk":"ANS: The most important task for the nurse is to prevent bleeding after the biopsy.","w":"ANS: The most important task for the nurse is to prevent bleeding after the biopsy. Holding pressure on the wound for 5 minutes is effective. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":27},{"id":"q228","ty":"sata","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"The nurse provides discharge instructions to a patient who is neutropenic. Which patient statements indicate the need for additional teaching? Select all that apply.","o":["“I will use a humidifier to moisten the air at night.”","“My prescribed antibiotic can be stopped once I feel better.”","“I will wash my hands before and after meals”","“I will wash all raw vegetables before eating them.”","“My plants are being moved outside.”"],"c":[0,1],"x":{"“I will wash my hands before and after meals”":"This is correct teaching.","“I will wash all raw vegetables before eating them.”":"This is correct teaching.","“My plants are being moved outside.”":"This is correct teaching; live plants are removed from the home."},"tk":"Correct answers: humidifier statement and stopping antibiotic statement.","w":"Correct answers: humidifier statement and stopping antibiotic statement. Humidifiers hold standing water that can grow organisms, and prophylactic antimicrobials are taken daily and the whole course is finished. (Your review PDF did not include the printed feedback for this question; this rationale is from your study guide, Box 34.2.) (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":49},{"id":"q229","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"A client with iron deficiency anemia is choosing a meal. Which meal indicates the best choice?","o":["Roast beef, steamed spinach, tomato soup, orange juice","Broiled fish, lettuce salad, grapefruit half, carrot sticks","Pork chop, mashed potatoes and gravy, cauliflower, tea","Cheese pizza with a glass of milk"],"c":0,"x":{"Broiled fish, lettuce salad, grapefruit half, carrot sticks":"This meal has less iron than the roast beef and spinach meal.","Pork chop, mashed potatoes and gravy, cauliflower, tea":"This meal has little vitamin C to help absorb iron.","Cheese pizza with a glass of milk":"Dairy blocks iron absorption."},"tk":"ANS: Roast beef, steamed spinach, tomato soup, orange juice.","w":"ANS: Roast beef, steamed spinach, tomato soup, orange juice. Rationale: This patient is anemic and needs iron. This meal contains iron in the beef, folic acid in the spinach, and vitamin C in the tomato soup and orange juice. Vitamin C helps absorption of the iron; folic acid is needed for production of red blood cells. Chapter 34. (NUR 334 practice quiz)","lp":1,"note":"Your review PDF did not include the question stem or the first choices (it said the item was about an anemic patient choosing the best meal), so the stem is rebuilt from your class case and the fourth choice (cheese pizza with milk) is added.","src":"quiz","qno":50},{"id":"q230","ty":"mc","ch":"ch8","t":"pain","cn":"c-pain","q":"World Health Organization step ladder recommends what step are the use of dihydrocodeine, dextropropoxyphene with or without adjuvant analgesics?","o":["Step 2","Step 1","Step 3","Step 4"],"c":0,"x":{"Step 1":"Step 1 is a nonopioid, with or without an adjuvant.","Step 3":"Step 3 is a strong opioid such as morphine or fentanyl.","Step 4":"The WHO ladder has three steps."},"tk":"ANS: Step 2 - moderate pain.","w":"ANS: Step 2 - moderate pain. Chp. 11, Table 11.8 The World Health Organization ladder - FA Davis Advantage, medical surgical, 2nd Edition, page 200. (NUR 334 practice quiz)","lp":1,"note":"You missed this one on your quiz (you picked Step 3).","src":"quiz","qno":41},{"id":"q231","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"Give patient 500 mg of dopamine in 250 mL of D5W to infuse at 20 mg/hr. Calculate the flow rate in mL/hr.","o":[],"c":{"answer":10,"unit":"mL/hr","setup":"(Ordered per hour ÷ Have) × Volume = (20 mg/hr ÷ 500 mg) × 250 mL = 10 mL/hr","near":{"20":"20 repeats the ordered dose; the concentration (500 mg in 250 mL = 2 mg/mL) has not been used.","16":"16 does not follow from the setup.","15":"15 does not follow from the setup.","40":"40 mL/hr inverts the setup (500 ÷ 20 × ...)."}},"x":{},"tk":"ANS: (Ordered Per Hour ÷ Have) × Volume (mL) = Y (Flow Rate in mL/hr) → (20 mg/hr ÷ 500 mg) × 250 mL = 10 mL/hr.","w":"ANS: (Ordered Per Hour ÷ Have) × Volume (mL) = Y (Flow Rate in mL/hr) → (20 mg/hr ÷ 500 mg) × 250 mL = 10 mL/hr. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":40},{"id":"q232","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"Calculate the IV flow rate for 1200 mL of NS to be infused in 6 hours. The infusion set is calibrated for a drop factor of 15 gtts/mL.","o":[],"c":{"answer":50,"unit":"gtts/min","setup":"6 hr × 60 = 360 min; (1200 mL ÷ 360 min) × 15 gtts/mL = 50 gtts/min","near":{"200":"200 is the mL/hr rate (1200 ÷ 6); the drop factor and minutes were not used.","60":"60 does not follow from the setup.","15":"15 is only the drop factor.","40":"40 does not follow from the setup.","3.33":"3.33 is mL/min; multiply by the drop factor of 15 to get gtts/min."}},"x":{},"tk":"ANS: (Volume (mL) ÷ Time (min)) × Drop Factor (gtts/mL) = Y (Flow Rate in gtts/min).","w":"ANS: (Volume (mL) ÷ Time (min)) × Drop Factor (gtts/mL) = Y (Flow Rate in gtts/min). Convert 6 hours to minutes: 6 hr × 60 = 360 min. (1200 mL ÷ 360 min) × 15 gtts/mL = 50 gtts/min. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":43},{"id":"q233","ty":"mc","ch":"ch8","t":"pain","cn":"c-pain","q":"A client with severe cancer pain is not relieved by a moderate opioid plus a nonopioid. According to the WHO ladder, which medication group does the nurse expect next?","o":["A strong opioid such as morphine or fentanyl plus a nonopioid","Acetaminophen alone","A weaker opioid such as codeine plus a nonopioid","An NSAID alone"],"c":0,"x":{"Acetaminophen alone":"Step 1 is a nonopioid alone for mild pain.","A weaker opioid such as codeine plus a nonopioid":"That is step 2, which has not worked.","An NSAID alone":"A nonopioid alone is step 1 for mild pain."},"tk":"The WHO ladder has three steps: nonopioid for mild pain, a moderate opioid plus a nonopioid for moderate pain, and a strong opioid plus a nonopioid for severe pain.","w":"The WHO ladder has three steps: nonopioid for mild pain, a moderate opioid plus a nonopioid for moderate pain, and a strong opioid plus a nonopioid for severe pain. A nonopioid stays at every step, with or without an adjuvant. Doses are given around the clock for cancer pain. (study guide, Ch 26 and Ch 11)"},{"id":"q234","ty":"mc","ch":"ch8","t":"pain","cn":"c-pain","q":"A client takes Percocet for pain and also acetaminophen for a headache. Which teaching is most important?","o":["Acetaminophen is limited to 1,000 mg per dose and 3,000 mg in 24 hours, and combination products contain acetaminophen","Acetaminophen has no daily limit when taken with an opioid","Acetaminophen is safe in any amount for the liver","Acetaminophen is an anti-inflammatory and should replace the NSAID"],"c":0,"x":{"Acetaminophen has no daily limit when taken with an opioid":"The limit is 3,000 mg in 24 hours.","Acetaminophen is safe in any amount for the liver":"It can cause liver damage at higher doses.","Acetaminophen is an anti-inflammatory and should replace the NSAID":"It has few anti-inflammatory effects."},"tk":"Acetaminophen causes liver damage in excess.","w":"Acetaminophen causes liver damage in excess. Hidden acetaminophen is in Percocet, Vicodin and cold medicines, so the nurse teaches reading labels. Alcohol and barbiturates increase hepatotoxicity. (study guide, Ch 11)"},{"id":"q235","ty":"mc","ch":"ch8","t":"pain","cn":"c-pain","q":"A client receiving morphine has slowed respirations and has not had a bowel movement in 4 days. Which receptor explains both effects?","o":["Mu receptors","Beta receptors","COX-1 receptors","NMDA receptors"],"c":0,"x":{"Beta receptors":"Beta receptors are not the opioid effect described.","COX-1 receptors":"COX-1 inhibition by NSAIDs causes GI ulcers and bleeding.","NMDA receptors":"NMDA blockers such as ketamine are adjuvants for resistant pain."},"tk":"Opioid binding at mu receptors causes respiratory depression, constipation (decreased GI motility), sedation, miosis and euphoria.","w":"Opioid binding at mu receptors causes respiratory depression, constipation (decreased GI motility), sedation, miosis and euphoria. Respiratory depression is the most critical adverse effect, and stool softeners and laxatives are almost always needed. (study guide, Ch 11)"},{"id":"q236","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"The provider orders 500 mg of a drug by mouth. The pharmacy supplies a liquid labeled 250 mg per 5 mL. How many milliliters does the nurse give?","o":[],"c":{"answer":10,"unit":"mL","setup":"(Desired ÷ Have) × Quantity = (500 mg ÷ 250 mg) × 5 mL = 10 mL","near":{"2":"2 is the number of 250 mg doses; it was not multiplied by the 5 mL quantity.","5":"5 is the quantity per dose on the label, not the volume for 500 mg.","2.5":"2.5 divides 5 by 2, which inverts the ratio.","25":"25 multiplies 500 by 5 and does not divide by the 250 mg on hand."}},"x":{},"tk":"The basic formula is desired over have times quantity.","w":"The basic formula is desired over have times quantity. Here the dose needed is twice the dose in each 5 mL, so the volume is 2 × 5 = 10 mL. (study guide, Other Topics: medication math, standard content)"},{"id":"q237","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"A child who weighs 44 lb is ordered 15 mg/kg of a medication. How many milligrams does the nurse give?","o":[],"c":{"answer":300,"unit":"mg","setup":"44 lb ÷ 2.2 = 20 kg; 15 mg/kg × 20 kg = 300 mg","near":{"660":"660 multiplies 15 by 44 pounds; pounds must be converted to kilograms first.","33":"33 divides the dose by 2.2 instead of the weight.","150":"150 does not follow from the setup."}},"x":{},"tk":"Weight-based dosing needs the weight in kilograms first: pounds divided by 2.2.","w":"Weight-based dosing needs the weight in kilograms first: pounds divided by 2.2. Then multiply the dose per kilogram by the weight. (study guide, Other Topics: medication math, standard content)"},{"id":"q238","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"A provider orders 1,000 mL of IV fluid to infuse over 8 hours by pump. At what rate in mL/hr should the nurse set the pump?","o":[],"c":{"answer":125,"unit":"mL/hr","setup":"Total mL ÷ hours = 1,000 mL ÷ 8 hr = 125 mL/hr","near":{"8":"8 is the number of hours; divide the volume by the hours.","31":"31 is the gravity drip rate in gtt/min for a 15 gtt/mL set, not the pump rate.","480":"480 is the number of minutes in 8 hours."}},"x":{},"tk":"A pump rate is volume divided by time in hours.","w":"A pump rate is volume divided by time in hours. No drop factor is needed for a pump. (study guide, Other Topics: medication math, standard content)"},{"id":"q239","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"The nurse hangs 1,000 mL to infuse over 8 hours by gravity. The tubing drop factor is 15 gtt/mL. What is the rate in drops per minute? Round to a whole number.","o":[],"c":{"answer":31,"unit":"gtt/min","setup":"(1,000 mL × 15 gtt/mL) ÷ 480 min = 31.25, round to 31 gtt/min","near":{"125":"125 is the pump rate in mL/hr; the drop factor and minutes were not used.","15":"15 is only the drop factor.","62":"62 divides by 240 minutes instead of 480."}},"x":{},"tk":"Gravity drip rate is volume times the drop factor, divided by the minutes.","w":"Gravity drip rate is volume times the drop factor, divided by the minutes. Eight hours is 480 minutes. Round per your program's rules, usually a whole number for drops. (study guide, Other Topics: medication math, standard content)"},{"id":"q240","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"A 500 mL bag is infusing at 100 mL/hr. How many hours will the bag take to infuse?","o":[],"c":{"answer":5,"unit":"hours","setup":"Total mL ÷ mL/hr = 500 ÷ 100 = 5 hours","near":{"50":"50 multiplies the volume by 0.1 or misplaces a decimal.","0.2":"0.2 divides the rate by the volume (inverted)."}},"x":{},"tk":"Infusion time is the total volume divided by the hourly rate.","w":"Infusion time is the total volume divided by the hourly rate. (study guide, Other Topics: medication math, standard content)"},{"id":"q241","ty":"num","ch":"ch8","t":"dose","cn":"c-dose","q":"A heparin infusion contains 25,000 units in 250 mL (100 units/mL). The order is 1,000 units/hr. At what rate in mL/hr should the pump run?","o":[],"c":{"answer":10,"unit":"mL/hr","setup":"Ordered units/hr ÷ units/mL = 1,000 ÷ 100 = 10 mL/hr","near":{"100":"100 is the concentration in units/mL, not the pump rate.","25":"25 does not follow from the setup.","1000":"1,000 is the ordered units, not mL."}},"x":{},"tk":"First find the concentration of the bag, 100 units per mL, then divide the hourly order by it.","w":"First find the concentration of the bag, 100 units per mL, then divide the hourly order by it. (study guide, Other Topics: medication math, standard content)"},{"id":"r001","ty":"mc","ch":"ch1","t":"risk","cn":"c-risk-list","q":"A 36-year-old client with breast cancer reports that her mother and her sister also had breast cancer. Which feature most strongly suggests a hereditary cancer syndrome?","o":["A younger-than-usual age together with two first-degree relatives who had the same cancer","A single tumor found at age 78 with no family history","A tumor in a client who has smoked for 40 years","A cancer found during a routine screening"],"c":0,"x":{"A single tumor found at age 78 with no family history":"This pattern does not suggest a hereditary syndrome.","A tumor in a client who has smoked for 40 years":"Smoking is a carcinogen exposure, not an inherited pattern.","A cancer found during a routine screening":"How a cancer was found says nothing about heredity."},"tk":"Red flags for hereditary cancer include a younger-than-usual age and two or more first-degree relatives with the same cancer.","w":"Red flags for hereditary cancer include a younger-than-usual age and two or more first-degree relatives with the same cancer. Others are multiple primary tumors, bilateral tumors in paired organs and a tumor in the sex not usually affected. Known genetic syndromes account for 5 to 10% of cancers. (study guide, Ch 13)","rs":1},{"id":"r002","ty":"sata","ch":"ch1","t":"risk","cn":"c-risk-list","q":"The nurse sorts a client's cancer risk factors into those that can be changed. Select all that apply.","o":["A sedentary lifestyle","A poor diet","Smoking","Heavy alcohol use","Age","A BRCA1 mutation"],"c":[0,1,2,3],"x":{"Age":"Age cannot be changed.","A BRCA1 mutation":"A genetic predisposition cannot be changed."},"tk":"Modifiable risk factors include a sedentary lifestyle, poor diet, smoking and alcohol.","w":"Modifiable risk factors include a sedentary lifestyle, poor diet, smoking and alcohol. Age and genetics are nonmodifiable, and 78% of cancers are diagnosed at age 55 or older. Disease-linked risks are modifiable only as far as the disease is managed. (study guide, Ch 13)","rs":1},{"id":"r003","ty":"mc","ch":"ch1","t":"risk","cn":"c-risk-table","q":"A client has chronic hepatitis B infection. For which cancer is this client at increased risk?","o":["Liver cancer","Kidney cancer","Thyroid cancer","Bladder cancer"],"c":0,"x":{"Kidney cancer":"Kidney cancer is tied to pesticides, solvents and tobacco.","Thyroid cancer":"Thyroid cancer is tied to ionizing radiation.","Bladder cancer":"Bladder cancer is tied to tobacco."},"tk":"The risk table pairs each cancer with its exposures: hepatitis A, B or C and alcohol go with liver cancer.","w":"The risk table pairs each cancer with its exposures: hepatitis A, B or C and alcohol go with liver cancer. Signs include jaundice, easy bruising and nausea or vomiting. It spreads to the omentum, peritoneum and pleura. (study guide, Ch 13 Table 13.2)","rs":1},{"id":"r004","ty":"sata","ch":"ch1","t":"risk","cn":"c-risk-table","q":"The nurse reviews risk factors listed for lung cancer. Select all that apply.","o":["Tobacco use","Asbestos exposure","Coal, soot or tar exposure","Wood dust","Air pollution","H. pylori infection","Chronic hepatitis B","An undescended testicle"],"c":[0,1,2,3,4],"x":{"H. pylori infection":"H. pylori goes with gastric cancer.","Chronic hepatitis B":"Hepatitis goes with liver cancer.","An undescended testicle":"This is the greatest risk for testicular cancer."},"tk":"Lung cancer risk factors in the table are tobacco, asbestos, coal, soot and tar, pollution and wood dust.","w":"Lung cancer risk factors in the table are tobacco, asbestos, coal, soot and tar, pollution and wood dust. Signs include chronic cough, hemoptysis, dyspnea and weight loss, and it spreads to brain, bone, adrenal and the other lung. The other options each belong to a different cancer. (study guide, Ch 13 Table 13.2)","rs":1},{"id":"r005","ty":"mc","ch":"ch1","t":"risk","cn":"c-risk-prev","q":"A nurse counsels a client to quit tobacco and use sunscreen daily. Which level of prevention is this?","o":["Primary prevention","Secondary prevention","Tertiary prevention","Surveillance only"],"c":0,"x":{"Secondary prevention":"Secondary prevention is screening for early detection.","Tertiary prevention":"Tertiary prevention reduces harm after a diagnosis.","Surveillance only":"Counseling to avoid carcinogens is primary prevention."},"tk":"Primary prevention stops cancer before it starts through risk factor modification, immunization, chemoprevention and avoiding carcinogens.","w":"Primary prevention stops cancer before it starts through risk factor modification, immunization, chemoprevention and avoiding carcinogens. Quitting tobacco for 10 years lowers lung cancer risk 30 to 50%. Sunscreen daily and a healthy weight are also primary prevention. (study guide, Ch 13)","rs":1},{"id":"r006","ty":"sata","ch":"ch1","t":"risk","cn":"c-risk-prev","q":"Which activities are secondary prevention? Select all that apply.","o":["A screening mammogram","A Pap smear","A colon cancer screening test","A discussion of PSA screening","Giving the HPV vaccine","Daily sunscreen"],"c":[0,1,2,3],"x":{"Giving the HPV vaccine":"Immunization is primary prevention.","Daily sunscreen":"Avoiding carcinogens is primary prevention."},"tk":"Secondary prevention is screening for early detection: general check-up, breast, cervical, colon and prostate.","w":"Secondary prevention is screening for early detection: general check-up, breast, cervical, colon and prostate. A good screening test is sensitive, with few false negatives, and specific, with few false positives. Immunization and avoiding carcinogens are primary prevention. (study guide, Ch 13)","rs":1},{"id":"r007","ty":"mc","ch":"ch1","t":"risk","cn":"c-risk-caution","q":"A client has had hoarseness and a nagging cough for 3 weeks. Which action should the nurse take?","o":["Refer the client for evaluation, because a CAUTION sign lasting more than 2 weeks needs evaluation","Reassure the client that it will probably clear up on its own","Advise waiting 3 more months","Advise an over-the-counter cough suppressant only"],"c":0,"x":{"Reassure the client that it will probably clear up on its own":"A sign lasting more than 2 weeks needs evaluation.","Advise waiting 3 more months":"This delays evaluation.","Advise an over-the-counter cough suppressant only":"This does not evaluate the cause."},"tk":"The N in CAUTION is a nagging cough or hoarseness.","w":"The N in CAUTION is a nagging cough or hoarseness. Any CAUTION sign that lasts more than 2 weeks needs a provider's evaluation. Early detection is the point of secondary prevention. (study guide, Ch 13)","rs":1},{"id":"r008","ty":"sata","ch":"ch1","t":"risk","cn":"c-risk-caution","q":"Which findings are among the seven CAUTION warning signs? Select all that apply.","o":["A change in bowel or bladder habits","A sore that does not heal","Unusual bleeding or discharge","Indigestion or difficulty swallowing","An obvious change in a wart or mole","Night sweats","Unexplained weight loss"],"c":[0,1,2,3,4],"x":{"Night sweats":"Night sweats are a constitutional sign, not one of the seven CAUTION letters.","Unexplained weight loss":"Weight loss is a constitutional sign, not one of the seven CAUTION letters."},"tk":"CAUTION lists seven changes: bowel or bladder habits, a sore that does not heal, unusual bleeding or discharge, thickening or lump, indigestion or difficulty swallowing, a change in a wart or mole, and a nagging cough or hoarseness.","w":"CAUTION lists seven changes: bowel or bladder habits, a sore that does not heal, unusual bleeding or discharge, thickening or lump, indigestion or difficulty swallowing, a change in a wart or mole, and a nagging cough or hoarseness. Constitutional signs are separate: fatigue, fever of unknown cause, unexplained weight loss and night sweats. (study guide, Ch 13)","rs":1},{"id":"r009","ty":"mc","ch":"ch1","t":"stage","cn":"c-stage-tnm","q":"A client's chart reads T2, N0, M0. Which interpretation by the nurse is correct?","o":["A tumor in size category 2 with no lymph node involvement and no metastasis","A tumor with spread to two lymph nodes","A tumor that has metastasized","A tumor with unknown size"],"c":0,"x":{"A tumor with spread to two lymph nodes":"N0 means no lymph node involvement.","A tumor that has metastasized":"M0 means no metastasis.","A tumor with unknown size":"T gives the tumor size."},"tk":"T is the size of the tumor, N is the number of lymph nodes involved, and M is the presence of metastasis.","w":"T is the size of the tumor, N is the number of lymph nodes involved, and M is the presence of metastasis. A zero in N or M means none. M1 means the cancer has spread. (study guide, Ch 13)","rs":1},{"id":"r010","ty":"sata","ch":"ch1","t":"stage","cn":"c-stage-tnm","q":"Which statements about cancer staging are correct? Select all that apply.","o":["Stage I is small with no obvious spread outside the organ","Stage IV means the cancer has metastasized","All hematologic malignancies are stage IV at diagnosis","M1 means metastasis is present","Grade shows how far the cancer has spread","Stage II means the cancer has spread to distant organs"],"c":[0,1,2,3],"x":{"Grade shows how far the cancer has spread":"Grade shows how differentiated the cells are; stage shows spread.","Stage II means the cancer has spread to distant organs":"Stage II invades deeper tissue or local nodes; distant spread is stage IV."},"tk":"Staging shows size, nodes and metastasis.","w":"Staging shows size, nodes and metastasis. Stage II invades deeper tissue or local nodes, stage III is large or locally advanced, and stage IV has metastasized. Grading is separate and describes differentiation. (study guide, Ch 13)","rs":1},{"id":"r011","ty":"mc","ch":"ch1","t":"stage","cn":"c-stage-sizes","q":"A client's breast cancer is 6 cm with no lymph node involvement and no metastasis. Which stage does the nurse expect?","o":["Stage IIB","Stage IIA","Stage IIIA","Stage IB","Stage IV"],"c":0,"x":{"Stage IIA":"Stage IIA is 2 to 5 cm with no nodes, or under 2 cm with nodes.","Stage IIIA":"Stage IIIA is over 5 cm with nodes, or any size with 4 to 8 nodes.","Stage IB":"Stage IB is no tumor or under 2 cm with small node involvement.","Stage IV":"Stage IV needs distant metastasis."},"tk":"Breast sizes are 2 cm or less for stage I, 2 to 5 cm for stage II, and over 5 cm for IIB or III.","w":"Breast sizes are 2 cm or less for stage I, 2 to 5 cm for stage II, and over 5 cm for IIB or III. A tumor over 5 cm with no nodes is stage IIB; with nodes it moves to IIIA. Nodes of 4 to 8 are IIIA, up to 9 is IIIB and 10 or more is IIIC. (study guide, Ch 65)","rs":1},{"id":"r012","ty":"sata","ch":"ch1","t":"stage","cn":"c-stage-sizes","q":"Which staging facts are correct? Select all that apply.","o":["Prostate T1 cannot be felt","Prostate T4 invades neighboring organs","The maximum Gleason score is 10","Ovarian stage II means spread into the pelvis","Prostate T2 invades neighboring organs","A Gleason score of 2 is the worst"],"c":[0,1,2,3],"x":{"Prostate T2 invades neighboring organs":"T2 is confined to the prostate; T4 invades neighboring organs.","A Gleason score of 2 is the worst":"A higher Gleason score is worse."},"tk":"Prostate staging runs T1 not felt, T2 confined, T3 locally extensive, T4 invading neighbors.","w":"Prostate staging runs T1 not felt, T2 confined, T3 locally extensive, T4 invading neighbors. Gleason adds two grades of 1 to 5 for a maximum of 10, and higher is worse. Ovarian FIGO staging is I ovaries, II pelvis, III peritoneum and/or nodes, IV distant. (study guide, Ch 65 and Ch 66)","rs":1},{"id":"r013","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-types","q":"Which biopsy is the least traumatic but yields fewer cells?","o":["Fine-needle aspiration","Excisional biopsy","Core needle biopsy","Surgical excision with wire localization"],"c":0,"x":{"Excisional biopsy":"Excisional removes the whole mass and a margin.","Core needle biopsy":"Core needle takes a larger sample with a wider needle.","Surgical excision with wire localization":"This removes a mass surgically after marking it."},"tk":"FNA uses a needle to suction cells and is less traumatic, but gives fewer cells and limited molecular testing.","w":"FNA uses a needle to suction cells and is less traumatic, but gives fewer cells and limited molecular testing. Core needle and vacuum-assisted biopsies give larger samples. The excisional biopsy is preferred for diagnosis because it removes the whole mass. (study guide, Ch 13)","rs":1},{"id":"r014","ty":"sata","ch":"ch1","t":"biopsy","cn":"c-bx-types","q":"Which statements about a sentinel node biopsy are correct? Select all that apply.","o":["It finds the first node the cancer drains to","A radioactive tracer or blue dye is used","It determines the stage","If it is negative, no more nodes are removed","If it is positive, no further surgery is needed","It is used to diagnose lymphoma"],"c":[0,1,2,3],"x":{"If it is positive, no further surgery is needed":"A positive sentinel node leads to an axillary dissection of 20 to 40 nodes.","It is used to diagnose lymphoma":"Lymphoma is confirmed with a lymph node biopsy."},"tk":"The sentinel node is the first node the cancer would reach.","w":"The sentinel node is the first node the cancer would reach. A negative result means the full axillary dissection can be skipped. A positive result leads to dissection of 20 to 40 nodes. (study guide, Ch 65)","rs":1},{"id":"r015","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-site","q":"A client has an abnormal Pap smear and positive high-risk HPV. Which test is diagnostic for cervical cancer?","o":["A cervical biopsy taken at colposcopy","A repeat Pap smear","An HPV test","A pelvic MRI"],"c":0,"x":{"A repeat Pap smear":"The Pap is a screening test.","An HPV test":"The HPV test shows risk, not the diagnosis.","A pelvic MRI":"MRI is used for staging."},"tk":"After an abnormal result with high-risk HPV the cervix is examined at colposcopy and abnormal areas are biopsied.","w":"After an abnormal result with high-risk HPV the cervix is examined at colposcopy and abnormal areas are biopsied. The biopsy is diagnostic. MRI, PET, CT and chest x-ray stage the cancer. (study guide, Ch 65)","rs":1},{"id":"r016","ty":"sata","ch":"ch1","t":"biopsy","cn":"c-bx-site","q":"Which biopsy or diagnostic facts are correct for the site named? Select all that apply.","o":["An endometrial biopsy is 99% sensitive for high-grade cancer","A D&C is done if the endometrial biopsy is negative but bleeding continues","Bronchoscopy allows biopsy of the airways","An ovarian mass is diagnosed by surgical removal and pathology","A needle biopsy is the preferred test for an ovarian mass","Mediastinoscopy is a blood test"],"c":[0,1,2,3],"x":{"A needle biopsy is the preferred test for an ovarian mass":"Biopsy of an ovarian mass is not recommended.","Mediastinoscopy is a blood test":"It is a surgical incision to view and biopsy the mediastinum."},"tk":"Each organ has its own sampling method.","w":"Each organ has its own sampling method. The ovary is removed and examined because a needle biopsy could spread cells. The endometrium is sampled with biopsy or D&C, the airways with bronchoscopy, and the mediastinum with mediastinoscopy. (study guide, Ch 13, Ch 26 and Ch 65)","rs":1},{"id":"r017","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"A client had a bone marrow biopsy 26 hours ago, and the dressing is soaked with blood. Which action should the nurse take?","o":["Report it to the provider, because bleeding that soaks the dressing or lasts more than 24 hours must be reported","Reinforce the dressing and recheck tomorrow","Remove the dressing to inspect the site","Document it as an expected finding"],"c":0,"x":{"Reinforce the dressing and recheck tomorrow":"This bleeding must be reported.","Remove the dressing to inspect the site":"The dressing stays on at least 24 hours and bleeding is reported.","Document it as an expected finding":"Expected care is pressure and a dry dressing; soaking is not expected."},"tk":"After the biopsy the nurse applies direct pressure for 5 to 10 minutes and a sterile dressing, and the client rests for several hours.","w":"After the biopsy the nurse applies direct pressure for 5 to 10 minutes and a sterile dressing, and the client rests for several hours. The dressing stays on at least 24 hours. Report bleeding that soaks the dressing or lasts more than 24 hours, and watch for infection. (study guide, Ch 33)","rs":1},{"id":"r018","ty":"sata","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"Which actions are part of preparing a client for a bone marrow biopsy? Select all that apply.","o":["Obtain informed consent","Ask about allergies","Check platelets, coagulation studies and anticoagulants","Explain that pressure and a brief pulling pain will be felt","Tell the client that nothing will be felt","Position the client supine for the posterior iliac crest"],"c":[0,1,2,3],"x":{"Tell the client that nothing will be felt":"The client feels pressure on insertion and a brief pulling pain on aspiration.","Position the client supine for the posterior iliac crest":"The posterior iliac crest uses prone or side-lying; supine is for the sternum or anterior iliac crest."},"tk":"Preparation covers consent, allergies and bleeding risk.","w":"Preparation covers consent, allergies and bleeding risk. The procedure takes 5 to 10 minutes and a mild sedative is allowed. The client may hear crunching. (study guide, Ch 33)","rs":1},{"id":"r019","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-types","q":"A client with small cell lung cancer asks about the outlook. Which response is accurate?","o":["“The outlook is poor at any stage; only 5 to 10% survive 5 years.”","“If it is found early, 5-year survival is good.”","“Surgery usually cures it when there is no metastasis.”","“It grows more slowly than other lung cancers.”"],"c":0,"x":{"“If it is found early, 5-year survival is good.”":"That describes non-small cell cancer.","“Surgery usually cures it when there is no metastasis.”":"Surgery is used primarily for non-small cell cancer.","“It grows more slowly than other lung cancers.”":"Small cell grows quickly and spreads early."},"tk":"Small cell cancer is 15% of lung cancers, grows quickly and spreads to other organs.","w":"Small cell cancer is 15% of lung cancers, grows quickly and spreads to other organs. Its outlook is poor at any stage, and your class notes give 6 months to 1 year. Non-small cell cancer has a good 5-year survival when found early. (study guide, Ch 26 and class notes)","rs":1},{"id":"r020","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-types","q":"Which statements are true of small cell (oat cell) lung cancer? Select all that apply.","o":["It makes up about 15% of lung cancers","It grows quickly","It spreads to other organs early","Its outlook is poor at any stage","It has three cell types: adenocarcinoma, squamous cell and large cell","Surgery is the primary treatment when there is no metastasis"],"c":[0,1,2,3],"x":{"It has three cell types: adenocarcinoma, squamous cell and large cell":"Those are the three types of non-small cell cancer.","Surgery is the primary treatment when there is no metastasis":"That is used for non-small cell cancer."},"tk":"Small cell lung cancer is fast and spreads early, and outcomes are poor.","w":"Small cell lung cancer is fast and spreads early, and outcomes are poor. Non-small cell cancer, about 85%, includes the three cell types and is the group where surgery is used when there is no metastasis. (study guide, Ch 26)","rs":1},{"id":"r021","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-dx","q":"Which test allows the provider to see the airways and take a tissue sample?","o":["Bronchoscopy","PET scan","Chest x-ray","Bone scan"],"c":0,"x":{"PET scan":"PET shows metabolic activity and does not take tissue.","Chest x-ray":"A chest x-ray finds the lesion.","Bone scan":"A bone scan looks for metastasis."},"tk":"Bronchoscopy passes a scope through the mouth or nose to view the trachea and bronchi and biopsy.","w":"Bronchoscopy passes a scope through the mouth or nose to view the trachea and bronchi and biopsy. Sputum cytology may identify the tumor cells, and mediastinoscopy is a surgical incision to biopsy the mediastinum. A PET scan shows metabolism. (study guide, Ch 26)","rs":1},{"id":"r022","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-dx","q":"Which findings are cues for lung cancer? Select all that apply.","o":["A new cough that does not go away","Hemoptysis","Hoarseness","Chest pain","Frequent pneumonia or bronchitis","Perioral tingling with laryngospasm","Ribbon-like stools"],"c":[0,1,2,3,4],"x":{"Perioral tingling with laryngospasm":"That fits hypocalcemia.","Ribbon-like stools":"That suggests a bowel obstruction."},"tk":"Lung cancer is often silent early.","w":"Lung cancer is often silent early. Cues include a new or changed cough, hemoptysis, shortness of breath, wheezing, hoarseness, chest pain, weight loss and frequent pneumonia. Headache and bone pain suggest metastasis. (study guide, Ch 26)","rs":1},{"id":"r023","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"Cancer is found in one small area of one lobe of a client's lung with no metastasis. Which surgery does the nurse expect?","o":["Wedge resection","Pneumonectomy","Lobectomy","Mediastinoscopy"],"c":0,"x":{"Pneumonectomy":"This removes the entire lung for diffuse spread.","Lobectomy":"This removes an entire lobe for cancer localized to one lobe.","Mediastinoscopy":"This is a diagnostic incision, not a treatment."},"tk":"A wedge resection removes a small section of a lobe.","w":"A wedge resection removes a small section of a lobe. A lobectomy removes the whole lobe and a pneumonectomy removes the whole lung. Surgery is preferred if there is no metastasis. (study guide, Ch 26)","rs":1},{"id":"r024","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"Which statements about lung cancer treatment are correct? Select all that apply.","o":["Radiation can be used for palliation of symptoms and pain","Chemotherapy can be neoadjuvant or adjuvant","Palliative care begins at diagnosis","Cancer pain doses are given around the clock","Surgery is preferred even when metastasis is present","WHO step 1 uses a strong opioid"],"c":[0,1,2,3],"x":{"Surgery is preferred even when metastasis is present":"Surgery is preferred when there is no metastasis.","WHO step 1 uses a strong opioid":"Step 1 is a nonopioid; strong opioids are step 3."},"tk":"Treatment depends on the type, size, location and stage.","w":"Treatment depends on the type, size, location and stage. Chemotherapy is primary for advanced disease or a client too ill for surgery. Pain is managed by the WHO ladder with around-the-clock dosing. (study guide, Ch 26)","rs":1},{"id":"r025","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"Which finding after a lobectomy suggests hemorrhage?","o":["Excess bloody chest tube drainage with hypotension and tachycardia","Cloudy chest tube drainage","Continuous bubbling in the water-seal chamber","Diminished breath sounds"],"c":0,"x":{"Cloudy chest tube drainage":"Cloudy drainage suggests infection.","Continuous bubbling in the water-seal chamber":"This is an air leak.","Diminished breath sounds":"This suggests atelectasis."},"tk":"After lobectomy the nurse watches vital signs, breath sounds, the suture line and the chest tube.","w":"After lobectomy the nurse watches vital signs, breath sounds, the suture line and the chest tube. Hypotension or tachycardia may mean excessive blood or fluid loss, and excess bloody drainage suggests a bleed. (study guide, Ch 26)","rs":1},{"id":"r026","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"Which are correct about chest tube care? Select all that apply.","o":["Keep the system closed","Never clamp the chest tube","Monitor the water-seal chamber","Persistent bubbling means an air leak","Clamp the tube briefly for transport","Cloudy drainage is expected"],"c":[0,1,2,3],"x":{"Clamp the tube briefly for transport":"The tube is never clamped.","Cloudy drainage is expected":"Cloudy drainage suggests infection."},"tk":"The closed system prevents air leaks.","w":"The closed system prevents air leaks. Clamping can trap air or fluid and cause a tension pneumothorax. The nurse watches drainage for bleeding or infection. (study guide, Ch 26)","rs":1},{"id":"r027","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A client with a bacterial infection has a WBC differential. Which cell type is expected to rise?","o":["Neutrophils","Eosinophils","Lymphocytes","Basophils"],"c":0,"x":{"Eosinophils":"Eosinophils rise with allergies and parasites.","Lymphocytes":"Lymphocytes rise with viral infections.","Basophils":"Basophils rise with allergy and inflammation."},"tk":"Neutrophils are 50 to 70% of white cells, fight bacteria and fungi, and are the first to arrive.","w":"Neutrophils are 50 to 70% of white cells, fight bacteria and fungi, and are the first to arrive. They rise with bacterial infection and fall with chemotherapy and radiation. A left shift means many immature neutrophils. (study guide, Ch 33)","rs":1},{"id":"r028","ty":"sata","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"Which statements about neutrophils and the ANC are correct? Select all that apply.","o":["Neutrophils are the first white cells to arrive at an infection","They remain in circulation about 6 hours","Chemotherapy and radiation lower them","An ANC below 1,500 is neutropenia","The ANC measures platelets","Mature neutrophils are called bands"],"c":[0,1,2,3],"x":{"The ANC measures platelets":"The ANC counts neutrophils.","Mature neutrophils are called bands":"Mature neutrophils are segs; immature ones are bands."},"tk":"Neutrophils are phagocytic and first on the scene.","w":"Neutrophils are phagocytic and first on the scene. Mature cells are segs and immature cells are bands. A low ANC means a high risk of infection. (study guide, Ch 33)","rs":1},{"id":"r029","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-plt","q":"A client's platelet count is 18,000/mm³. Which expectation by the nurse is correct?","o":["
