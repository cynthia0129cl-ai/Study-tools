<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#17213a;--mut:#5a6785;--line:#dde3ef;--acc:#1f3a68;--acc-ink:#fff;--acc2:#0f766e;--soft:#e8eefb;--good:#1a7f37;--goodbg:#e7f5ea;--bad:#c62828;--badbg:#fdecec;--amb:#a35f00;--ambbg:#fff3df;--press:#dfe6f5;--shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18203a;--ink:#e7ecf8;--mut:#9aa8c7;--line:#2a3558;--acc:#8fb4ff;--acc-ink:#0f1524;--acc2:#5fd0c4;--soft:#1f2a4a;--good:#6fd58a;--goodbg:#14301d;--bad:#ff8a8a;--badbg:#3a1a1c;--amb:#f0b95a;--ambbg:#33270f;--press:#25304f;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18203a;--ink:#e7ecf8;--mut:#9aa8c7;--line:#2a3558;--acc:#8fb4ff;--acc-ink:#0f1524;--acc2:#5fd0c4;--soft:#1f2a4a;--good:#6fd58a;--goodbg:#14301d;--bad:#ff8a8a;--badbg:#3a1a1c;--amb:#f0b95a;--ambbg:#33270f;--press:#25304f;--shadow:none;color-scheme:dark}
html{color-scheme:light}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:40}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em;text-wrap:balance}h1{font-size:1.55rem}h2{font-size:1.2rem;margin-top:1.1em}h3{font-size:1rem}
.wrap{max-width:980px;margin:0 auto;padding:0 0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(14px,env(safe-area-inset-left,0px)));padding:8px max(14px,env(safe-area-inset-left,0px)) 0}
.brow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;font-weight:500;color:var(--mut);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
.save{font-size:.78rem;color:var(--mut)}.save b{color:var(--good)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
nav.tabs button:active{background:var(--press)}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{border:1px solid var(--acc);background:var(--card);color:var(--acc);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:40px}
.btn.pri{background:var(--acc);color:var(--acc-ink)}.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:500}.btn.sm{padding:5px 10px;min-height:32px;font-size:.88rem}
.btn:active{background:var(--press)}.btn.pri:active{filter:brightness(.9)}.btn[disabled]{opacity:.45;cursor:default}
@media (hover:hover){.btn:hover{background:var(--soft)}.btn.pri:hover{filter:brightness(1.08)}.opt:hover{background:var(--soft)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stat{text-align:left}.stat .n{font-size:1.9rem;font-weight:800;line-height:1}.stat .l{color:var(--mut);font-size:.82rem;margin-top:4px}
.big{font-size:2.3rem;font-weight:800;color:var(--acc)}
.small{font-size:.85rem;color:var(--mut)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bar{height:9px;background:var(--soft);border-radius:6px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:var(--acc2)}
.bar.b i.g{background:var(--good)}.bar.b i.r{background:var(--bad)}.bar.b i.a{background:var(--amb)}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--soft);color:var(--acc)}
.pill.q{background:var(--ambbg);color:var(--amb)}.pill.n{background:var(--goodbg);color:var(--good)}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.tw{overflow-x:auto}
.stem{font-size:1.06rem;margin:8px 0 12px;white-space:pre-wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin:8px 0;cursor:pointer}
.opt .ltr{flex:none;width:1.6em;font-weight:800;color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--soft)}.opt:active{background:var(--press)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.miss{border-color:var(--amb);background:var(--ambbg)}
.opt[disabled]{cursor:default}
.rat{font-size:.88rem;margin:0 0 6px 2.2em;color:var(--mut)}.rat b{color:var(--ink)}
.verdict{border-radius:10px;padding:9px 12px;font-weight:700;margin:12px 0;scroll-margin-top:110px}.verdict.ok{background:var(--goodbg);color:var(--good)}.verdict.no{background:var(--badbg);color:var(--bad)}.verdict.part{background:var(--ambbg);color:var(--amb)}
.take{border-left:4px solid var(--acc2);background:var(--soft);padding:8px 12px;border-radius:0 10px 10px 0;margin:10px 0}
.note{border:1px dashed var(--amb);background:var(--ambbg);color:var(--ink);padding:8px 12px;border-radius:10px;margin:10px 0;font-size:.9rem}
.new{display:inline-block;background:var(--acc2);color:#fff;border-radius:6px;padding:0 7px;font-size:.7rem;font-weight:700;margin-left:6px}
select,input[type=number],input[type=text]{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;background:var(--card);font-size:.9rem}
.chip input{margin:0}.chip.on{border-color:var(--acc);background:var(--soft)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin:8px 0}
.qgrid button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;cursor:pointer;font-weight:700}
.qgrid button.ans{background:var(--soft);border-color:var(--acc)}.qgrid button.flag{border-color:var(--amb);box-shadow:inset 0 -3px 0 var(--amb)}.qgrid button.cur{outline:2px solid var(--acc)}
.ord{display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;margin:6px 0}.ord span.t{flex:1}.ord button{border:1px solid var(--line);background:var(--card);border-radius:6px;min-width:38px;min-height:36px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{margin-top:5px;width:18px;height:18px}.task.done .tl{text-decoration:line-through;color:var(--mut)}
.day.today{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
ul.pl{margin:.3em 0 .6em 1.1em;padding:0}ul.pl li{margin:4px 0}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);padding:8px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem}.timer.low{color:var(--bad)}
@media (max-width:560px){h1{font-size:1.3rem}.big{font-size:1.9rem}}

<script type="application/json" id="bank">{"meta":{"key":"study:nur-oncology-heme-exam1:v1","examDate":"2026-11-10","examLabel":"Exam 1 · Tuesday, November 10"},"chapters":[{"id":"ch1","name":"Cancer Basics: Risk, Staging, Biopsy","short":"Basics"},{"id":"ch2","name":"Labs and Blood Counts","short":"Labs"},{"id":"ch3","name":"Leukemia and Neutropenia","short":"Leukemia"},{"id":"ch4","name":"Lymphoma and Myeloma","short":"Lymphoma/MM"},{"id":"ch5","name":"Lung Cancer","short":"Lung"},{"id":"ch6","name":"Breast, Uterine and Cervical Cancer","short":"Female repro"},{"id":"ch7","name":"Prostate and Testicular Cancer","short":"Male repro"},{"id":"ch8","name":"Pain, Dosage and End of Life","short":"Pain/Dose/EOL"}],"topics":[{"id":"risk","name":"Cancer risk factors","ch":"ch1","exam":0},{"id":"stage","name":"Cancer staging (TNM, sizes)","ch":"ch1","exam":0},{"id":"biopsy","name":"Biopsy procedures","ch":"ch1","exam":0},{"id":"labs","name":"Labs: CBC, WBC, platelets","ch":"ch2","exam":0},{"id":"pv","name":"Polycythemia vera","ch":"ch2","exam":0},{"id":"leuk","name":"Leukemia: risk factors, medications","ch":"ch3","exam":5},{"id":"neut","name":"Neutropenic precautions","ch":"ch3","exam":0},{"id":"hodgkin","name":"Hodgkin lymphoma","ch":"ch4","exam":0},{"id":"mm","name":"Multiple myeloma","ch":"ch4","exam":0},{"id":"lung","name":"Lung cancer","ch":"ch5","exam":0},{"id":"breast","name":"Breast cancer (female and male): medications","ch":"ch6","exam":0},{"id":"uterine","name":"Uterine cancer","ch":"ch6","exam":0},{"id":"cervical","name":"Cervical guidelines","ch":"ch6","exam":0},{"id":"prostate","name":"Prostate cancer and BPH: post-op complications","ch":"ch7","exam":5},{"id":"testis","name":"Testicular cancer","ch":"ch7","exam":0},{"id":"pain","name":"Pain management","ch":"ch8","exam":0},{"id":"dose","name":"Dosage calculations","ch":"ch8","exam":2},{"id":"eol","name":"End of life: hospice vs palliative","ch":"ch8","exam":2}],"Q":[{"id":"q001","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-risk","q":"A 62-year-old client reports fatigue, shortness of breath on stairs, and bleeding gums. The client has worked in an oil refinery since age 18 and has smoked for more than 40 years. Hgb is 9.4 g/dL and platelets are 97,000/mm³. Which part of the history places this client at the highest risk for leukemia?","o":["Long-term benzene exposure from refinery work","Smoking for more than 40 years","Fatigue with shortness of breath on exertion","Bleeding gums","A hemoglobin of 9.4 g/dL"],"c":0,"x":{"Smoking for more than 40 years":"Smoking is a listed leukemia risk factor, but it is not the highest risk in this history; the case names benzene as the highest.","Fatigue with shortness of breath on exertion":"This is a manifestation of anemia from a crowded marrow, not something that causes leukemia.","Bleeding gums":"Bleeding gums are a sign of thrombocytopenia, not a cause of leukemia.","A hemoglobin of 9.4 g/dL":"A low hemoglobin is a result of marrow crowding by blasts, not a risk factor."},"tk":"Leukemia risk factors include genetic anomalies, Down syndrome, radiation, benzene or other chemical exposure, prior chemotherapy or radiation, and smoking.","w":"Leukemia risk factors include genetic anomalies, Down syndrome, radiation, benzene or other chemical exposure, prior chemotherapy or radiation, and smoking. In this case the oil refinery is the benzene exposure and is identified as the highest risk factor. The low hemoglobin, low platelets, fatigue and bleeding gums are the effects of blasts crowding the marrow. They are findings the nurse assesses, not causes. (study guide, Ch 34 case)","lp":1},{"id":"q002","ty":"sata","ch":"ch3","t":"leuk","cn":"c-leuk-risk","q":"The nurse is reviewing risk factors for leukemia with a client's family. Select all that apply.","o":["Down syndrome","Prior chemotherapy or radiation","Benzene exposure","Presence of the Philadelphia chromosome in chronic myeloid leukemia","A diet high in red meat","Undescended testicle","Unopposed estrogen exposure"],"c":[0,1,2,3],"x":{"A diet high in red meat":"A diet high in red meat is a prostate cancer risk factor, not a leukemia risk factor.","Undescended testicle":"Cryptorchidism is the greatest risk factor for testicular cancer.","Unopposed estrogen exposure":"Unopposed estrogen is a main risk factor for uterine cancer."},"tk":"Down syndrome raises leukemia risk about 10 to 30 times.","w":"Down syndrome raises leukemia risk about 10 to 30 times. Radiation, benzene and prior chemotherapy damage marrow stem cells. The Philadelphia chromosome, a 9;22 swap, is found in more than 90% of chronic myeloid leukemia. Each wrong option is the signature risk of a different cancer. (study guide, Ch 34)","lp":1},{"id":"q003","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"A 7-year-old child is admitted with fever, bone pain, and bruising. Testing confirms the most common childhood leukemia. Which type should the nurse expect the chart to list?","o":["Acute lymphoblastic leukemia","Acute myeloid leukemia","Chronic myeloid leukemia","Chronic lymphocytic leukemia","Multiple myeloma"],"c":0,"x":{"Acute myeloid leukemia":"AML is acute but is tied to benzene, radiation and prior chemotherapy in adults; ALL is the most common childhood type.","Chronic myeloid leukemia":"CML is chronic and marked by the Philadelphia chromosome, not the typical childhood form.","Chronic lymphocytic leukemia":"CLL is chronic and can be present for years before it is found; it is not the common childhood leukemia.","Multiple myeloma":"Multiple myeloma is a plasma cell cancer of older adults, not a leukemia."},"tk":"Leukemias are named by the stem cell line and the speed of onset.","w":"Leukemias are named by the stem cell line and the speed of onset. AML and ALL have a sudden, acute onset, and ALL is the most common childhood leukemia. CML and CLL can be present for years before turning acute. Multiple myeloma is a separate plasma cell cancer. (study guide, Ch 34)","lp":1},{"id":"q004","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"A client newly diagnosed with leukemia asks, “My white count is high, so why am I getting infections and bruising so easily?” Which response by the nurse is best?","o":["“The extra white cells are immature blasts that cannot fight infection, and they crowd out the cells that make platelets and red cells.”","“Your body is making too many healthy neutrophils, and they are destroying your platelets.”","“The high count means your immune system is working extra hard to fight an infection.”","“Your chemotherapy has lowered your platelets and made you prone to infection.”","“Your spleen is destroying your blood cells faster than they can be made.”"],"c":0,"x":{"“Your body is making too many healthy neutrophils, and they are destroying your platelets.”":"The high count is from immature blasts, not healthy neutrophils, and they do not destroy platelets.","“The high count means your immune system is working extra hard to fight an infection.”":"A high count in leukemia does not mean a stronger defense; the blasts are immature and useless.","“Your chemotherapy has lowered your platelets and made you prone to infection.”":"The client has just been diagnosed; the problem comes from the leukemia itself, not from treatment.","“Your spleen is destroying your blood cells faster than they can be made.”":"Splenomegaly can occur, but the main cause is marrow crowding by blasts."},"tk":"An unknown stimulus mutates a stem cell, which clones immature blasts that never mature and never die.","w":"An unknown stimulus mutates a stem cell, which clones immature blasts that never mature and never die. The marrow, spleen and lymph tissue fill with blasts. The crowded marrow cannot make enough RBCs and platelets, so anemia and thrombocytopenia follow. The blasts cannot fight infection, so neutropenia and infections follow even when the count is high. (study guide, Ch 34)"},{"id":"q005","ty":"order","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"The nurse is explaining the phases of chemotherapy for leukemia to a client. Place the phases in the order they are given.","o":["Induction to bring the leukemia into remission","Consolidation to treat hidden disease","Maintenance to prevent relapse"],"c":[0,1,2],"x":{},"tk":"Induction aims to get remission.","w":"Induction aims to get remission. Consolidation treats leukemia cells that cannot be seen. Maintenance helps prevent relapse. Remission is not a cure, which is why therapy continues in phases. (study guide, Ch 34)"},{"id":"q006","ty":"match","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"The nurse reviews medications used for leukemia. Match each drug with its role.","o":["Blocks the Bcr-Abl protein in CML","Targeted therapy used in CLL","Induction chemotherapy for AML","Growth factor that raises neutrophils"],"c":[0,1,2,3],"x":{"Blocks the Bcr-Abl protein in CML":"Imatinib is a Bcr-Abl inhibitor given for CML; it does not treat CLL.","Targeted therapy used in CLL":"Ibrutinib is the targeted agent listed for CLL.","Induction chemotherapy for AML":"Daunorubicin plus cytarabine (Ara-C) is the AML example regimen.","Growth factor that raises neutrophils":"Filgrastim is G-CSF, which raises neutrophils and can cause bone pain."},"tk":"Imatinib targets the Bcr-Abl abnormality of CML and ibrutinib is used in CLL.","w":"Imatinib targets the Bcr-Abl abnormality of CML and ibrutinib is used in CLL. Daunorubicin plus cytarabine is the AML chemotherapy example. Filgrastim (G-CSF) raises neutrophils; the textbook says growth factors are generally not indicated in leukemia because they could fuel the disease, although the case patient received it, so ask your instructor how it will be tested. (study guide, Ch 34)","rows":["Imatinib","Ibrutinib","Daunorubicin with cytarabine","Filgrastim"],"lp":1},{"id":"q007","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"A client with acute leukemia is receiving chemotherapy and has an absolute neutrophil count of 0.6 ×10³/mm³. Which medication group does the nurse expect to be ordered to lower the risk of infection?","o":["Prophylactic antibiotics, antivirals and antifungals","Aspirin","Megestrol","Mesna","Allopurinol"],"c":0,"x":{"Aspirin":"Aspirin inhibits platelets and raises bleeding risk; it does not prevent infection and is unsafe with thrombocytopenia.","Megestrol":"Megestrol is used for anorexia, not infection prevention.","Mesna":"Mesna protects the bladder from hemorrhagic cystitis.","Allopurinol":"Allopurinol prevents high uric acid in tumor lysis; it does not prevent infection."},"tk":"Chemotherapy causes myelosuppression, and severe neutropenia lets infection spread quickly.","w":"Chemotherapy causes myelosuppression, and severe neutropenia lets infection spread quickly. The case patient received prophylactic antibiotics, antivirals and antifungals along with blood products. Examples listed are levofloxacin or moxifloxacin, acyclovir and fluconazole. Each wrong option protects against a different chemotherapy problem. (study guide, Ch 34)","lp":1},{"id":"q008","ty":"tf","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"A client whose leukemia is in remission after induction chemotherapy tells the nurse, “I am relieved because this means I am cured.” The nurse recognizes that this statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True treats remission as a cure; the teaching need is that remission does not mean cure."},"tk":"Remission means no detectable leukemia cells, but hidden disease can remain.","w":"Remission means no detectable leukemia cells, but hidden disease can remain. That is why consolidation and maintenance follow induction. The true version is: remission is not the same as a cure, and treatment continues to prevent relapse. (study guide, Ch 34)","lp":1},{"id":"q009","ty":"tf","ch":"ch3","t":"leuk","cn":"c-leuk-tx","q":"A client with leukemia involving the brain asks why radiation to the brain and spine is planned along with chemotherapy. The nurse says it is because chemotherapy cannot cross the blood–brain barrier. The nurse's statement is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False denies that the blood–brain barrier blocks chemotherapy; this is the reason radiation is added."},"tk":"Chemotherapy given by vein does not reach the central nervous system well.","w":"Chemotherapy given by vein does not reach the central nervous system well. Radiation to the brain and spine treats leukemia cells that hide there. Some chemotherapy is also given intrathecally. (study guide, Ch 34)","lp":1},{"id":"q010","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-nursing","q":"A client receiving chemotherapy for acute leukemia has a temperature of 101.8°F (38.8°C) and an ANC of 0.6 ×10³/mm³. Which action should the nurse take first?","o":["Notify the provider immediately so broad-spectrum IV antibiotics can be started","Give acetaminophen and recheck the temperature in 1 hour","Take a rectal temperature to confirm the reading","Encourage oral fluids and bed rest","Apply a cooling blanket"],"c":0,"x":{"Give acetaminophen and recheck the temperature in 1 hour":"Waiting delays treatment; fever may be the only sign of infection and needs antibiotics immediately.","Take a rectal temperature to confirm the reading":"Rectal temperatures are never done in neutropenia because rectal bacteria can enter the blood.","Encourage oral fluids and bed rest":"Fluids and rest are supportive but do not treat a possible infection, which is an emergency.","Apply a cooling blanket":"Cooling lowers the temperature but does not treat the infection behind it."},"tk":"In a chemotherapy client, fever is often the first and only sign of infection, and infection is the most common cause of death besides the disease itself.","w":"In a chemotherapy client, fever is often the first and only sign of infection, and infection is the most common cause of death besides the disease itself. Myelosuppression with fever is treated aggressively with broad-spectrum antibiotics to prevent sepsis. A fever of 100.4°F (38°C) or higher is the trigger to call. Rectal temperatures and suppositories are avoided because rectal bacteria can enter the blood. (study guide, Ch 13 and Ch 34)","lp":1},{"id":"q011","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-nursing","q":"A client with leukemia has a platelet count of 19,000/mm³ after chemotherapy. Which statement by the client indicates a need for further teaching?","o":["“I have an appointment to get my teeth cleaned this week.”","“I will go to the emergency department if I have a nosebleed that lasts more than 10 minutes.”","“I will go to the emergency department if my temperature reaches 102°F.”","“I will use an electric razor instead of a blade.”"],"c":0,"x":{"“I will go to the emergency department if I have a nosebleed that lasts more than 10 minutes.”":"This is correct teaching; a nosebleed lasting more than 10 minutes needs emergency care.","“I will go to the emergency department if my temperature reaches 102°F.”":"This is correct teaching; fever with neutropenia needs prompt treatment.","“I will use an electric razor instead of a blade.”":"This is correct teaching; an electric razor lowers the risk of cuts and bleeding."},"tk":"With platelets this low, dental cleaning can cause bleeding and bacteria can enter the blood, so it should be avoided.","w":"With platelets this low, dental cleaning can cause bleeding and bacteria can enter the blood, so it should be avoided. The other statements show correct bleeding and infection teaching: report a prolonged nosebleed and fever, and use an electric razor. After chemotherapy the first priority is infection, and platelets below 20,000 can bleed spontaneously. (study guide, Ch 34 case; class notes)","lp":1},{"id":"q012","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A client with newly diagnosed stage III lung cancer will start chemotherapy next week. The client asks the nurse when pain, shortness of breath and nausea can be managed by a specialty team. Which response is best?","o":["“Palliative care can start now, at diagnosis, and it can continue along with chemotherapy.”","“Palliative care begins only after the cancer stops responding to treatment.”","“You must stop chemotherapy before palliative care can begin.”","“Palliative care is available only when a doctor estimates less than 6 months to live.”"],"c":0,"x":{"“Palliative care begins only after the cancer stops responding to treatment.”":"Palliative care is not limited to the end of life; it starts at diagnosis.","“You must stop chemotherapy before palliative care can begin.”":"Palliative care can continue alongside chemotherapy, radiation and surgery; stopping curative treatment is a hospice requirement.","“Palliative care is available only when a doctor estimates less than 6 months to live.”":"The 6-month prognosis is the hospice rule, not the palliative rule."},"tk":"Palliative care relieves symptoms such as pain, dyspnea and nausea and improves quality of life for the client and family at any stage of a serious illness.","w":"Palliative care relieves symptoms such as pain, dyspnea and nausea and improves quality of life for the client and family at any stage of a serious illness. It starts on the day of diagnosis and can go on while the client receives chemotherapy, radiation or surgery. Hospice is different: it is for the end of life and curative treatment stops. (study guide, Ch 26 and Other Topics)","lp":1},{"id":"q013","ty":"sata","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"The nurse is teaching a family about hospice care for a client with end-stage cancer. Select all that apply.","o":["The client has a prognosis of 6 months or less if the disease runs its usual course","Curative treatment is stopped and the focus is on comfort","Family support continues after the death, including bereavement","The client can leave hospice to restart curative treatment","Hospice can begin the day any serious illness is diagnosed","Chemotherapy and radiation are continued to cure the disease"],"c":[0,1,2,3],"x":{"Hospice can begin the day any serious illness is diagnosed":"Starting at diagnosis describes palliative care; hospice is for the end of life.","Chemotherapy and radiation are continued to cure the disease":"Hospice means the client stops curative treatment and chooses comfort care."},"tk":"Hospice is for a client whose prognosis is 6 months or less.","w":"Hospice is for a client whose prognosis is 6 months or less. The client stops curative treatment and chooses comfort, dignity and a peaceful death, and the family receives support including bereavement. Hospice is usually provided at home but can be in a facility or nursing home, and a client can leave to restart curative care. All hospice is palliative, but not all palliative care is hospice. (study guide, Other Topics; standard content as labeled in the guide)","lp":1},{"id":"q014","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A client with heart failure and several hospitalizations wants help with symptoms but still wants to try every treatment that might extend life. Which type of care fits this client's goals?","o":["Palliative care","Hospice care","Hospice care with continued curative treatment","Care only after the client is declared terminal","Bereavement care only"],"c":0,"x":{"Hospice care":"Hospice requires stopping curative treatment and a prognosis of 6 months or less; this client wants to keep treating.","Hospice care with continued curative treatment":"Hospice means the client stops curative treatment.","Care only after the client is declared terminal":"Palliative care is open to anyone with a serious illness at any stage.","Bereavement care only":"Bereavement support is a feature of hospice for the family after a death, not the client's present goal."},"tk":"Palliative care is for anyone with a serious illness at any age or stage, and curative treatment can continue with it.","w":"Palliative care is for anyone with a serious illness at any age or stage, and curative treatment can continue with it. Hospice is limited to the last months of life and replaces curative treatment with comfort care. The client's wish to keep treating points to palliative care. (study guide, Other Topics; standard content as labeled in the guide)"},{"id":"q015","ty":"tf","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A nurse tells the daughter of a client with advanced cancer, “All hospice care is palliative, but not all palliative care is hospice.” The statement is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False would mean hospice is not palliative or that palliative care is always hospice; neither is true."},"tk":"Hospice is a form of care that aims at comfort, so everything it does is palliative.","w":"Hospice is a form of care that aims at comfort, so everything it does is palliative. Palliative care is the wider umbrella: it treats symptoms such as pain, dyspnea and nausea at any stage and can run alongside chemotherapy, radiation or surgery. Because palliative care does not require the client to stop curative treatment, it is not always hospice. This is why “all hospice is palliative, but not all palliative care is hospice” is accurate. (study guide, Other Topics; Ch 26)","lp":1},{"id":"q016","ty":"tf","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A nurse explains to a client with a new cancer diagnosis that palliative care and hospice are the same thing. The nurse's statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True treats the two as the same; palliative care is broader than hospice."},"tk":"Palliative care can begin at diagnosis and continue alongside curative treatment.","w":"Palliative care can begin at diagnosis and continue alongside curative treatment. Hospice is for the end of life and curative treatment stops. The true version is: palliative care is not the same as hospice. (study guide, Ch 26 and Other Topics)","lp":1},{"id":"q017","ty":"sata","ch":"ch8","t":"eol","cn":"c-eol-nursing","q":"A hospice nurse is assessing a client who is actively dying. Which findings suggest that death is near? Select all that apply.","o":["Decreased oral intake and urine output","Mottled, cool extremities","Periods of apnea with Cheyne-Stokes breathing","Noisy secretions","A sudden increase in appetite and energy with a rising urine output","Warm, pink, well-perfused extremities"],"c":[0,1,2,3],"x":{"A sudden increase in appetite and energy with a rising urine output":"Intake and urine output fall as death nears; they do not rise.","Warm, pink, well-perfused extremities":"Mottled, cool extremities are the sign of approaching death."},"tk":"As death nears, intake and urine output fall, the extremities become mottled and cool, and breathing becomes irregular with apnea and Cheyne-Stokes patterns.","w":"As death nears, intake and urine output fall, the extremities become mottled and cool, and breathing becomes irregular with apnea and Cheyne-Stokes patterns. Noisy secretions, the “death rattle,” and a falling level of consciousness are also expected. Hearing is often the last sense lost, so the nurse keeps talking to the client. (study guide, Other Topics; standard content)"},{"id":"q018","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-nursing","q":"A client in hospice care has dyspnea and pain at the end of life. Which action by the nurse is most consistent with comfort care?","o":["Give the opioid as ordered on a regular schedule and provide mouth care and repositioning","Withhold opioids until the client's respiratory rate rises","Start curative chemotherapy to reduce the symptoms","Ignore the advance directive until the family arrives","Limit visitors to protect the client from emotional strain"],"c":0,"x":{"Withhold opioids until the client's respiratory rate rises":"Opioids, including morphine for dyspnea, are given to keep the client comfortable.","Start curative chemotherapy to reduce the symptoms":"Hospice means curative treatment has stopped.","Ignore the advance directive until the family arrives":"Advance directives and DNR orders are honored in end-of-life care.","Limit visitors to protect the client from emotional strain":"Emotional and spiritual support for the client and family is part of nursing care."},"tk":"At the end of life the goal changes from cure to comfort, so symptoms are treated on a schedule rather than waiting for them to become severe.","w":"At the end of life the goal changes from cure to comfort, so symptoms are treated on a schedule rather than waiting for them to become severe. Opioids such as morphine relieve pain and the sensation of breathlessness, and they are given as ordered rather than withheld. Mouth care and repositioning prevent the discomfort that comes with reduced intake and immobility. The nurse also honors the advance directive and DNR order and supports the family. (study guide, Other Topics; standard content)"},{"id":"q019","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"A 52-year-old client with estrogen receptor–positive breast cancer is starting tamoxifen. Which medication on the client's list should the nurse question?","o":["A combined oral contraceptive","Acetaminophen as needed","A multivitamin","Calcium with vitamin D","A stool softener"],"c":0,"x":{"Acetaminophen as needed":"Acetaminophen has no interaction with tamoxifen in these materials.","A multivitamin":"A multivitamin is not a hormone and does not feed an estrogen-positive tumor.","Calcium with vitamin D":"Calcium and vitamin D are not hormones and do not fuel the tumor.","A stool softener":"A stool softener has no hormonal effect on the tumor."},"tk":"Estrogen-positive tumors are fed by estrogen, so oral contraceptives are questioned.","w":"Estrogen-positive tumors are fed by estrogen, so oral contraceptives are questioned. Combined oral contraceptives also raise the risk of clots. Tamoxifen blocks estrogen at its receptor and is taken for 5 to 10 years. The other medications have no hormone effect. (study guide, Ch 65; Davis Table 65.3)","lp":1},{"id":"q020","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"A client with breast cancer who takes tamoxifen reports depression and a new prescription for an SSRI. Which concern should the nurse raise with the provider?","o":["SSRIs reduce how tamoxifen is metabolized","SSRIs increase the blood level of tamoxifen to a toxic range","SSRIs cause cardiotoxicity when combined with tamoxifen","SSRIs raise the risk of endometrial cancer with tamoxifen","SSRIs cause bone loss when combined with tamoxifen"],"c":0,"x":{"SSRIs increase the blood level of tamoxifen to a toxic range":"The interaction lowers the tamoxifen's effect by reducing its metabolism; it does not cause toxicity.","SSRIs cause cardiotoxicity when combined with tamoxifen":"Cardiotoxicity is linked to trastuzumab, not to this combination.","SSRIs raise the risk of endometrial cancer with tamoxifen":"Endometrial cancer risk comes from tamoxifen itself, not from SSRIs.","SSRIs cause bone loss when combined with tamoxifen":"Bone loss is tied to aromatase inhibitors, and to tamoxifen in premenopausal clients, not to this SSRI interaction."},"tk":"Tamoxifen is a selective estrogen receptor modulator that works only if the body converts it normally.","w":"Tamoxifen is a selective estrogen receptor modulator that works only if the body converts it normally. SSRIs reduce tamoxifen metabolism, so the nurse tells the provider before the SSRI is started. Tamoxifen's own risks include DVT, PE, stroke, cataracts and endometrial cancer. (study guide, Ch 65; Davis Table 65.3)","lp":1},{"id":"q021","ty":"match","ch":"ch6","t":"breast","cn":"c-breast-meds","q":"The nurse reviews medications for breast cancer. Match each drug with its key nursing consideration.","o":["Blocks estrogen at its receptor; avoid SSRIs","Blocks conversion of androgens to estrogen; risk of osteoporosis and fractures","For HER2-positive tumors; watch for cardiotoxicity","Immunotherapy given with chemotherapy before surgery; rash, diarrhea, thyroid problems"],"c":[0,1,2,3],"x":{"Blocks estrogen at its receptor; avoid SSRIs":"Tamoxifen is a SERM taken for 5 to 10 years.","Blocks conversion of androgens to estrogen; risk of osteoporosis and fractures":"Aromatase inhibitors such as anastrozole, letrozole and exemestane work this way.","For HER2-positive tumors; watch for cardiotoxicity":"Trastuzumab (Herceptin) is a targeted antibody; it also causes fatigue, joint pain, diarrhea and fever.","Immunotherapy given with chemotherapy before surgery; rash, diarrhea, thyroid problems":"Pembrolizumab (Keytruda) is immunotherapy used with chemotherapy for high-risk triple-negative cancer."},"tk":"Tamoxifen blocks estrogen at the receptor, while aromatase inhibitors stop androgens from becoming estrogen, so only the aromatase inhibitor carries the osteoporosis warning of this pair.","w":"Tamoxifen blocks estrogen at the receptor, while aromatase inhibitors stop androgens from becoming estrogen, so only the aromatase inhibitor carries the osteoporosis warning of this pair. Trastuzumab targets HER2 and can harm the heart. Pembrolizumab is immunotherapy. (study guide, Ch 65; Davis Table 65.3)","rows":["Tamoxifen","Anastrozole","Trastuzumab","Pembrolizumab"],"lp":1},{"id":"q022","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-male","q":"A 64-year-old male client has had a mastectomy for breast cancer. His tumor is estrogen receptor–negative and HER2-negative. Which order should the nurse question?","o":["Antiestrogen therapy","Pain medication as needed","Dressing change using aseptic technique","Emptying and recording the surgical drain","Teaching about suture care"],"c":0,"x":{"Pain medication as needed":"Pain medication helps with coughing, deep breathing and walking after surgery.","Dressing change using aseptic technique":"This is routine post-operative wound care.","Emptying and recording the surgical drain":"Drain care and recording color and amount is expected after mastectomy.","Teaching about suture care":"Suture care and signs of infection are part of expected teaching."},"tk":"Hormone therapy, such as tamoxifen, aromatase inhibitors or fulvestrant, works only on receptor-positive tumors.","w":"Hormone therapy, such as tamoxifen, aromatase inhibitors or fulvestrant, works only on receptor-positive tumors. This tumor is receptor-negative, so antiestrogen therapy would not help and the order should be questioned. Trastuzumab and pertuzumab are for HER2-positive tumors. The other orders are routine post-operative care. (study guide, Ch 66; Davis table notes)","lp":1},{"id":"q023","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-male","q":"A 66-year-old male client with a BRCA2 mutation finds a lump behind his nipple. Which statement about breast cancer in men is accurate for the nurse to include in teaching?","o":["It is far less common than in women, and the small amount of breast tissue means it spreads easily to the nipple, skin and muscle","It is as common as breast cancer in women","Lumpectomy is the usual treatment because the tissue is small","Radiation is the main treatment","BRCA1 is far more common than BRCA2 in men"],"c":0,"x":{"It is as common as breast cancer in women":"It is about 100 times less common than in women.","Lumpectomy is the usual treatment because the tissue is small":"Mastectomy is the usual treatment because there is so little tissue.","Radiation is the main treatment":"Radiation is rarely used.","BRCA1 is far more common than BRCA2 in men":"BRCA2 is the more common mutation in male breast cancer."},"tk":"Male breast cancer is about 100 times less common than in women and occurs mainly between ages 60 and 70.","w":"Male breast cancer is about 100 times less common than in women and occurs mainly between ages 60 and 70. BRCA2 is the more common mutation. With so little tissue behind the nipple, the tumor is easier to feel but spreads to the nipple, skin and muscle early. Mastectomy is usual, with chemotherapy and hormone therapy only for receptor-positive tumors. (study guide, Ch 66)"},{"id":"q024","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-male","q":"A 22-year-old male client has a palpable lump behind the nipple and a strong family history of breast cancer. Which imaging does the nurse expect the provider to order first?","o":["Ultrasound","Mammogram","Bone scan","PET scan","Chest x-ray"],"c":0,"x":{"Mammogram":"A mammogram is the choice for men age 25 and older; this client is under 25.","Bone scan":"A bone scan looks for metastasis after the cancer is confirmed.","PET scan":"PET scanning is used later to look for metastasis.","Chest x-ray":"A chest x-ray is a staging test for spread, not the first imaging of a breast lump."},"tk":"In men the workup includes a clinical breast exam, then ultrasound if the client is under 25 years old or mammogram if 25 or older, and MRI.","w":"In men the workup includes a clinical breast exam, then ultrasound if the client is under 25 years old or mammogram if 25 or older, and MRI. ER/PR and HER2 receptor tests then guide therapy. Bone scan, PET and chest x-ray look for metastasis. (study guide, Ch 66)"},{"id":"q025","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-tx","q":"A 45-year-old client is scheduled for a lumpectomy for early-stage breast cancer. The client asks what treatment will follow surgery. Which response by the nurse is correct?","o":["“Breast conservation surgery is always followed by radiation, with chemotherapy first if it is indicated.”","“Radiation is not needed if the lumpectomy removed the whole tumor.”","“Radiation is given first to shrink the tumor, then surgery.”","“A mastectomy will be needed after the lumpectomy.”","“Only hormone pills are given after a lumpectomy.”"],"c":0,"x":{"“Radiation is not needed if the lumpectomy removed the whole tumor.”":"Lumpectomy is always followed by radiation.","“Radiation is given first to shrink the tumor, then surgery.”":"Chemotherapy, not radiation, is the usual neoadjuvant treatment to shrink a tumor before surgery.","“A mastectomy will be needed after the lumpectomy.”":"Lumpectomy and mastectomy are equivalent for early disease; the patient chooses one.","“Only hormone pills are given after a lumpectomy.”":"Hormone therapy is added for receptor-positive tumors but does not replace radiation."},"tk":"Lumpectomy removes only the tumor plus a margin, and it is always followed by radiation.","w":"Lumpectomy removes only the tumor plus a margin, and it is always followed by radiation. When chemotherapy is indicated the order is surgery, then chemotherapy, then radiation. For early disease lumpectomy and mastectomy are equivalent, so the client chooses. Endocrine therapy for 5 to 10 years is added for receptor-positive tumors. (study guide, Ch 65)","lp":1},{"id":"q026","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-tx","q":"A client has a 2 cm breast mass and the plan is chemotherapy before surgery, then mastectomy, then oral hormonal therapy. How should the nurse describe the oral hormonal therapy?","o":["Adjuvant therapy given after the primary treatment","Neoadjuvant therapy given before the primary treatment","Palliative therapy to relieve symptoms","Primary therapy","Debulking therapy"],"c":0,"x":{"Neoadjuvant therapy given before the primary treatment":"Neoadjuvant therapy is given before the definitive treatment; the chemotherapy in this plan is the neoadjuvant part.","Palliative therapy to relieve symptoms":"The hormonal therapy is given to lower the risk from leftover cells, not to relieve symptoms.","Primary therapy":"The primary therapy is the definitive treatment, here the surgery.","Debulking therapy":"Debulking is partial removal of a tumor by surgery."},"tk":"The timing words describe when a treatment is given relative to the definitive treatment, which here is the mastectomy.","w":"The timing words describe when a treatment is given relative to the definitive treatment, which here is the mastectomy. Neoadjuvant treatment comes before it and shrinks the tumor, which is why the chemotherapy in this plan is neoadjuvant. Adjuvant treatment comes after it and targets microscopic cells that may be left behind. Radiation and oral hormonal therapy after surgery are therefore adjuvant. (study guide, Ch 13 case and class PLQ)","lp":1},{"id":"q027","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-tx","q":"A nurse reviews facts about breast cancer in situ lesions. Select all that apply.","o":["Ductal carcinoma in situ is stage 0 and requires surgery","Lobular carcinoma in situ has no treatment and is followed with mammograms","Both lesions raise the risk of later invasive cancer","Lobular carcinoma in situ requires a mastectomy","Ductal carcinoma in situ needs no treatment"],"c":[0,1,2],"x":{"Lobular carcinoma in situ requires a mastectomy":"LCIS is no longer considered cancer and has no treatment; the focus is surveillance and risk reduction.","Ductal carcinoma in situ needs no treatment":"DCIS requires surgery."},"tk":"DCIS is confined to the lining of the milk ducts, is stage 0, and requires surgery.","w":"DCIS is confined to the lining of the milk ducts, is stage 0, and requires surgery. LCIS is in the milk-producing lobules and is no longer considered cancer, so it has no treatment and the client is followed with mammograms and risk reduction. Both increase the chance of later invasive cancer. (study guide, Ch 65)"},{"id":"q028","ty":"mc","ch":"ch6","t":"breast","cn":"c-breast-nursing","q":"A client returns to the unit after a mastectomy and axillary node removal. Which finding is the most concerning?","o":["Bloody drainage saturating the dressing","Serosanguineous drainage in the surgical drain","Mild incisional pain rated 3 out of 10","A temperature of 99.0°F (37.2°C)"],"c":0,"x":{"Serosanguineous drainage in the surgical drain":"Serosanguineous drainage is expected after surgery.","Mild incisional pain rated 3 out of 10":"Mild pain is expected and is treated, which also helps coughing and ambulation.","A temperature of 99.0°F (37.2°C)":"This is not a fever and is not the most concerning finding."},"tk":"Bloody drainage that saturates the dressing suggests bleeding and is the most concerning wound finding.","w":"Bloody drainage that saturates the dressing suggests bleeding and is the most concerning wound finding. Serosanguineous drainage is expected. Immediate post-operative complications include infection, wound dehiscence, pulmonary embolism and pneumonia. (study guide, Ch 65)","lp":1},{"id":"q029","ty":"sata","ch":"ch6","t":"breast","cn":"c-breast-nursing","q":"A client had radiation after a lumpectomy for left breast cancer. Which findings should the nurse monitor for as radiation effects? Select all that apply.","o":["Redness and itching of the skin","Patchy desquamation","Breast swelling","A dry cough 6 weeks to 6 months later","Hot flashes and vaginal dryness","Skin rashes and flu-like symptoms"],"c":[0,1,2,3],"x":{"Hot flashes and vaginal dryness":"These are effects of endocrine therapy, not radiation.","Skin rashes and flu-like symptoms":"These are effects of immunotherapy."},"tk":"Radiation irritates the skin, so the nurse monitors for redness, itching and patchy desquamation.","w":"Radiation irritates the skin, so the nurse monitors for redness, itching and patchy desquamation. The breast can swell for 6 to 18 months, and radiation pneumonitis causes a nonproductive cough 6 weeks to 6 months later. Late cardiac risk also exists. (study guide, Ch 65)"},{"id":"q030","ty":"tf","ch":"ch6","t":"breast","cn":"c-breast-nursing","q":"A nurse teaches a client with breast cancer that monthly breast self-examination is the recommended screening method. The nurse's teaching is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True repeats the old teaching; the materials say breast self-exam is not recommended."},"tk":"Breast self-exam is not recommended according to Chapter 65 and the slides.","w":"Breast self-exam is not recommended according to Chapter 65 and the slides. Screening is by mammography: annual from 45 to 54, then annual or every 2 years from age 55 while healthy. The true version is: breast self-exam is not recommended as screening. (study guide, Ch 65)","lp":1},{"id":"q031","ty":"tf","ch":"ch6","t":"breast","cn":"c-breast-nursing","q":"A nurse tells a client after axillary node removal that the most common long-term effect is shoulder immobility and that arm swelling is called lymphedema. The nurse's statement is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False denies a long-term effect that is listed as the most common one."},"tk":"Removal of axillary nodes can cause lymphedema, arm swelling.","w":"Removal of axillary nodes can cause lymphedema, arm swelling. Shoulder immobility, or frozen shoulder, is the most common long-term effect. Pain and scarring also occur. (study guide, Ch 65; class notes)","lp":1},{"id":"q032","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A client with leukemia has a platelet count of 45,000/mm³. Which action by the nurse is the priority?","o":["Initiate bleeding precautions","Initiate neutropenic precautions","Increase iron-rich foods in the diet","Give a vitamin K injection","Encourage vigorous exercise"],"c":0,"x":{"Initiate neutropenic precautions":"Neutropenic precautions are triggered by a low ANC, not by a low platelet count.","Increase iron-rich foods in the diet":"Iron foods address iron deficiency anemia, not platelets.","Give a vitamin K injection":"Vitamin K helps clotting factors, not a low platelet count.","Encourage vigorous exercise":"Activity that risks falls and bumps raises the bleeding risk."},"tk":"Normal platelets are 150,000 to 450,000/mm³.","w":"Normal platelets are 150,000 to 450,000/mm³. Precautions start below 100,000, spontaneous bleeding is possible below 50,000 and especially below 20,000, and below 5,000 a fatal CNS or GI bleed can occur. A count of 45,000 calls for bleeding precautions such as a soft toothbrush, electric razor and no IM injections. (study guide, Ch 33 and cheat sheet)","lp":1},{"id":"q033","ty":"order","ch":"ch2","t":"labs","cn":"c-labs-plt","q":"Place these platelet counts in order from the highest to the lowest as the nurse considers bleeding risk.","o":["150,000/mm³: lower limit of normal","100,000/mm³: start bleeding precautions","50,000/mm³: spontaneous bleeding possible","20,000/mm³: platelets usually transfused","5,000/mm³: fatal CNS or GI bleed possible"],"c":[0,1,2,3,4],"x":{},"tk":"Platelets plug injured vessels, so the lower the count the less able the body is to stop bleeding.","w":"Platelets plug injured vessels, so the lower the count the less able the body is to stop bleeding. At 150,000 the count is at the lower limit of normal, and below it the client has thrombocytopenia. Precautions begin below 100,000, spontaneous bleeding becomes possible below 50,000, and platelets are usually transfused below 20,000 or before procedures. Below 5,000 a fatal central nervous system or GI bleed is possible. (study guide, Ch 33, Ch 34 and cheat sheet)","lp":1},{"id":"q034","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A client receiving chemotherapy has a WBC differential showing an ANC of 400/mm³. Which conclusion should the nurse draw?","o":["The client has severe neutropenia and a high risk of infection","The client has thrombocytopenia and a high risk of bleeding","The client has anemia and needs iron","The client has a normal infection-fighting ability","The client has polycythemia"],"c":0,"x":{"The client has thrombocytopenia and a high risk of bleeding":"ANC measures neutrophils, not platelets.","The client has anemia and needs iron":"ANC measures neutrophils, not red cells or iron.","The client has a normal infection-fighting ability":"An ANC below 1,500 is neutropenia and 500 or below is severe.","The client has polycythemia":"Polycythemia is too many red cells."},"tk":"A WBC differential shows the proportion of each type of white cell, and neutrophils are the first cells to arrive at an infection.","w":"A WBC differential shows the proportion of each type of white cell, and neutrophils are the first cells to arrive at an infection. Neutropenia is an ANC below 1,500, and 500 or below is severe and calls for neutropenic precautions. A fever of 100.4°F (38°C) or higher with neutropenia is treated aggressively. (study guide, Ch 13, Ch 33, Ch 34)","lp":1},{"id":"q035","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A client has a WBC differential showing many immature neutrophils, or bands. What does the nurse understand this left shift to mean?","o":["The marrow is releasing immature cells to fight an active infection","The client has a chronic viral infection","The client has too many red blood cells","The client has normal marrow with stable cell counts","The client has low platelets"],"c":0,"x":{"The client has a chronic viral infection":"Left shift points to active bacterial-type infection or inflammation, not to a chronic viral illness.","The client has too many red blood cells":"Left shift concerns white cells.","The client has normal marrow with stable cell counts":"Many bands means the marrow is being pushed to release cells early.","The client has low platelets":"A left shift is a white-cell finding, not a platelet finding."},"tk":"In a left shift, immature neutrophils (bands) outnumber the normal amount, usually 3 to 5%.","w":"In a left shift, immature neutrophils (bands) outnumber the normal amount, usually 3 to 5%. The marrow is pumping cells out early to fight infection or inflammation. Bands are not very effective at fighting infection. Bacterial infection raises neutrophils, while chemotherapy and radiation lower them. (study guide, Ch 33)"},{"id":"q036","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A client's report lists reticulocytes of 4% of RBCs after a hemorrhage. What does the nurse understand this to mean?","o":["The marrow is responding to blood loss by making more red cells","The marrow is not producing red cells","The client has leukemia","The client is dehydrated","The client has thrombocytopenia"],"c":0,"x":{"The marrow is not producing red cells":"A low reticulocyte count shows a marrow that is not producing, such as in aplastic or pernicious anemia.","The client has leukemia":"Reticulocytes are immature red cells and do not point to leukemia.","The client is dehydrated":"Dehydration raises the hematocrit but does not explain reticulocytes.","The client has thrombocytopenia":"Reticulocytes are red cells, not platelets."},"tk":"Reticulocytes are immature red cells released from the marrow, and they are larger than mature red cells.","w":"Reticulocytes are immature red cells released from the marrow, and they are larger than mature red cells. After a hemorrhage the marrow speeds up to replace lost cells, so more immature cells appear in the blood and the reticulocyte count rises above the normal 0.5 to 2.5%. In a marrow that is not producing, such as aplastic or pernicious anemia, the count is low instead. The count therefore tells the nurse how well the marrow is responding. (study guide, Ch 33)"},{"id":"q037","ty":"blanks","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"A client with iron deficiency anemia has a serum iron test scheduled. The nurse explains that iron supplements must be held for at least [1] before the test, that the sample is best drawn in the [2], and that the total iron-binding capacity will be [3].","o":[["24 hours","4 hours","2 weeks"],["morning","evening","afternoon"],["high","low","normal"]],"c":[0,0,0],"x":{"4 hours":"Iron supplements are held at least 24 hours.","2 weeks":"Two weeks is far longer than needed.","evening":"Iron levels drop in the evening, so the sample is drawn in the morning.","afternoon":"The morning draw is recommended.","low":"TIBC is high in iron deficiency because there are many empty binding spots.","normal":"TIBC is not normal in iron deficiency; it rises."},"tk":"Iron supplements are avoided for at least 24 hours and an overnight fast is recommended.","w":"Iron supplements are avoided for at least 24 hours and an overnight fast is recommended. Serum iron is drawn in the morning because levels are lower in the evening. In iron deficiency TIBC is high because transferrin has many empty seats, while ferritin and transferrin saturation are low. (study guide, Ch 33 and class notes)","lp":1},{"id":"q038","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"A 25-year-old client with fatigue, pale nailbeds, a smooth red tongue and low ferritin has iron deficiency anemia. Which lunch choice shows the client understood diet teaching?","o":["Roast beef, steamed spinach, tomato soup and orange juice","Cheese pizza with a glass of milk","Cereal with milk and a banana","Plain pasta with butter and a vanilla milkshake","Toast with margarine and tea"],"c":0,"x":{"Cheese pizza with a glass of milk":"Dairy blocks iron absorption and this lunch has little iron.","Cereal with milk and a banana":"Milk blocks iron absorption.","Plain pasta with butter and a vanilla milkshake":"This meal has little iron and the dairy blocks absorption.","Toast with margarine and tea":"This meal has no heme iron, no vitamin C source, and no iron-rich vegetables."},"tk":"Heme iron from red meat is paired with nonheme iron from spinach and vitamin C from tomatoes and orange juice, which increases absorption.","w":"Heme iron from red meat is paired with nonheme iron from spinach and vitamin C from tomatoes and orange juice, which increases absorption. Dairy and antacids reduce iron absorption. The class notes add that iron is taken with vitamin C on an empty stomach, not with milk. (study guide, Ch 34 and class notes)","lp":1},{"id":"q039","ty":"sata","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"A client has iron deficiency anemia. Which laboratory findings should the nurse expect? Select all that apply.","o":["Decreased serum ferritin","Increased total iron-binding capacity","Decreased transferrin saturation","Decreased MCV","Increased serum ferritin","Increased MCV","Increased transferrin saturation"],"c":[0,1,2,3],"x":{"Increased serum ferritin":"Ferritin reflects iron stores and is low in iron deficiency.","Increased MCV":"An increased MCV is macrocytic, as in B12 or folate deficiency; iron deficiency is microcytic.","Increased transferrin saturation":"Transferrin saturation is always low in iron deficiency."},"tk":"Iron is stored as ferritin and carried by transferrin, so when iron runs out the stores empty and ferritin, serum iron and transferrin saturation all fall.","w":"Iron is stored as ferritin and carried by transferrin, so when iron runs out the stores empty and ferritin, serum iron and transferrin saturation all fall. The transferrin carriers are left with many empty binding spots, which is why total iron-binding capacity rises. Without enough iron the marrow makes small, pale red cells, so the MCV and MCHC fall. The class slide gives ferritin below 100 for iron deficiency and the textbook gives below 10; ask your instructor which number will be tested. (study guide, Ch 33 and Ch 34)"},{"id":"q040","ty":"match","ch":"ch2","t":"labs","cn":"c-labs-coag","q":"The nurse reviews coagulation studies. Match each test with what it monitors.","o":["Heparin, through the intrinsic pathway","Warfarin, through the extrinsic pathway","Platelet function","Abnormal platelet function from aspirin or von Willebrand disease"],"c":[0,1,2,3],"x":{"Heparin, through the intrinsic pathway":"PTT or aPTT monitors heparin.","Warfarin, through the extrinsic pathway":"PT and INR monitor warfarin; the INR goal is 2 to 3.","Platelet function":"Bleeding time checks overall platelet function and is not done if platelets are under 75,000.","Abnormal platelet function from aspirin or von Willebrand disease":"Platelet aggregation is impaired in von Willebrand disease and with aspirin or NSAIDs."},"tk":"The intrinsic pathway is monitored by PTT and the drug is heparin.","w":"The intrinsic pathway is monitored by PTT and the drug is heparin. The extrinsic pathway is monitored by PT and INR and the drug is warfarin. Your class notes list PT and PTT together for the intrinsic pathway, but the book and slide picture pair heparin with PTT, so PTT is the safe answer for heparin. (study guide, Ch 33 and class notes)","rows":["PTT","PT/INR","Bleeding time","Platelet aggregation"],"lp":1},{"id":"q041","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A nurse is preparing to collect blood for a CBC. Which tube should the nurse use?","o":["Lavender (EDTA) tube","Light blue (sodium citrate) tube","Red top with no additive","Green (heparin) tube"],"c":0,"x":{"Light blue (sodium citrate) tube":"Sodium citrate tubes are used for PT, INR and PTT.","Red top with no additive":"The CBC is drawn in an EDTA tube.","Green (heparin) tube":"A heparin tube is not the tube listed for the CBC."},"tk":"The tube additive decides which test can be run.","w":"The tube additive decides which test can be run. A CBC needs whole blood that does not clot, so it goes in a lavender tube with EDTA. Clotting studies measure how fast plasma clots, so they use sodium citrate, which is reversible, and the tube must be filled completely to keep the blood-to-additive ratio right. The tourniquet comes off as soon as blood flows because leaving it on for more than a minute falsely raises the RBC, Hgb and Hct. (study guide, Ch 33)"},{"id":"q042","ty":"tf","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A nurse teaches a student that a client with iron deficiency anemia will typically show microcytic and hypochromic red cells. The nurse's statement is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False would label iron deficiency as macrocytic; macrocytic cells point to B12 or folate deficiency."},"tk":"Hemoglobin needs iron, and the amount of hemoglobin determines how large and how dark a red cell is.","w":"Hemoglobin needs iron, and the amount of hemoglobin determines how large and how dark a red cell is. When iron is lacking the marrow makes cells with less hemoglobin, so they are smaller (a low MCV, microcytic) and paler (a low MCHC, hypochromic). Lead poisoning produces the same picture. Large cells, by contrast, point to a lack of B12 or folate. (study guide, Ch 33)","lp":1},{"id":"q043","ty":"tf","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A nurse tells a student that a platelet count of 100,000/mm³ is the level at which spontaneous bleeding becomes possible. The nurse's statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True moves the spontaneous-bleeding threshold up to 100,000."},"tk":"At 100,000 bleeding precautions start.","w":"At 100,000 bleeding precautions start. Spontaneous bleeding becomes possible below 50,000, and especially below 20,000. The true version is: precautions start at 100,000, and spontaneous bleeding is possible below 50,000. (study guide, Ch 33 and cheat sheet)","lp":1},{"id":"q044","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-types","q":"A 68-year-old client who has smoked two packs a day for decades is told the biopsy shows small cell (oat cell) lung cancer. Which statement by the nurse is accurate?","o":["“This type grows quickly and spreads to other organs early, so surgery is not the main treatment.”","“This is the most common type, making up about 85% of lung cancers.”","“If it is found early, the 5-year survival is good.”","“It includes adenocarcinoma, squamous cell and large cell types.”","“Surgery is used primarily for this type when it has not spread.”"],"c":0,"x":{"“This is the most common type, making up about 85% of lung cancers.”":"About 85% of lung cancers are non-small cell; small cell is about 15%.","“If it is found early, the 5-year survival is good.”":"Good early-stage survival describes non-small cell cancer; small cell has a poor outlook at any stage.","“It includes adenocarcinoma, squamous cell and large cell types.”":"Those three cell types make up non-small cell cancer.","“Surgery is used primarily for this type when it has not spread.”":"Surgery is used primarily for non-small cell cancer without metastasis."},"tk":"Smoking causes mutations that turn off the controls on cell growth, and the two lung cancer groups behave very differently once that happens.","w":"Smoking causes mutations that turn off the controls on cell growth, and the two lung cancer groups behave very differently once that happens. Small cell cancer is about 15% of cases, grows fast and spreads to other organs early, so removing the tumor does not cure it and surgery is not the main treatment. Its outlook is poor at any stage: only 5 to 10% survive 5 years, and your class notes give a life expectancy of 6 months to 1 year. Non-small cell cancer is about 85%, has three cell types, grows more slowly, and has a good 5-year survival if found early, so surgery is used when there is no metastasis. (study guide, Ch 26 and class notes)","lp":1},{"id":"q045","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-types","q":"The nurse reviews the features of non-small cell lung cancer with a nursing student. Select all that apply.","o":["It makes up about 85% of lung cancers","Its cell types are adenocarcinoma, squamous cell carcinoma and large cell carcinoma","Surgery is used primarily when there is no metastasis","The 5-year survival is good when it is found at an early stage","It grows quickly and spreads early to other organs","Life expectancy is typically 6 months to 1 year","It is also called oat cell cancer"],"c":[0,1,2,3],"x":{"It grows quickly and spreads early to other organs":"That describes small cell lung cancer.","Life expectancy is typically 6 months to 1 year":"That is the class figure for small cell lung cancer.","It is also called oat cell cancer":"Oat cell is another name for small cell lung cancer."},"tk":"Non-small cell lung cancer is the larger and slower group with three cell types, and early-stage disease has a good 5-year survival.","w":"Non-small cell lung cancer is the larger and slower group with three cell types, and early-stage disease has a good 5-year survival. Surgery is the preferred treatment when there is no metastasis. The wrong options all describe small cell, the faster and poorer-outlook type. (study guide, Ch 26 and class notes)","lp":1},{"id":"q046","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-dx","q":"A 70-year-old client with known lung cancer reports a new headache and bone pain. Which finding does the nurse recognize as suggesting metastasis?","o":["Headache and bone pain","A new cough that does not go away","Hoarseness","Frequent pneumonia or bronchitis","Hemoptysis"],"c":0,"x":{"A new cough that does not go away":"A new or changing cough is a presenting cue of lung cancer itself, not a sign of spread.","Hoarseness":"Hoarseness is a presenting symptom of lung cancer.","Frequent pneumonia or bronchitis":"This is a presenting cue from airway obstruction and infection.","Hemoptysis":"Hemoptysis comes from small vessels rupturing in the lung."},"tk":"Early lung cancer often has no symptoms.","w":"Early lung cancer often has no symptoms. As it advances, cues include a new or changed cough, hemoptysis, shortness of breath, wheezing, hoarseness, chest pain, weight loss and frequent pneumonia. Headache and bone pain suggest metastasis to the brain and bone; common sites are brain, bone, adrenal gland and the other lung. Bone pain also prompts a calcium check. (study guide, Ch 26 and Ch 13)","lp":1},{"id":"q047","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-dx","q":"A client with suspected lung cancer is scheduled for a PET scan. The client asks what the test shows. Which response by the nurse is best?","o":["“It shows areas of high metabolic activity, such as rapidly dividing cancer cells, rather than the structure of the lung.”","“It shows the structure of the airways so the provider can take a tissue sample.”","“It is a small chest incision to look at the nodes in the middle of the chest.”","“It identifies the type of tumor cells in the mucus you cough up.”","“It looks only for fractures of the ribs.”"],"c":0,"x":{"“It shows the structure of the airways so the provider can take a tissue sample.”":"Airway structure and tissue sampling describe bronchoscopy.","“It is a small chest incision to look at the nodes in the middle of the chest.”":"That describes mediastinoscopy.","“It identifies the type of tumor cells in the mucus you cough up.”":"That describes sputum cytology.","“It looks only for fractures of the ribs.”":"PET looks at metabolism; bone and abdominal scans look for metastasis."},"tk":"A PET scan detects how metabolically active tissue is, and rapidly dividing cancer cells are very active, so they light up as hot spots (glucose must be controlled before the scan).","w":"A PET scan detects how metabolically active tissue is, and rapidly dividing cancer cells are very active, so they light up as hot spots (glucose must be controlled before the scan). That is why PET reveals metabolism rather than anatomy. Structure and tissue are shown by other tests: chest x-ray and CT find the lesion, sputum cytology may identify tumor cells, bronchoscopy allows a biopsy of the airways, and mediastinoscopy is a surgical incision to view and biopsy the mediastinum. (study guide, Ch 26)"},{"id":"q048","ty":"match","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"The nurse reviews lung cancer surgery and testing with a client. Match each procedure with its description.","o":["Removes one entire lobe when the cancer is localized to that lobe","Removes the entire lung when cancer is spread diffusely through it","Removes a small section of a lobe for cancer in one small area","A surgical incision to view and biopsy the mediastinum"],"c":[0,1,2,3],"x":{"Removes one entire lobe when the cancer is localized to that lobe":"This is a lobectomy.","Removes the entire lung when cancer is spread diffusely through it":"This is a pneumonectomy.","Removes a small section of a lobe for cancer in one small area":"This is a wedge resection.","A surgical incision to view and biopsy the mediastinum":"This is mediastinoscopy, a diagnostic test rather than a treatment."},"tk":"Surgery is preferred if there is no metastasis.","w":"Surgery is preferred if there is no metastasis. The extent of cancer decides the operation: a small area gets a wedge resection, one lobe gets a lobectomy, and a diffusely spread cancer needs a pneumonectomy. Mediastinoscopy is used to biopsy the nodes. (study guide, Ch 26)","rows":["Lobectomy","Pneumonectomy","Wedge resection","Mediastinoscopy"]},{"id":"q049","ty":"order","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"The nurse explains the WHO pain ladder used for cancer pain. Place the steps in order from mild to severe pain.","o":["Step 1: a nonopioid such as acetaminophen or an NSAID","Step 2: a moderate opioid such as codeine, hydrocodone or oxycodone plus a nonopioid","Step 3: a strong opioid such as morphine or fentanyl plus a nonopioid"],"c":[0,1,2],"x":{},"tk":"The ladder matches the strength of the drug to the intensity of the pain.","w":"The ladder matches the strength of the drug to the intensity of the pain. A nonopioid is first, and it is kept at every step because it adds pain relief and lets the opioid dose stay lower. When pain is moderate a weaker opioid is added, and when it is severe a strong opioid such as morphine or fentanyl is used. Doses are given around the clock rather than on demand, so that the level of relief stays steady and pain peaks are avoided. (study guide, Ch 26 and Ch 11)","lp":1},{"id":"q050","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with lung cancer has dyspnea and a SpO₂ of 87% on room air. Which action should the nurse take first?","o":["Raise the head of the bed to semi-Fowler's position and apply oxygen to keep the SpO₂ at 90% or higher","Lay the client flat to rest","Offer a large meal to improve strength","Encourage the client to walk the hall","Wait and recheck the SpO₂ in 1 hour"],"c":0,"x":{"Lay the client flat to rest":"Lying flat reduces lung expansion; semi-Fowler's allows full expansion and better oxygenation.","Offer a large meal to improve strength":"A large meal pushes on the diaphragm; small frequent meals with supplements are better.","Encourage the client to walk the hall":"Activity increases oxygen demand; the client has activity intolerance.","Wait and recheck the SpO₂ in 1 hour":"A SpO₂ below 90% is a significant oxygenation problem that needs action now."},"tk":"A SpO₂ below 90% means poor gas exchange.","w":"A SpO₂ below 90% means poor gas exchange. Oxygen is given to keep the SpO₂ at 90% or higher, and semi-Fowler's allows full lung expansion and better oxygenation. Small frequent meals with supplements avoid pressure on the diaphragm, and pain, anti-anxiety and bronchodilator medications help the client relax and open the airway. (study guide, Ch 26)","lp":1},{"id":"q051","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A nurse sees a coworker about to clamp the chest tube of a client who had a lobectomy, to move the client to a chair. Which action should the nurse take?","o":["Intervene, because the chest tube should never be clamped; air or fluid can build up and cause a tension pneumothorax","Allow it, because clamping prevents air from entering the pleural space","Allow it for a short time only","Disconnect the tube from the drainage system to make moving easier","Ask the client to hold the tube while standing"],"c":0,"x":{"Allow it, because clamping prevents air from entering the pleural space":"Clamping traps air and fluid in the pleural space and can cause a tension pneumothorax.","Allow it for a short time only":"The rule is to never clamp the chest tube.","Disconnect the tube from the drainage system to make moving easier":"The system must stay closed to prevent air leaks.","Ask the client to hold the tube while standing":"This does not address the unsafe clamping and the closed system must be maintained."},"tk":"After lobectomy or pneumonectomy the nurse keeps the chest tube system closed, watches the water-seal chamber, and never clamps the tube.","w":"After lobectomy or pneumonectomy the nurse keeps the chest tube system closed, watches the water-seal chamber, and never clamps the tube. Persistent bubbling in the water-seal chamber means an air leak. Excess bloody drainage suggests a bleed and cloudy drainage suggests infection. (study guide, Ch 26)","lp":1},{"id":"q052","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client who had a lobectomy yesterday has continuous bubbling in the water-seal chamber of the chest tube drainage system. The nurse recognizes this as which finding?","o":["An air leak in the system","Normal re-expansion of the lung","Excess bloody drainage","Infection of the pleural space","Atelectasis"],"c":0,"x":{"Normal re-expansion of the lung":"Normal drainage does not cause persistent bubbling in the water-seal chamber.","Excess bloody drainage":"Bleeding is judged by the amount and color of drainage, not by bubbling.","Infection of the pleural space":"Cloudy drainage, not bubbling, suggests infection.","Atelectasis":"Atelectasis is suspected when breath sounds are diminished or absent."},"tk":"The water-seal chamber works as a one-way valve: air leaves the pleural space and bubbles through the water, but cannot come back.","w":"The water-seal chamber works as a one-way valve: air leaves the pleural space and bubbles through the water, but cannot come back. A brief bubble when the client coughs is expected, but bubbling that never stops means air is entering the system continuously. That points to a leak somewhere in the drainage system or the lung. The nurse also checks vital signs for hypotension or tachycardia from blood loss, breath sounds for atelectasis, and the suture line for infection. (study guide, Ch 26)"},{"id":"q053","ty":"tf","ch":"ch5","t":"lung","cn":"c-lung-types","q":"A nurse tells a client with a 30 pack-year smoking history who quit 4 years ago that a yearly low-dose CT is recommended for all adults over age 65, regardless of smoking history. The nurse's statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True extends screening to everyone over 65; it is limited to high-risk clients."},"tk":"There is no general screening guideline for lung cancer.","w":"There is no general screening guideline for lung cancer. A yearly low-dose CT is for high-risk clients: current smokers or those who quit within 15 years, with at least a 20 pack-year history. The true version is that screening is for this high-risk group only. (study guide, Ch 13 and Ch 26)","lp":1},{"id":"q054","ty":"tf","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"A client newly diagnosed with lung cancer asks when palliative care can begin. The nurse answers that it begins at diagnosis to manage pain, dyspnea and nausea. The nurse's answer is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False delays palliative care to the end of life, which is the hospice timing."},"tk":"Palliative care is built around the client's symptoms and quality of life, not around how long the client is expected to live.","w":"Palliative care is built around the client's symptoms and quality of life, not around how long the client is expected to live. Lung cancer causes pain, dyspnea and nausea from the time it is diagnosed, so the help is needed from day one. For that reason palliative care starts at diagnosis and continues alongside chemotherapy or radiation. It is not the same as hospice, which is for the end of life. (study guide, Ch 26 Connection Check)","lp":1},{"id":"q055","ty":"sata","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"The nurse reviews the CRAB criteria used to support a diagnosis of multiple myeloma. Select all that apply.","o":["Calcium above 11.5 mg/dL","Creatinine above 2 mg/dL","Hemoglobin below 10 g/dL","Lytic bone lesions or pathologic fractures","Platelets above 450,000/mm³","Philadelphia chromosome present","Reed–Sternberg cells on biopsy"],"c":[0,1,2,3],"x":{"Platelets above 450,000/mm³":"A high platelet count is not part of CRAB.","Philadelphia chromosome present":"The Philadelphia chromosome is linked to chronic myeloid leukemia.","Reed–Sternberg cells on biopsy":"Reed–Sternberg cells define Hodgkin lymphoma."},"tk":"Each letter of CRAB comes from a way the abnormal plasma cells damage the body.","w":"Each letter of CRAB comes from a way the abnormal plasma cells damage the body. Lytic bone lesions release calcium, which causes hypercalcemia and also bone disease with fractures. Excess light chains injure the kidney, which causes renal insufficiency, and the crowded marrow causes anemia. Plasma cells of 10% or more in the marrow and an M protein in serum or urine complete the picture. (study guide, Ch 34)","lp":1},{"id":"q056","ty":"mc","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"A client with multiple myeloma has Bence Jones protein in the urine. Why does the nurse monitor BUN and creatinine closely?","o":["The excess light chains are toxic to the kidneys","The M protein lowers the blood pressure and starves the kidneys","Bisphosphonates always cause kidney failure","The tumor grows directly inside the kidney","Low platelets cause bleeding into the kidneys"],"c":0,"x":{"The M protein lowers the blood pressure and starves the kidneys":"The harm comes from light chains and calcium, not from low blood pressure.","Bisphosphonates always cause kidney failure":"The kidney damage in myeloma comes from light chains and hypercalcemia, not from treatment.","The tumor grows directly inside the kidney":"Myeloma is a plasma cell cancer of the marrow; the kidney is harmed by what the cells make.","Low platelets cause bleeding into the kidneys":"Bleeding is not the cause of the kidney damage here."},"tk":"
