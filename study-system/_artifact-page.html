 masses.”":"Biopsy of an ovarian mass is not recommended.","“A CA-125 blood test is enough to diagnose ovarian cancer.”":"CA-125 is normal in 50% of early cases and also rises with other conditions.","“A Pap smear will confirm the diagnosis.”":"A Pap samples the cervix."},"tk":"A biopsy of an ovarian mass is not recommended because it could spread the cancer.","w":"A biopsy of an ovarian mass is not recommended because it could spread the cancer. The definitive diagnosis is surgical removal of the mass plus pathology. In uterine cancer the endometrial biopsy is 99% sensitive for high-grade cancer, and D&C is done if the biopsy is negative but bleeding continues. (study guide, Ch 65)","lp":1},{"id":"q127","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"A client is scheduled for a bone marrow aspiration and biopsy. Which statement by the client indicates a need for further teaching?","o":["“Odds are I will die from this procedure.”","“I will feel pressure when the needle goes in.”","“I may feel a brief pulling pain when the marrow is drawn out.”","“I will keep the dressing on for at least 24 hours.”"],"c":0,"x":{"“I will feel pressure when the needle goes in.”":"This is correct teaching.","“I may feel a brief pulling pain when the marrow is drawn out.”":"This is correct teaching.","“I will keep the dressing on for at least 24 hours.”":"This is correct teaching."},"tk":"The procedure takes 5 to 10 minutes and a mild sedative is allowed.","w":"The procedure takes 5 to 10 minutes and a mild sedative is allowed. The client feels pressure on insertion and a brief pulling pain on aspiration, and may hear crunching. A statement that the client will die from it shows fear and misinformation and needs correction. (study guide, Ch 33 and class PLQ)","lp":1},{"id":"q128","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"The nurse prepares a client for a bone marrow biopsy at the most common site. Which position does the nurse use?","o":["Prone or side-lying, for the posterior iliac crest","Supine, because the most common site is the sternum","Sitting upright with the arms crossed","Trendelenburg"],"c":0,"x":{"Supine, because the most common site is the sternum":"The most common site is the posterior iliac crest; the sternum and anterior iliac crest use supine.","Sitting upright with the arms crossed":"This does not expose the posterior iliac crest.","Trendelenburg":"This position is not used for this procedure."},"tk":"The most common site is the posterior iliac crest, with the client prone or side-lying.","w":"The most common site is the posterior iliac crest, with the client prone or side-lying. The sternum or anterior iliac crest is done supine. Before the procedure: consent, allergies and bleeding risk (platelets, coagulation studies, anticoagulants). (study guide, Ch 33)"},{"id":"q129","ty":"sata","ch":"ch1","t":"biopsy","cn":"c-bx-marrow","q":"The nurse provides care after a bone marrow biopsy. Select all that apply.","o":["Hold direct pressure for 5 to 10 minutes and apply a sterile dressing","Have the client rest for several hours","Leave the dressing on for at least 24 hours","Report bleeding that soaks the dressing or lasts more than 24 hours","Remove the dressing after 1 hour to inspect the site","Encourage vigorous exercise right away"],"c":[0,1,2,3],"x":{"Remove the dressing after 1 hour to inspect the site":"The dressing stays on at least 24 hours.","Encourage vigorous exercise right away":"The client rests for several hours."},"tk":"After the procedure the nurse applies direct pressure for 5 to 10 minutes and a sterile dressing, and the client rests for several hours.","w":"After the procedure the nurse applies direct pressure for 5 to 10 minutes and a sterile dressing, and the client rests for several hours. The dressing stays on at least 24 hours. Bleeding that soaks the dressing or lasts more than 24 hours is reported, and the nurse watches for infection and gives analgesia. (study guide, Ch 33)"},{"id":"q130","ty":"mc","ch":"ch1","t":"biopsy","cn":"c-bx-types","q":"A client asks what a liquid biopsy is. Which description by the nurse is accurate?","o":["A blood test that looks for cancer cells or tumor DNA","Removal of the whole mass with a margin","A needle that suctions cells from a mass","A scope that looks inside the airways"],"c":0,"x":{"Removal of the whole mass with a margin":"That describes an excisional biopsy.","A needle that suctions cells from a mass":"That describes fine-needle aspiration.","A scope that looks inside the airways":"That describes bronchoscopy."},"tk":"A liquid biopsy is a blood test that looks for cancer cells or tumor DNA, so it does not take tissue from the mass.","w":"A liquid biopsy is a blood test that looks for cancer cells or tumor DNA, so it does not take tissue from the mass. It is used for example in non-small cell lung, breast, colorectal, GI and ovarian cancers. It differs from tissue biopsies, which remove cells or a mass directly. (study guide, Ch 13)"},{"id":"q131","ty":"tf","ch":"ch1","t":"biopsy","cn":"c-bx-types","q":"A nurse tells a client that the results of a tissue biopsy usually take 3 to 10 days. The nurse's statement is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False gives the client an unrealistic expectation about when results arrive."},"tk":"A biopsy sample has to be processed, stained and examined by a pathologist before a cytopathologic diagnosis can be made, and that takes time.","w":"A biopsy sample has to be processed, stained and examined by a pathologist before a cytopathologic diagnosis can be made, and that takes time. Results are expected in 3 to 10 days. The nurse explains the purpose, preparation, aftercare and when results arrive, so the client is not left waiting without information. The statement is accurate. (study guide, Ch 13)","lp":1},{"id":"q132","ty":"tf","ch":"ch1","t":"biopsy","cn":"c-bx-types","q":"A nurse tells a client that blood tests and imaging can give a definitive diagnosis of cancer without a biopsy. The nurse's statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True treats supportive tests as diagnostic."},"tk":"Labs and imaging are supportive.","w":"Labs and imaging are supportive. A biopsy is required for a definitive cytopathologic diagnosis. The true version is that tissue confirmation is needed. (study guide, Ch 13)","lp":1},{"id":"q133","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"A 60-year-old postmenopausal client calls the clinic. Which statement requires the nurse's immediate follow-up?","o":["“I have had some vaginal bleeding.”","“I feel a little tired in the afternoons.”","“I have mild joint stiffness in the mornings.”","“I had trouble falling asleep last night.”","“I had heartburn after a spicy dinner.”"],"c":0,"x":{"“I feel a little tired in the afternoons.”":"Mild afternoon fatigue is not the red flag for uterine cancer.","“I have mild joint stiffness in the mornings.”":"This is not the key warning sign for a gynecologic cancer.","“I had trouble falling asleep last night.”":"This is not the key warning sign for a gynecologic cancer.","“I had heartburn after a spicy dinner.”":"This is not the key warning sign for a gynecologic cancer."},"tk":"After menopause the uterine lining should not bleed, so bleeding means the lining is abnormal.","w":"After menopause the uterine lining should not bleed, so bleeding means the lining is abnormal. Uterine cancer is most common at ages 55 to 65, with a median of 60, and abnormal bleeding is its most common symptom. Any postmenopausal bleeding needs evaluation, so this statement is the one that needs immediate follow-up. The other statements are not the key warning sign for a gynecologic cancer. (study guide, Ch 65 and class PLQ)","lp":1},{"id":"q134","ty":"sata","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"The nurse reviews risk factors for uterine (endometrial) cancer. Select all that apply.","o":["Unopposed estrogen exposure","Obesity","Tamoxifen use","Early menarche and late menopause","Polycystic ovary syndrome","Estrogen given together with progesterone","Maintaining a healthy weight and exercising","HPV infection"],"c":[0,1,2,3,4],"x":{"Estrogen given together with progesterone":"Progesterone with estrogen is protective; the risk is estrogen without progesterone.","Maintaining a healthy weight and exercising":"These help prevent uterine cancer.","HPV infection":"HPV is the cause of cervical cancer."},"tk":"Estrogen makes the uterine lining grow, and progesterone balances it.","w":"Estrogen makes the uterine lining grow, and progesterone balances it. When estrogen is unopposed, by estrogen therapy without progesterone, tamoxifen or anovulation, the lining keeps growing and can become cancer. Obesity adds risk because fat tissue makes estrogen. Chapter 13 also lists early menarche, late menopause, PCOS and diabetes. (study guide, Ch 65 and Ch 13)","lp":1},{"id":"q135","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"A nurse is describing the most common type of uterine cancer to a client. Which description is correct?","o":["Endometrioid adenocarcinoma, which is estrogen-driven and usually found early","Serous or clear cell carcinoma, which is the most common type","Uterine sarcoma, which is the most common type","Squamous cell carcinoma of the cervix"],"c":0,"x":{"Serous or clear cell carcinoma, which is the most common type":"Type II serous or clear cell cancers are aggressive and occur in older clients, but they are not the most common.","Uterine sarcoma, which is the most common type":"Sarcoma makes up only 3 to 5%.","Squamous cell carcinoma of the cervix":"That is the main type of cervical cancer."},"tk":"Most uterine cancers arise from the lining, the endometrium.","w":"Most uterine cancers arise from the lining, the endometrium. About 80% are endometrioid adenocarcinoma, called type I, which is driven by estrogen and is usually found early with about 88% survival. Type II (serous or clear cell) is aggressive and occurs in older clients with a poor prognosis, and sarcoma of the muscle is only 3 to 5%. The most common type is therefore the estrogen-driven endometrioid type. (study guide, Ch 65)"},{"id":"q136","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"A postmenopausal client has vaginal bleeding. Which diagnostic test does the nurse expect to be done first for uterine cancer?","o":["Endometrial biopsy","CA-125 blood test","Colposcopy","Mammogram"],"c":0,"x":{"CA-125 blood test":"CA-125 is an ovarian marker.","Colposcopy":"Colposcopy is for the cervix after an abnormal Pap.","Mammogram":"A mammogram screens the breast."},"tk":"Bleeding comes from the endometrium, so the test samples the endometrium.","w":"Bleeding comes from the endometrium, so the test samples the endometrium. The endometrial biopsy is 99% sensitive for high-grade cancer and is done first. A pelvic transvaginal ultrasound shows a thickened endometrium, and a D&C is added if the biopsy is negative but bleeding continues. CA-125, colposcopy and mammography belong to ovarian, cervical and breast evaluation. (study guide, Ch 65)","lp":1},{"id":"q137","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"A client's endometrial biopsy is negative but she continues to have postmenopausal bleeding. Which procedure does the nurse expect?","o":["Dilation and curettage","No further testing is needed","Repeat screening in 3 years","A bone marrow biopsy"],"c":0,"x":{"No further testing is needed":"Continued bleeding needs evaluation.","Repeat screening in 3 years":"The bleeding needs follow-up now.","A bone marrow biopsy":"This is for blood and marrow disorders."},"tk":"A biopsy takes a small sample and can miss an area of disease, so a negative result does not explain ongoing bleeding.","w":"A biopsy takes a small sample and can miss an area of disease, so a negative result does not explain ongoing bleeding. A D&C scrapes the whole lining and gives a larger tissue sample for pathology. It is done with NPO status and consent, and normal postoperative bleeding and cramping are expected. Continued bleeding always needs further evaluation. (study guide, Ch 65 and Ch 64)"},{"id":"q138","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"A client has stage I uterine cancer. Which treatment does the nurse expect?","o":["Surgery to remove the uterus, fallopian tubes and ovaries","Chemotherapy alone","Observation only","Pelvic exenteration","Radical trachelectomy"],"c":0,"x":{"Chemotherapy alone":"Chemotherapy is for higher-risk disease and gives only a modest response.","Observation only":"Early stage I is often cured by surgery.","Pelvic exenteration":"Exenteration is for a pelvic recurrence of cervical cancer.","Radical trachelectomy":"This surgery is for early cervical cancer."},"tk":"Surgery removes the uterus, tubes and ovaries plus washings and lymphadenectomy, and early stage I is often cured by surgery alone.","w":"Surgery removes the uterus, tubes and ovaries plus washings and lymphadenectomy, and early stage I is often cured by surgery alone. Progestin therapy is used for stage I if surgery is not possible. Radiation is the usual adjuvant. (study guide, Ch 65)","lp":1},{"id":"q139","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"A 52-year-old client with a uterus is prescribed estrogen for menopausal symptoms. Which statement should the nurse include in teaching to lower the risk of uterine cancer?","o":["“Estrogen is taken with progesterone because estrogen alone can cause the lining of the uterus to overgrow.”","“Estrogen is safe alone because it protects the uterus.”","“Estrogen should be stopped if you gain weight.”","“Only women who have had a hysterectomy need progesterone.”"],"c":0,"x":{"“Estrogen is safe alone because it protects the uterus.”":"Estrogen alone is unopposed and raises uterine cancer risk.","“Estrogen should be stopped if you gain weight.”":"Weight management helps, but the key point is progesterone.","“Only women who have had a hysterectomy need progesterone.”":"The women who need it are those with a uterus."},"tk":"Anyone on estrogen who has a uterus needs progesterone too.","w":"Anyone on estrogen who has a uterus needs progesterone too. Tamoxifen users need monitoring for endometrial hyperplasia. Prevention also includes a healthy weight and exercise. (study guide, Ch 65)","lp":1},{"id":"q140","ty":"mc","ch":"ch6","t":"uterine","cn":"c-ut-dx","q":"A client receiving chemotherapy for uterine cancer has stomatitis. Which instruction by the nurse is correct?","o":["Avoid hot or spicy food and use salt-water rinses","Eat hot soups to soothe the mouth","Use a hard toothbrush to keep the mouth clean","Avoid fluids to keep the mouth dry"],"c":0,"x":{"Eat hot soups to soothe the mouth":"Hot food irritates stomatitis.","Use a hard toothbrush to keep the mouth clean":"A soft toothbrush is used.","Avoid fluids to keep the mouth dry":"Fluids help; dryness worsens mouth sores."},"tk":"Chemotherapy kills fast-dividing cells, including the lining of the mouth, so sores develop.","w":"Chemotherapy kills fast-dividing cells, including the lining of the mouth, so sores develop. Hot or spicy food irritates the damaged lining and worsens pain. Salt-water rinses keep the mouth clean and comfortable, and antiemetics help with nausea. Soft toothbrushes and good hydration also help. (study guide, Ch 65 and Ch 13)"},{"id":"q141","ty":"tf","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"A nurse teaches a client that anyone who takes estrogen therapy and has a uterus also needs progesterone. The nurse's teaching is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False would leave estrogen unopposed."},"tk":"Estrogen makes the lining of the uterus grow, and progesterone keeps that growth in check.","w":"Estrogen makes the lining of the uterus grow, and progesterone keeps that growth in check. Estrogen alone is unopposed, and years of unopposed growth raise the risk of uterine cancer. A client who has a uterus therefore takes progesterone with estrogen. The teaching is accurate. (study guide, Ch 65)","lp":1},{"id":"q142","ty":"tf","ch":"ch6","t":"uterine","cn":"c-ut-risk","q":"A nurse tells a client that ovarian cancer is the most common gynecologic cancer in the United States. The nurse's statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True swaps the most common gynecologic cancer with the deadliest one."},"tk":"Two different facts are easy to swap.","w":"Two different facts are easy to swap. Uterine (endometrial) cancer is the most common gynecologic cancer in the US, with a 2.6% lifetime risk. Ovarian cancer is the deadliest, because its symptoms are vague and 70 to 75% are not found until stage III or IV. The statement gives the label of the wrong cancer and is false. (study guide, Ch 65)","lp":1},{"id":"q143","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-def","q":"A client receiving chemotherapy has an absolute neutrophil count of 480/mm³. Which nursing action is the priority?","o":["Implement neutropenic precautions, including a private room and hand hygiene by everyone","Implement bleeding precautions","Encourage visitors and fresh flowers to lift the client's mood","Take the client's temperature rectally","Offer iron-rich foods"],"c":0,"x":{"Implement bleeding precautions":"Bleeding precautions are for a low platelet count.","Encourage visitors and fresh flowers to lift the client's mood":"Crowds and live plants are avoided in neutropenia.","Take the client's temperature rectally":"Rectal temperatures are never used in neutropenia.","Offer iron-rich foods":"Iron foods are for iron deficiency anemia."},"tk":"Neutropenia is an ANC below 1,500, and neutropenic precautions start at 500 or below.","w":"Neutropenia is an ANC below 1,500, and neutropenic precautions start at 500 or below. A fever of 100.4°F (38°C) or higher means broad-spectrum IV antibiotics immediately. The nurse uses hand hygiene, a private room and restricts visitors with communicable diseases. (study guide, Ch 13 and Ch 34)","lp":1},{"id":"q144","ty":"sata","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"The nurse is teaching a client with neutropenia about precautions at home. Select all that apply.","o":["Wash hands often and ask visitors to do the same","Avoid crowds and people who are sick","Avoid live plants and cut flowers","Avoid standing water, such as in a humidifier","Keep fresh cut flowers in the bedroom","Take the temperature rectally when ill","Eat raspberries and blackberries as a healthy snack"],"c":[0,1,2,3],"x":{"Keep fresh cut flowers in the bedroom":"Live plants and cut flowers carry bacteria and mold.","Take the temperature rectally when ill":"No rectal temperatures, suppositories or enemas; rectal bacteria can enter the blood.","Eat raspberries and blackberries as a healthy snack":"Raspberries and blackberries are bumpy and hard to wash, so they are avoided."},"tk":"Neutrophils are the first cells to reach an infection, so with a low count even ordinary germs can cause serious infection.","w":"Neutrophils are the first cells to reach an infection, so with a low count even ordinary germs can cause serious infection. Each precaution removes a source of germs: other people's hands and coughs, live plants and flowers that carry bacteria and mold, standing water, fruit that is hard to wash, and the rectal route. The client washes produce, avoids raspberries and blackberries, and uses no rectal temperatures, suppositories or enemas. Your class notes add reverse isolation, where staff wear PPE to protect the client. (study guide, Ch 34 Box 34.2 and class notes)","lp":1},{"id":"q145","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"A client with neutropenia is being discharged. Which statement by the client indicates a need for further teaching?","o":["“I will put fresh cut flowers on my bedside table to cheer me up.”","“I will wash raw fruits and vegetables well.”","“I will check my temperature every day and call if it is above 100.4°F.”","“I will take my antibiotics every day and finish the whole course.”"],"c":0,"x":{"“I will wash raw fruits and vegetables well.”":"This is correct teaching.","“I will check my temperature every day and call if it is above 100.4°F.”":"This is correct teaching.","“I will take my antibiotics every day and finish the whole course.”":"This is correct teaching; prophylactic antimicrobials are taken daily."},"tk":"Live plants and cut flowers carry bacteria and mold, and a neutropenic client cannot fight them off.","w":"Live plants and cut flowers carry bacteria and mold, and a neutropenic client cannot fight them off. For that reason they are avoided at home and in the hospital, and a statement about placing flowers at the bedside shows a need for teaching. The correct statements are washing raw fruits and vegetables, checking the temperature daily and calling for more than 100.4°F (38°C), and taking prophylactic antimicrobials daily and finishing the course. These actions lower the chance of infection or catch it early. (study guide, Ch 34 Box 34.2)","lp":1},{"id":"q146","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-def","q":"A client at home who is receiving chemotherapy has a temperature of 100.6°F (38.1°C). Which instruction by the nurse is correct?","o":["“Seek care or call your provider right away, because IV antibiotics can prevent sepsis.”","“Take acetaminophen and call tomorrow if it persists.”","“Drink extra fluids and recheck in 12 hours.”","“A low-grade fever is expected and can be ignored.”"],"c":0,"x":{"“Take acetaminophen and call tomorrow if it persists.”":"Waiting delays treatment; fever may be the only sign of infection.","“Drink extra fluids and recheck in 12 hours.”":"This delays treatment.","“A low-grade fever is expected and can be ignored.”":"A temperature of 100.4°F or higher requires immediate care."},"tk":"In a chemotherapy client, few working neutrophils means the usual signs of infection may be weak or missing, and a fever may be the only sign.","w":"In a chemotherapy client, few working neutrophils means the usual signs of infection may be weak or missing, and a fever may be the only sign. An infection can spread to the blood and lead to sepsis within hours. Treatment with IV antibiotics prevents that, so the client should seek care or call the provider right away. Waiting to see whether the fever settles delays treatment. (study guide, Ch 13 and Ch 34)"},{"id":"q147","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"The nurse reviews the orders of a client with an ANC of 450/mm³. Which order should the nurse question?","o":["Bisacodyl rectal suppository as needed for constipation","Prophylactic levofloxacin daily","Oral temperature every 4 hours","Private room with strict hand hygiene"],"c":0,"x":{"Prophylactic levofloxacin daily":"Prophylactic antibiotics are used in neutropenia.","Oral temperature every 4 hours":"Oral temperatures are appropriate.","Private room with strict hand hygiene":"This is part of neutropenic precautions."},"tk":"Rectal tissue is full of bacteria, and a suppository, enema or thermometer can create tiny tears that let them into the blood.","w":"Rectal tissue is full of bacteria, and a suppository, enema or thermometer can create tiny tears that let them into the blood. With an ANC of 450 the client cannot control that infection. For that reason rectal medications and temperatures are not used in neutropenia. Prophylactic antibiotics, a private room and oral temperatures are appropriate. (study guide, Ch 34 Box 34.2)","lp":1},{"id":"q148","ty":"mc","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"A client with leukemia is neutropenic. Which visitor should the nurse restrict?","o":["A sibling who has a cold and a cough","A well adult friend who has washed her hands","The client's spouse who is well and wears a mask as requested","An asymptomatic adult relative who sanitizes his hands"],"c":0,"x":{"A well adult friend who has washed her hands":"A healthy visitor using hand hygiene is allowed.","The client's spouse who is well and wears a mask as requested":"A well visitor is allowed.","An asymptomatic adult relative who sanitizes his hands":"A well adult with hand hygiene is allowed."},"tk":"A neutropenic client has few cells to fight germs, so any visitor with a communicable illness is a direct risk.","w":"A neutropenic client has few cells to fight germs, so any visitor with a communicable illness is a direct risk. A sibling with a cold and a cough could pass on the infection. Well visitors who clean their hands are allowed. The plan also avoids crowds, small children and pets, and requires hand hygiene by everyone. (study guide, Ch 34 and class PLQ)"},{"id":"q149","ty":"match","ch":"ch3","t":"neut","cn":"c-neut-def","q":"The nurse reviews neutropenia values with a new graduate. Match each value with its meaning.","o":["Neutropenia and an infection risk","Neutropenic precautions begin","Call the provider immediately"],"c":[0,1,2],"x":{"Neutropenia and an infection risk":"An ANC below 1,500 is neutropenia.","Neutropenic precautions begin":"At an ANC of 500 or below the client is on neutropenic precautions, and IV antibiotics are given for fever.","Call the provider immediately":"A fever of 100.4°F (38°C) or higher in a chemotherapy client is called in right away."},"tk":"The ANC counts the neutrophils that can fight bacteria and fungi.","w":"The ANC counts the neutrophils that can fight bacteria and fungi. Below 1,500 the client is neutropenic and at risk of infection, and at 500 or below the risk is high enough that neutropenic precautions are started. A temperature of 100.4°F (38°C) or higher in a chemotherapy client is called in immediately and treated with broad-spectrum IV antibiotics. Matching each number with its action is the core of the care plan. (study guide, Ch 13 and Ch 34)","rows":["ANC below 1,500","ANC 500 or below","Temperature of 100.4°F (38°C) or higher"]},{"id":"q150","ty":"tf","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"A nurse explains that in reverse isolation for a neutropenic client the nurse wears protective equipment to protect the client from infection. The nurse's explanation is accurate.","o":["True","False"],"c":0,"x":{"False":"Marking False would turn it into isolation that protects others instead."},"tk":"In ordinary isolation the barrier protects other people from the client's germs.","w":"In ordinary isolation the barrier protects other people from the client's germs. In reverse isolation the direction is reversed, because the neutropenic client is the one who cannot fight germs. Staff and visitors wear PPE when required, limit their exposures, and avoid items that harbor waterborne organisms. The nurse explaining that the PPE protects the client is accurate. (class notes and study guide, Ch 34)","lp":1},{"id":"q151","ty":"tf","ch":"ch3","t":"neut","cn":"c-neut-prec","q":"A nurse tells a neutropenic client that raspberries and blackberries are safe to eat because they are easy to wash. The nurse's statement is accurate.","o":["True","False"],"c":1,"x":{"True":"Marking True would let the client eat fruit that is hard to clean."},"tk":"Fruits and vegetables carry soil bacteria on their surface, and a neutropenic client cannot fight them off.","w":"Fruits and vegetables carry soil bacteria on their surface, and a neutropenic client cannot fight them off. Raspberries and blackberries have a bumpy surface that traps dirt and is hard to clean. For that reason they are avoided, while other raw fruits and vegetables are washed well. The statement is false. (study guide, Ch 34 Box 34.2)","lp":1},{"id":"q152","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-types","q":"A 45-year-old client with a 20-year smoking history asks what causes lung cancer. Which statement by the nurse is accurate?","o":["“Smoking causes more than 90% of lung cancers, and the risk rises with the number of cigarettes and the years smoked.”","“Only current smokers are at risk; second-hand smoke and radon do not raise the risk.”","“Smoking causes about half of lung cancers, and the rest come from asbestos.”","“The risk is the same no matter how much a person has smoked.”","“Exposure to asbestos at work does not add to the risk.”"],"c":0,"x":{"“Only current smokers are at risk; second-hand smoke and radon do not raise the risk.”":"Second-hand smoke and radon are both listed risk factors.","“Smoking causes about half of lung cancers, and the rest come from asbestos.”":"More than 90% of lung cancer is caused by smoking.","“The risk is the same no matter how much a person has smoked.”":"Risk rises with the number of cigarettes and the years smoked.","“Exposure to asbestos at work does not add to the risk.”":"Occupational pollutants and asbestos are listed risk factors."},"tk":"Smoking is the most preventable cause of lung cancer and accounts for more than 90% of cases.","w":"Smoking is the most preventable cause of lung cancer and accounts for more than 90% of cases. Carcinogens in smoke damage the lining of the lung, and the damage adds up with each cigarette and each year. Second-hand smoke, radon, occupational pollutants and asbestos add risk. (study guide, Ch 26)"},{"id":"q153","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-dx","q":"A client newly diagnosed with lung cancer asks why the provider keeps stressing that it is usually found late. Which response by the nurse is best?","o":["“Early disease often has no symptoms, and survival depends on the stage at diagnosis: about 49% for stage IA but about 1% for stage IV.”","“Survival is about the same no matter when the cancer is found.”","“Lung cancer causes severe pain right away, so it is almost always found early.”","“Only small cell cancer has a worse outlook when found late.”","“Stage IV has the best survival because it is the most treated.”"],"c":0,"x":{"“Survival is about the same no matter when the cancer is found.”":"Survival depends strongly on the stage at diagnosis.","“Lung cancer causes severe pain right away, so it is almost always found early.”":"Lung cancer is often silent until a late stage.","“Only small cell cancer has a worse outlook when found late.”":"Stage matters for lung cancer overall; small cell is poor at any stage.","“Stage IV has the best survival because it is the most treated.”":"Stage IV survival is about 1%."},"tk":"Lung cancer is often silent until a late stage and is most common after age 65.","w":"Lung cancer is often silent until a late stage and is most common after age 65. Stage IA survival is about 49%, while stage IV survival is about 1%. This is why high-risk clients are screened with a yearly low-dose CT. (study guide, Ch 26)"},{"id":"q154","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-types","q":"A nursing student asks how cigarette smoke produces lung cancer. Which explanation by the nurse is correct?","o":["Smoke causes dysplasia of the lung lining; repeated exposure leads to mutations that switch oncogenes on, switch tumor suppressors off, let cells avoid apoptosis, and stop DNA repair","One exposure changes a normal cell directly into a metastatic cell","Smoke makes the lung produce extra immune cells that attack healthy lung tissue","Smoke blocks oxygen so cells shrink and stop dividing"],"c":0,"x":{"One exposure changes a normal cell directly into a metastatic cell":"Cancer develops through repeated exposure and accumulating mutations, not one exposure.","Smoke makes the lung produce extra immune cells that attack healthy lung tissue":"This is not the described mechanism; the mechanism is mutation and loss of growth control.","Smoke blocks oxygen so cells shrink and stop dividing":"Cancer is uncontrolled growth, not shrinkage."},"tk":"Carcinogens such as cigarette smoke cause dysplasia of the lung epithelium.","w":"Carcinogens such as cigarette smoke cause dysplasia of the lung epithelium. With repeated exposure mutations accumulate: oncogenes turn on, tumor suppressors turn off, cells evade apoptosis and DNA repair fails. The result is uncontrolled growth of abnormal cells, which is carcinogenesis. (study guide, Ch 26)"},{"id":"q155","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with lung cancer is admitted with dyspnea. Which findings does the nurse interpret correctly? Select all that apply.","o":["A SpO₂ below 90% means a significant gas exchange problem","Wheezes suggest airway obstruction","Rhonchi suggest secretions in the upper airways","Hemoptysis means small vessels are rupturing","Pain increases the respiratory rate and lowers quality of life","A fever means the tumor is shrinking","Weight loss is caused by chemotherapy only, and the work of breathing does not matter"],"c":[0,1,2,3,4],"x":{"A fever means the tumor is shrinking":"A fever means infection.","Weight loss is caused by chemotherapy only, and the work of breathing does not matter":"Both chemotherapy side effects and the work of breathing cause weight loss."},"tk":"Oxygen saturation shows how well the lungs exchange gas, and below 90% is significant.","w":"Oxygen saturation shows how well the lungs exchange gas, and below 90% is significant. Wheezes mean narrowed airways, rhonchi mean secretions in the larger airways, and hemoptysis comes from ruptured small vessels. Pain raises the respiratory rate, and both chemotherapy and the work of breathing cause weight loss. (study guide, Ch 26)"},{"id":"q156","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with lung cancer is taught pursed-lip breathing. Which explanation of its purpose should the nurse give?","o":["It helps clear sputum, reduces breathlessness and removes trapped air","It sedates the client so the respiratory rate drops","It replaces the need for oxygen therapy","It prevents the cancer from spreading to the brain"],"c":0,"x":{"It sedates the client so the respiratory rate drops":"It is a breathing technique, not a sedative.","It replaces the need for oxygen therapy":"Oxygen is still given to keep the SpO₂ at 90% or higher.","It prevents the cancer from spreading to the brain":"A breathing technique does not affect metastasis."},"tk":"Breathing techniques such as pursed-lip breathing help the client clear sputum, reduce breathlessness and remove trapped air.","w":"Breathing techniques such as pursed-lip breathing help the client clear sputum, reduce breathlessness and remove trapped air. They are taught with pacing of activities, small frequent meals, and correct inhaler use. Oxygen and medications are still given as needed. (study guide, Ch 26)"},{"id":"q157","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with lung cancer tires easily and becomes short of breath when washing and dressing. Which teaching should the nurse give?","o":["“Pace your activities with rests, because that conserves energy and lowers the work of breathing.”","“Do everything at once so you only have to rest one time.”","“Avoid all activity until your treatment is finished.”","“Breathe faster during activity to bring in more oxygen.”"],"c":0,"x":{"“Do everything at once so you only have to rest one time.”":"Grouping everything at once increases the work of breathing and fatigue.","“Avoid all activity until your treatment is finished.”":"The client should pace activity, not stop it.","“Breathe faster during activity to bring in more oxygen.”":"Controlled breathing, such as pursed-lip breathing, is taught instead."},"tk":"Activity intolerance from fatigue and dyspnea is a nursing diagnosis in lung cancer.","w":"Activity intolerance from fatigue and dyspnea is a nursing diagnosis in lung cancer. Pacing activities conserves energy and lowers the work of breathing. The nurse also teaches breathing techniques, small frequent meals and smoking cessation. (study guide, Ch 26)"},{"id":"q158","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"A client with lung cancer asks why pain medicine is ordered at set times instead of only when needed. Which response is best?","o":["“Giving it around the clock keeps a steady level of control instead of peaks of pain.”","“It prevents you from becoming addicted.”","“It lets you use less pain medicine overall.”","“It treats the cancer cells directly.”"],"c":0,"x":{"“It prevents you from becoming addicted.”":"Giving the medicine on a schedule is for steady relief, not for addiction prevention.","“It lets you use less pain medicine overall.”":"The reason is steady control, not a smaller total dose.","“It treats the cancer cells directly.”":"Pain medicine relieves pain and does not treat the tumor."},"tk":"Cancer pain is managed with the WHO ladder, and doses are given around the clock rather than on demand.","w":"Cancer pain is managed with the WHO ladder, and doses are given around the clock rather than on demand. A steady level of medicine avoids the peaks of pain that come when doses are delayed. Pain control also lets the lungs expand better. (study guide, Ch 26)"},{"id":"q159","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client who had a lobectomy has a red, warm incision with thick yellow drainage on the suture line. Which complication does the nurse suspect?","o":["Infection of the suture line","Normal healing","Atelectasis","A bleed"],"c":0,"x":{"Normal healing":"Redness and warmth with thick yellow drainage is not normal healing.","Atelectasis":"Atelectasis is suspected when breath sounds are diminished or absent.","A bleed":"A bleed shows as excess bloody drainage, hypotension or tachycardia."},"tk":"After lobectomy or pneumonectomy the nurse monitors vital signs, breath sounds, the suture line and the chest tube.","w":"After lobectomy or pneumonectomy the nurse monitors vital signs, breath sounds, the suture line and the chest tube. A red, warm suture line with thick yellow drainage means infection, and cloudy chest tube drainage also suggests infection. Excess bloody drainage suggests a bleed. (study guide, Ch 26)"},{"id":"q160","ty":"sata","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"The nurse teaches a client with lung cancer who is going home. Select all that apply.","o":["Quitting smoking can change the course of the disease","Pace activities to conserve energy","Eat small, frequent meals with supplements","Take pain medicine around the clock","Use the inhaler correctly as part of the medication regimen","Take pain medicine only when the pain becomes severe","Wait until chemotherapy is finished before trying to quit smoking","Eat one large meal a day to save energy"],"c":[0,1,2,3,4],"x":{"Take pain medicine only when the pain becomes severe":"Pain medicine is given around the clock to avoid peaks of pain.","Wait until chemotherapy is finished before trying to quit smoking":"Smoking cessation can change the course of the disease, so it should not wait.","Eat one large meal a day to save energy":"A large meal pushes on the diaphragm; small frequent meals are better."},"tk":"Teaching covers breathing techniques, pacing activities, smoking cessation, nutrition, the medication regimen and pain control.","w":"Teaching covers breathing techniques, pacing activities, smoking cessation, nutrition, the medication regimen and pain control. Expected outcomes are controlled pain, enough appetite and weight, and adequate oxygenation, and the client is referred for pulmonary rehabilitation and palliative care. (study guide, Ch 26)"},{"id":"q161","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A 39-year-old client with asthma is in the tripod position using pursed-lip breathing and cannot finish a sentence. Heart rate is 150, respirations 40, SpO₂ 88%, and there are bilateral wheezes. Which is the nurse's priority?","o":["Airway management, including oxygen","Teaching the client to stop smoking","Reviewing the asthma action plan","Obtaining a peak flow reading before any treatment","Giving a large meal for energy"],"c":0,"x":{"Teaching the client to stop smoking":"Smoking cessation is a long-term part of the plan, not the priority in an acute attack.","Reviewing the asthma action plan":"Education is the most important part of long-term management, but the airway comes first now.","Obtaining a peak flow reading before any treatment":"The client is in distress with a SpO₂ of 88%; the airway and oxygen come first.","Giving a large meal for energy":"This does nothing for the airway and increases pressure on the diaphragm."},"tk":"The client is showing signs of severe obstruction and low oxygen: tripod position, pursed-lip breathing, tachycardia, tachypnea and a SpO₂ of 88%.","w":"The client is showing signs of severe obstruction and low oxygen: tripod position, pursed-lip breathing, tachycardia, tachypnea and a SpO₂ of 88%. When a partially obstructed airway is suspected, airway management is the priority. Oxygen, albuterol nebulizers and a corticosteroid follow. (study guide, Ch 26 asthma case and class PLQ)","lp":1},{"id":"q162","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with an asthma attack was wheezing, but now no wheezes are heard and the breath sounds are diminished. What does the nurse conclude?","o":["The client is not moving air, which is an emergency","The attack is resolving and the airway is open","The client has developed a pleural effusion","The client no longer needs oxygen"],"c":0,"x":{"The attack is resolving and the airway is open":"Wheezing that stops along with diminished breath sounds means little air is moving.","The client has developed a pleural effusion":"The finding is a partially obstructed airway.","The client no longer needs oxygen":"This is a sign of worsening obstruction or exhaustion and needs urgent treatment."},"tk":"In asthma, wheezes need air moving through narrowed airways.","w":"In asthma, wheezes need air moving through narrowed airways. If wheezing goes away while breath sounds are diminished, the client is not moving air because of worsening obstruction or exhaustion. This is an emergency, with a risk of respiratory failure, and a rising PaCO₂ signals impending failure. (study guide, Ch 26 and class PLQ)","lp":1},{"id":"q163","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with asthma is being discharged. Which statement shows a need for further teaching?","o":["“I can stop all my medicines once my asthma is under control.”","“I will rinse my mouth after using my inhaled steroid.”","“I will blow into the peak flow meter three times and write down the highest reading.”","“I will not stop my prednisone suddenly and will take it as the taper directs.”"],"c":0,"x":{"“I will rinse my mouth after using my inhaled steroid.”":"This is correct; rinsing prevents oral candidiasis.","“I will blow into the peak flow meter three times and write down the highest reading.”":"This is correct peak flow technique.","“I will not stop my prednisone suddenly and will take it as the taper directs.”":"This is correct; prednisone is tapered."},"tk":"Asthma medicines are not stopped when asthma is controlled; the controller medicine keeps it controlled.","w":"Asthma medicines are not stopped when asthma is controlled; the controller medicine keeps it controlled. The most important part of management is education using an asthma action plan built on peak flow readings. Prednisone is tapered, never stopped suddenly. (study guide, Ch 26 and class PLQ)","lp":1},{"id":"q164","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-nursing","q":"A client with asthma has a rescue inhaler and a controller inhaled corticosteroid. Which instruction should the nurse give?","o":["Use the short-acting beta agonist (albuterol) for rescue, and rinse the mouth after the inhaled corticosteroid","Use the inhaled corticosteroid as the rescue medicine during an attack","Skip rinsing the mouth so the medicine stays in the lungs","Stop the controller when there are no symptoms"],"c":0,"x":{"Use the inhaled corticosteroid as the rescue medicine during an attack":"The inhaled corticosteroid is the controller; albuterol is the rescue medicine.","Skip rinsing the mouth so the medicine stays in the lungs":"Rinsing prevents oral candidiasis.","Stop the controller when there are no symptoms":"Controllers are continued even when the client feels well."},"tk":"The rescue medicine is a short-acting beta₂ agonist such as albuterol.","w":"The rescue medicine is a short-acting beta₂ agonist such as albuterol. The controller is an inhaled corticosteroid, and the client rinses the mouth afterward to prevent oral candidiasis. Peak flow is measured by blowing three times and recording the highest reading. (study guide, Ch 26)"},{"id":"q165","ty":"mc","ch":"ch5","t":"lung","cn":"c-lung-tx","q":"A client with advanced lung cancer is too ill for surgery. Which treatment is the primary option?","o":["Chemotherapy","Wedge resection","Lobectomy","Observation only"],"c":0,"x":{"Wedge resection":"Surgery is preferred only when there is no metastasis and the client can have it.","Lobectomy":"Surgery is not an option for this client.","Observation only":"Chemotherapy is the primary treatment for advanced cancer or a client too ill for surgery."},"tk":"Chemotherapy is the primary treatment for advanced lung cancer or a client too ill for surgery, and it can be neoadjuvant or adjuvant.","w":"Chemotherapy is the primary treatment for advanced lung cancer or a client too ill for surgery, and it can be neoadjuvant or adjuvant. Radiation is used when surgery is not an option, before or after surgery, or for palliation of symptoms and pain. (study guide, Ch 26)"},{"id":"q166","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"The nurse is assessing the abdomen of a client with an enlarged spleen. Which action is correct?","o":["Palpate the left upper quadrant lightly","Palpate deeply to measure the size of the spleen","Palpate firmly in all four quadrants","Avoid inspecting the abdomen","Percuss only the right lower quadrant"],"c":0,"x":{"Palpate deeply to measure the size of the spleen":"An enlarged spleen is tender and can rupture with deep palpation.","Palpate firmly in all four quadrants":"The spleen is assessed in the LUQ with light palpation.","Avoid inspecting the abdomen":"Inspection for masses and distention is part of the exam.","Percuss only the right lower quadrant":"The spleen is in the left upper quadrant."},"tk":"The spleen sits in the left upper quadrant and filters old red cells and abnormal white cells and platelets.","w":"The spleen sits in the left upper quadrant and filters old red cells and abnormal white cells and platelets. When it is enlarged it is tender and can rupture, so the nurse palpates the LUQ lightly with the client supine. Your class notes add standing on the opposite (right) side of the client. (study guide, Ch 33 and class notes)"},{"id":"q167","ty":"sata","ch":"ch2","t":"labs","cn":"c-labs-iron","q":"A 25-year-old client has fatigue, shortness of breath, a heart rate of 118, a respiratory rate of 26, a blood pressure of 90/72, a hemoglobin of 9 and a low ferritin. Which findings does the nurse expect or recognize? Select all that apply.","o":["Pale skin and nail beds","A red, swollen tongue","Tachycardia as compensation for hypoxemia","Tachypnea as compensation for hypoxemia","A low ferritin showing depleted iron stores","A high blood pressure because the blood is thick","A decreased respiratory rate"],"c":[0,1,2,3,4],"x":{"A high blood pressure because the blood is thick":"In anemia the systolic blood pressure is lower; thick blood and high pressure go with too many red cells.","A decreased respiratory rate":"The respiratory rate rises as the lungs work harder to deliver oxygen."},"tk":"In iron deficiency anemia there is not enough hemoglobin to carry oxygen.","w":"In iron deficiency anemia there is not enough hemoglobin to carry oxygen. The heart rate and respiratory rate rise to compensate, the blood pressure is lower, and the skin and nail beds are pale. Glossitis, a red, swollen tongue, goes with iron deficiency and pernicious anemia. (study guide, Ch 33 case and class notes)"},{"id":"q168","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-plt","q":"A client who takes aspirin daily is scheduled for surgery. The client asks how long aspirin affects clotting. Which response is correct?","o":["“Aspirin irreversibly blocks platelets for their whole life span, which is 4 to 7 days.”","“Aspirin affects clotting for only a few hours.”","“Aspirin lowers the number of platelets but they work normally.”","“Aspirin affects only the clotting factors made by the liver.”"],"c":0,"x":{"“Aspirin affects clotting for only a few hours.”":"Aspirin blocks platelets for their life span of 4 to 7 days.","“Aspirin lowers the number of platelets but they work normally.”":"Aspirin blocks platelet function; it does not simply lower the count.","“Aspirin affects only the clotting factors made by the liver.”":"Aspirin acts on platelets."},"tk":"Aspirin and other salicylates block platelets irreversibly, and platelets live 4 to 7 days.","w":"Aspirin and other salicylates block platelets irreversibly, and platelets live 4 to 7 days. Other drugs that predispose to bleeding include NSAIDs, heparin, warfarin, DOACs, clopidogrel and antineoplastics. The nurse also asks about herbs and supplements. (study guide, Ch 33)"},{"id":"q169","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-plt","q":"During a hematologic history the client mentions taking ginger and garlic supplements. Which concern should the nurse have?","o":["They promote bleeding","They raise the platelet count","They raise the hemoglobin","They prevent infection in neutropenia"],"c":0,"x":{"They raise the platelet count":"Ginger and garlic promote bleeding; they do not raise the platelet count.","They raise the hemoglobin":"They are not iron supplements and do not raise hemoglobin.","They prevent infection in neutropenia":"They are not a protection against infection."},"tk":"Ginger and garlic promote bleeding, so the nurse asks about herbs and supplements in the medication history.","w":"Ginger and garlic promote bleeding, so the nurse asks about herbs and supplements in the medication history. Goldenseal and green tea can reduce the effect of anticoagulants. (class notes and study guide, Ch 33)"},{"id":"q170","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-coag","q":"A client has a mechanical heart valve and takes warfarin. Which INR goal does the nurse expect?","o":["2.5 to 3.5","0.9 to 1.1","2 to 3","5 to 6"],"c":0,"x":{"0.9 to 1.1":"This is the normal INR for a client who is not on an anticoagulant.","2 to 3":"This is the usual warfarin goal; a mechanical valve has a higher goal.","5 to 6":"This is too high and risks bleeding."},"tk":"The normal INR is 0.9 to 1.1 without an anticoagulant.","w":"The normal INR is 0.9 to 1.1 without an anticoagulant. The warfarin goal is 2 to 3, and a client with a mechanical valve has a goal of 2.5 to 3.5. INR rises with DIC, cirrhosis and vitamin K deficiency. (study guide, Ch 33)"},{"id":"q171","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A newborn's laboratory report shows a positive Coombs test. What does the nurse understand this to mean?","o":["Antibodies are present on the red cells, as in hemolytic disease of the newborn","The infant has too many red blood cells","The infant has a platelet disorder","The infant has a clotting factor deficiency"],"c":0,"x":{"The infant has too many red blood cells":"Polycythemia is too many red cells; Coombs detects antibodies.","The infant has a platelet disorder":"Coombs tests antibodies on red cells, not platelets.","The infant has a clotting factor deficiency":"Clotting factors are tested with PT and PTT."},"tk":"The Coombs test detects immunoglobulins (antibodies) on red cells.","w":"The Coombs test detects immunoglobulins (antibodies) on red cells. A positive result is seen with hemolytic disease of the newborn, a transfusion reaction and autoimmune hemolytic anemia. (study guide, Ch 33)"},{"id":"q172","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A client has a high neutrophil count but the leukocyte alkaline phosphatase (LAP) is not elevated. Which condition does the nurse suspect?","o":["Chronic myeloid leukemia","A bacterial infection","Pregnancy","Corticosteroid use","Iron deficiency anemia"],"c":0,"x":{"A bacterial infection":"LAP rises with infection, stress, inflammation, pregnancy and steroids.","Pregnancy":"LAP rises in pregnancy.","Corticosteroid use":"LAP rises with steroid use.","Iron deficiency anemia":"This does not explain a high neutrophil count."},"tk":"LAP is an enzyme made by mature neutrophils and is elevated with infection, stress, inflammation, pregnancy, steroids and leukemia.","w":"LAP is an enzyme made by mature neutrophils and is elevated with infection, stress, inflammation, pregnancy, steroids and leukemia. High neutrophils without a high LAP suggest chronic myeloid leukemia. (study guide, Ch 33)"},{"id":"q173","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-plt","q":"A client's platelet count is 60,000/mm³ and a bleeding time is ordered. Which action should the nurse take?","o":["Hold the test and notify the provider","Perform the test as ordered","Continue the test for 30 minutes","Give vitamin K first"],"c":0,"x":{"Perform the test as ordered":"Bleeding time is not done if platelets are under 75,000.","Continue the test for 30 minutes":"The test is stopped if bleeding lasts more than 15 minutes.","Give vitamin K first":"Vitamin K does not raise platelets."},"tk":"Bleeding time, normally 3 to 8 minutes, tests platelet function and is not done when platelets are under 75,000.","w":"Bleeding time, normally 3 to 8 minutes, tests platelet function and is not done when platelets are under 75,000. If it is done, it is stopped when bleeding lasts more than 15 minutes. (study guide, Ch 33)"},{"id":"q174","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"The nurse is teaching about the life cycle of red blood cells. Where are old red cells broken down, and what becomes of the heme?","o":["In the spleen; heme becomes iron that is recycled and bilirubin that is excreted in bile","In the bone marrow; heme becomes platelets","In the kidneys; heme becomes erythropoietin","In the liver; heme becomes albumin"],"c":0,"x":{"In the bone marrow; heme becomes platelets":"The marrow makes red cells; the spleen breaks old ones down.","In the kidneys; heme becomes erythropoietin":"EPO is released by the kidneys to stimulate RBC production; it is not made from heme.","In the liver; heme becomes albumin":"Albumin is a plasma protein made by the liver; heme becomes iron and bilirubin."},"tk":"Red cells live about 120 days and the marrow makes new ones, which need iron, B₁₂ and folic acid.","w":"Red cells live about 120 days and the marrow makes new ones, which need iron, B₁₂ and folic acid. The spleen breaks down old cells: globin becomes amino acids and heme becomes iron, which is recycled, plus bilirubin, which is excreted in bile. (study guide, Ch 33)"},{"id":"q175","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"A 58-year-old man has a hematocrit of 58%, an RBC count of 6.4 million and a headache with blurred vision. Which condition does the nurse suspect?","o":["Polycythemia","Iron deficiency anemia","Aplastic anemia","Thrombocytopenia"],"c":0,"x":{"Iron deficiency anemia":"In iron deficiency the hemoglobin and hematocrit are low.","Aplastic anemia":"Aplastic anemia lowers all three cell lines.","Thrombocytopenia":"A low platelet count is not shown."},"tk":"Too many red cells make the blood thick, which increases viscosity and decreases oxygen transport.","w":"Too many red cells make the blood thick, which increases viscosity and decreases oxygen transport. A hematocrit above 52% in men and an RBC above 6 million fit polycythemia, with headache, dizziness and blurred vision. (study guide, Ch 33 and Ch 34)"},{"id":"q176","ty":"mc","ch":"ch7","t":"prostate","cn":"c-bph","q":"A 65-year-old man has nocturia three or four times a night, urgency and occasional incontinence. His PSA is below 2 ng/mL, the digital rectal exam and urinalysis are unremarkable. Which approach does the nurse expect?","o":["Watchful waiting with follow-up","Immediate TURP","An indwelling catheter","Chemotherapy","Radical prostatectomy"],"c":0,"x":{"Immediate TURP":"Surgery is for retention, kidney damage, overflow incontinence, stones, recurrent UTI or severe hematuria.","An indwelling catheter":"A catheter is used if medications fail and he cannot have surgery.","Chemotherapy":"BPH is not cancer.","Radical prostatectomy":"That is cancer surgery; BPH is not cancer."},"tk":"With minimal symptoms and minimal enlargement the first approach is watchful waiting or active surveillance with a yearly exam.","w":"With minimal symptoms and minimal enlargement the first approach is watchful waiting or active surveillance with a yearly exam. If the symptoms worsen, a 5-alpha reductase inhibitor or an alpha-adrenergic blocker may be prescribed. The nurse teaches recognition of worsening symptoms and the need for follow-up. (study guide, Ch 66 and slides)"},{"id":"q177","ty":"mc","ch":"ch7","t":"prostate","cn":"c-bph","q":"A client with benign prostatic hyperplasia says, “I'm glad I can still take my decongestants for my cold.” What does the nurse conclude?","o":["The client needs more teaching because decongestants and tranquilizers worsen obstruction","The client understands the teaching","The client may take decongestants only at night","The client should also take a tranquilizer to sleep"],"c":0,"x":{"The client understands the teaching":"Decongestants and tranquilizers are avoided because they constrict and increase urinary retention.","The client may take decongestants only at night":"They are avoided at any time.","The client should also take a tranquilizer to sleep":"Tranquilizers also worsen retention."},"tk":"In BPH the enlarged prostate narrows the urethra.","w":"In BPH the enlarged prostate narrows the urethra. Tranquilizers and decongestants cause constriction and increase urinary retention, so they are avoided. The client should also limit fluids in the evening to reduce nocturia. (study guide, Ch 66 and class notes)"},{"id":"q178","ty":"mc","ch":"ch7","t":"prostate","cn":"c-bph","q":"A client is prescribed tamsulosin (Flomax) for BPH. Which explanation of its action should the nurse give?","o":["It relaxes the smooth muscle of the prostate and bladder neck so urine flows more easily","It shrinks the prostate by blocking the change of testosterone to DHT","It lowers the PSA level","It kills prostate cancer cells"],"c":0,"x":{"It shrinks the prostate by blocking the change of testosterone to DHT":"That describes 5-alpha reductase inhibitors such as finasteride.","It lowers the PSA level":"5-alpha reductase inhibitors lower PSA; alpha blockers do not.","It kills prostate cancer cells":"BPH is not cancer."},"tk":"Alpha-adrenergic blockers relax smooth muscle of the prostate and bladder neck, so the urethra is squeezed less.","w":"Alpha-adrenergic blockers relax smooth muscle of the prostate and bladder neck, so the urethra is squeezed less. They work in 2 weeks to 4 months, and the nurse teaches rising slowly because of orthostatic hypotension. Your class notes say Flomax “dilates the urethra,” but the textbook says it does not; choose “relaxes the prostate muscle” if it is offered. (study guide, Ch 66 and class notes)"},{"id":"q179","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"The family of a client with end-stage cancer wants the client to be cared for at home. Which statement by the nurse about hospice is accurate?","o":["“Hospice is usually provided at home, but it can also be given in a hospice facility or a nursing home.”","“Hospice can only be provided in a hospital.”","“Hospice requires the client to continue chemotherapy.”","“Hospice ends when the client dies, with no support for the family.”"],"c":0,"x":{"“Hospice can only be provided in a hospital.”":"Hospice is usually at home but also in facilities and nursing homes.","“Hospice requires the client to continue chemotherapy.”":"Hospice means curative treatment stops.","“Hospice ends when the client dies, with no support for the family.”":"Family support continues after death, including bereavement."},"tk":"Hospice care aims at comfort, dignity and a peaceful death.","w":"Hospice care aims at comfort, dignity and a peaceful death. It is usually given at home but can be in a hospice facility or nursing home. Family support continues after death with bereavement care. (study guide, Other Topics; standard content)"},{"id":"q180","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"Which client qualifies for hospice care?","o":["A client with a terminal illness certified by physicians with a prognosis of 6 months or less","Any client with a newly diagnosed serious illness","A client who wants every curative treatment to continue","Only a client who is admitted to a hospital"],"c":0,"x":{"Any client with a newly diagnosed serious illness":"That describes who may receive palliative care.","A client who wants every curative treatment to continue":"Hospice means curative treatment stops.","Only a client who is admitted to a hospital":"Hospice is usually provided at home."},"tk":"Hospice is for a terminal illness certified by physicians, with a prognosis of 6 months or less if the disease runs its usual course.","w":"Hospice is for a terminal illness certified by physicians, with a prognosis of 6 months or less if the disease runs its usual course. Palliative care is open to anyone with a serious illness at any age or stage. (study guide, Other Topics; standard content)"},{"id":"q181","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A client with newly diagnosed pancreatic cancer reports pain, dyspnea and nausea and asks what a palliative care team will do. Which response is best?","o":["“The team relieves your symptoms and improves quality of life for you and your family while you continue treatment.”","“The team will take over once all treatment has stopped.”","“The team can only help if you have 6 months or less to live.”","“The team replaces your oncology team.”"],"c":0,"x":{"“The team will take over once all treatment has stopped.”":"Palliative care can continue alongside treatment from diagnosis.","“The team can only help if you have 6 months or less to live.”":"The 6-month rule is for hospice.","“The team replaces your oncology team.”":"Palliative care works together with curative treatment."},"tk":"Palliative care relieves symptoms such as pain, dyspnea and nausea and improves quality of life for the patient and family.","w":"Palliative care relieves symptoms such as pain, dyspnea and nausea and improves quality of life for the patient and family. It can start at diagnosis and continues with chemotherapy, radiation or surgery. (study guide, Ch 26 and Other Topics)"},{"id":"q182","ty":"mc","ch":"ch8","t":"eol","cn":"c-eol-nursing","q":"A client in hospice care has just died. Which statement about hospice support for the family is accurate?","o":["Hospice offers bereavement support to the family after the death","Hospice care ends the moment the client dies, with no further contact","Hospice offers only physical care for the client","Hospice support is offered only if the client was in a hospital"],"c":0,"x":{"Hospice care ends the moment the client dies, with no further contact":"Family support includes bereavement after death.","Hospice offers only physical care for the client":"Hospice includes emotional and spiritual support for the family.","Hospice support is offered only if the client was in a hospital":"Hospice is usually at home."},"tk":"Hospice goals are comfort, dignity and a peaceful death, and the family receives support including bereavement after the death.","w":"Hospice goals are comfort, dignity and a peaceful death, and the family receives support including bereavement after the death. Nursing care includes pain control, mouth care, repositioning, and emotional and spiritual support. (study guide, Other Topics; standard content)"},{"id":"q183","ty":"sata","ch":"ch8","t":"eol","cn":"c-eol-diff","q":"A nurse is describing palliative care to a client with a new cancer diagnosis. Select all that apply.","o":["It can begin at diagnosis","It can continue along with chemotherapy, radiation or surgery","It relieves symptoms such as pain, dyspnea and nausea","It improves quality of life for the client and the family","It is available at any stage of a serious illness","It requires a prognosis of 6 months or less","It requires the client to stop curative treatment"],"c":[0,1,2,3,4],"x":{"It requires a prognosis of 6 months or less":"That requirement belongs to hospice.","It requires the client to stop curative treatment":"That is the rule for hospice, not for palliative care."},"tk":"Palliative care is for anyone with a serious illness at any age or stage.","w":"Palliative care is for anyone with a serious illness at any age or stage. It starts at diagnosis, can run with curative treatment, and focuses on symptom relief and quality of life for client and family. Hospice is the form of palliative care at the end of life with a 6-month prognosis and no curative treatment. (study guide, Ch 26 and Other Topics)"},{"id":"q184","ty":"mc","ch":"ch2","t":"pv","cn":"c-pv","q":"Which term does the nurse use when documenting an elevated red blood cell (RBC) count?","o":["Polycythemia","Neutropenia","Anemia","Thrombocytopenia"],"c":0,"x":{"Neutropenia":"Neutropenia is a low neutrophil count.","Anemia":"Anemia is reduced oxygen-carrying capacity from fewer RBCs or less hemoglobin.","Thrombocytopenia":"Thrombocytopenia is a low platelet count."},"tk":"Polycythemia - is a term used to describe an increased RBC count.","w":"Polycythemia - is a term used to describe an increased RBC count. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":3},{"id":"q185","ty":"mc","ch":"ch2","t":"labs","cn":"c-labs-cbc","q":"In reviewing a patient’s complete blood count (CBC) results, the nurse notes a “shift to the left.” What is the significance of these results?","o":["There is an elevated number of immature neutrophils (bands).","There is an elevated number of mature neutrophils (segs).","There is an elevated number of mature erythrocytes","There is an elevated number of immature thrombocytes"],"c":0,"x":{"There is an elevated number of mature neutrophils (segs).":"Mature neutrophils are segs; a left shift is the immature ones.","There is an elevated number of mature erythrocytes":"A left shift is a white-cell finding, not a red-cell finding.","There is an elevated number of immature thrombocytes":"A left shift concerns neutrophils, not platelets."},"tk":"ANS: There is an elevated number of immature neutrophils (bands).","w":"ANS: There is an elevated number of immature neutrophils (bands). Chapter 33, Assessment of Hematological Function, White Blood Count/Neutrophils. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":4},{"id":"q186","ty":"match","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"Match the clinical presentation of the following blood disorders.","o":["Numbness and tingling associated with neuropathies","Thrombocytopenia","Engorged capillaries","Feeling of fullness","Glossitis"],"c":[0,1,2,3],"x":{"Numbness and tingling associated with neuropathies":"This is the multiple myeloma presentation.","Thrombocytopenia":"This is the leukemia presentation (crowded marrow).","Engorged capillaries":"This is the polycythemia vera presentation (hyperviscosity).","Feeling of fullness":"This is the non-Hodgkin lymphoma presentation.","Glossitis":"Glossitis, a red, swollen, smooth tongue, goes with iron deficiency or pernicious anemia and is not one of the four matches."},"tk":"Correct matches: Multiple myeloma = numbness & tingling (neuropathies) · Leukemia = thrombocytopenia · Polycythemia vera = engorged capillaries · Non-Hodgkin lymphoma = feeling of fullness.","w":"Correct matches: Multiple myeloma = numbness & tingling (neuropathies) · Leukemia = thrombocytopenia · Polycythemia vera = engorged capillaries · Non-Hodgkin lymphoma = feeling of fullness. (NUR 334 practice quiz)","rows":["Multiple myeloma","Leukemia","Polycythemia vera","Non-Hodgkin lymphoma"],"lp":1,"note":"You missed this one on your quiz (matched polycythemia vera to fullness and non-Hodgkin lymphoma to glossitis).","src":"quiz","qno":5},{"id":"q187","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-risk","q":"A client is receiving treatment for a new diagnosis of chronic lymphocytic leukemia (CLL). Based on known risk factors, age, ethnicity, and accompanying clinical conditions, which client is most likely to have this disease?","o":["82-year-old Vietnam War veteran with widely disseminated shingles","69-year-old Gulf War veteran with deep vein thrombosis (DVT)","62-year-old client of Asian descent with a left fractured hip","85-year-old client of Native American/First Nation descent with chest pain"],"c":0,"x":{"69-year-old Gulf War veteran with deep vein thrombosis (DVT)":"Gulf War veterans were not exposed to Agent Orange (1962 to 1975), and DVT is not related to infection.","62-year-old client of Asian descent with a left fractured hip":"CLL has an infrequent incidence in clients of Asian descent, and a fractured hip is not related to infection.","85-year-old client of Native American/First Nation descent with chest pain":"CLL is rarely seen in clients of Native American/First Nation descent."},"tk":"ANS: 82-year-old Vietnam War veteran with widely disseminated shingles.","w":"ANS: 82-year-old Vietnam War veteran with widely disseminated shingles. CLL is a common malignancy of older adults with an average age of 71 at diagnosis and the most prevalent leukemia in the Western world. It is rarely seen in clients of Native American/First Nation descent and has an infrequent incidence in clients of Asian descent. Veterans of the Vietnam War who were exposed to the herbicide Agent Orange are at risk for CLL. The time period of exposure was from 1962 to 1975 so veterans from the Gulf War in 1991 were not exposed. Infections are common with advanced CLL. None of the other conditions are related to infection, so they are not the best choice. Viral infections such as herpes zoster (shingles) can be widely disseminated with CLL. Chapter 34 - Leukemia. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":1},{"id":"q188","ty":"sata","ch":"ch7","t":"prostate","cn":"c-pros-patho","q":"The nurse monitors for which clinical manifestations in the patient being treated for locally invasive prostate cancer? Select all that apply.","o":["Hemospermia","Hematuria","Tenesmus","It is the result of blood loss","Urge incontinence","Weak urinary stream"],"c":[0,1,2],"x":{"It is the result of blood loss":"This is not a clinical manifestation of locally invasive prostate cancer.","Urge incontinence":"Urge incontinence is anticipated for the patient with localized prostate cancer, not locally invasive disease.","Weak urinary stream":"A weak stream is anticipated for the patient with localized prostate cancer."},"tk":"ANS: 3 clinical manifestations for pt treated for locally invasive prostate cancer.","w":"ANS: 3 clinical manifestations for pt treated for locally invasive prostate cancer. Tenesmus - rectal symptoms (rectal pain or cramping). Hematuria - blood in the urine. Hemospermia - blood in the semen. Urge incontinence is anticipated for the patient with localized prostate cancer. A weak stream is anticipated for the patient with localized prostate cancer. Chapter 66, page 1538 - FA Davis Medical Surgical. (NUR 334 practice quiz)","lp":1,"note":"You missed this one on your quiz (picked urge incontinence and weak stream instead of hemospermia).","src":"quiz","qno":2},{"id":"q189","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"In admitting the client with primary complain of weakness, what other cues must the nurse recognize in order to confirm the diagnosis of Leukemia?","o":["Low grade fever","Flushed face","High grade fever","Drenching night sweats"],"c":0,"x":{"Flushed face":"A flushed face is not a listed cue of leukemia (ruddy facial flushing goes with polycythemia vera).","High grade fever":"Leukemia causes low-grade fevers, not high-grade fevers.","Drenching night sweats":"Drenching night sweats are a B symptom of lymphoma; the keyed answer for leukemia is the low-grade fever."},"tk":"ANS: Low grade fever.","w":"ANS: Low grade fever. Ref: Chapter 34 - FA Davis Advantage, Medical surgical, 2nd Edition, page 739. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":14},{"id":"q190","ty":"mc","ch":"ch4","t":"mm","cn":"c-mm-patho","q":"In providing care for a patient with malignant lymphoma, the nurse correlates which clinical manifestations to the development of superior vena cava syndrome?","o":["Shortness of breath","Decreased venous pressure","Decreased peripheral pulses","Tachycardia"],"c":0,"x":{"Decreased venous pressure":"There is no decrease in venous pressure; it is increased by SVC syndrome.","Decreased peripheral pulses":"There is no decrease in peripheral pulses.","Tachycardia":"Tachycardia is not associated with this complication of malignant lymphoma."},"tk":"ANS: In SVC syndrome, the enlarging lymph node compresses the flexible superior vena cava.","w":"ANS: In SVC syndrome, the enlarging lymph node compresses the flexible superior vena cava. Edema of the face and one or both arms, shortness of breath, chest pain, or dysphagia develops because there is engorgement in the upper torso and impaired venous return. There is no decrease in peripheral pulses. There is no decreased venous pressure, but rather increased venous pressure by SVC syndrome. Tachycardia is not associated with complication of malignant lymphoma. Ref: Chp 34, page 741 - FA Davis Medical Surgical. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":16},{"id":"q191","ty":"mc","ch":"ch2","t":"pv","cn":"c-pv","q":"A clinic nurse is working with a client who has a long-standing diagnosis of Polycythemia Vera. How can the nurse best gauge the course of the client's disease?","o":["Follow the trends of the client's hematocrit.","Follow the client's erythrocyte sedimentation rate over time.","Document the color of the client's palms and face during each visit.","Document the client's response to erythropoietin injections."],"c":0,"x":{"Follow the client's erythrocyte sedimentation rate over time.":"The hematocrit, not the ESR, tracks polycythemia.","Document the color of the client's palms and face during each visit.":"Skin color is subjective and does not gauge the disease course.","Document the client's response to erythropoietin injections.":"Erythropoietin is not given for polycythemia; it stimulates red cell production."},"tk":"ANS: Follow the trends of the client's hematocrit.","w":"ANS: Follow the trends of the client's hematocrit. RAT: Blood counts are done to check and maintain hematocrit below 45% in men and below 42% in women. Chapter 34, page 732 - Hoffman & Davis. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":12},{"id":"q192","ty":"mc","ch":"ch2","t":"pv","cn":"c-pv","q":"A patient diagnosed with polycythemia is prescribed radiation, and asks the rationale for this treatment. Which response by the nurse is accurate?","o":["\"It suppresses the bone marrow\"","\"It stimulates red blood cell production\"","\"It decreases the risk of transfusion reactions\"","\"It provides vitamin supplementation\""],"c":0,"x":{"\"It stimulates red blood cell production\"":"The goal is to decrease red cell production.","\"It decreases the risk of transfusion reactions\"":"Radiation is not given to lower transfusion reaction risk.","\"It provides vitamin supplementation\"":"Radiation does not supply vitamins."},"tk":"Ans: Radiation suppresses the bone marrow in an attempt to decrease the production of red blood cells.","w":"Ans: Radiation suppresses the bone marrow in an attempt to decrease the production of red blood cells. Chp 34. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":17},{"id":"q193","ty":"sata","ch":"ch4","t":"mm","cn":"c-mm-nursing","q":"Which actions does the nurse implement to patients with diagnosis of multiple myeloma? Select all that apply.","o":["Encourage ambulation as tolerated","Administration of drugs like alendronate or risedronate","Encourage fluid intake as tolerated","Passive range of motion daily","Ensuring bedrest fo prevent fractures"],"c":[0,1,2],"x":{"Passive range of motion daily":"This is not one of the keyed interventions.","Ensuring bedrest fo prevent fractures":"Bones respond to the stress of walking; bedrest is not the intervention."},"tk":"ANS: Encourage fluid intake - prevent hypercalcemia due to biphosphate therapy.","w":"ANS: Encourage fluid intake - prevent hypercalcemia due to biphosphate therapy. Administer biphosphonate therapy - alendronate; risedonate - lowers the risk of fractures. Encourage ambulation as tolerated - bones respond to stress walking. Chp 34 - multiple myeloma - Nursing Interventions. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":29},{"id":"q194","ty":"mc","ch":"ch3","t":"leuk","cn":"c-leuk-patho","q":"An oncology nurse is providing health education for a client who has recently been diagnosed with leukemia. What should the nurse explain about commonalities between all of the different subtypes of leukemia?","o":["The different leukemias all involve unregulated proliferation of white blood cells.","The different leukemias all result in a decrease in the production of white blood cells.","The different leukemias all involve the development of cancer in the lymphatic system.","The different leukemias all have unregulated proliferation of red blood cells and decreased bone marrow function."],"c":0,"x":{"The different leukemias all result in a decrease in the production of white blood cells.":"A decrease in white cell production is associated with leukopenia.","The different leukemias all involve the development of cancer in the lymphatic system.":"The leukemias are not characterized by their involvement with the lymphatic system.","The different leukemias all have unregulated proliferation of red blood cells and decreased bone marrow function.":"Decreased production of red blood cells is associated with anemias."},"tk":"ANS: The different leukemias all involve unregulated proliferation of white blood cells.","w":"ANS: The different leukemias all involve unregulated proliferation of white blood cells. Leukemia commonly involves unregulated proliferation of white blood cells. Decreased production of red blood cells is associated with anemias. Decreased production of white blood cells is associated with leukopenia. The leukemias are not characterized by their involvement with the lymphatic system. Chp 34, WBC disorders. (NUR 334 practice quiz)","lp":1,"src":"quiz","qno":19},{"id":"q195","ty":"sata","ch":"ch4","t":"hodgkin","cn":"c-hodg-dx","q":"The nurse monitors for which clinical manifestations in the patient diagnosed with malignant lymphoma? Select all that apply.","o":["Swollen lymph nodes","Night sweats","Weight loss","Painful lymph nodes","High fevers"],"c":[0,1,2],"x":{"Painful lymph nodes":"Lymph node swelling in lymphoma is painless.","High fevers":"Lymphoma causes low-grade fevers for no apparent reason, not high fevers."},"tk":"ANS: Clinical manifestations include painless swelling of the lymph nodes in the neck, underarm, and groin; low-grade fevers for no apparent reason; drenching night sweats; unexplained weight loss of more than 10% in less than 6 months; and fatigue.","w":"ANS: Clinical manifestations include painless swelling of the lymph nodes in the neck, underarm, and groin; low-grade fevers for no apparent reason; drenching night sweats; unexplained weight loss of more than 10% in less than 6 months; and fatigue. Ch 34. (NUR 334 practice quiz)","lp":1,"note":"You partly missed this one on your quiz (you picked high f
